const castBtn = document.getElementById('castBtn');
const castLabel = document.getElementById('castLabel');
const linesFrame = document.getElementById('linesFrame');
const heroHint = document.getElementById('heroHint');

function trigramTopToBottom(key){
  return TRIGRAMS[key].bottomToTop.slice().reverse();
}

function buildYaoLineEl(isYang){
  const row = document.createElement('div');
  row.className = 'yao-line ' + (isYang ? 'yang' : 'yin');
  if(isYang){
    const bar = document.createElement('div');
    bar.className = 'bar';
    row.appendChild(bar);
  } else {
    const bar1 = document.createElement('div');
    bar1.className = 'bar';
    const bar2 = document.createElement('div');
    bar2.className = 'bar';
    row.appendChild(bar1);
    row.appendChild(bar2);
  }
  return row;
}

function renderStaticHexagram(container, upperKey, lowerKey){
  container.innerHTML = '';
  const seq = trigramTopToBottom(upperKey).concat(trigramTopToBottom(lowerKey));
  seq.forEach(bit=>{
    container.appendChild(buildYaoLineEl(bit === 1));
  });
}

function animateHexagram(container, upperKey, lowerKey, onDone){
  container.innerHTML = '';
  container.classList.add('show');
  const seqTopToBottom = trigramTopToBottom(upperKey).concat(trigramTopToBottom(lowerKey));
  // 建立六個爻的元素（先建立好，之後由下往上依序顯現）
  const els = seqTopToBottom.map(bit=>buildYaoLineEl(bit === 1));
  els.forEach(el=>container.appendChild(el));

  const order = [5,4,3,2,1,0]; // 由下而上
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(reduceMotion){
    els.forEach(el=>el.classList.add('drawn'));
    onDone && onDone();
    return;
  }

  order.forEach((idx, i)=>{
    setTimeout(()=>{
      els[idx].classList.add('drawn');
      if(i === order.length - 1){
        setTimeout(onDone, 350);
      }
    }, i * 260);
  });
}

function buildCompass(hex){
  const svg = document.getElementById('compassSvg');
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const cx = 160, cy = 160, rOuter = 140, rRing = 118, rLabel = 92, rGlyph = 62;

  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('class','ring');
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', rRing);
  svg.appendChild(ring);

  const centerRing = document.createElementNS(NS, 'circle');
  centerRing.setAttribute('class','ring');
  centerRing.setAttribute('cx', cx); centerRing.setAttribute('cy', cy); centerRing.setAttribute('r', 34);
  svg.appendChild(centerRing);

  Object.keys(TRIGRAMS).forEach(key=>{
    const t = TRIGRAMS[key];
    const rad = (t.bearing - 90) * Math.PI / 180; // -90 使 0 度朝上
    const x1 = cx + 34 * Math.cos(rad), y1 = cy + 34 * Math.sin(rad);
    const x2 = cx + rRing * Math.cos(rad), y2 = cy + rRing * Math.sin(rad);
    const isActive = (key === hex.u || key === hex.l);

    const spoke = document.createElementNS(NS,'line');
    spoke.setAttribute('class', 'spoke' + (isActive ? ' active' : ''));
    spoke.setAttribute('x1', x1); spoke.setAttribute('y1', y1);
    spoke.setAttribute('x2', x2); spoke.setAttribute('y2', y2);
    svg.appendChild(spoke);

    const gx = cx + rGlyph * Math.cos(rad), gy = cy + rGlyph * Math.sin(rad);
    const glyphText = document.createElementNS(NS,'text');
    glyphText.setAttribute('x', gx); glyphText.setAttribute('y', gy + 6);
    glyphText.setAttribute('text-anchor','middle');
    glyphText.setAttribute('font-size', isActive ? '22' : '18');
    glyphText.setAttribute('fill', isActive ? 'var(--seal-deep)' : 'var(--ink-soft)');
    glyphText.textContent = t.glyph;
    svg.appendChild(glyphText);

    const nx = cx + rLabel * Math.cos(rad), ny = cy + rLabel * Math.sin(rad);
    const g = document.createElementNS(NS,'g');
    g.setAttribute('class','hit' + (isActive ? ' active' : ''));

    const nameText = document.createElementNS(NS,'text');
    nameText.setAttribute('class','name-label');
    nameText.setAttribute('x', nx); nameText.setAttribute('y', ny - 4);
    nameText.setAttribute('text-anchor','middle');
    nameText.setAttribute('font-size', currentLang === 'en' ? '11' : '13');
    nameText.textContent = currentLang === 'en' ? t.nameEn.split(' · ')[0] : key;
    g.appendChild(nameText);

    const dirText = document.createElementNS(NS,'text');
    dirText.setAttribute('class','dir-label');
    dirText.setAttribute('x', nx); dirText.setAttribute('y', ny + 14);
    dirText.setAttribute('text-anchor','middle');
    dirText.textContent = currentLang === 'en' ? t.dirEn : t.dir;
    g.appendChild(dirText);

    svg.appendChild(g);
  });
}

function showResult(hex){
  currentHex = hex;
  const t = UI_STRINGS[currentLang];
  const isEn = currentLang === 'en';
  const e = hex.en;

  document.getElementById('hexIndex').textContent = isEn ? ('Hexagram ' + hex.n) : ('第 ' + hex.n + ' 卦');
  document.getElementById('hexName').textContent = isEn ? e.name : hex.s;
  document.getElementById('hexFull').textContent = isEn ? e.title : hex.f;
  document.getElementById('hexKeyword').textContent = isEn ? e.keyword : hex.k;
  document.getElementById('hexDesc').textContent = isEn ? e.desc : hex.desc;
  document.getElementById('fortuneBadge').textContent = t.fortunePrefix + (isEn ? FORTUNE_EN[hex.fortune] : hex.fortune);

  segLockState = {};
  closeSegPopover();
  if (isEn || !hex.guaCiSeg){
    document.getElementById('ccGuaCi').textContent = isEn ? e.guaCi : hex.guaCi;
    document.getElementById('ccGuaCiX').textContent = isEn ? e.guaCiX : hex.guaCiX;
  } else {
    renderSegBlock(document.getElementById('ccGuaCi'), document.getElementById('ccGuaCiX'), hex.guaCiSeg, 'guaCi');
  }
  if (isEn || !hex.tuanSeg){
    document.getElementById('ccTuan').textContent = isEn ? e.tuan : hex.tuan;
    document.getElementById('ccTuanX').textContent = isEn ? e.tuanX : hex.tuanX;
  } else {
    renderSegBlock(document.getElementById('ccTuan'), document.getElementById('ccTuanX'), hex.tuanSeg, 'tuan');
  }
  if (isEn || !hex.xiangSeg){
    document.getElementById('ccXiang').textContent = isEn ? e.xiang : hex.xiang;
    document.getElementById('ccXiangX').textContent = isEn ? e.xiangX : hex.xiangX;
  } else {
    renderSegBlock(document.getElementById('ccXiang'), document.getElementById('ccXiangX'), hex.xiangSeg, 'xiang');
  }

  buildYaoBlocks(isEn ? e.yao : hex.yao);

  const u = TRIGRAMS[hex.u], l = TRIGRAMS[hex.l];
  document.getElementById('upperGlyph').textContent = u.glyph;
  document.getElementById('upperName').textContent = isEn ? u.nameEn : hex.u;
  document.getElementById('upperDir').textContent = isEn ? u.dirEn : u.dir;
  document.getElementById('lowerGlyph').textContent = l.glyph;
  document.getElementById('lowerName').textContent = isEn ? l.nameEn : hex.l;
  document.getElementById('lowerDir').textContent = isEn ? l.dirEn : l.dir;

  renderStaticHexagram(document.getElementById('staticLines'), hex.u, hex.l);
  buildCompass(hex);

  document.getElementById('adviceLove').textContent = isEn ? e.a : hex.a;
  document.getElementById('adviceCareer').textContent = isEn ? e.b : hex.b;
  document.getElementById('adviceWealth').textContent = isEn ? e.c : hex.c;

  document.getElementById('heroHint').textContent = t.heroHintResult(hex);
}

function buildYaoBlocks(yaoList){
  const container = document.getElementById('yaoContainer');
  container.innerHTML = '';
  const t = UI_STRINGS[currentLang];

  yaoList.forEach((row, idx)=>{
    const [label, text, textX, xiangText, xiangX] = row;

    const block = document.createElement('div');
    block.className = 'yao-block';

    const head = document.createElement('div');
    head.className = 'yao-head';
    const labelEl = document.createElement('span');
    labelEl.className = 'yao-label';
    labelEl.textContent = label;
    const textEl = document.createElement('p');
    textEl.className = 'yao-text serif';
    textEl.textContent = text;
    head.appendChild(labelEl);
    head.appendChild(textEl);

    const explainEl = document.createElement('p');
    explainEl.className = 'yao-explain';
    explainEl.textContent = textX;

    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'yao-toggle';
    toggleBtn.type = 'button';
    toggleBtn.textContent = t.yaoToggle;
    toggleBtn.setAttribute('aria-expanded', 'false');

    const panel = document.createElement('div');
    panel.className = 'yao-xiang-panel';
    panel.hidden = true;

    const panelLabel = document.createElement('p');
    panelLabel.className = 'classic-label';
    panelLabel.textContent = t.panelLabel;
    const panelText = document.createElement('p');
    panelText.className = 'classic-text serif';
    panelText.textContent = xiangText;
    const panelExplain = document.createElement('p');
    panelExplain.className = 'classic-explain';
    panelExplain.textContent = xiangX;
    panel.appendChild(panelLabel);
    panel.appendChild(panelText);
    panel.appendChild(panelExplain);

    toggleBtn.addEventListener('click', ()=>{
      const isHidden = panel.hidden;
      panel.hidden = !isHidden;
      toggleBtn.setAttribute('aria-expanded', String(isHidden));
    });

    block.appendChild(head);
    block.appendChild(explainEl);
    block.appendChild(toggleBtn);
    block.appendChild(panel);
    container.appendChild(block);
  });
}

function castHexagram(){
  castBtn.disabled = true;
  castLabel.style.display = 'none';
  heroHint.textContent = UI_STRINGS[currentLang].heroHintCasting;

  const hex = HEXAGRAMS[Math.floor(Math.random() * HEXAGRAMS.length)];

  animateHexagram(linesFrame, hex.u, hex.l, ()=>{
    showResult(hex);
    castBtn.disabled = false;
    setTimeout(()=>{
      document.getElementById('meaning').scrollIntoView({behavior:'smooth'});
    }, 500);
  });
}

castBtn.addEventListener('click', castHexagram);

document.getElementById('redoBtn').addEventListener('click', ()=>{
  linesFrame.classList.remove('show');
  linesFrame.innerHTML = '';
  castLabel.style.display = '';
  currentHex = null;
  document.getElementById('heroHint').textContent = UI_STRINGS[currentLang].heroHintIdle;
  document.getElementById('hexIndex').textContent = UI_STRINGS[currentLang].hexIndexIdle;
  document.getElementById('hero').scrollIntoView({behavior:'smooth'});
});

document.getElementById('langToggle').addEventListener('click', ()=>{
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  applyStaticStrings();
  if (currentHex){
    showResult(currentHex);
  }
});

applyStaticStrings();
</script>
