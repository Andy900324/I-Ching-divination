 xiangSeg:[{o:"澤上於天，夬；",e:"沼澤之水高懸於天上，隨時可能潰決而下，象徵果決之象；"},{o:"君子以施祿及下，居德則忌。",e:"君子觀此應將恩惠俸祿廣施於下位者，若獨自安享德澤而不與人分享，則應有所警惕。",terms:["jun_zi"]}],
 yao:[
 ["初九","壯于前趾，往不勝為咎。","剛強之氣顯現於腳趾般急於前行，若前往卻無法取勝，反而成為過失。","不勝而往，咎也。","尚未有必勝的把握便貿然前往，這就是過咎所在。"],
 ["九二","惕號，莫夜有戎，勿恤。","心懷戒惕、大聲疾呼提防危險，即使深夜有敵情來犯，也不必過度憂慮。","有戎勿恤，得中道也。","即使有敵情也不必過憂，是因秉持中庸之道應對。"],
 ["九三","壯于頄，有凶；君子夬夬，獨行遇雨，若濡有慍，无咎。","剛強之氣顯露於面容，有凶險；君子當機立斷、獨自前行縱使遇雨淋濕而心生慍怒，仍無災咎。","君子夬夬，終无咎也。","君子當機立斷、堅決果行，最終並無過咎。"],
 ["九四","臀无膚，其行次且；牽羊悔亡，聞言不信。","行走艱難如臀部受傷般難以安坐，猶豫不前；若能如牽羊般順勢而行，悔恨可消，但對於忠告卻聽而不信。","其行次且，位不當也；聞言不信，聰不明也。","行走猶豫不前，是因所處之位不甚恰當；聽聞忠告卻不相信，是耳目不夠聰慧明察。"],
 ["九五","莧陸夬夬，中行无咎。","如决除柔嫩的莧菜般果斷處置，秉持中道而行，並無災咎。","中行无咎，中未光也。","秉持中道而無咎，但中正之道尚未能完全光大彰顯。"],
 ["上六","无號，終有凶。","已無法再呼號求救，最終仍有凶險，象徵柔弱者的處境走到盡頭。","无號之凶，終不可長也。","無法呼號求助的凶險，象徵這樣的處境終究無法長久維持。"],
 ],
 a:"感情中該面對的問題不宜再拖延，宜當機立斷。",b:"適合果斷處理積弊已久的問題，展現決斷力。",c:"該處理的財務問題宜盡快解決，避免拖延生變。",
 en:{name:"Guài",title:"Breakthrough",keyword:"Decisive Resolution",
  desc:"A lake rising above heaven, about to break forth: the moment calls for firm, decisive resolution of a long-standing problem — but pursued fairly, not through force alone.",
  guaCi:"Guài: Proclaimed openly at the royal court, with sincere warning of danger. Announce it within your own city; it is not favorable to resort to arms. Favorable to have somewhere to go.",
  guaCiX:"Address the problem openly and honestly, starting close to home, warning sincerely of the risk — resorting to force is unwise, though continued forward movement remains favorable.",
  tuan:"Guài means to break through decisively: the firm breaks through the soft. Strong yet joyous, decisive yet harmonious. Proclaimed openly at the royal court means the one soft line rides atop five firm ones. Sincere warning of danger means the danger itself becomes clear. Announcing it within one's own city, not favorable to resort to arms, means what is relied upon would reach its own limit. Favorable to have somewhere to go means the firm force, once it grows, will finally reach completion.",
  tuanX:"Even a small remaining obstruction, precariously perched above real strength, must be addressed openly and with sincere warning rather than force — sustained, principled effort will eventually see this resolved fully.",
  xiang:"The lake rises up to heaven: this is Guài. Thus the noble one extends his bounty down to those below, yet is wary of resting on virtue alone.",
  xiangX:"As the lake's waters rise high, even toward heaven itself, a person of character shares their abundance generously with those below, while remaining wary of complacency.",
  yao:[
   ["1st (Nine)","Vigor in the front toes. To go forward without certainty of success is a fault.","Acting rashly, before one's strength or readiness is truly sufficient, is itself a mistake.","Going forward without being certain of victory is indeed a fault.","Such premature action, without real assurance, is exactly the error here."],
   ["2nd (Nine)","A sincere warning cried out. Even if trouble comes at night, there is nothing to fear.","Sincere, timely warning of danger means that even sudden trouble need not be truly feared.","Trouble at night, yet nothing to fear, comes from holding to the balanced, correct middle way.","This centered, correct approach is what removes real cause for fear."],
   ["3rd (Nine)","Vigor shown in the cheekbones. There is misfortune. The noble one is resolute, resolute, walking alone and meeting rain; though it may seem he is soaked and resentful, no blame.","Visible determination invites some risk, but a principled person's resolve, even when misunderstood, remains ultimately sound.","The noble one is resolute, resolute — in the end, no blame.","This steady, principled resolve ultimately carries no real fault."],
   ["4th (Nine)","No skin on the buttocks; walking is halting and difficult. Leading a flock of sheep, regret vanishes. Hearing these words, yet not truly believing them.","Progress is uncomfortable and slow, but following capable guidance, rather than going it alone, dissolves earlier regret — though the advice may not yet be fully trusted.","No skin on the buttocks means the position held is not a fitting one; hearing these words yet not believing them shows a lack of true understanding.","This ill-suited position, paired with a failure to truly listen, is the underlying issue here."],
   ["5th (Nine)","The weed patch is resolutely cleared. Walking the middle course brings no blame.","Firm, decisive action against a persistent minor problem, done with balance, carries no fault.","Walking the middle course without blame means the balanced way has not yet fully come to light.","This is sound, though the deeper balance of the way has not yet been fully realized."],
   ["Top (Six)","No one calls out in warning; in the end, there is misfortune.","Without any sincere warning offered or heeded, the matter ultimately ends badly.","The misfortune of not calling out in warning cannot, in the end, long endure.","This unfortunate state of affairs, left unaddressed, cannot continue indefinitely either way."],
  ],
  a:"Don't put off issues that need addressing — decisive action is called for.",b:"A good time to decisively resolve long-standing problems.",c:"Handle overdue financial matters promptly to avoid complications."}
},
{n:44,s:"姤",f:"天風姤",u:"乾",l:"巽",k:"慎始防微",fortune:"小凶",
 desc:"慎始防微，指目前可能出現意外的誘惑或機會，宜謹慎評估、把持分寸。",
 guaCi:"姤：女壯，勿用取女。",
 guaCiX:"姤卦象徵不期而遇：象徵陰氣初生而漸盛，此時不宜娶這樣強勢的女子為妻，提醒應謹慎面對意外的相遇。",
 tuan:"姤，遇也，柔遇剛也。勿用取女，不可與長也。天地相遇，品物咸章也。剛遇中正，天下大行也。姤之時義大矣哉！",
 tuanX:"姤就是相遇的意思，是陰柔與陽剛相遇的過程；之所以不宜娶這樣的女子，是因為這股陰柔之勢不宜任其增長；天地相互交會遇合，萬物因此得以彰顯生長；陽剛遇上中正之道，天下的政令便能暢行無阻；姤卦所蘊含謹慎面對相遇的道理，其意義實在深遠重大！",
 xiang:"天下有風，姤；后以施命誥四方。",
 xiangX:"天底下吹拂著風，無所不至，象徵不期而遇、廣泛接觸之象，君王觀此應頒布政令，曉諭天下四方。",
 guaCiSeg:[{o:"姤：女壯，",e:"姤卦象徵不期而遇：象徵陰氣初生而漸盛，"},{o:"勿用取女。",e:"此時不宜娶這樣強勢的女子為妻，提醒應謹慎面對意外的相遇。"}],
 tuanSeg:[{o:"姤，遇也，柔遇剛也。",e:"姤就是相遇的意思，是陰柔與陽剛相遇的過程。"},{o:"勿用取女，不可與長也。",e:"之所以不宜娶這樣的女子，是因為這股陰柔之勢不宜任其增長。"},{o:"天地相遇，品物咸章也。",e:"天地相互交會遇合，萬物因此得以彰顯生長。"},{o:"剛遇中正，天下大行也。",e:"陽剛遇上中正之道，天下的政令便能暢行無阻。",terms:["zhong_zheng"]},{o:"姤之時義大矣哉！",e:"姤卦所蘊含謹慎面對相遇的道理，其意義實在深遠重大！",terms:["shi"]}],
 xiangSeg:[{o:"天下有風，姤；",e:"天底下吹拂著風，無所不至，象徵不期而遇、廣泛接觸之象；"},{o:"后以施命誥四方。",e:"君王觀此應頒布政令，曉諭天下四方。"}],
 yao:[
 ["初六","繫于金柅，貞吉；有攸往，見凶；羸豕孚蹢躅。","以堅固的金屬煞車繫住，堅守正道則吉；若貿然前往行動將見凶險，如瘦弱的豬隻焦躁徘徊般不安。","繫于金柅，柔道牽也。","以堅固之物繫住柔弱的力量，及早加以牽制。"],
 ["九二","包有魚，无咎，不利賓。","如廚房中包藏著魚一般擁有資源，並無災咎，但不宜將其輕易示人或分享給外人。","包有魚，義不及賓也。","包藏資源在內，依理不應該延及外來的賓客。"],
 ["九三","臀无膚，其行次且，厲，无大咎。","行走艱難猶豫不前，雖有危險但並無重大過咎。","其行次且，行未牽也。","行走猶豫不前，是因尚未受到外力的牽引。"],
 ["九四","包无魚，起凶。","原本包藏的資源已然失去，因而興起凶險之事。","无魚之凶，遠民也。","失去資源而生凶險，是因與百姓漸行疏遠。"],
 ["九五","以杞包瓜，含章，有隕自天。","以枸杞樹的枝葉包覆瓜果般用心守護，內含美德才華，將有如天降般的美好機緣。","九五含章，中正也；有隕自天，志不舍命也。","內含美德而居中守正；天降機緣，是因不放棄應盡的使命。"],
 ["上九","姤其角，吝，无咎。","相遇之勢已發展至如頭角般的末端極致，稍有遺憾但並無災咎。","姤其角，上窮吝也。","相遇之勢發展至頂端窮盡之處，故稍有遺憾。"],
 ],
 a:"可能有意外的邂逅或誘惑，宜謹慎看待、把持分寸。",b:"職場上可能出現新的合作機會，宜謹慎評估來歷。",c:"財務上宜提防不明來源的誘因，謹慎查證後再行動。",
 en:{name:"Gòu",title:"Encountering",keyword:"Unexpected Meeting",
  desc:"Wind moving beneath heaven: an unlooked-for encounter or temptation may appear now — meet it with clear-eyed caution rather than careless indulgence.",
  guaCi:"Gòu: The woman is powerful. Do not take this woman in marriage.",
  guaCiX:"A rising, unchecked influence calls for real caution — this is not the moment to commit fully to what has appeared.",
  tuan:"Gòu means to encounter: the soft encounters the firm. Do not take this woman in marriage, for she cannot be depended on to last. Heaven and earth encounter one another, and all things are made fully manifest. The firm encounters the balanced and correct, and the whole world's affairs are greatly carried forward. Great indeed is the timeliness of Gòu and its meaning!",
  tuanX:"Just as heaven and earth's meeting brings all things fully into being, a chance, unlooked-for encounter carries real significance — though not every such encounter should be trusted to last.",
  xiang:"Beneath heaven there is wind: this is Gòu. Thus the ruler issues his commands, proclaiming them to the four quarters of the world.",
  xiangX:"As wind moves beneath heaven, reaching into every corner, a ruler issues commands that are proclaimed throughout the whole realm.",
  yao:[
   ["1st (Six)","Held fast by a metal brake-block. Perseverance brings good fortune. Should one go forward, misfortune will appear. A weak, thin pig struggles and paces restlessly.","An unchecked influence should be firmly restrained at the outset — persisting in this restraint is fortunate, while letting it advance courts misfortune.","Held fast by a metal brake-block means the soft way is being restrained.","This is precisely about restraining a small but growing influence before it spreads."],
   ["2nd (Nine)","A wrapped fish in the kitchen. No blame. Not favorable for guests.","What has been contained and kept close should not be shared more widely just yet.","A wrapped fish, no blame, means it is not fitting to extend this reach to others.","This containment is fitting for now, without extending its influence further."],
   ["3rd (Nine)","No skin on the buttocks; walking is halting and difficult. Danger, yet no great blame.","Discomfort and slow progress here, though difficult, involves no serious fault.","Walking halting and difficult means one has not truly advanced upon it.","There has been no real advance made here, hence no serious error either."],
   ["4th (Nine)","No fish in the wrapper. This gives rise to misfortune.","What was once contained has now escaped, and real trouble follows.","The misfortune of no fish in the wrapper comes from having grown distant from the people.","This growing distance from those one should be close to is the source of the trouble."],
   ["5th (Nine)","Wrapping melons with willow leaves. Containing real refinement within. Something falls from heaven itself.","Carefully, thoughtfully containing inner excellence, in due course, brings an unexpected and welcome gift.","The fifth line containing real refinement holds to the balanced and correct way.","This is precisely the balanced, correct holding of genuine inner quality."],
   ["Top (Nine)","Encountering with the horns. Regret, yet no blame.","A final, somewhat harsh encounter brings some difficulty, though no lasting fault.","The regret of encountering with the horns at the very top comes from things having reached their limit.","This is simply where the natural course of this matter has reached its end."],
  ],
  a:"An unexpected temptation or encounter may arise — proceed with caution.",b:"New collaboration opportunities may appear — verify them carefully before committing.",c:"Be wary of unclear sources of financial gain — verify before acting."}
},
{n:45,s:"萃",f:"澤地萃",u:"兌",l:"坤",k:"聚合眾力",fortune:"小吉",
 desc:"聚合眾力，指當前適合凝聚人心、集結資源，眾志成城必能有所成就。",
 guaCi:"萃：亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。",
 guaCiX:"萃卦象徵聚合眾力：亨通，君王親臨宗廟祭祀，有利於求見賢能之人，堅守正道可獲亨通；以豐盛的祭品祭祀則吉祥，也適合有所前往。",
 tuan:"萃，聚也。順以說，剛中而應，故聚也。王假有廟，致孝享也。利見大人亨，聚以正也。用大牲吉，利有攸往，順天命也。觀其所聚，而天地萬物之情可見矣！",
 tuanX:"萃就是聚合的意思；順從而又和悅，剛強居中且能相應，因此能夠聚合眾人；君王親臨宗廟祭祀，是為了表達孝敬之心；有利於求見賢能之人並能亨通，是因為以正道聚合眾人；以豐盛的祭品祭祀能夠吉祥、適合前往，是因為順應了天命；觀察萬物聚合的方式，便能了解天地萬物真實的情狀！",
 xiang:"澤上於地，萃；君子以除戎器，戒不虞。",
 xiangX:"沼澤之水匯聚於大地之上，象徵聚合之象，君子觀此應整備兵器武備，戒備意料之外的變故。",
 guaCiSeg:[{o:"萃：亨。",e:"萃卦象徵聚合眾力：亨通。",terms:["heng"]},{o:"王假有廟，",e:"君王親臨宗廟祭祀，"},{o:"利見大人，亨，利貞。",e:"有利於求見賢能之人，堅守正道可獲亨通。",terms:["li","da_ren","heng","zhen"]},{o:"用大牲吉，",e:"以豐盛的祭品祭祀則吉祥，",terms:["ji"]},{o:"利有攸往。",e:"也適合有所前往。",terms:["li","youyouwang"]}],
 tuanSeg:[{o:"萃，聚也。順以說，剛中而應，故聚也。",e:"萃就是聚合的意思；順從而又和悅，剛強居中且能相應，因此能夠聚合眾人。"},{o:"王假有廟，致孝享也。",e:"君王親臨宗廟祭祀，是為了表達孝敬之心。"},{o:"利見大人亨，聚以正也。",e:"有利於求見賢能之人並能亨通，是因為以正道聚合眾人。",terms:["li","da_ren","heng"]},{o:"用大牲吉，利有攸往，順天命也。",e:"以豐盛的祭品祭祀能夠吉祥、適合前往，是因為順應了天命。",terms:["ji","li","tian_ming"]},{o:"觀其所聚，而天地萬物之情可見矣！",e:"觀察萬物聚合的方式，便能了解天地萬物真實的情狀！"}],
 xiangSeg:[{o:"澤上於地，萃；",e:"沼澤之水匯聚於大地之上，象徵聚合之象；"},{o:"君子以除戎器，戒不虞。",e:"君子觀此應整備兵器武備，戒備意料之外的變故。",terms:["jun_zi"]}],
 yao:[
 ["初六","有孚不終，乃亂乃萃；若號，一握為笑，勿恤，往无咎。","誠信起初未能貫徹始終，導致人心散亂又聚合不定；若能誠心呼喊，眾人終將轉憂為喜，不必過慮，前往並無災咎。","乃亂乃萃，其志亂也。","人心時聚時散，是因心志尚未安定專一。"],
 ["六二","引吉，无咎；孚乃利用禴。","受到引薦而吉祥，並無災咎；心懷誠信，即使以簡樸的禴祭也能感通神明、有利。","引吉无咎，中未變也。","受引薦而吉且無咎，是因居中之道尚未改變。"],
 ["六三","萃如嗟如，无攸利；往无咎，小吝。","想要聚合眾人卻徒然嘆息，沒有益處；勉強前往雖無災咎，但仍有些許遺憾。","往无咎，上巽也。","前往而無咎，是因能謙遜順從於上位者。"],
 ["九四","大吉，无咎。","此時大為吉祥，並無災咎。","大吉无咎，位不當也。","雖然大吉無咎，但所處之位仍有不盡恰當之處，宜謹慎。"],
 ["九五","萃有位，无咎；匪孚，元永貞，悔亡。","居於適當之位聚合眾人，並無災咎；即使尚未完全取信於人，只要長久堅守正道，悔恨終將消失。","萃有位，志未光也。","雖居其位而聚眾，但志向尚未能完全光大彰顯。"],
 ["上六","齎咨涕洟，无咎。","悲傷嘆息、涕淚縱橫，雖處境淒涼但並無災咎。","齎咨涕洟，未安上也。","如此悲切，是因尚未能安於上位、安定心境。"],
 ],
 a:"適合參與聚會活動，有機會遇見志同道合的對象。",b:"團隊凝聚力強，適合集結資源共同推動計畫。",c:"適合集資合作或團體投資，眾志成城可獲佳績。",
 en:{name:"Cuì",title:"Gathering",keyword:"Coming Together",
  desc:"A lake rising above the earth: this is a favorable time for people and resources to gather together — unite with sincerity, and much can be accomplished.",
  guaCi:"Cuì: Success. The king approaches his ancestral temple. Favorable to see a great man; success, favorable to persevere. Using a great offering brings good fortune; favorable to have somewhere to go.",
  guaCiX:"A season of coming together brings success; sincere devotion, seeking wise counsel, and generous, well-intentioned effort all favor moving forward now.",
  tuan:"Cuì means to gather: gentle and joyous, the firm holds the center and responds — hence the gathering. The king approaches his ancestral temple, bringing forth true filial devotion. Favorable to see a great man, success, for gathering is achieved through correctness. Using a great offering brings good fortune, favorable to have somewhere to go, for this follows heaven's own mandate. Observing what truly gathers things together, the deeper nature of heaven and earth and all creation may be seen!",
  tuanX:"Genuine devotion — like a king's sincere reverence at the ancestral temple — is what truly draws people and resources together; observing this natural gathering reveals something profound about all creation.",
  xiang:"The lake rises above the earth: this is Cuì. Thus the noble one prepares his weapons, guarding against the unforeseen.",
  xiangX:"As the lake gathers and rises above the earth's surface, a person of character readies their defenses, staying prepared for the unexpected.",
  yao:[
   ["1st (Six)","With sincerity, yet not carried through to the end; there is confusion, then a gathering. If one cries out, a single grasp brings laughter. Do not be anxious; going forward brings no blame.","Sincerity that wavers brings initial confusion before real connection forms — calling out clearly resolves this, so there is no need for worry in moving forward.","The confusion within comes from a will that has grown disordered.","This inner disorder of purpose is the root of the earlier confusion."],
   ["2nd (Six)","Being drawn forward brings good fortune, no blame. With sincerity, it is favorable to use even a simple summer offering.","Being led toward gathering, with sincerity, brings good fortune; even a modest, genuine offering is entirely fitting here.","Being drawn forward with good fortune shows the middle way has not yet altered.","The centered, balanced approach remains steady and unchanged throughout this."],
   ["3rd (Six)","Gathering, then sighing, nothing favorable in this. Going forward brings no blame, though some small regret.","A gathering that brings disappointment offers little benefit for now, though moving forward, despite minor regret, is not truly at fault.","Going forward without blame comes from a willingness to yield and follow above.","This willingness to defer to proper guidance above is what keeps this sound."],
   ["4th (Nine)","Great good fortune. No blame.","This position brings great good fortune, entirely without fault.","Great good fortune without blame means the position held is not truly a fitting one.","Even so, this position is not entirely well-suited, so care is still warranted."],
   ["5th (Nine)","Gathering with real position. No blame. If not yet trusted, hold firmly to what is enduring, correct, and constant; regret vanishes.","Genuine authority in gathering others carries no fault; if trust is not yet complete, sustained integrity will dissolve any remaining doubt.","Gathering with real position shows the will has not yet fully come to light.","The deeper purpose behind this gathering has not yet been fully revealed or realized."],
   ["Top (Six)","Sighing and weeping, tears flowing freely. No blame.","Deep, unguarded emotional release at this point carries no fault.","Sighing and weeping at the very top means one is not yet at peace.","This lack of settled peace is simply the natural condition at this final stage."],
  ],
  a:"Good for social gatherings — you may meet someone who shares your values.",b:"Team cohesion is strong — pool resources to advance shared plans.",c:"Good for group investment or pooled resources — unity brings good results."}
},
{n:46,s:"升",f:"地風升",u:"坤",l:"巽",k:"循序漸升",fortune:"大吉",
 desc:"循序漸升，指當前運勢亨通、勇猛向前、不必憂慮，未來必定大有成就。",
 guaCi:"升：元亨。用見大人，勿恤，南征吉。",
 guaCiX:"升卦象徵循序漸升：大為亨通，適合求見賢能之人，不必憂慮，往南方前進則吉祥。",
 tuan:"柔以時升，巽而順，剛中而應，是以大亨。用見大人，勿恤，有慶也。南征吉，志行也。",
 tuanX:"陰柔者能順應時勢而逐漸上升，謙遜而又順從，剛強者居中且能相應，因此能大為亨通；適合求見賢能之人，不必憂慮，是因為必有喜慶之事；往南方前進吉祥，是因為心中的志向得以實現。",
 xiang:"地中生木，升；君子以順德，積小以高大。",
 xiangX:"大地之中長出樹木，逐漸向上生長，象徵循序漸升之象，君子觀此應順應美德，累積微小的努力，逐步邁向高大的成就。",
 guaCiSeg:[{o:"升：元亨。",e:"升卦象徵循序漸升：大為亨通。",terms:["yuanheng"]},{o:"用見大人，勿恤，",e:"適合求見賢能之人，不必憂慮，",terms:["da_ren"]},{o:"南征吉。",e:"往南方前進則吉祥。",terms:["ji"]}],
 tuanSeg:[{o:"柔以時升，巽而順，剛中而應，是以大亨。",e:"陰柔者能順應時勢而逐漸上升，謙遜而又順從，剛強者居中且能相應，因此能大為亨通。",terms:["shi","heng"]},{o:"用見大人，勿恤，有慶也。",e:"適合求見賢能之人，不必憂慮，是因為必有喜慶之事。",terms:["da_ren"]},{o:"南征吉，志行也。",e:"往南方前進吉祥，是因為心中的志向得以實現。",terms:["ji","zhi"]}],
 xiangSeg:[{o:"地中生木，升；",e:"大地之中長出樹木，逐漸向上生長，象徵循序漸升之象；"},{o:"君子以順德，積小以高大。",e:"君子觀此應順應美德，累積微小的努力，逐步邁向高大的成就。",terms:["jun_zi"]}],
 yao:[
 ["初六","允升，大吉。","獲得眾人信任而得以上升，大為吉祥。","允升大吉，上合志也。","受信任而上升，與上位者的志向相合。"],
 ["九二","孚乃利用禴，无咎。","心懷誠信，即使以簡樸的禴祭也能感通而有利，並無災咎。","九二之孚，有喜也。","九二爻的誠信之德，必有喜慶之事相隨。"],
 ["九三","升虛邑。","如進入空曠無阻的城邑般順利上升，暢行無阻。","升虛邑，无所疑也。","順利上升毫無阻礙，故無需有所疑慮。"],
 ["六四","王用亨于岐山，吉，无咎。","如君王在岐山誠心祭祀般虔敬行事，吉祥，並無災咎。","王用亨于岐山，順事也。","君王在岐山祭祀，是順應時勢而行之事。"],
 ["六五","貞吉，升階。","堅守正道則吉，如拾級而上般循序漸進地晉升。","貞吉升階，大得志也。","堅守正道循序上升，志向得以大為實現。"],
 ["上六","冥升，利于不息之貞。","上升至幽暗不明之境，此時仍利於持續不懈地堅守正道。","冥升在上，消不富也。","上升至極致卻趨於幽暗，象徵盛極必然轉為消退。"],
 ],
 a:"感情穩定發展、逐漸加深，宜順其自然穩步前進。",b:"事業運穩步上升，按部就班終能獲得晉升機會。",c:"財運穩健成長，適合長期投資、循序累積財富。",
 en:{name:"Shēng",title:"Ascending",keyword:"Steady Progress",
  desc:"A tree quietly growing up from the earth: steady, unforced progress is favored now — advance with confidence, without undue worry.",
  guaCi:"Shēng: Sublime success. Favorable to see a great man. Do not worry; a southward journey brings good fortune.",
  guaCiX:"Great success comes now; seeking wise counsel is favorable, and there is no cause for worry as forward movement, especially southward, brings good fortune.",
  tuan:"The soft rises in due season; gentle and obedient, the firm holds the center and responds — hence great success. Favorable to see a great man, do not worry, for there is real cause for celebration. A southward journey brings good fortune, for the will is truly carried out.",
  tuanX:"Steady, gentle progress that unfolds naturally, in accord with proper timing, brings genuine success and cause for celebration — advancing this way fulfills real purpose.",
  xiang:"Within the earth, a tree grows: this is Shēng. Thus the noble one, obedient to virtue, accumulates small efforts to achieve what is high and great.",
  xiangX:"As a tree rises gradually from within the earth, a person of character follows virtue faithfully, building up great achievement from small, steady efforts.",
  yao:[
   ["1st (Six)","Trusted in ascending. Great good fortune.","Being genuinely trusted as one rises brings great good fortune.","The great good fortune of trusted ascent comes from a will held in accord above.","This is fortunate because the deeper intent is truly in harmony with those above."],
   ["2nd (Nine)","With sincerity, favorable to use even a simple summer offering. No blame.","A modest, sincere offering, given genuinely, carries no fault here.","The sincerity of the second line brings real cause for joy.","This genuine sincerity is, in itself, a real cause for happiness."],
   ["3rd (Nine)","Ascending into an empty city.","Progress here meets no resistance at all, advancing with complete ease.","Ascending into an empty city means there is nothing to doubt.","There is truly nothing here to give one pause or hesitation."],
   ["4th (Six)","The king makes offering at Mount Qí. Good fortune, no blame.","A leader's sincere, reverent devotion at a sacred place brings good fortune, without fault.","The king's offering at Mount Qí is an act in accordance with what is right.","This solemn devotion is precisely the fitting, proper action here."],
   ["5th (Six)","Perseverance brings good fortune. Ascending by the steps.","Steady, orderly progress, held with integrity, brings good fortune.","Perseverance with good fortune through ascending the steps brings, in the end, real and great fulfillment of purpose.","This gradual, step-by-step rise ultimately brings full realization of the intent."],
   ["Top (Six)","Ascending in darkness. Favorable in ceaseless perseverance.","Rising beyond what can be clearly seen calls for continued, unwavering perseverance.","Ascending in darkness at the very top shows abundance without real substance.","This is a fullness that, at its peak, has begun to lack real underlying substance."],
  ],
  a:"The relationship is developing steadily and deepening — let it progress naturally.",b:"Career is on a steady rise — advancement will come through consistent effort.",c:"Finances are growing steadily — favor long-term, gradual investment."}
},
{n:47,s:"困",f:"澤水困",u:"兌",l:"坎",k:"堅忍待時",fortune:"小凶",
 desc:"堅忍待時，指目前身處困境、資源受限，宜堅定志向、耐心等待轉機。",
 guaCi:"困：亨，貞，大人吉，无咎。有言不信。",
 guaCiX:"困卦象徵身處困境：仍可亨通，堅守正道；德高望重之人處此則吉祥、沒有災咎；此時多說無益，言語未必能取信於人。",
 tuan:"困，剛揜也。險以說，困而不失其所亨，其唯君子乎！貞大人吉，以剛中也。有言不信，尚口乃窮也。",
 tuanX:"困卦是陽剛被陰柔所掩蔽遮蔽的處境；身處險境卻仍能保持內心和悅，處於困境卻不失去亨通的本質，這恐怕只有君子才能做到！堅守正道、德高望重之人便能吉祥，是因為秉持剛健中正之德；此時多說反而無益，是因為一味崇尚言辭辯說終將陷入窮困。",
 xiang:"澤无水，困；君子以致命遂志。",
 xiangX:"沼澤之中沒有水，象徵資源枯竭、身處困境之象，君子觀此應不惜付出生命，也要完成自己的志向。",
 guaCiSeg:[{o:"困：亨，貞，",e:"困卦象徵身處困境：仍可亨通，堅守正道；",terms:["heng","zhen"]},{o:"大人吉，无咎。",e:"德高望重之人處此則吉祥、沒有災咎；",terms:["da_ren","ji","wujiu"]},{o:"有言不信。",e:"此時多說無益，言語未必能取信於人。"}],
 tuanSeg:[{o:"困，剛揜也。",e:"困卦是陽剛被陰柔所掩蔽遮蔽的處境。"},{o:"險以說，困而不失其所亨，其唯君子乎！",e:"身處險境卻仍能保持內心和悅，處於困境卻不失去亨通的本質，這恐怕只有君子才能做到！",terms:["heng","jun_zi"]},{o:"貞大人吉，以剛中也。",e:"堅守正道、德高望重之人便能吉祥，是因為秉持剛健中正之德。",terms:["zhen","da_ren","ji"]},{o:"有言不信，尚口乃窮也。",e:"此時多說反而無益，是因為一味崇尚言辭辯說終將陷入窮困。"}],
 xiangSeg:[{o:"澤无水，困；",e:"沼澤之中沒有水，象徵資源枯竭、身處困境之象；"},{o:"君子以致命遂志。",e:"君子觀此應不惜付出生命，也要完成自己的志向。",terms:["jun_zi","zhi"]}],
 yao:[
 ["初六","臀困于株木，入于幽谷，三歲不覿。","如臀部困陷於枯木之間，深陷幽暗的山谷，長期不見天日。","入于幽谷，幽不明也。","深陷幽暗的山谷，象徵處境昏暗不明。"],
 ["九二","困于酒食，朱紱方來，利用亨祀；征凶，无咎。","雖受困於物質享受，卻有貴人如穿著朱紅官服者前來相助，適合誠心祭祀；貿然出征雖凶但並無災咎。","困于酒食，中有慶也。","雖受困於酒食享樂，但居中而行終有喜慶。"],
 ["六三","困于石，據于蒺藜；入于其宮，不見其妻，凶。","受困於堅石之間，又倚靠帶刺的蒺藜，回到家中卻不見妻子，凶險。","據于蒺藜，乘剛也；入于其宮，不見其妻，不祥也。","倚靠帶刺之物，是因處於剛強之上的險境；歸家不見妻子，是不祥的徵兆。"],
 ["九四","來徐徐，困于金車，吝，有終。","緩緩而來，受困於華麗的車駕之累，雖有遺憾但終能有好結果。","來徐徐，志在下也；雖不當位，有與也。","緩緩而來，是因志向在於謙下；雖所處之位不甚恰當，仍能得到相助。"],
 ["九五","劓刖，困于赤紱，乃徐有說，利用祭祀。","受到嚴厲的刑罰般痛苦，受困於顯貴的地位之中，但逐漸能夠解脫，適合誠心祭祀。","劓刖，志未得也；乃徐有說，以中直也；利用祭祀，受福也。","受此困境是因志向尚未實現；能逐漸解脫，是因秉持中正之道；誠心祭祀，終能受福。"],
 ["上六","困于葛藟，于臲卼，曰動悔，有悔，征吉。","受困於藤蔓般的糾纏，處境動盪不安，若說行動便有悔，然而懷有悔悟之心、勇於前行反而能吉祥。","困于葛藟，未當也；動悔有悔，吉行也。","受困於藤蔓糾纏，是處境未能得當；懂得悔悟而後行動，反而是吉祥之舉。"],
 ],
 a:"感情正面臨考驗與壓力，宜堅定信念、耐心度過。",b:"事業陷入瓶頸或資源受限，宜沉潛蓄力等待轉機。",c:"財務較為拮据，宜量入為出、避免舉債投資。",
 en:{name:"Kùn",title:"Confinement",keyword:"Perseverance Under Pressure",
  desc:"A lake with its water drained away, beneath: resources feel limited now, but genuine integrity, patiently held, will still find a way through.",
  guaCi:"Kùn: Success. Perseverance. The great man finds good fortune, no blame. Words are not believed.",
  guaCiX:"Even under real constraint, success and good fortune remain possible for someone of genuine character who perseveres; but words alone will not carry much weight now.",
  tuan:"Kùn: the firm is covered over. Danger, yet finding joy within; confined, yet not losing what makes one truly successful — surely this is the way of the noble one! Perseverance, the great man's good fortune, comes from firmness and balance. Words not believed shows that trusting in mere talk leads only to further confinement.",
  tuanX:"There is real strength of character in remaining inwardly at peace even while genuinely confined; a firm, balanced integrity — rather than persuasive words — is what actually carries one through such difficulty.",
  xiang:"The lake has no water: this is Kùn. Thus the noble one, even at the cost of his own life, remains devoted to fulfilling his purpose.",
  xiangX:"As the lake sits dry, its water having drained away, a person of character remains devoted to their true purpose, whatever the personal cost.",
  yao:[
   ["1st (Six)","Sitting confined beneath a bare tree trunk, entering a dark valley; for three years, not seen.","A prolonged period of obscurity and hardship, with no sign of relief for a long while.","Entering the dark valley shows a real lack of clarity in this situation.","This extended obscurity reflects just how unclear the way forward remains."],
   ["2nd (Nine)","Confined by food and drink; the scarlet-robed one is coming. Favorable to make offering. To press forward brings misfortune; no blame.","Amid material want, help of real significance is approaching; sincere devotion is fitting, though rash advance would be unwise, though not truly at fault.","Confined by food and drink shows there is, even so, real cause for celebration.","Even amid this confinement, there remains genuine cause for hope and celebration."],
   ["3rd (Six)","Confined by stone, resting upon thistles and thorns; entering one's own house, not seeing one's wife. Misfortune.","A truly painful, isolating confinement, where even the comfort of home is denied — a genuinely difficult situation.","Resting on thistles and thorns means one rides upon what is hard and unyielding; entering one's house and not seeing one's wife is an inauspicious sign indeed.","Facing such harsh, unyielding difficulty at home is a genuinely troubling omen."],
   ["4th (Nine)","Coming very slowly, confined by a bronze carriage. There is difficulty, yet an end to it.","Progress toward relief is slow and encumbered by outward wealth or position, but hardship does eventually come to an end.","Coming very slowly shows the will is directed toward what lies below; though not perfectly placed, there is still real companionship to be found.","Even in this less-than-ideal position, genuine companionship and support remain available."],
   ["5th (Nine)","Nose and feet both cut off; confined by the scarlet-robed ones, yet gradually there is release. Favorable to make offering.","Severe, painful restriction gradually gives way to relief — sincere devotion remains fitting throughout.","The confinement of nose and feet cut off shows the will has not yet been achieved; gradual release comes from a balanced, upright course; favorable to make offering means one thereby receives real blessing.","This centered, upright perseverance is ultimately what brings both release and genuine blessing."],
   ["Top (Six)","Confined by entangling vines, in a state of great unease; one says, 'movement brings regret' — yet with regret comes the resolve to act, and going forward brings good fortune.","Trapped in a tangled, uncomfortable predicament, real movement seems risky at first — but acknowledging the difficulty and acting anyway ultimately brings good fortune.","Confined by entangling vines means one has not yet found the fitting position; the regret felt in acting is itself what leads to a fortunate course.","Recognizing the awkward position, and moving forward regardless, is what turns this situation around."],
  ],
  a:"Love faces real pressure — stay firm and patiently work through it.",b:"Career has hit a bottleneck — stay low and build strength for the turnaround.",c:"Money is tight — live within your means and avoid debt-funded investment."}
},
{n:48,s:"井",f:"水風井",u:"坎",l:"巽",k:"井養不窮",fortune:"小凶",
 desc:"井養不窮，指當前累積的價值終將持續發揮效益，但切忌半途而廢。",
 guaCi:"井：改邑不改井，无喪无得，往來井井。汔至，亦未繘井，羸其瓶，凶。",
 guaCiX:"井卦象徵井養不窮：城邑可以遷移，水井卻不能移動，井水既不會減少也不會增加，來往取水的人絡繹不絕；但若快到井邊卻尚未打上井水，甚至打破了汲水的瓦瓶，便有凶險，提醒應堅持到底、切勿半途而廢。",
 tuan:"巽乎水而上水，井。井養而不窮也。改邑不改井，乃以剛中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。",
 tuanX:"順著水的性質向上汲水，這便是井卦的象徵；水井滋養萬物而永不枯竭；城邑可以遷移而水井不能移動，是因為秉持著剛健中正、恆常不變的特質；快到井邊卻尚未打上井水，表示尚未真正完成任務；打破了汲水的瓦瓶，因此才有凶險，提醒功虧一簣的教訓。",
 xiang:"木上有水，井；君子以勞民勸相。",
 xiangX:"木製的汲水器上盛著水，象徵水井滋養萬物之象，君子觀此應慰勞百姓、勸勉彼此互助扶持。",
 guaCiSeg:[{o:"井：改邑不改井，",e:"井卦象徵井養不窮：城邑可以遷移，水井卻不能移動，"},{o:"无喪无得，",e:"井水既不會減少也不會增加，"},{o:"往來井井。",e:"來往取水的人絡繹不絕。"},{o:"汔至，亦未繘井，",e:"但若快到井邊卻尚未打上井水，"},{o:"羸其瓶，凶。",e:"甚至打破了汲水的瓦瓶，便有凶險，提醒應堅持到底、切勿半途而廢。",terms:["xiong"]}],
 tuanSeg:[{o:"巽乎水而上水，井。",e:"順著水的性質向上汲水，這便是井卦的象徵。"},{o:"井養而不窮也。",e:"水井滋養萬物而永不枯竭。"},{o:"改邑不改井，乃以剛中也。",e:"城邑可以遷移而水井不能移動，是因為秉持著剛健中正、恆常不變的特質。"},{o:"汔至亦未繘井，未有功也。",e:"快到井邊卻尚未打上井水，表示尚未真正完成任務。"},{o:"羸其瓶，是以凶也。",e:"打破了汲水的瓦瓶，因此才有凶險，提醒功虧一簣的教訓。",terms:["xiong"]}],
 xiangSeg:[{o:"木上有水，井；",e:"木製的汲水器上盛著水，象徵水井滋養萬物之象；"},{o:"君子以勞民勸相。",e:"君子觀此應慰勞百姓、勸勉彼此互助扶持。",terms:["jun_zi"]}],
 yao:[
 ["初六","井泥不食，舊井无禽。","井底淤泥堆積、無法取水食用，如廢棄的舊井已無鳥獸前來，象徵荒廢已久。","井泥不食，下也；舊井无禽，時舍也。","井底淤積不堪食用，是因居於卑下之位；舊井荒廢，是因已被時勢所捨棄。"],
 ["九二","井谷射鮒，甕敝漏。","如在井谷中僅能射獵小魚，汲水的瓦甕又破損滲漏，象徵功能不彰、徒勞無功。","井谷射鮒，无與也。","僅能獵取井谷中的小魚，是因缺乏更多的助力與資源。"],
 ["九三","井渫不食，為我心惻；可用汲，王明並受其福。","井水已淘淨清澈卻無人飲用，令人感到惋惜哀傷；其實可以汲取利用，若君王賢明，眾人都能同享福澤。","井渫不食，行惻也；求王明，受福也。","井水清澈卻無人飲用，令人感到惻然哀傷；渴求賢明的君王任用，方能共同受福。"],
 ["六四","井甃，无咎。","修繕井壁、加以砌磚鞏固，並無災咎。","井甃无咎，脩井也。","修繕井壁而無咎，是為了整治維護水井的功能。"],
 ["九五","井洌，寒泉食。","井水清冽甘美，如寒泉般可供飲用，象徵資源優良、造福眾人。","寒泉之食，中正也。","寒泉可供飲用，是因秉持中正之道。"],
 ["上六","井收勿幕，有孚，元吉。","水井打水完成後不加蓋覆蓋、讓眾人共享，心懷誠信，大為吉祥。","元吉在上，大成也。","居於上位而獲元吉，象徵大功告成。"],
 ],
 a:"感情經營宜細水長流，用心維持才能歷久彌新。",b:"累積的專業與人脈終將發揮價值，宜持續精進。",c:"財源穩定但需妥善維護，避免資源閒置浪費。",
 en:{name:"Jǐng",title:"The Well",keyword:"Inexhaustible Resource",
  desc:"Water drawn up through wood: like a well that serves anyone who comes, real value here lies in steady maintenance — don't let a good resource fall into neglect.",
  guaCi:"Jǐng: The town may be changed, but the well cannot be changed. It neither decreases nor increases; people come and go, drawing from the well. If one nearly reaches the water but the rope does not yet reach it, or the jug is broken, this is misfortune.",
  guaCiX:"Some things are fixed and unchanging, serving everyone equally, but they must still be properly maintained — falling short at the last moment, through neglect, brings misfortune.",
  tuan:"Gentle, and rising up with water: this is the Well. The well nourishes without ever being exhausted. The town may change, but the well cannot change, for the firm holds the center. Nearly reaching the water but the rope not yet reaching it means no real achievement has yet been made. The jug breaking brings misfortune.",
  tuanX:"A resource that steadily nourishes without depletion — like a well's firm, unchanging core — still requires the work to be truly finished; falling short at the very end undoes the whole effort.",
  xiang:"Above the wood there is water: this is the Well. Thus the noble one encourages the people in their labor and urges them to help one another.",
  xiangX:"As water is drawn up through the wooden mechanism to reach those who need it, a person of character encourages the people in their work and urges mutual support.",
  yao:[
   ["1st (Six)","The well is muddy, undrinkable; an old well draws no birds.","A resource left neglected and unused becomes useless to everyone, even those who might otherwise rely on it.","The well muddy and undrinkable comes from lying at the very bottom; the old well drawing no birds means it has been abandoned by time.","This neglected position at the bottom is why it has fallen so completely out of use."],
   ["2nd (Nine)","The well shoots water down toward small fish; the jug is cracked and leaks.","Real potential is being wasted on trivial ends, and the means of drawing on it are themselves failing.","The well shooting water toward small fish means there is no real companion to help.","Lacking any true support or partnership is why this potential goes to waste."],
   ["3rd (Nine)","The well is cleaned, yet not drunk from; this is a cause for real sorrow. It could be drawn from — if the king were wise, all could share in this blessing.","Genuine value, ready to be used, sits neglected for lack of recognition from those in a position to make use of it.","The well cleaned yet not drunk from is a real cause for grief in passing by it; seeking a wise king means blessing could then be received.","This waste of genuine, ready value is truly regrettable — recognition from above would let it finally be of use."],
   ["4th (Six)","The well is lined with brick. No blame.","Careful, ongoing maintenance of a valuable resource keeps it sound and fault-free.","The well lined with brick without blame comes from the well itself being properly maintained.","This is simply the natural result of proper, careful upkeep."],
   ["5th (Nine)","The well runs clear and cool; its cold spring water may be drunk.","A resource in its finest, most refined state is now genuinely ready to benefit everyone.","The cold spring water that may be drunk comes from a balanced and correct nature.","This balanced, correct quality is what makes it so genuinely fit to nourish others."],
   ["Top (Six)","The well is drawn from without being covered; with sincerity, sublime good fortune.","A valuable resource, kept openly accessible and used sincerely by all, brings great good fortune.","Sublime good fortune at the very top comes from truly great success.","This represents the fullest, most complete success this resource can achieve."],
  ],
  a:"Love benefits from a slow, sustained approach — steady care keeps it fresh.",b:"Your accumulated expertise and connections will eventually pay off — keep refining.",c:"Income is steady but needs active management — don't let resources sit idle."}
},
{n:49,s:"革",f:"澤火革",u:"兌",l:"離",k:"改革創新",fortune:"大吉",
 desc:"改革創新，指眼前正是革除舊弊、順應時勢變革的好時機，可望脫胎換骨。",
 guaCi:"革：己日乃孚，元亨利貞，悔亡。",
 guaCiX:"革卦象徵改革創新：等到時機成熟之日，改革才能取信於人；大為亨通、有利、正固，悔恨也將因此消失。",
 tuan:"革，水火相息，二女同居，其志不相得，曰革。己日乃孚，革而信之。文明以說，大亨以正，革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉！",
 tuanX:"革卦中水火相互消長制衡，如同兩位女子同住一處卻志向不合，因此稱為變革；等到時機成熟之日才能取信於人，是因為改革之後獲得眾人的信任；內心光明又能使人和悅，能大為亨通且合乎正道，改革得當，悔恨便會因此消失；天地藉由變革而使四季得以形成，商湯、周武王的革命，都是順應天理、呼應人心的作為，變革所蘊含的時代意義實在重大深遠！",
 xiang:"澤中有火，革；君子以治歷明時。",
 xiangX:"沼澤之中有火相互制衡消長，象徵變革之象，君子觀此應修訂曆法，明辨時序的變化。",
 guaCiSeg:[{o:"革：己日乃孚，",e:"革卦象徵改革創新：等到時機成熟之日，改革才能取信於人；",terms:["fu"]},{o:"元亨利貞，",e:"大為亨通、有利、正固，",terms:["yuanheng","li","zhen"]},{o:"悔亡。",e:"悔恨也將因此消失。",terms:["hui"]}],
 tuanSeg:[{o:"革，水火相息，二女同居，其志不相得，曰革。",e:"革卦中水火相互消長制衡，如同兩位女子同住一處卻志向不合，因此稱為變革。",terms:["zhi"]},{o:"己日乃孚，革而信之。",e:"等到時機成熟之日才能取信於人，是因為改革之後獲得眾人的信任。",terms:["fu"]},{o:"文明以說，大亨以正，革而當，其悔乃亡。",e:"內心光明又能使人和悅，能大為亨通且合乎正道，改革得當，悔恨便會因此消失。",terms:["heng","hui"]},{o:"天地革而四時成，湯武革命，順乎天而應乎人，",e:"天地藉由變革而使四季得以形成，商湯、周武王的革命，都是順應天理、呼應人心的作為，"},{o:"革之時大矣哉！",e:"變革所蘊含的時代意義實在重大深遠！",terms:["shi"]}],
 xiangSeg:[{o:"澤中有火，革；",e:"沼澤之中有火相互制衡消長，象徵變革之象；"},{o:"君子以治歷明時。",e:"君子觀此應修訂曆法，明辨時序的變化。",terms:["jun_zi"]}],
 yao:[
 ["初九","鞏用黃牛之革。","以堅韌的黃牛皮加以牢固捆紮，象徵改革之初應先鞏固自身、謹慎行事。","鞏用黃牛，不可以有為也。","以此鞏固自身，是因時機尚未成熟，不宜貿然有所作為。"],
 ["六二","己日乃革之，征吉，无咎。","等到時機成熟之日才進行變革，前行吉祥，並無災咎。","己日革之，行有嘉也。","時機成熟而後變革，行事必有嘉美的結果。"],
 ["九三","征凶，貞厲；革言三就，有孚。","貿然出征有凶險，堅持也有危險；變革之言應反覆審議三次以求周全，心懷誠信。","革言三就，又何之矣。","變革的主張已反覆審議周全，還有什麼可猶豫的呢。"],
 ["九四","悔亡，有孚改命，吉。","悔恨消失，心懷誠信而改變舊有的命運或制度，吉祥。","改命之吉，信志也。","改變命運或制度而獲吉，是因心志真誠可信。"],
 ["九五","大人虎變，未占有孚。","德高望重之人如猛虎換毛般徹底而顯著地變革，不待占卜便已心懷誠信、深孚眾望。","大人虎變，其文炳也。","德高望重之人的變革，其文采光輝顯著可見。"],
 ["上六","君子豹變，小人革面；征凶，居貞吉。","君子如豹紋般細緻而顯著地跟隨變革，小人則僅是表面改變態度；貿然出征有凶險，安居守正則吉。","君子豹變，其文蔚也；小人革面，順以從君也。","君子的變革文采蔚然可觀；小人僅改變表面態度，是順從並追隨在上位者。"],
 ],
 a:"感情關係可能面臨重大轉變，宜順應變化調整心態。",b:"適合進行改革創新，順應趨勢調整方向能有所突破。",c:"財務規劃宜與時俱進，適時調整投資組合。",
 en:{name:"Gé",title:"Revolution",keyword:"Timely Transformation",
  desc:"Fire within the lake, each working against the other: real transformation is called for now — but it succeeds only once trust has genuinely been earned.",
  guaCi:"Gé: On one's own day, it is believed. Sublime success, favorable to persevere. Regret vanishes.",
  guaCiX:"Once real trust has been established through your own conduct, this change brings great success and favors continued integrity — earlier regret is dispelled.",
  tuan:"Gé: water and fire extinguish each other; two women living together, yet their wills do not move in the same direction — this is called Gé. On one's own day, it is believed — the change is carried through and becomes trusted. Cultured and joyous, greatly successful through correctness; the change, being fitting, dispels its own regret. Heaven and earth change, and the four seasons are thereby completed; Tāng and Wǔ changed their mandate in accordance with heaven and in response to the people. Great indeed is the timeliness of Gé!",
  tuanX:"Just as heaven and earth's own changes bring forth the seasons, and great rulers of the past changed course only when it truly answered both heaven's will and the people's need, real transformation must be fitting and well-earned to succeed.",
  xiang:"Fire within the lake: this is Gé. Thus the noble one sets the calendar in order and makes the seasons clear.",
  xiangX:"As fire and water in the lake work against one another, driving change, a person of character sets the calendar in order and clarifies the passing of the seasons.",
  yao:[
   ["1st (Nine)","Bound with the hide of a yellow ox.","At the very outset of change, restraint and firm stability are called for.","Bound with yellow ox hide means one should not yet take real action.","It is not yet the right moment to move forward with real change."],
   ["2nd (Six)","On one's own day, then the change may be carried out. Going forward brings good fortune, no blame.","Once trust has genuinely been earned, moving forward with the change brings good fortune and no fault.","The change carried through on one's own day comes from an action that has real cause for celebration.","This is a genuinely praiseworthy action, undertaken at exactly the right time."],
   ["3rd (Nine)","To press forward brings misfortune; perseverance carries danger. When talk of change has been raised three times, there is real sincerity in it.","Rash action now is unwise, and even careful persistence carries risk — but a proposal for change, thoroughly considered and repeated, shows genuine sincerity.","When talk of change has been raised three times, where else should one then go?","At this point, thorough deliberation has run its course, and the way forward is now clear."],
   ["4th (Nine)","Regret vanishes. With sincerity, changing the mandate. Good fortune.","Earlier doubt dissolves, and genuine, sincere transformation brings good fortune.","The good fortune of changing the mandate comes from genuine trust in one's purpose.","Real trust in the underlying intent is what makes this change so fortunate."],
   ["5th (Nine)","The great man transforms like a tiger; even before divination, there is real sincerity in it.","A truly capable leader's transformation is so evidently genuine that it needs no further confirmation.","The great man transforming like a tiger means his pattern is brilliantly clear.","The clarity and brilliance of this transformation speaks for itself."],
   ["Top (Six)","The noble one transforms like a leopard; the small-minded merely change their outward face. To press forward brings misfortune; remaining settled and correct brings good fortune.","A person of real character transforms deeply and visibly, while lesser people only change appearances — pushing further now is unwise, but staying settled and correct brings good fortune.","The noble one transforming like a leopard means his pattern is richly and beautifully clear; the small-minded changing only their face means they merely comply outwardly with their ruler.","Deep, genuine change shows in real substance, while mere outward compliance falls short of true transformation."],
  ],
  a:"The relationship may be heading for major change — adjust your mindset to match.",b:"A good time for reform and innovation — adapting to the trend can be a breakthrough.",c:"Update your financial plan as circumstances evolve."}
},
{n:50,s:"鼎",f:"火風鼎",u:"離",l:"巽",k:"鼎新革故",fortune:"大吉",
 desc:"鼎新革故，指目前基礎穩固、氣象一新，正是建立長遠事業的大好時機。",
 guaCi:"鼎：元吉，亨。",
 guaCiX:"鼎卦象徵鼎新革故：大為吉祥，亨通順遂。",
 tuan:"鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。",
 tuanX:"鼎就是取象的意思；以木材順從火勢燃燒，用來烹煮食物；聖人烹煮食物用以祭祀上天，並且以豐盛的宴饗奉養賢能之人；謙遜而又耳聰目明，柔順者上進而向上發展，居中且能與剛強相應，因此能大為吉祥、亨通。",
 xiang:"木上有火，鼎；君子以正位凝命。",
 xiangX:"木材之上燃著火，正如同鼎烹煮食物之象，君子觀此應端正自身的地位，凝聚並鞏固自己承擔的使命。",
 guaCiSeg:[{o:"鼎：元吉，",e:"鼎卦象徵鼎新革故：大為吉祥，",terms:["yuanji"]},{o:"亨。",e:"亨通順遂。",terms:["heng"]}],
 tuanSeg:[{o:"鼎，象也。以木巽火，亨飪也。",e:"鼎就是取象的意思；以木材順從火勢燃燒，用來烹煮食物。"},{o:"聖人亨以享上帝，而大亨以養聖賢。",e:"聖人烹煮食物用以祭祀上天，並且以豐盛的宴饗奉養賢能之人。",terms:["heng"]},{o:"巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。",e:"謙遜而又耳聰目明，柔順者上進而向上發展，居中且能與剛強相應，因此能大為吉祥、亨通。",terms:["yuanheng"]}],
 xiangSeg:[{o:"木上有火，鼎；",e:"木材之上燃著火，正如同鼎烹煮食物之象；"},{o:"君子以正位凝命。",e:"君子觀此應端正自身的地位，凝聚並鞏固自己承擔的使命。",terms:["jun_zi"]}],
 yao:[
 ["初六","鼎顛趾，利出否；得妾以其子，无咎。","鼎足顛倒翻轉，反而有利於倒出污穢不堪之物；如娶妾是為了得子傳承，並無災咎。","鼎顛趾，未悖也；利出否，以從貴也。","鼎足雖顛倒，卻未違背常理；有利於清除穢物，是為了順從尊貴的目的。"],
 ["九二","鼎有實，我仇有疾，不我能即，吉。","鼎中裝滿實物、充實有內涵，即使有對手心懷疾妒，也無法威脅接近，吉祥。","鼎有實，慎所之也；我仇有疾，終无尤也。","鼎中充實，行事更應謹慎所往；即使對手心懷妒忌，終究無可指責之處。"],
 ["九三","鼎耳革，其行塞，雉膏不食；方雨虧悔，終吉。","鼎耳脫落變異，運行受阻，美味的野雞肉膏也無法食用；待雨水降下、悔恨消解後，終能吉祥。","鼎耳革，失其義也。","鼎耳出現變異損壞，是失去了應有的功能與道理。"],
 ["九四","鼎折足，覆公餗，其形渥，凶。","鼎足折斷、傾覆了王公的美食，狼狽不堪，凶險。","覆公餗，信如何也。","傾覆了美食重任，其誠信與能力又該如何呢，實為失職。"],
 ["六五","鼎黃耳金鉉，利貞。","鼎配有中和的黃色鼎耳與堅固的金屬鼎槓，堅守正道有利。","鼎黃耳，中以為實也。","鼎具黃色的鼎耳，象徵以中庸之道作為充實的根本。"],
 ["上九","鼎玉鉉，大吉，无不利。","鼎配以溫潤的玉製鼎槓，剛柔相濟，大為吉祥，無所不利。","玉鉉在上，剛柔節也。","溫潤的玉槓居於上位，象徵剛柔相濟、調和有度。"],
 ],
 a:"感情關係邁向更穩固成熟的階段，宜用心經營。",b:"事業基礎穩固，適合建立長遠制度或品牌。",c:"財運穩健，適合投入資源建立長期穩定的收入來源。",
 en:{name:"Dǐng",title:"The Cauldron",keyword:"Establishing Stability",
  desc:"Fire above wind, like a cauldron over the flame: this is a time for establishing something solid and lasting — build carefully, and nourish what truly matters.",
  guaCi:"Dǐng: Sublime good fortune, success.",
  guaCiX:"A time of great good fortune and success, well suited to building something meant to last.",
  tuan:"Dǐng is an image: using wood to feed the fire, this is the way of cooking. The sage cooks in order to make offering to the Supreme Lord, and greatly cooks in order to nourish the worthy. Gentle, yet with clear sight and hearing; the soft advances and moves upward, attains balance and responds to the firm — hence sublime success.",
  tuanX:"Just as a cauldron is used both for sacred offering and for generously nourishing the worthy, a gentle yet clear-sighted approach, balanced and responsive to real strength, is what brings this great success.",
  xiang:"Fire above wood: this is Dǐng. Thus the noble one sets his position firmly and secures his true calling.",
  xiangX:"As fire burns steadily atop the wood beneath it, a person of character establishes their position firmly and secures their true purpose.",
  yao:[
   ["1st (Six)","The cauldron's legs are overturned; favorable to expel what is stale. Taking a concubine for the sake of her son. No blame.","Overturning old, outdated arrangements to clear out what no longer serves — even an unconventional choice, made for a sound reason, carries no fault.","The cauldron's legs overturned does not go against what is right; favorable to expel what is stale means to follow what is truly valuable.","This overturning is not, in fact, contrary to what is proper — it clears the way for what genuinely matters."],
   ["2nd (Nine)","The cauldron holds real substance; my companion has an ailment, yet cannot approach me. Good fortune.","Real, substantial value is protected here, safely out of reach of those who would seek to disturb it, bringing good fortune.","The cauldron holding real substance calls for careful attention to where it is placed; my companion having an ailment means, in the end, no real fault will follow.","This is fortunate because careful discernment about where to direct oneself prevents any real harm."],
   ["3rd (Nine)","The cauldron's handles are altered, its movement obstructed; the rich pheasant fat goes uneaten. Rain is about to fall, and regret will diminish. In the end, good fortune.","A temporary obstruction prevents genuine value from being enjoyed, but relief is coming, and earlier regret will fade — a good outcome in the end.","The cauldron's handles altered means one has lost what is truly proper.","This loss of proper function is the underlying reason for the temporary obstruction."],
   ["4th (Nine)","The cauldron's legs break, spilling the duke's fine stew; its form is drenched and soiled. Misfortune.","Overburdening or mishandling a position of real responsibility leads to a genuine, embarrassing failure.","The misfortune of spilling the duke's fine stew — how could trust in this really be justified?","Such a serious failure genuinely undermines any confidence placed here."],
   ["5th (Six)","The cauldron has yellow handles and golden carrying rings. Favorable to persevere.","A position of real, balanced strength and worth now favors continued, steady integrity.","The cauldron with yellow handles takes the balanced, correct way as its true substance.","This centered, correct quality is exactly what gives it such real substance."],
   ["Top (Nine)","The cauldron has a jade carrying ring. Great good fortune, nothing unfavorable.","A position of refined, harmonious strength brings great good fortune and only good outcomes.","The jade carrying ring at the very top shows firmness and softness well tempered together.","This is precisely where real strength and true gentleness come together in perfect balance."],
  ],
  a:"The relationship is entering a more stable, mature stage — invest care into it.",b:"A solid foundation supports building lasting systems or a strong brand.",c:"Finances are stable — a good time to build long-term, dependable income streams."}
},
{n:51,s:"震",f:"震為雷",u:"震",l:"震",k:"驚懼奮起",fortune:"平",
 desc:"驚懼奮起，指當前雖有突發驚動，但只要臨危不亂、心存戒懼終能無虞。",
 guaCi:"震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。",
 guaCiX:"震卦象徵驚懼奮起：亨通；雷聲乍然驚動，令人心生戒懼，但隨後仍能談笑自若；即使雷聲震驚百里，主祭之人手中的祭器酒食仍能不失分毫，象徵臨危不亂。",
 tuan:"震，亨。震來虩虩，恐致福也；笑言啞啞，後有則也。震驚百里，驚遠而懼邇也。出可以守宗廟社稷，以為祭主也。",
 tuanX:"震卦亨通；雷聲乍然而來令人恐懼戒慎，正是因為心存戒懼才能招致福報；隨後仍能談笑自若，是因為心中早有應對的法則；雷聲震驚百里，使遠近之人都心生警惕，這種臨危不亂的態度，正足以擔當守護宗廟社稷、主持祭祀的重任。",
 xiang:"洊雷，震；君子以恐懼修省。",
 xiangX:"雷聲接連不斷地響起，象徵驚懼之象，君子觀此應心存戒懼、時時反省自身的言行。",
 guaCiSeg:[{o:"震：亨。",e:"震卦象徵驚懼奮起：亨通。",terms:["heng"]},{o:"震來虩虩，",e:"雷聲乍然驚動，令人心生戒懼，"},{o:"笑言啞啞。",e:"但隨後仍能談笑自若。"},{o:"震驚百里，",e:"即使雷聲震驚百里，"},{o:"不喪匕鬯。",e:"主祭之人手中的祭器酒食仍能不失分毫，象徵臨危不亂。"}],
 tuanSeg:[{o:"震，亨。",e:"震卦亨通。",terms:["heng"]},{o:"震來虩虩，恐致福也；笑言啞啞，後有則也。",e:"雷聲乍然而來令人恐懼戒慎，正是因為心存戒懼才能招致福報；隨後仍能談笑自若，是因為心中早有應對的法則。"},{o:"震驚百里，驚遠而懼邇也。",e:"雷聲震驚百里，使遠近之人都心生警惕。"},{o:"出可以守宗廟社稷，以為祭主也。",e:"這種臨危不亂的態度，正足以擔當守護宗廟社稷、主持祭祀的重任。"}],
 xiangSeg:[{o:"洊雷，震；",e:"雷聲接連不斷地響起，象徵驚懼之象；"},{o:"君子以恐懼修省。",e:"君子觀此應心存戒懼、時時反省自身的言行。",terms:["jun_zi"]}],
 yao:[
 ["初九","震來虩虩，後笑言啞啞，吉。","雷聲乍然而來令人恐懼戒慎，隨後仍能談笑自若，吉祥。","震來虩虩，恐致福也；笑言啞啞，後有則也。","心存戒懼恐正是招致福報的緣由；隨後談笑自若，是因心中早有應對的法則。"],
 ["六二","震來厲，億喪貝，躋于九陵，勿逐，七日得。","雷聲震動帶來危險，可能損失大量財物，宜登高避險，不必刻意追尋失物，過些時日自然尋回。","震來厲，乘剛也。","震動帶來危險，是因處境凌乘於剛強之上。"],
 ["六三","震蘇蘇，震行无眚。","因雷聲驚動而精神渙散不安，但只要謹慎行事仍可避免災禍。","震蘇蘇，位不當也。","精神渙散不安，是因所處之位不甚恰當。"],
 ["九四","震遂泥。","受到雷震之驚後陷入泥濘，象徵行動受阻、停滯不前。","震遂泥，未光也。","陷入泥濘困頓，是因志向與作為尚未能光大彰顯。"],
 ["六五","震往來厲，億无喪，有事。","雷聲往來震動皆有危險，但即使遭逢大事，也能大致保全、無所喪失。","震往來厲，危行也；其事在中，大无喪也。","往來皆感震動危險，行事應格外謹慎；只要秉持中道處事，終究不致有重大損失。"],
 ["上六","震索索，視矍矍，征凶；震不于其躬，于其鄰，无咎；婚媾有言。","因雷震而戰慄不安、驚恐四顧，貿然前行有凶險；震動雖未及己身而及於鄰人，尚可無咎，但婚嫁之事恐有閒言。","震索索，中未得也；雖凶无咎，畏鄰戒也。","戰慄不安，是因尚未能秉持中道；雖有凶險卻無咎，是因能以鄰人的遭遇為戒。"],
 ],
