 en:{name:"Zhèn",title:"The Shock",keyword:"Sudden Alarm, Steady Response",
  desc:"Thunder crashing again and again: a sudden shock disturbs the calm now, but staying composed and reflective will see you safely through it.",
  guaCi:"Zhèn: Success. The thunder comes with a startling crash; then there is laughter and calm conversation. The thunder alarms for a hundred miles, yet one does not drop the sacrificial ladle and wine.",
  guaCiX:"Even amid a genuinely startling disturbance, real composure allows life to return quickly to normal — steady, unshaken conduct is what sees this through.",
  tuan:"Zhèn brings success. The thunder comes with a startling crash, for fear brings about good fortune in the end; laughter and calm conversation follow, for afterward there are rules to guide one. The thunder alarms for a hundred miles, startling the distant and causing the near to tremble as well. One may thereby go forth to guard the ancestral temple and the altars of the state, and become fit to preside as master of the sacrifice.",
  tuanX:"A startling disturbance that inspires real, healthy caution actually brings good fortune in the end; such composure under alarm is exactly what qualifies someone to hold real, solemn responsibility.",
  xiang:"Thunder repeated: this is Zhèn. Thus the noble one, in fear and trembling, cultivates and examines himself.",
  xiangX:"As thunder crashes again and again in succession, a person of character responds with real caution, using the moment to examine and improve themselves.",
  yao:[
   ["1st (Nine)","The thunder comes with a startling crash; then laughter and calm conversation. Good fortune.","An initial shock gives way to genuine composure and good fortune.","The thunder comes with a startling crash, for fear brings about good fortune; laughter and calm conversation follow, for afterward there are rules to guide one.","This natural progression from alarm to composure is exactly what brings the good fortune."],
   ["2nd (Six)","The thunder comes, bringing real danger. A hundred thousand cowries are lost; climbing the nine hills to escape. Do not chase after it — in seven days, it is recovered.","A serious disturbance brings real loss, requiring a prudent retreat to safety — but patience, rather than pursuit, restores what was lost.","The danger of the thunder's arrival comes from riding upon strength.","This danger arises from being positioned atop a source of real, unyielding force."],
   ["3rd (Six)","The thunder leaves one dazed and shaken; if one then acts, there is no calamity.","Disorientation from the shock fades, and careful action afterward avoids real trouble.","The daze from the thunder comes from a position that is simply not fitting.","This somewhat ill-suited position accounts for the initial disorientation."],
   ["4th (Nine)","The thunder, and then one sinks into the mud.","The disturbance here leads to becoming genuinely stuck and unable to move forward.","The thunder sinking into the mud means, in the end, no real brightness has come of it.","This lack of any real clarity or progress is the underlying issue here."],
   ["5th (Six)","The thunder comes and goes, bringing real danger. In one's assessment, nothing is truly lost, though there is much to attend to.","Repeated disturbance brings real risk, but with careful, ongoing attention, nothing of true value is ultimately lost.","The thunder coming and going, bringing danger, calls for cautious action; though much needs attending to, in the end nothing of great value is lost.","Careful, sustained attention through this repeated disturbance is what prevents any real loss."],
   ["Top (Six)","The thunder leaves one utterly shaken, gazing about anxiously. To press forward brings misfortune. If the thunder does not strike oneself directly but a neighbor instead, there is no blame — though there may be talk regarding a marriage.","Extreme, lingering alarm makes further action unwise — being spared direct harm, while a neighbor is affected, still carries no fault, though some difficulty in personal matters may follow.","The utter shaking has not yet found true balance within; though there is misfortune, no real blame follows, for one takes warning from what befalls one's neighbor.","Learning caution from a neighbor's misfortune, rather than one's own, is what keeps this ultimately blameless."],
  ],
  a:"Sudden developments may arise — stay calm and handle them well.",b:"Unexpected changes at work — stay composed and adapt quickly.",c:"Finances may see surprise swings — keep a reserve fund ready."}
},
{n:52,s:"艮",f:"艮為山",u:"艮",l:"艮",k:"止於當止",fortune:"平",
 desc:"止於當止，指目前宜停下腳步、安於現狀，靜心沉澱勝過貿然行動。",
 guaCi:"艮：艮其背，不獲其身；行其庭，不見其人，无咎。",
 guaCiX:"艮卦象徵止於當止：止定於背後而不為外物所動，如同不覺察自身的存在；行走於庭院之中，卻視若不見周遭之人，如此便沒有災咎，象徵心無雜念、安於靜止。",
 tuan:"艮，止也。時止則止，時行則行，動靜不失其時，其道光明。艮其止，止其所也。上下敵應，不相與也，是以不獲其身，行其庭不見其人，无咎也。",
 tuanX:"艮就是靜止的意思；應該靜止之時便靜止，應該行動之時便行動，動與靜都能掌握恰當的時機，其道理便顯得光明正大；艮卦所謂的靜止，是指靜止於應當靜止之處；上下各爻彼此對應卻互不相涉、互不干擾，因此才能不覺察自身、行走於庭院之中也視若無人，如此便沒有災咎。",
 xiang:"兼山，艮；君子以思不出其位。",
 xiangX:"兩座高山重疊並立、各自靜止不動，象徵艮卦止定之象，君子觀此應謹守本分，思慮不超出自己所處的職位範圍。",
 guaCiSeg:[{o:"艮其背，",e:"艮卦象徵止於當止：止定於背後而不為外物所動，"},{o:"不獲其身；",e:"如同不覺察自身的存在；"},{o:"行其庭，不見其人，",e:"行走於庭院之中，卻視若不見周遭之人，"},{o:"无咎。",e:"如此便沒有災咎，象徵心無雜念、安於靜止。",terms:["wujiu"]}],
 tuanSeg:[{o:"艮，止也。",e:"艮就是靜止的意思。"},{o:"時止則止，時行則行，動靜不失其時，其道光明。",e:"應該靜止之時便靜止，應該行動之時便行動，動與靜都能掌握恰當的時機，其道理便顯得光明正大。",terms:["shi"]},{o:"艮其止，止其所也。",e:"艮卦所謂的靜止，是指靜止於應當靜止之處。"},{o:"上下敵應，不相與也，是以不獲其身，行其庭不見其人，无咎也。",e:"上下各爻彼此對應卻互不相涉、互不干擾，因此才能不覺察自身、行走於庭院之中也視若無人，如此便沒有災咎。",terms:["wujiu"]}],
 xiangSeg:[{o:"兼山，艮；",e:"兩座高山重疊並立、各自靜止不動，象徵艮卦止定之象；"},{o:"君子以思不出其位。",e:"君子觀此應謹守本分，思慮不超出自己所處的職位範圍。",terms:["jun_zi"]}],
 yao:[
 ["初六","艮其趾，无咎，利永貞。","止定於腳趾之初，及早停止不當的行動，並無災咎，有利於長久堅守正道。","艮其趾，未失正也。","及早止定於初起之處，並未失去應有的正道。"],
 ["六二","艮其腓，不拯其隨，其心不快。","止定於小腿，卻無法解救、跟隨引導上位者的行動，心中因而感到不快。","不拯其隨，未退聽也。","無法解救並跟隨，是因對方尚未能退讓聽從。"],
 ["九三","艮其限，列其夤，厲薰心。","止定過於僵硬，如將腰部截然分裂脊背般，內心因而承受極大的煎熬危險。","艮其限，危薰心也。","過於僵硬地強行止定，其危險如烈火薰灼內心。"],
 ["六四","艮其身，无咎。","止定並約束己身的言行舉止，並無災咎。","艮其身，止諸躬也。","約束自身而無咎，是止定於自身修養的緣故。"],
 ["六五","艮其輔，言有序，悔亡。","止定於口頰言語之間，說話有條理次序，悔恨消失。","艮其輔，以中正也。","言語有節制條理，是因秉持中正之道。"],
 ["上九","敦艮，吉。","以敦厚篤實的態度止定安處，吉祥。","敦艮之吉，以厚終也。","敦厚地止定而獲吉，是因能夠敦厚地善始善終。"],
 ],
 a:"感情宜順其自然，不強求也不躁進，安於現狀。",b:"適合停下腳步、沉澱思考，避免貿然行動。",c:"財運平穩，宜守成為主，不宜輕舉妄動。",
 en:{name:"Gèn",title:"Keeping Still",keyword:"Stillness and Restraint",
  desc:"Mountain upon mountain, utterly still: this is a time for genuine stillness — pause, reflect, and resist the urge to act just for the sake of acting.",
  guaCi:"Gèn: Keeping still in one's back, so one does not perceive one's own body; walking through the courtyard without seeing anyone there. No blame.",
  guaCiX:"A mind so genuinely at rest that it becomes unaware even of self or surroundings — this deep composure carries no fault.",
  tuan:"Gèn means to stop: stopping when it is time to stop, moving when it is time to move; not losing the right timing in either movement or stillness — this is a bright and clear way. Keeping still in its proper place means resting where one truly belongs. Above and below are opposed and unresponsive to one another, hence not perceiving one's own body, walking through the courtyard without seeing anyone there, and no blame.",
  tuanX:"There is real clarity and wisdom in knowing precisely when to act and when to rest; a genuine stillness that settles into its proper place, undisturbed by outside pull, is what allows this state to be blameless.",
  xiang:"Mountains joined together: this is Gèn. Thus the noble one does not let his thoughts stray beyond his own proper position.",
  xiangX:"As two mountains stand joined, each utterly still in its own place, a person of character keeps their thoughts within the bounds of their own proper role.",
  yao:[
   ["1st (Six)","Keeping still in the toes. No blame. Favorable to persevere for a long time.","Restraining oneself at the very first, smallest impulse is entirely sound, and this restraint favors continuing for a long while.","Keeping still in the toes means one has not yet departed from what is correct.","This is simply staying true to the right course from the very outset."],
   ["2nd (Six)","Keeping still in the calves; unable to rescue what one follows, the heart is not content.","Unable to influence the course of someone one is tied to, real discontent naturally follows.","Unable to rescue what one follows means one has not yet withdrawn to listen inwardly.","There is, as yet, no genuine inward pause to truly reconsider the matter."],
   ["3rd (Nine)","Keeping still at the waist, tearing apart the flesh along the spine. Danger burns the heart.","Forcing stillness in an unnatural, rigid way causes real, painful inner distress.","Keeping still at the waist means the danger truly burns the heart.","Such forced, unnatural restraint genuinely causes this painful inner turmoil."],
   ["4th (Six)","Keeping still in the whole body. No blame.","A stillness that settles the entire self, wholly and genuinely, carries no fault.","Keeping still in the whole body means stopping within one's own person.","This is a genuine, complete stillness settled truly within oneself."],
   ["5th (Six)","Keeping still in the jaws; words are spoken with real order. Regret vanishes.","Restraint applied even to speech, spoken thoughtfully and in proper order, dissolves any earlier regret.","Keeping still in the jaws comes from the balanced, correct way.","This centered, correct approach is what governs such measured, orderly speech."],
   ["Top (Nine)","Genuine stillness. Good fortune.","A deep, sincere, well-earned stillness brings good fortune.","The good fortune of genuine stillness at the very top comes from a truly good ending.","This represents a truly good and complete conclusion to the whole matter."],
  ],
  a:"Let love take its natural course — neither forcing nor rushing it.",b:"A good time to pause and reflect rather than act impulsively.",c:"Finances are stable — favor holding steady over bold moves."}
},
{n:53,s:"漸",f:"風山漸",u:"巽",l:"艮",k:"循序漸進",fortune:"小吉",
 desc:"循序漸進，指眼前發展宜按部就班、穩紮穩打，急躁反而欲速則不達。",
 guaCi:"漸：女歸吉，利貞。",
 guaCiX:"漸卦象徵循序漸進：如同女子出嫁般按部就班而行，吉祥，有利於堅守正道。",
 tuan:"漸之進也，女歸吉也。進得位，往有功也；進以正，可以正邦也。其位，剛得中也。止而巽，動不窮也。",
 tuanX:"漸卦所代表的循序漸進，就如同女子依禮出嫁一般吉祥；循序漸進而能得到適當的地位，前往必能有所成就；以正道循序漸進，便足以端正邦國；居於恰當之位，是因為剛強者能持守中道；安於靜止而又謙遜順從，行動起來便不會陷入窮困。",
 xiang:"山上有木，漸；君子以居賢德善俗。",
 xiangX:"高山之上生長著樹木，逐漸茁壯高聳，象徵循序漸進之象，君子觀此應涵養賢德，並藉此逐步改善社會的風俗。",
 guaCiSeg:[{o:"漸：女歸吉，",e:"漸卦象徵循序漸進：如同女子出嫁般按部就班而行，吉祥，",terms:["ji"]},{o:"利貞。",e:"有利於堅守正道。",terms:["li","zhen"]}],
 tuanSeg:[{o:"漸之進也，女歸吉也。",e:"漸卦所代表的循序漸進，就如同女子依禮出嫁一般吉祥。",terms:["ji"]},{o:"進得位，往有功也；進以正，可以正邦也。",e:"循序漸進而能得到適當的地位，前往必能有所成就；以正道循序漸進，便足以端正邦國。"},{o:"其位，剛得中也。止而巽，動不窮也。",e:"居於恰當之位，是因為剛強者能持守中道；安於靜止而又謙遜順從，行動起來便不會陷入窮困。"}],
 xiangSeg:[{o:"山上有木，漸；",e:"高山之上生長著樹木，逐漸茁壯高聳，象徵循序漸進之象；"},{o:"君子以居賢德善俗。",e:"君子觀此應涵養賢德，並藉此逐步改善社會的風俗。",terms:["jun_zi"]}],
 yao:[
 ["初六","鴻漸于干，小子厲，有言，无咎。","鴻雁循序漸進地飛至水邊，如年幼者行事略有危險、招來閒言，但終無災咎。","小子之厲，義无咎也。","年幼者所遇的危險，依理最終仍是無咎的。"],
 ["六二","鴻漸于磐，飲食衎衎，吉。","鴻雁漸進飛抵磐石之上，安然享用飲食、和樂自在，吉祥。","飲食衎衎，不素飽也。","飲食和樂自在，並非徒然飽食而已，是踏實有得的安穩。"],
 ["九三","鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。","鴻雁漸進至陸地，如丈夫出征不歸、婦人懷孕卻難以順利生育，凶險；此時適合用於防禦外侮。","夫征不復，離群醜也；婦孕不育，失其道也；利用禦寇，順相保也。","丈夫出征不歸，是因脫離了應有的群體規範；婦人難以生育，是失去了應循的常道；利於防禦，是為了順勢相互保全。"],
 ["六四","鴻漸于木，或得其桷，无咎。","鴻雁漸進棲息於樹木之上，或能尋得平直的枝椏棲身，並無災咎。","或得其桷，順以巽也。","能尋得安穩的棲身之處，是因順從且謙遜柔和。"],
 ["九五","鴻漸于陵，婦三歲不孕，終莫之勝，吉。","鴻雁漸進飛抵高陵之上，如婦人多年未能懷孕，但終究沒有什麼能阻撓最終的圓滿，吉祥。","終莫之勝吉，得所願也。","最終無人能阻撓而獲吉，是終於實現了原本的心願。"],
 ["上九","鴻漸于陸，其羽可用為儀，吉。","鴻雁漸進飛抵高處，其潔淨的羽毛可作為禮儀典範之用，吉祥。","其羽可用為儀，吉，不可亂也。","羽毛可作典範而獲吉，象徵秩序井然、不可紊亂。"],
 ],
 a:"感情宜按部就班發展，穩紮穩打終能開花結果。",b:"事業發展宜循序漸進，累積實績自然水到渠成。",c:"財運穩健成長，適合長期、漸進式的投資策略。",
 en:{name:"Jiàn",title:"Gradual Progress",keyword:"Slow, Steady Advance",
  desc:"Wind resting gently upon the mountain: growth here comes step by step — patience and proper order, not haste, will see it through to a good end.",
  guaCi:"Jiàn: The maiden's marriage brings good fortune. Favorable to persevere.",
  guaCiX:"Like a marriage properly and gradually arranged, this steady, unhurried process brings good fortune and favors continued perseverance.",
  tuan:"Jiàn's advance is like the maiden's marriage bringing good fortune. Advancing and attaining the proper position, going forward achieves real merit; advancing with correctness, one may thereby set the state in order. Its position comes from the firm attaining the center. Resting still, yet gentle in movement — hence it does not become exhausted.",
  tuanX:"Real progress, made gradually and in the proper, correct order — like the careful stages of a traditional marriage — leads to genuine, lasting achievement without ever wearing itself out.",
  xiang:"Above the mountain there is a tree: this is Jiàn. Thus the noble one dwells in worthy virtue and improves the customs of his people.",
  xiangX:"As a tree grows slowly and steadily atop the mountain, a person of character settles into worthy virtue and gradually improves the customs of those around them.",
  yao:[
   ["1st (Six)","The wild goose gradually advances to the shore. The young one faces danger; there is talk, yet no blame.","A young or inexperienced figure, taking careful first steps, faces some early difficulty and criticism, though ultimately without real fault.","The danger of the young one is, in principle, without blame.","This early difficulty is, in the underlying sense, not truly a fault at all."],
   ["2nd (Six)","The wild goose gradually advances to the boulder; eating and drinking in contentment and ease. Good fortune.","Reaching a place of real stability and contentment along the way brings good fortune.","Eating and drinking in contentment and ease means one is not simply eating without having truly earned it.","This is not mere idle comfort — it reflects genuinely earned, well-deserved ease."],
   ["3rd (Nine)","The wild goose gradually advances to dry land; the husband goes on campaign and does not return, the wife is pregnant yet does not carry to term. Misfortune. Favorable to resist plunderers.","Progress here has run into real trouble — separation and loss follow — though this is still a fitting moment to defend against outside threats.","The husband's campaign without return means he has separated from his own kind, to his own sorrow; the wife pregnant yet not carrying to term means she has lost the proper way; favorable to resist plunderers means to act together in mutual protection.","Such separation and loss stem from departing the natural, proper order of things."],
   ["4th (Six)","The wild goose gradually advances to the tree; perhaps it finds a level branch. No blame.","Finding a stable resting place, even somewhat unexpectedly, along a gradual advance, carries no fault.","Perhaps finding a level branch comes from a gentle, yielding compliance.","This gentle willingness to adapt is what allows such a stable place to be found."],
   ["5th (Nine)","The wild goose gradually advances to the high ridge; the wife does not conceive for three years, yet in the end nothing can overcome this. Good fortune.","A long delay along the way, despite real difficulty, ultimately cannot prevent the fulfillment sought, bringing good fortune.","In the end nothing can overcome this, bringing good fortune, for what was truly wished for is finally attained.","This long-awaited fulfillment is exactly the genuine wish finally realized."],
   ["Top (Nine)","The wild goose gradually advances to the highest heights; its feathers may serve as ornament for solemn rites. Good fortune.","Reaching the very culmination of a long, gradual process, one's refined character becomes something genuinely worth honoring.","Its feathers serving as ornament for solemn rites, bringing good fortune, means order has not been thrown into confusion.","This good fortune reflects that the whole gradual process has unfolded in proper, undisturbed order."],
  ],
  a:"Love should progress step by step — steady building leads to real results.",b:"Career development favors a gradual approach — results follow naturally from sustained effort.",c:"Finances grow steadily — favor long-term, gradual investment strategies."}
},
{n:54,s:"歸妹",f:"雷澤歸妹",u:"震",l:"兌",k:"謹慎行事",fortune:"大凶",
 desc:"謹慎行事，指當前名分或關係尚未明朗，貿然行動恐招致不利，宜謹慎釐清。",
 guaCi:"歸妹：征凶，无攸利。",
 guaCiX:"歸妹卦象徵名分未正：貿然前行將有凶險，沒有任何利益。",
 tuan:"歸妹，天地之大義也。天地不交而萬物不興，歸妹，人之終始也。說以動，所歸妹也。征凶，位不當也。无攸利，柔乘剛也。",
 tuanX:"男女婚嫁本是天地之間重大的義理；若天地陰陽不能交融，萬物便無法興旺，而婚嫁正是人類生生不息、終而復始的根本；此卦因一時喜悅而輕率行動，才促成了這樣的婚嫁；貿然前行之所以有凶險，是因為所處的地位並不恰當；之所以沒有利益，是因為陰柔者凌駕於陽剛之上，名分尚未端正。",
 xiang:"澤上有雷，歸妹；君子以永終知敝。",
 xiangX:"沼澤之上響著雷聲，激盪不安，象徵名分未正之象，君子觀此應以長遠的眼光看待事物的終始，並提早察覺可能出現的弊端。",
 guaCiSeg:[{o:"歸妹：征凶，",e:"歸妹卦象徵名分未正：貿然前行將有凶險，",terms:["xiong"]},{o:"无攸利。",e:"沒有任何利益。",terms:["wuyouli"]}],
 tuanSeg:[{o:"歸妹，天地之大義也。",e:"男女婚嫁本是天地之間重大的義理。"},{o:"天地不交而萬物不興，歸妹，人之終始也。",e:"若天地陰陽不能交融，萬物便無法興旺，而婚嫁正是人類生生不息、終而復始的根本。"},{o:"說以動，所歸妹也。",e:"此卦因一時喜悅而輕率行動，才促成了這樣的婚嫁。"},{o:"征凶，位不當也。无攸利，柔乘剛也。",e:"貿然前行之所以有凶險，是因為所處的地位並不恰當；之所以沒有利益，是因為陰柔者凌駕於陽剛之上，名分尚未端正。",terms:["xiong","wuyouli"]}],
 xiangSeg:[{o:"澤上有雷，歸妹；",e:"沼澤之上響著雷聲，激盪不安，象徵名分未正之象；"},{o:"君子以永終知敝。",e:"君子觀此應以長遠的眼光看待事物的終始，並提早察覺可能出現的弊端。",terms:["jun_zi"]}],
 yao:[
 ["初九","歸妹以娣，跛能履，征吉。","以陪嫁侍妾的身分出嫁，如跛足者仍勉力而行，前行可獲吉祥。","歸妹以娣，以恆也；跛能履吉，相承也。","以侍妾身分出嫁，是本於恆常的名分；跛足仍能行走而吉，是彼此相承相助的緣故。"],
 ["九二","眇能視，利幽人之貞。","如視力不佳者仍勉力視物，宜如隱居守貞之人般安靜自守。","利幽人之貞，未變常也。","宜如隱士般安靜守貞，是因未曾改變應有的常道。"],
 ["六三","歸妹以須，反歸以娣。","出嫁之時名分未定、有所等待，最終仍以侍妾的身分歸嫁。","歸妹以須，未當也。","以此方式出嫁而有所等待，是因處境尚未恰當。"],
 ["九四","歸妹愆期，遲歸有時。","婚嫁之事延誤了原定時機，遲些歸嫁自有其合適的時候。","愆期之志，有待而行也。","延誤婚期的用意，是要等待合適的時機再行動。"],
 ["六五","帝乙歸妹，其君之袂，不如其娣之袂良；月幾望，吉。","如帝乙嫁女般尊貴，但正室的衣袖竟不如陪嫁侍妾的衣袖華美，象徵謙抑不爭；如月將圓滿般吉祥。","帝乙歸妹，不如其娣之袂良也；其位在中，以貴行也。","正室之服不如侍妾華美，反映謙抑之德；其地位居中，以尊貴而謙遜的態度行事。"],
 ["上六","女承筐无實，士刲羊无血，无攸利。","女子承接的竹筐中空無一物，男子宰殺的羊隻也無血可取，象徵徒具形式而無實質，沒有益處。","上六无實，承虛筐也。","居於上位卻空無實質，如同承接一個空虛的竹筐。"],
 ],
 a:"感情關係名分或定位不明，宜謹慎釐清彼此期待。",b:"職場角色或分工不清，宜主動溝通釐清權責。",c:"合作關係條件不明確時，宜先釐清權益再行動。",
 en:{name:"Guī Mèi",title:"The Marrying Maiden",keyword:"Proceed with Caution",
  desc:"Thunder stirring above the lake: relationships or roles here are not yet clearly defined — moving forward without real clarity risks real trouble.",
  guaCi:"Guī Mèi: To press forward brings misfortune; nothing favorable.",
  guaCiX:"Pressing ahead now, without a clear and proper basis, brings misfortune and offers no real advantage.",
  tuan:"Guī Mèi is the great principle of heaven and earth. If heaven and earth do not join, all things cannot flourish; Guī Mèi is the beginning and end of humanity itself. Joy that gives rise to movement — this is what results in the maiden's marriage. To press forward brings misfortune, for the position is not a fitting one. Nothing favorable, for the soft rides upon the firm.",
  tuanX:"Just as heaven and earth's union is essential to all flourishing, a union or step forward taken from an ill-suited position — like a match entered too rashly — invites misfortune rather than benefit.",
  xiang:"Thunder above the lake: this is Guī Mèi. Thus the noble one, understanding this, considers deeply how an ending may lead to a corresponding flaw.",
  xiangX:"As thunder stirs above the settled lake, causing real disturbance, a person of character reflects carefully on how present actions may shape future outcomes, for better or worse.",
  yao:[
   ["1st (Nine)","The maiden marries as a secondary wife; the lame can still walk. To go forward brings good fortune.","Accepting a lesser but still proper role, working within real limitations, still brings good fortune when approached rightly.","The maiden marrying as a secondary wife follows what is constant and proper; the lame walking with good fortune comes from mutual support given to one another.","This is a matter of accepting one's proper, constant role and supporting others in turn."],
   ["2nd (Nine)","A one-eyed man can still see. Favorable for one who lives apart, holding to constancy.","Working with real, if partial, limitations, a quiet, principled independence remains a sound course.","Favorable for one who lives apart, holding to constancy, means the constant way has not yet been altered.","This principled, unwavering constancy is what makes such quiet independence sound."],
   ["3rd (Six)","The maiden marries while still waiting; she returns and becomes a secondary wife instead.","Uncertainty in this situation ultimately leads to a lesser, though still proper, resolution.","The maiden marrying while still waiting shows the position was simply not yet fitting.","This unresolved waiting reflects that the situation was not yet properly suited."],
   ["4th (Nine)","The maiden's marriage is delayed past the appointed time; the later marriage still has its proper season.","A delay in this matter, though frustrating, does not prevent a fitting resolution in due time.","The purpose of the delay is to wait for the right time before acting.","This delay reflects a deliberate, patient waiting for the truly right moment."],
   ["5th (Six)","Sovereign Yi gives his younger sister in marriage; the chief wife's sleeve was not as fine as that of the secondary wife. The moon is nearly full. Good fortune.","A humble, understated union between people of different standing, entered at the right time, brings good fortune.","Sovereign Yi giving his younger sister in marriage means her sleeve was not as fine as that of the secondary wife; her position is central, and she acts with true nobility through this humility.","Genuine humility from a position of real standing is what makes this union so worthy."],
   ["Top (Six)","The woman holds a basket with nothing in it; the man cuts the sheep, yet there is no blood. Nothing favorable.","This is an arrangement that is entirely empty of real substance, offering no true benefit to anyone.","The topmost line having nothing real within it means one is left holding only an empty basket.","This is a union that, at its very core, carries no genuine substance at all."],
  ],
  a:"The relationship's status or expectations are unclear — clarify them carefully.",b:"Roles or responsibilities at work are ambiguous — communicate to clarify them.",c:"Clarify terms before committing to unclear partnerships."}
},
{n:55,s:"豐",f:"雷火豐",u:"震",l:"離",k:"豐盛盈滿",fortune:"小吉",
 desc:"豐盛盈滿，指目前正值豐收盛況，宜把握當下、居安思危，以防盛極而衰。",
 guaCi:"豐：亨，王假之，勿憂，宜日中。",
 guaCiX:"豐卦象徵豐盛盈滿：亨通，君王能達到豐盛之境，不必憂慮，正如太陽當中天一般，最為適宜。",
 tuan:"豐，大也。明以動，故豐。王假之，尚大也；勿憂宜日中，宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？",
 tuanX:"豐就是盛大的意思；內心光明而又能行動，因此能夠豐盛；君王能達到如此豐盛的境界，是因為崇尚盛大的作為；不必憂慮、正如日正當中一般，是因為此時最適合普照天下；然而太陽到了正中之後便會西斜，月亮盈滿之後便會虧缺，天地萬物的盈虛消長，本就會隨著時勢而變化，更何況是人事呢？又何況是鬼神呢？",
 xiang:"雷電皆至，豐；君子以折獄致刑。",
 xiangX:"雷聲與閃電同時到來，聲勢盛大而威嚴明察，象徵豐盛之象，君子觀此應明斷刑獄、施行刑罰，恩威並施。",
 guaCiSeg:[{o:"豐：亨，",e:"豐卦象徵豐盛盈滿：亨通，",terms:["heng"]},{o:"王假之，",e:"君王能達到豐盛之境，"},{o:"勿憂，宜日中。",e:"不必憂慮，正如太陽當中天一般，最為適宜。"}],
 tuanSeg:[{o:"豐，大也。明以動，故豐。",e:"豐就是盛大的意思；內心光明而又能行動，因此能夠豐盛。"},{o:"王假之，尚大也；",e:"君王能達到如此豐盛的境界，是因為崇尚盛大的作為；"},{o:"勿憂宜日中，宜照天下也。",e:"不必憂慮、正如日正當中一般，是因為此時最適合普照天下。"},{o:"日中則昃，月盈則食，天地盈虛，與時消息，",e:"然而太陽到了正中之後便會西斜，月亮盈滿之後便會虧缺，天地萬物的盈虛消長，本就會隨著時勢而變化，",terms:["shi"]},{o:"而況於人乎？況於鬼神乎？",e:"更何況是人事呢？又何況是鬼神呢？"}],
 xiangSeg:[{o:"雷電皆至，豐；",e:"雷聲與閃電同時到來，聲勢盛大而威嚴明察，象徵豐盛之象；"},{o:"君子以折獄致刑。",e:"君子觀此應明斷刑獄、施行刑罰，恩威並施。",terms:["jun_zi"]}],
 yao:[
 ["初九","遇其配主，雖旬无咎，往有尚。","遇到與自己相配合的對象，即使勢均力敵也無災咎，前往行事將受到嘉許。","雖旬无咎，過旬災也。","勢均力敵之時雖無咎，但若超過應有的限度便會招致災禍。"],
 ["六二","豐其蔀，日中見斗；往得疑疾，有孚發若，吉。","豐盛之時卻遭遮蔽，如日正當中卻昏暗得見星斗，前往將招致猜疑困擾，但心懷誠信、光明磊落地表露心跡，終能吉祥。","有孚發若，信以發志也。","以誠信坦率地表露心跡，是憑藉真誠來闡發自己的志向。"],
 ["九三","豐其沛，日中見沬；折其右肱，无咎。","豐盛之時遭遇更深的遮蔽，如日正當中卻昏暗如夜，甚至如折斷右臂般受創，但並無災咎。","豐其沛，不可大事也；折其右肱，終不可用也。","遮蔽如此深重，此時不可貿然成就大事；如折斷右臂，終究難以有所作為。"],
 ["九四","豐其蔀，日中見斗；遇其夷主，吉。","豐盛之時仍受遮蔽，如日中見星斗般昏暗，但遇到志同道合、地位相當的夥伴，吉祥。","豐其蔀，位不當也；日中見斗，幽不明也；遇其夷主，吉行也。","遭受遮蔽是因所處之位不甚恰當；日中見斗，象徵幽暗不明；能遇到相稱的夥伴，是吉祥之行。"],
 ["六五","來章，有慶譽，吉。","招來有才華美德之人前來相助，將有喜慶與美譽，吉祥。","六五之吉，有慶也。","居此位而獲吉，必有值得慶賀之事。"],
 ["上六","豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。","豐大了自己的房舍卻反而遮蔽了整個家，窺視門戶卻空寂無人，長期不見蹤影，凶險，象徵過度追求外在盛大反而自我孤立。","豐其屋，天際翔也；闚其戶，闃其无人，自藏也。","房舍豐大得如飛翔於天際般高不可攀；窺視卻空無一人，是因自我封閉隱藏所致。"],
 ],
 a:"感情運勢豐盛美滿，但盛極必衰，宜珍惜當下。",b:"事業達到高峰、成果豐碩，宜居安思危持續努力。",c:"財運豐厚，但宜適度儲備，避免盛極而衰。",
 en:{name:"Fēng",title:"Abundance",keyword:"Fullness at Its Peak",
  desc:"Thunder and lightning arriving together: a time of real abundance and success — but the sun at its zenith is already beginning to turn, so enjoy this moment with awareness.",
  guaCi:"Fēng: Success. The king attains this abundance. Do not worry; it is fitting like the sun at midday.",
  guaCiX:"A true leader achieves real abundance and success here; there is no need for worry — this fullness suits the moment perfectly, like the sun at its highest point.",
  tuan:"Fēng means abundance: brightness paired with movement, hence abundance. The king attains this abundance, for he values what is great. Do not worry; it is fitting like the sun at midday, for one should illuminate the whole world. When the sun reaches its zenith, it begins to decline; when the moon becomes full, it begins to wane. The fullness and emptiness of heaven and earth wax and wane together with the times — how much more so with man, and how much more so with spirits and gods!",
  tuanX:"Real abundance — brightness joined with vigorous action — brings genuine success, but nature itself teaches that fullness, once reached, naturally begins to turn; this wisdom applies to human affairs just as much as to sun and moon.",
  xiang:"Thunder and lightning both arrive: this is Fēng. Thus the noble one settles disputes and carries out punishments.",
  xiangX:"As thunder and lightning arrive together, combining clarity with real force, a person of character resolves disputes and administers punishment justly.",
  yao:[
   ["1st (Nine)","Meeting one's rightful match; though of equal standing, no blame. Going forward brings real esteem.","Meeting a truly fitting counterpart, even among equals, carries no fault, and moving forward together earns real respect.","Though of equal standing, past this point, disaster may follow.","There remains a real caution here against overextending this equal partnership too far."],
   ["2nd (Six)","The abundance is screened, so at midday one sees the stars. To go forward brings suspicion and hostility. With sincerity, expressed openly, there is good fortune.","Real substance is obscured by circumstance, causing others to doubt — but open, sincere expression of one's true position brings good fortune despite this.","With sincerity, expressed openly, sincerity itself becomes the means of expressing true intent.","This open sincerity is precisely what makes one's genuine intent clearly understood."],
   ["3rd (Nine)","The abundance is screened even more deeply; at midday one sees the smaller stars. The right arm is broken. No blame.","An even deeper obscuring of real capacity leads to real limitation, though this comes without any true fault of one's own.","The abundance screened so deeply means great affairs cannot be undertaken; the right arm broken means, in the end, nothing can truly be used.","This deep obscuring leaves one genuinely unable to take on significant undertakings for now."],
   ["4th (Nine)","The abundance is screened, so at midday one sees the stars. Meeting one's equal in obscurity. Good fortune.","Real substance remains hidden, yet finding a genuine, equal counterpart even amid this obscurity still brings good fortune.","The abundance screened means the position held is not truly a fitting one; seeing stars at midday means it is dim and unclear, without real brightness; meeting one's equal in obscurity brings good fortune through moving forward together.","Even in this dim, ill-suited position, finding a true equal to move forward with is what brings the good fortune."],
   ["5th (Six)","Bringing forth true talent and character. There is real praise and good fortune.","Recognizing and bringing forward genuine ability and virtue in others earns real praise and good fortune.","The good fortune of the fifth line brings real cause for celebration.","This is a genuinely praiseworthy and celebratory outcome."],
   ["Top (Six)","The house is made grand and abundant, yet it screens the family within; peering through the door, it is silent and empty — for three years, no one is seen. Misfortune.","Excessive outward display, pursued at the cost of genuine inner connection, leads to real isolation and misfortune.","The house made grand soars as if flying through the sky; peering through the door, silent and empty, shows one has hidden oneself away entirely.","Excessive, ungrounded ambition has led to this complete and unfortunate self-isolation."],
  ],
  a:"Love is at a joyful peak — but nothing lasts forever, so cherish it now.",b:"Career has reached a high point — stay humble and keep working even at the peak.",c:"Finances are strong — set some aside, since peaks are eventually followed by dips."}
},
{n:56,s:"旅",f:"火山旅",u:"離",l:"艮",k:"謹慎自持",fortune:"平",
 desc:"謹慎自持，指當前身處變動或陌生環境，宜謹言慎行、步步為營以求平安。",
 guaCi:"旅：小亨，旅貞吉。",
 guaCiX:"旅卦象徵旅居在外：小有亨通，在外旅居之時堅守正道便能吉祥。",
 tuan:"旅小亨，柔得中乎外而順乎剛，止而麗乎明，是以小亨旅貞吉也。旅之時義大矣哉！",
 tuanX:"旅卦之所以小有亨通，是因為陰柔者在外居於適中之位，並能順從陽剛，安於靜止又能依附光明，因此能小有亨通、旅居在外堅守正道便能吉祥；旅卦所蘊含在外處世應對進退的道理，其意義實在深遠重大！",
 xiang:"山上有火，旅；君子以明慎用刑，而不留獄。",
 xiangX:"高山之上燃著火，火勢不斷向前蔓延而不長久停留，象徵旅居不定之象，君子觀此應明察謹慎地施行刑罰，不使案件久懸未決。",
 guaCiSeg:[{o:"旅：小亨，",e:"旅卦象徵旅居在外：小有亨通，",terms:["heng"]},{o:"旅貞吉。",e:"在外旅居之時堅守正道便能吉祥。",terms:["zhen","ji"]}],
 tuanSeg:[{o:"旅小亨，柔得中乎外而順乎剛，",e:"旅卦之所以小有亨通，是因為陰柔者在外居於適中之位，並能順從陽剛，",terms:["heng"]},{o:"止而麗乎明，是以小亨旅貞吉也。",e:"安於靜止又能依附光明，因此能小有亨通、旅居在外堅守正道便能吉祥。",terms:["heng","zhen","ji"]},{o:"旅之時義大矣哉！",e:"旅卦所蘊含在外處世應對進退的道理，其意義實在深遠重大！",terms:["shi"]}],
 xiangSeg:[{o:"山上有火，旅；",e:"高山之上燃著火，火勢不斷向前蔓延而不長久停留，象徵旅居不定之象；"},{o:"君子以明慎用刑，而不留獄。",e:"君子觀此應明察謹慎地施行刑罰，不使案件久懸未決。",terms:["jun_zi"]}],
 yao:[
 ["初六","旅瑣瑣，斯其所取災。","在外旅居之時行事瑣碎計較、格局狹小，這正是自取災禍的原因。","旅瑣瑣，志窮災也。","行事瑣碎計較，是因志向窮蹙短淺才招致災禍。"],
 ["六二","旅即次，懷其資，得童僕，貞。","旅居能安頓於住所，懷藏應有的資財，並得到忠僕相助，堅守正道。","得童僕貞，終无尤也。","得到忠僕相助且堅守正道，終究沒有過失可言。"],
 ["九三","旅焚其次，喪其童僕，貞厲。","旅居住所遭遇焚毀，甚至失去了忠僕，即使堅守正道也有危險。","旅焚其次，亦以傷矣；以旅與下，其義喪也。","住所遭焚毀，令人深感傷痛；旅居之時對待下屬失當，因而喪失了忠僕的依附。"],
 ["九四","旅于處，得其資斧，我心不快。","旅居暫時安頓之處，雖獲得謀生所需的資財器具，內心卻仍感不快。","旅于處，未得位也；得其資斧，心未快也。","旅居暫居之處，是因尚未得到合適的地位；即使獲得資財，內心仍未能感到暢快。"],
 ["六五","射雉，一矢亡，終以譽命。","如射獵野雞般努力，雖損失了一支箭矢，最終仍因此獲得美譽與任命。","終以譽命，上逮也。","最終獲得美譽與任命，是因才能得以上達於位。"],
 ["上九","鳥焚其巢，旅人先笑後號咷；喪牛于易，凶。","如鳥兒焚毀自己的巢穴，旅居之人先歡笑後卻悲號痛哭，甚至在平地輕易失去了牛隻，凶險。","以旅在上，其義焚也；喪牛于易，終莫之聞也。","身處旅居而居於過高之位，依理終將自取焚毀；輕易失去牛隻，最終也無人聞問相助。"],
 ],
 a:"感情關係尚不穩定，宜謹言慎行、避免衝動決定。",b:"可能面臨異動或出差機會，宜謹慎應對陌生環境。",c:"財運不甚穩定，外出理財或投資宜格外謹慎。",
 en:{name:"Lǚ",title:"The Wanderer",keyword:"Careful Conduct Abroad",
  desc:"Fire moving atop the mountain, always shifting onward: this is a time of travel or unfamiliar circumstance — careful, modest conduct is what keeps you safe.",
  guaCi:"Lǚ: Small success. Perseverance brings good fortune for the wanderer.",
  guaCiX:"Modest success is available here; careful, principled conduct while away from familiar ground brings good fortune.",
  tuan:"Lǚ has small success: the soft attains the middle place while abroad, and finds accord with the firm; resting still, yet clinging to what is bright — hence small success, and good fortune for the wanderer's perseverance. Great indeed is the timeliness and meaning of Lǚ!",
  tuanX:"Finding a balanced, adaptable footing while away from one's usual ground, and staying attached to what is genuinely sound, is itself a subtle and meaningful skill in unfamiliar circumstances.",
  xiang:"Fire atop the mountain: this is Lǚ. Thus the noble one is clear and cautious in applying punishment, and does not let cases drag on unresolved.",
  xiangX:"As fire moves continuously across the mountain's peak, never settling in one place, a person of character applies judgment with clarity and care, resolving matters promptly.",
  yao:[
   ["1st (Six)","The wanderer is petty and fussy over trifles; this is how he brings misfortune upon himself.","Small-minded, overly fussy conduct while away from home invites trouble of one's own making.","The wanderer's petty misfortune comes from a will that has grown narrow and constrained.","Such narrow, constrained thinking is exactly what brings about this self-inflicted trouble."],
   ["2nd (Six)","The wanderer arrives at a lodging place, keeping his resources close, and gains a loyal attendant of true integrity.","Settling into a stable temporary position, with resources well-managed, brings genuine, trustworthy support.","The loyal attendant of true integrity means, in the end, no real fault will come of this.","This genuine, well-earned support is why no real trouble follows here."],
   ["3rd (Nine)","The wanderer's lodging burns down, and he loses his loyal attendant. Perseverance carries danger.","A stable position and its support are suddenly lost, and even holding steady afterward remains genuinely precarious.","The wanderer's lodging burning down is likewise a real cause for sorrow; treating those below as mere servants means the proper relationship has been lost.","Mistreating those who support oneself is what leads to this real loss and sorrow."],
   ["4th (Nine)","The wanderer finds a temporary shelter, obtains resources and tools, yet his heart is not content.","A functional but unsatisfying temporary situation is secured, though genuine contentment remains elusive.","The wanderer's shelter means the position held is not truly a fitting one; obtaining resources and tools, yet the heart is not content, shows the will has not yet truly found its rest.","This ill-suited position is why real satisfaction remains just out of reach."],
   ["5th (Six)","Shooting a pheasant, one arrow is lost; in the end, there is both praise and a mandate received.","An initial small loss, in the course of a worthy pursuit, is followed by real recognition and responsibility.","In the end there is praise and a mandate received, showing one has truly reached a position of real regard.","This genuine standing and recognition is what ultimately follows this modest setback."],
   ["Top (Nine)","The bird burns its own nest; the wanderer first laughs, then weeps and wails. Losing an ox through carelessness. Misfortune.","Self-destructive recklessness abroad, following an initial overconfidence, leads to real loss and misfortune.","The wanderer's position at the very top means he has, through this, brought about his own burning; losing an ox through carelessness means in the end no one truly hears of his plight.","This self-inflicted misfortune, coupled with real isolation, leaves the wanderer without any real support at the end."],
  ],
  a:"The relationship is still unsettled — be careful with words and avoid impulsive decisions.",b:"You may face relocation or unfamiliar situations — navigate them carefully.",c:"Finances are unstable — be extra cautious with investments made away from home."}
},
{n:57,s:"巽",f:"巽為風",u:"巽",l:"巽",k:"順勢而為",fortune:"平",
 desc:"順勢而為，指眼前宜謙遜柔軟、順應局勢調整方向，方能穩步向前推展。",
 guaCi:"巽：小亨，利有攸往，利見大人。",
 guaCiX:"巽卦象徵順勢而為：小有亨通，有利於有所前往，也適合求見賢能之人。",
 tuan:"重巽以申命，剛巽乎中正而志行，柔皆順乎剛，是以小亨，利有攸往，利見大人。",
 tuanX:"巽卦上下皆為巽，象徵反覆申明政令，陽剛者謙遜而合乎中正之道、志向得以施行，陰柔者也都順從陽剛，因此能小有亨通，有利於前往，也適合求見賢能之人。",
 xiang:"隨風，巽；君子以申命行事。",
 xiangX:"風接連不斷地吹拂，象徵順勢而行之象，君子觀此應反覆申明政令，並依此施行政事。",
 guaCiSeg:[{o:"巽：小亨，",e:"巽卦象徵順勢而為：小有亨通，",terms:["heng"]},{o:"利有攸往，",e:"有利於有所前往，",terms:["li","youyouwang"]},{o:"利見大人。",e:"也適合求見賢能之人。",terms:["li","da_ren"]}],
 tuanSeg:[{o:"重巽以申命，",e:"巽卦上下皆為巽，象徵反覆申明政令，"},{o:"剛巽乎中正而志行，柔皆順乎剛，",e:"陽剛者謙遜而合乎中正之道、志向得以施行，陰柔者也都順從陽剛，",terms:["zhong_zheng","zhi"]},{o:"是以小亨，利有攸往，利見大人。",e:"因此能小有亨通，有利於前往，也適合求見賢能之人。",terms:["heng","li","da_ren"]}],
 xiangSeg:[{o:"隨風，巽；",e:"風接連不斷地吹拂，象徵順勢而行之象；"},{o:"君子以申命行事。",e:"君子觀此應反覆申明政令，並依此施行政事。",terms:["jun_zi"]}],
 yao:[
 ["初六","進退，利武人之貞。","在進退之間猶豫不決，此時適合如武人般果決剛毅地堅守正道。","進退，志疑也；利武人之貞，志治也。","進退猶豫，是因心志有所疑慮；宜效法武人剛毅果決，如此心志才能得到整治。"],
 ["九二","巽在床下，用史巫紛若，吉，无咎。","過度謙遜卑順地藏身於床下，如同借助祝史巫覡般紛紛祈禱溝通，吉祥，並無災咎。","紛若之吉，得中也。","紛紛溝通祈求而獲吉，是因能秉持中道行事。"],
 ["九三","頻巽，吝。","屢次過度謙遜卑順卻缺乏原則，反而有所遺憾。","頻巽之吝，志窮也。","屢次一味謙順卻無所堅持，是因心志已陷入窮困。"],
 ["六四","悔亡，田獲三品。","悔恨消失，如田獵般獲得多種豐富的收穫。","田獲三品，有功也。","田獵獲得豐富的收穫，象徵確實有所功績成就。"],
 ["九五","貞吉，悔亡，无不利；无初有終；先庚三日，後庚三日，吉。","堅守正道則吉、悔恨消失，無所不利；起初雖無明顯成效，最終卻能有好結果；行事前後都應審慎籌劃，吉祥。","九五之吉，位正中也。","居此位而獲吉，是因所處之位居中且端正。"],
 ["上九","巽在床下，喪其資斧，貞凶。","過度謙遜卑順到藏身床下的地步，甚至喪失了賴以維生的資財器具，即使堅守也有凶險。","巽在床下，上窮也；喪其資斧，正乎凶也。","過度謙順藏身於床下，是因謙遜之道已發展至窮盡；喪失資財器具，正是凶險之所在。"],
 ],
 a:"以柔軟、體貼的態度經營感情，關係將更加融洽。",b:"適合順勢而為、靈活應變，柔軟身段有助推展業務。",c:"財運穩定，宜順應市場趨勢靈活調整理財策略。",
 en:{name:"Xùn",title:"The Gentle Wind",keyword:"Gentle Persistence",
  desc:"Wind following wind, gently but continuously: gradual, gentle, repeated influence — not force — is what accomplishes real, lasting change now.",
  guaCi:"Xùn: Small success. Favorable to have somewhere to go. Favorable to see a great man.",
  guaCiX:"Modest success is available here, favoring both continued forward movement and seeking out wise counsel.",
  tuan:"Repeated gentleness, to proclaim the mandate again and again: the firm submits to the balanced and correct, and its will is carried out; the soft entirely submits to the firm — hence small success, favorable to have somewhere to go, favorable to see a great man.",
  tuanX:"A gentle, patient approach — genuine strength that submits willingly to what is right — is what allows real, if modest, progress and benefits from seeking wise guidance.",
  xiang:"Wind following wind: this is Xùn. Thus the noble one proclaims his commands and carries out his affairs.",
  xiangX:"As wind follows wind, gentle yet continuous and pervasive, a person of character issues instructions clearly and carries out their affairs accordingly.",
  yao:[
   ["1st (Six)","Advancing and retreating; favorable for the perseverance of a resolute person.","Uncertainty between advancing and holding back is best resolved through the steady resolve of someone truly firm-minded.","Advancing and retreating shows the will is caught in doubt; favorable for the perseverance of a resolute person shows the will is thereby set in order.","This doubt is exactly what a genuinely resolute character is able to settle."],
   ["2nd (Nine)","Gentle submission beneath the bed; using diviners and shamans in great number. Good fortune, no blame.","Extreme, almost excessive humility, paired with seeking abundant outside counsel, still brings good fortune here.","The good fortune of great numbers comes from holding to the balanced, correct way.","This centered, correct approach is what makes such extensive consultation fortunate."],
   ["3rd (Nine)","Repeated, anxious gentleness. Regret.","Excessive, repeated submission without real conviction leads only to regret.","The regret of repeated, anxious gentleness comes from a will that has grown exhausted.","This exhausted, depleted will is exactly what leads to the regret."],
   ["4th (Six)","Regret vanishes. In the hunting field, three kinds of game are caught.","Earlier regret dissolves, and real, tangible achievement follows.","Catching three kinds of game in the hunting field shows real achievement.","This is a genuine, concrete achievement worth noting."],
   ["5th (Nine)","Perseverance brings good fortune, regret vanishes, nothing unfavorable. No good beginning, but a good end. Three days before the change, three days after — good fortune.","A difficult start ultimately resolves well, provided one persists with integrity and gives careful thought both before and after any significant change.","The good fortune of the fifth line comes from occupying a position that is both balanced and correct.","This centered, correct position is the true source of this eventual good fortune."],
   ["Top (Nine)","Gentle submission beneath the bed, losing one's own resources and resolve. Perseverance brings misfortune.","Excessive, self-effacing submission, taken to the point of losing one's own means and resolve, is genuinely unwise even if persisted in.","Gentle submission beneath the bed at the very top shows the way has reached its limit; losing one's resources and resolve, with misfortune, means one's own resolve has, in truth, grown corrupted.","Submission pushed this far has, in effect, corrupted one's own genuine resolve and purpose."],
  ],
  a:"A gentle, considerate approach to love makes the relationship more harmonious.",b:"Adapt flexibly to circumstances — a soft touch helps advance your work.",c:"Finances are stable — adjust your strategy flexibly with market trends."}
},
{n:58,s:"兌",f:"兌為澤",u:"兌",l:"兌",k:"喜悅溝通",fortune:"小吉",
 desc:"喜悅溝通，指當前人際氛圍和樂融洽，多加溝通交流有助於凝聚共識。",
 guaCi:"兌：亨，利貞。",
 guaCiX:"兌卦象徵喜悅溝通：亨通，有利於堅守正道。",
 tuan:"兌，說也。剛中而柔外，說以利貞，是以順乎天而應乎人。說以先民，民忘其勞；說以犯難，民忘其死。說之大，民勸矣哉！",
 tuanX:"兌就是喜悅的意思；內在剛健而外表柔和，以喜悅之心堅守正道，因此能順應天理、呼應人心；以喜悅之心引導百姓，百姓便能忘卻勞苦；以喜悅之心面對艱難，百姓甚至能不畏生死；喜悅所帶來的感召力量如此深遠廣大，百姓怎能不受到勸勉激勵呢！",
 xiang:"麗澤，兌；君子以朋友講習。",
 xiangX:"兩片相連的沼澤彼此滋潤映照，象徵喜悅交流之象，君子觀此應與朋友互相講論、切磋學習。",
 guaCiSeg:[{o:"兌：亨，",e:"兌卦象徵喜悅溝通：亨通，",terms:["heng"]},{o:"利貞。",e:"有利於堅守正道。",terms:["li","zhen"]}],
 tuanSeg:[{o:"兌，說也。剛中而柔外，說以利貞，",e:"兌就是喜悅的意思；內在剛健而外表柔和，以喜悅之心堅守正道，",terms:["li","zhen"]},{o:"是以順乎天而應乎人。",e:"因此能順應天理、呼應人心。"},{o:"說以先民，民忘其勞；說以犯難，民忘其死。",e:"以喜悅之心引導百姓，百姓便能忘卻勞苦；以喜悅之心面對艱難，百姓甚至能不畏生死。"},{o:"說之大，民勸矣哉！",e:"喜悅所帶來的感召力量如此深遠廣大，百姓怎能不受到勸勉激勵呢！"}],
 xiangSeg:[{o:"麗澤，兌；",e:"兩片相連的沼澤彼此滋潤映照，象徵喜悅交流之象；"},{o:"君子以朋友講習。",e:"君子觀此應與朋友互相講論、切磋學習。",terms:["jun_zi"]}],
 yao:[
 ["初九","和兌，吉。","以平和喜悅的心態與人交往，吉祥。","和兌之吉，行未疑也。","以平和喜悅相處而獲吉，是因行事尚未引起他人的疑慮。"],
 ["九二","孚兌，吉，悔亡。","心懷誠信而與人喜悅相處，吉祥，悔恨消失。","孚兌之吉，信志也。","以誠信與人喜悅交往而獲吉，是因志向真誠可信。"],
 ["六三","來兌，凶。","一味迎合、諂媚討好地前來取悅於人，凶險。","來兌之凶，位不當也。","以此方式取悅於人而招凶，是因所處之位不甚恰當。"],
 ["九四","商兌未寧，介疾有喜。","反覆商議喜悅之事而未能安定，若能謹慎戒除心中的疾患，終能有喜。","九四之喜，有慶也。","居此位而終有喜悅，必有值得慶賀之事。"],
 ["九五","孚于剝，有厲。","心懷誠信卻可能受到剝蝕侵害的小人蒙蔽，有危險。","孚于剝，位正當也。","雖有受剝蝕之虞，但所處之位仍屬正當，宜提高警覺。"],
 ["上六","引兌。","被引誘牽動而生喜悅，象徵喜悅之情尚待延伸擴展。","上六引兌，未光也。","居於上位而被引動生喜，其道尚未能完全光大彰顯。"],
 ],
 a:"感情氛圍愉快融洽，適合多溝通交流增進感情。",b:"人際關係和諧，適合透過溝通協商達成共識。",c:"財運穩定向好，透過良好溝通合作可提升收益。",
 en:{name:"Duì",title:"The Joyous Lake",keyword:"Genuine Joy and Openness",
  desc:"Two lakes joined together, reflecting and nourishing one another: real, honest joy and open exchange with others is favored now.",
  guaCi:"Duì: Success. Favorable to persevere.",
  guaCiX:"Genuine, well-grounded joy brings success and favors continued steadfastness.",
  tuan:"Duì means joy: firm within, soft without; joyous through perseverance, thus in accord with heaven and responsive to man. Leading the people with joy, and the people forget their toil; facing hardship with joy, and the people forget the danger of death. Great indeed is the encouragement that comes through joy!",
  tuanX:"Genuine joy — firm and solid at heart, gentle and open in expression — inspires people so deeply that they forget toil and even danger; this kind of encouragement carries real, lasting power.",
  xiang:"Two lakes joined together: this is Duì. Thus the noble one gathers with friends to discuss and practice what they have learned.",
  xiangX:"As two lakes rest side by side, nourishing one another, a person of character gathers with friends to discuss and practice what they have learned together.",
  yao:[
   ["1st (Nine)","Harmonious joy. Good fortune.","Genuine, balanced contentment, without excess, brings good fortune.","The good fortune of harmonious joy comes from conduct that raises no real doubt.","This is a joy free of any hidden agenda or cause for suspicion."],
   ["2nd (Nine)","Sincere joy. Good fortune, regret vanishes.","Genuine, trustworthy joy dissolves earlier regret and brings good fortune.","The good fortune of sincere joy comes from real trust in one's own purpose.","This genuine trust in one's own intent is the true source of this good fortune."],
   ["3rd (Six)","Joy that comes from without. Misfortune.","Joy sought merely from outside flattery or pleasure, rather than genuine substance, ends badly.","The misfortune of joy from without comes from a position that is simply not fitting.","This ill-suited position is exactly why such external joy proves misguided."],
   ["4th (Nine)","Deliberating over joy, not yet settled; keeping a sickness at a distance brings cause for celebration.","Careful discernment about where real joy should lie, and resisting an unhealthy influence, brings real cause for happiness.","The celebration of the fourth line brings genuine cause for joy.","This careful deliberation is, in itself, a real cause for celebration."],
   ["5th (Nine)","Sincere trust extended toward what erodes true character. There is real danger in this.","Placing genuine trust in a corrupting or flattering influence carries real danger.","Sincere trust extended toward what erodes character comes from occupying a rightly balanced position, yet real caution is still needed.","Even from a correct, well-centered position, real vigilance remains necessary here."],
   ["Top (Six)","Joy that draws one onward.","Joy here continues to extend and pull one further, without yet reaching its full resolution.","Joy drawing one onward at the very top has not yet come to real brightness.","This ongoing pull of joy has not yet reached a fully clear or settled conclusion."],
  ],
  a:"A joyful, harmonious mood in the relationship — more open communication deepens it.",b:"Relationships are harmonious — good communication leads to consensus.",c:"Finances trend positive — good communication and cooperation boost returns."}
},
{n:59,s:"渙",f:"風水渙",u:"巽",l:"坎",k:"凝聚人心",fortune:"小吉",
 desc:"凝聚人心，指目前人心或資源趨於渙散，宜主動整合、重新凝聚向心力。",
 guaCi:"渙：亨。王假有廟，利涉大川，利貞。",
 guaCiX:"渙卦象徵渙散離心：亨通，君王親臨宗廟祭祀凝聚人心，有利於涉越險阻、成就大事，也有利於堅守正道。",
 tuan:"渙亨，剛來而不窮，柔得位乎外而上同。王假有廟，王乃在中也。利涉大川，乘木有功也。",
 tuanX:"渙卦之所以亨通，是因為陽剛前來而不至於窮困，陰柔則居於恰當的外位並向上與人同心協力；君王親臨宗廟祭祀，是要居於核心以凝聚人心；有利於涉險成就大事，是因為如同乘坐木舟渡河一般能有所成就。",
 xiang:"風行水上，渙；先王以享于帝立廟。",
 xiangX:"風吹拂在水面之上，使水波四散渙開，象徵渙散離心之象，古代君王觀此便祭祀上天、建立宗廟，藉此凝聚渙散的人心。",
 guaCiSeg:[{o:"渙：亨。",e:"渙卦象徵渙散離心：亨通。",terms:["heng"]},{o:"王假有廟，",e:"君王親臨宗廟祭祀凝聚人心，"},{o:"利涉大川，",e:"有利於涉越險阻、成就大事，",terms:["li","she_da_chuan"]},{o:"利貞。",e:"也有利於堅守正道。",terms:["li","zhen"]}],
 tuanSeg:[{o:"渙亨，剛來而不窮，柔得位乎外而上同。",e:"渙卦之所以亨通，是因為陽剛前來而不至於窮困，陰柔則居於恰當的外位並向上與人同心協力。",terms:["heng"]},{o:"王假有廟，王乃在中也。",e:"君王親臨宗廟祭祀，是要居於核心以凝聚人心。"},{o:"利涉大川，乘木有功也。",e:"有利於涉險成就大事，是因為如同乘坐木舟渡河一般能有所成就。",terms:["li"]}],
 xiangSeg:[{o:"風行水上，渙；",e:"風吹拂在水面之上，使水波四散渙開，象徵渙散離心之象；"},{o:"先王以享于帝立廟。",e:"古代君王觀此便祭祀上天、建立宗廟，藉此凝聚渙散的人心。"}],
 yao:[
 ["初六","用拯馬壯，吉。","藉助強壯的馬匹及時拯救渙散的局面，吉祥。","初六之吉，順也。","獲得吉祥，是因能順應時勢而行。"],
 ["九二","渙奔其机，悔亡。","渙散之時急忙奔向可以依靠的憑几或根基，悔恨消失。","渙奔其机，得願也。","急忙奔向可依靠之處，終能實現心中所願。"],
 ["六三","渙其躬，无悔。","渙散之時願意犧牲自身以顧全大局，並無悔恨。","渙其躬，志在外也。","願意犧牲自身，是因志向著眼於外部整體的大局。"],
 ["六四","渙其群，元吉；渙有丘，匪夷所思。","渙散原本狹隘的小群體、重新凝聚成更廣大的群體，大為吉祥；能匯聚如山丘般的力量，實非尋常思慮所能想見。","渙其群元吉，光大也。","渙散小群而重新凝聚，大為吉祥，象徵格局光明廣大。"],
 ["九五","渙汗其大號，渙王居，无咎。","渙散之時發布如汗水般難以收回的重大號令，君王安居其位以安定人心，並無災咎。","王居无咎，正位也。","君王安居其位而無咎，是因端正了應有的地位與職責。"],
 ["上九","渙其血，去逖出，无咎。","渙散危險之時能遠離傷害、及早脫離險境，並無災咎。","渙其血，遠害也。","能及早脫離傷害之境，是為了遠離禍害。"],
 ],
 a:"感情關係可能出現疏離，宜主動溝通重新凝聚情感。",b:"團隊向心力不足，宜加強溝通凝聚共識。",c:"財務資源分散，宜整合資源、集中規劃理財目標。",
 en:{name:"Huàn",title:"Dispersion",keyword:"Reuniting What Has Scattered",
  desc:"Wind moving over water, scattering it into spray: unity has broken down somewhat — this is a time for sincere, deliberate effort to bring people and purpose back together.",
  guaCi:"Huàn: Success. The king approaches his ancestral temple. Favorable to cross the great water. Favorable to persevere.",
  guaCiX:"Genuine, devoted effort — like a king's sincere reverence at the temple — brings success here, and favors both bold undertakings and continued steadfastness.",
  tuan:"Huàn brings success: the firm comes and does not exhaust itself; the soft attains its position outside and unites with what is above. The king approaches his ancestral temple, for the king thereby stands at the very center. Favorable to cross the great water, for riding the wooden vessel brings real achievement.",
  tuanX:"When steady strength and gentle unity work together, centered around genuine, devoted purpose, the scattered pieces can be gathered again, even supporting a bold and difficult undertaking.",
  xiang:"Wind moves over water: this is Huàn. Thus the ancient kings made offering to the Supreme Lord and established their ancestral temples.",
  xiangX:"As wind moves across water, scattering it into fine spray, ancient kings made solemn offerings and established ancestral temples to gather and unite the people's hearts.",
  yao:[
   ["1st (Six)","Rescued with the strength of a sturdy horse. Good fortune.","Timely, capable assistance at the very outset of dispersion brings good fortune.","The good fortune of the first line comes from following what is right.","This is fortunate simply because it follows the right and proper course."],
   ["2nd (Nine)","In dispersion, hastening to one's support. Regret vanishes.","Amid scattering, quickly seeking a stable foundation to rely on dissolves earlier regret.","Hastening to one's support in dispersion means one thereby attains one's true wish.","This prompt search for real support is what fulfills the genuine wish here."],
   ["3rd (Six)","Dispersing one's own self; no regret.","Willingly setting aside personal interest for the sake of the greater whole leaves no regret.","Dispersing one's own self means the will is directed outward, toward what lies beyond.","This outward-directed intent, beyond mere self-interest, is what leaves no regret."],
   ["4th (Six)","Dispersing the small factions; sublime good fortune. Through dispersion there comes a gathering like a hill — this is not something ordinary minds would conceive.","Breaking up narrow, divisive groups in favor of a larger, genuine unity brings great good fortune — a result of real insight, beyond common thinking.","Sublime good fortune in dispersing the factions comes from a light that shines broadly and greatly.","This broad, generous clarity of vision is what brings about such great good fortune."],
   ["5th (Nine)","In dispersion, a great proclamation goes forth like sweat that cannot be recalled; dispersing the king's own hoard. No blame.","A significant, irreversible announcement, paired with generously sharing what has been accumulated, is entirely sound here.","The king's hoard, no blame, comes from occupying a rightly correct position.","This correct, rightful position is what makes such generous distribution entirely fitting."],
   ["Top (Nine)","Dispersing one's own blood, going far off, departing. No blame.","Moving decisively away from real danger or harm at this final stage carries no fault.","Dispersing one's own blood means, in this way, one keeps far from real harm.","This deliberate distancing is precisely what keeps real danger at bay."],
  ],
  a:"The relationship may feel distant — reach out actively to reconnect.",b:"Team cohesion is weak — strengthen communication to rebuild consensus.",c:"Resources are scattered — consolidate and refocus your financial goals."}
},
{n:60,s:"節",f:"水澤節",u:"坎",l:"兌",k:"節制有度",fortune:"平",
 desc:"節制有度，指當前宜量力而為、拿捏分寸，過猶不及都非長久之計。",
 guaCi:"節：亨。苦節不可貞。",
 guaCiX:"節卦象徵節制有度：亨通，但若節制過於嚴苛、令人痛苦，便不宜長久堅持。",
 tuan:"節亨，剛柔分而剛得中。苦節不可貞，其道窮也。說以行險，當位以節，中正以通。天地節而四時成，節以制度，不傷財，不害民。",
 tuanX:"節卦之所以亨通，是因為剛柔各自分明且陽剛居於適中之位；過於嚴苛的節制之所以不宜長久堅持，是因為這樣的做法終將走向窮途末路；內心和悅地面對險境，居於恰當之位而懂得節制，秉持中正之道便能通達；天地也有其節制規律因而形成四季，人事上若能以制度加以節制，便不會耗損財物，也不會妨害百姓。",
 xiang:"澤上有水，節；君子以制數度，議德行。",
 xiangX:"沼澤之上蓄積著水，容量有限、必須節制，象徵節制之象，君子觀此應制定各種法度規範，並審議自身的德行操守。",
 guaCiSeg:[{o:"節：亨。",e:"節卦象徵節制有度：亨通。",terms:["heng"]},{o:"苦節不可貞。",e:"但若節制過於嚴苛、令人痛苦，便不宜長久堅持。",terms:["zhen"]}],
 tuanSeg:[{o:"節亨，剛柔分而剛得中。",e:"節卦之所以亨通，是因為剛柔各自分明且陽剛居於適中之位。",terms:["heng"]},{o:"苦節不可貞，其道窮也。",e:"過於嚴苛的節制之所以不宜長久堅持，是因為這樣的做法終將走向窮途末路。",terms:["zhen"]},{o:"說以行險，當位以節，中正以通。",e:"內心和悅地面對險境，居於恰當之位而懂得節制，秉持中正之道便能通達。",terms:["zhong_zheng"]},{o:"天地節而四時成，節以制度，不傷財，不害民。",e:"天地也有其節制規律因而形成四季，人事上若能以制度加以節制，便不會耗損財物，也不會妨害百姓。"}],
 xiangSeg:[{o:"澤上有水，節；",e:"沼澤之上蓄積著水，容量有限、必須節制，象徵節制之象；"},{o:"君子以制數度，議德行。",e:"君子觀此應制定各種法度規範，並審議自身的德行操守。",terms:["jun_zi"]}],
 yao:[
 ["初九","不出戶庭，无咎。","安分守己、不輕易踏出家門庭院，並無災咎。","不出戶庭，知通塞也。","不輕易外出，是因能明辨時勢的通達與閉塞。"],
 ["九二","不出門庭，凶。","應當有所作為之時卻仍固守不出門庭，反而有凶險，象徵過度節制。","不出門庭凶，失時極也。","應行動時卻不出行而招凶，是因錯失了應把握的時機。"],
 ["六三","不節若，則嗟若，无咎。","若不能適當節制，將招致嘆息悔恨，但及時醒悟仍可無咎。","不節之嗟，又誰咎也。","不知節制而生嘆息，這樣的結果又能歸咎於誰呢。"],
 ["六四","安節，亨。","安然自在地保持適度的節制，亨通。","安節之亨，承上道也。","安然節制而能亨通，是因能承繼並順應上位者的正道。"],
 ["九五","甘節，吉；往有尚。","以甘心樂意的態度節制自持，吉祥，前往行事將受到嘉許。","甘節之吉，居位中也。","以甘心之態節制而獲吉，是因居於中正之位。"],
 ["上六","苦節，貞凶，悔亡。","節制過於嚴苛痛苦，即使堅持也有凶險，但若能適時調整，悔恨終將消失。","苦節貞凶，其道窮也。","過於嚴苛的節制即使堅持也凶，是因這樣的做法已至窮途末路。"],
 ],
 a:"感情經營宜拿捏分寸，過猶不及都非好事。",b:"工作上宜量力而為，做好時間與資源分配。",c:"財務上宜量入為出、節制開支，避免超支負債。",
 en:{name:"Jié",title:"Limitation",keyword:"Proper Measure",
  desc:"Water contained within a lake, held to its proper bounds: this is a time for appropriate restraint and boundaries — too little discipline, or too much, both cause trouble.",
  guaCi:"Jié: Success. Bitter limitation should not be persisted in.",
  guaCiX:"Real restraint brings success, but limitation carried to a harsh, painful extreme is not meant to be sustained indefinitely.",
  tuan:"Jié brings success: the firm and the soft are distinct, and the firm attains the middle place. Bitter limitation should not be persisted in, for such a way would reach its own limit. Joyous, and moving through danger; occupying the correct position with limitation, and moving with balance and clarity. Heaven and earth have their own limitation, and so the four seasons are formed; limitation established through proper measure neither harms resources nor injures the people.",
  tuanX:"Just as heaven and earth's own natural limits give rise to the ordered seasons, proper, balanced restraint — neither too harsh nor too lax — is what protects both resources and people alike.",
  xiang:"Above the lake there is water: this is Jié. Thus the noble one establishes measures and standards, and examines the conduct of virtue.",
  xiangX:"As water is held within the bounds of the lake, contained to its proper measure, a person of character sets clear standards and reflects on their own conduct.",
  yao:[
   ["1st (Nine)","Not going out from the door and courtyard. No blame.","Restraint in staying close to home at the outset, with good judgment about the moment, carries no fault.","Not going out from the door and courtyard means one understands when the way is open and when it is blocked.","Real discernment about the state of things is what makes this restraint sound."],
   ["2nd (Nine)","Not going out from the inner gate. Misfortune.","Remaining overly restrained when the moment actually calls for action leads to misfortune.","The misfortune of not going out from the inner gate comes from having greatly lost the right sense of timing.","Missing the right moment to act entirely is the source of this misfortune."],
   ["3rd (Six)","Not exercising restraint, and so there is lament. No blame.","A lack of restraint here brings real regret, though it comes without deeper fault of character.","The lament of not exercising restraint — who else, in truth, is there to blame?","This regret arises from one's own choice, with no one else truly to blame."],
   ["4th (Six)","Peaceful limitation. Success.","Restraint applied calmly and comfortably here brings real success.","The success of peaceful limitation comes from carrying on the way that lies above.","This continuation of the sound principle from above is what brings the success."],
   ["5th (Nine)","Sweet, willing limitation. Good fortune. Going forward earns real esteem.","Restraint accepted gladly and without resistance brings good fortune, and moving forward this way earns genuine respect.","The good fortune of sweet, willing limitation comes from occupying the balanced, central position.","This centered, well-placed position is what makes such restraint so genuinely fitting."],
   ["Top (Six)","Bitter limitation. Perseverance brings misfortune; regret vanishes.","Restraint pushed to a harsh, painful extreme is unwise if persisted in, though earlier regret does eventually dissolve.","Bitter limitation with misfortune through perseverance means the way itself has reached its limit.","This is simply the natural point where excessive restraint reaches its own breaking point."],
  ],
  a:"Love needs the right balance — too much or too little both cause problems.",b:"Pace yourself at work and manage your time and resources well.",c:"Live within your means and avoid overspending or debt."}
},
{n:61,s:"中孚",f:"風澤中孚",u:"巽",l:"兌",k:"誠信中孚",fortune:"大吉",
 desc:"誠信中孚，指眼前以真誠信任待人處世，必能感化他人、事事亨通。",
 guaCi:"中孚：豚魚吉，利涉大川，利貞。",
 guaCiX:"中孚卦象徵誠信中孚：內心的誠信足以感化如豚魚般愚鈍的事物，因而吉祥，有利於涉越險阻、成就大事，也有利於堅守正道。",
 tuan:"中孚，柔在內而剛得中。說而巽，孚，乃化邦也。豚魚吉，信及豚魚也。利涉大川，乘木舟虛也。中孚以利貞，乃應乎天也。",
 tuanX:"中孚卦中陰柔居於內、陽剛居中得位；內心和悅而外表謙遜，誠信便足以感化整個邦國；連愚鈍的豚魚都能感受到誠信而獲得吉祥；有利於涉險成就大事，是因為如同乘坐中空的木舟渡河一般安穩；秉持誠信而堅守正道，正是順應天道的表現。",
 xiang:"澤上有風，中孚；君子以議獄緩死。",
 xiangX:"沼澤之上吹拂著風，無所不至，象徵誠信廣被之象，君子觀此應審慎議定訴訟案件，並對死刑從寬處理，體現至誠愛人之心。",
 guaCiSeg:[{o:"中孚：豚魚吉，",e:"中孚卦象徵誠信中孚：內心的誠信足以感化如豚魚般愚鈍的事物，因而吉祥，",terms:["ji"]},{o:"利涉大川，",e:"有利於涉越險阻、成就大事，",terms:["li","she_da_chuan"]},{o:"利貞。",e:"也有利於堅守正道。",terms:["li","zhen"]}],
 tuanSeg:[{o:"中孚，柔在內而剛得中。",e:"中孚卦中陰柔居於內、陽剛居中得位。"},{o:"說而巽，孚，乃化邦也。",e:"內心和悅而外表謙遜，誠信便足以感化整個邦國。",terms:["fu"]},{o:"豚魚吉，信及豚魚也。",e:"連愚鈍的豚魚都能感受到誠信而獲得吉祥。",terms:["ji"]},{o:"利涉大川，乘木舟虛也。",e:"有利於涉險成就大事，是因為如同乘坐中空的木舟渡河一般安穩。",terms:["li"]},{o:"中孚以利貞，乃應乎天也。",e:"秉持誠信而堅守正道，正是順應天道的表現。",terms:["li","zhen"]}],
 xiangSeg:[{o:"澤上有風，中孚；",e:"沼澤之上吹拂著風，無所不至，象徵誠信廣被之象；"},{o:"君子以議獄緩死。",e:"君子觀此應審慎議定訴訟案件，並對死刑從寬處理，體現至誠愛人之心。",terms:["jun_zi"]}],
 yao:[
 ["初九","虞吉，有它不燕。","心存戒備審度則吉，若有其他變故干擾便難以安寧。","初九虞吉，志未變也。","戒慎審度而獲吉，是因心志尚未有所改變動搖。"],
 ["九二","鳴鶴在陰，其子和之；我有好爵，吾與爾靡之。","鶴鳥在幽隱之處鳴叫，其幼鶴隨聲應和；如我有美酒佳爵，也願與你共同分享。","其子和之，中心願也。","幼鶴隨聲應和，是發自內心真誠的願望。"],
 ["六三","得敵，或鼓或罷，或泣或歌。","與敵對相遇，時而擊鼓進攻、時而停止罷休，時而悲泣、時而歡歌，情緒反覆不定。","或鼓或罷，位不當也。","情緒行為反覆不定，是因所處之位不甚恰當。"],
 ["六四","月幾望，馬匹亡，无咎。","如月將圓滿之際，失去了原本相配的馬匹，但並無災咎。","馬匹亡，絕類上也。","失去相配的馬匹，是為了斷絕同類的牽絆、一心向上追隨。"],
 ["九五","有孚攣如，无咎。","心懷誠信、與人緊密相繫連結，並無災咎。","有孚攣如，位正當也。","心懷誠信而緊密相繫，是因所處之位正當合宜。"],
 ["上九","翰音登于天，貞凶。","如雞鳴之聲卻妄圖高飛入天，徒有虛聲而無實德，即使堅持也有凶險。","翰音登于天，何可長也。","徒具虛聲卻妄想登天，這樣的情況豈能長久維持。"],
 ],
 a:"以真誠信任為基礎經營感情，能獲得對方真心回應。",b:"誠信待人能贏得他人信賴，有助拓展合作機會。",c:"誠信經營、言而有信，有助累積長遠的財富基礎。",
 en:{name:"Zhōng Fú",title:"Inner Truth",keyword:"Sincerity That Moves Others",
  desc:"Wind moving over the lake: genuine, heartfelt sincerity — reaching even the simplest and least aware — is what carries real power now.",
  guaCi:"Zhōng Fú: Even pigs and fish respond to this — good fortune. Favorable to cross the great water. Favorable to persevere.",
  guaCiX:"Sincerity so genuine it moves even the most unaware creatures brings good fortune, favoring both bold action and steady perseverance.",
  tuan:"Zhōng Fú: the soft is within, the firm attains the center. Joyous, and gentle; sincerity that thereby transforms the whole state. Even pigs and fish respond, good fortune, for sincerity extends even to pigs and fish. Favorable to cross the great water, for one rides the empty wooden vessel. Inner truth, favorable to persevere, thereby responds to heaven itself.",
  tuanX:"A sincerity so complete that it reaches even the least perceptive creatures has the power to transform a whole community; such genuine truth, held with balance and steadiness, is in true accord with heaven's own way.",
  xiang:"Wind above the lake: this is Zhōng Fú. Thus the noble one carefully deliberates over judicial cases and shows leniency in matters of execution.",
  xiangX:"As wind moves gently but pervasively over the lake, reaching every part, a person of character deliberates cases with real care and shows leniency where a life is at stake.",
  yao:[
   ["1st (Nine)","Deliberating carefully brings good fortune. Having something else in mind brings unease.","Careful, deliberate consideration brings good fortune, while a divided, distracted mind brings unease.","The good fortune of deliberating carefully at the first line comes from a will that has not yet wavered.","This steady, undivided resolve is what secures the good fortune here."],
   ["2nd (Nine)","A crane calling in the shade; its young answer it. I have a fine cup of wine; let us share it together.","A genuine, resonant connection naturally draws a heartfelt response, worth celebrating together.","Its young answering it comes from a wish truly shared at heart.","This is a response born of real, shared, heartfelt sincerity."],
   ["3rd (Six)","Meeting an equal, now beating the drum, now stopping; now weeping, now singing.","Facing a genuine counterpart brings a swirl of shifting, uncertain emotion, alternating between effort and rest, sorrow and joy.","Now beating the drum, now stopping, comes from a position that is simply not fitting.","This ill-suited position accounts for such shifting, uncertain conduct."],
   ["4th (Six)","The moon is nearly full; the horse loses its mate. No blame.","Reaching a moment of near-completion, one lets go of an old attachment in favor of a higher purpose, without fault.","The horse losing its mate means severing ties with one's own kind in order to rise upward.","This deliberate release of an old bond serves a genuinely higher purpose."],
   ["5th (Nine)","Sincerity that binds closely together. No blame.","Deep, genuine sincerity that draws people tightly together carries no fault.","Sincerity that binds closely together comes from occupying a rightly correct position.","This correct, well-placed position is what makes such close sincerity entirely fitting."],
   ["Top (Nine)","A cock's crow rising toward heaven. Perseverance brings misfortune.","Loud, ambitious display without real substance behind it is unwise even if persisted in.","How can a cock's crow rising toward heaven possibly last for long?","Such hollow, overreaching display simply cannot be sustained for any real length of time."],
  ],
  a:"Build love on genuine trust — sincerity earns a heartfelt response.",b:"Trustworthy conduct earns others' confidence and opens doors to cooperation.",c:"Honest, reliable dealings build lasting financial foundations."}
},
{n:62,s:"小過",f:"雷山小過",u:"震",l:"艮",k:"大事宜緩",fortune:"小吉",
 desc:"大事宜緩，指目前適合處理日常小事，重大決策則宜暫緩、謹慎評估。",
 guaCi:"小過：亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。",
 guaCiX:"小過卦象徵小事可為、大事宜緩：亨通，有利於堅守正道；適合處理小事，不適合處理大事；如同飛鳥留下的鳴聲一般，不宜向上高飛，宜向下低飛，如此便能大為吉祥。",
 tuan:"小過，小者過而亨也。過以利貞，與時行也。柔得中，是以小事吉也；剛失位而不中，是以不可大事也。有飛鳥之象焉，飛鳥遺之音，不宜上宜下大吉；上逆而下順也。",
 tuanX:"小過卦是陰柔稍微過盛卻仍能亨通的狀態；過度之時仍有利於堅守正道，是因為能順應時勢而行動；陰柔居於適中之位，因此處理小事能夠吉祥；陽剛失去恰當的位置且不居中，因此不適合處理重大之事；此卦帶有飛鳥的象徵，如同飛鳥的鳴聲，不宜向上高飛而宜向下低飛，如此便能大為吉祥，因為向上逆勢而向下則順勢而行。",
 xiang:"山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。",
 xiangX:"高山之上響著雷聲，聲音受阻而略顯過度，象徵小有過度之象，君子觀此應在行為上稍微過於恭敬、居喪時稍微過於哀戚、用度上稍微過於節儉，凡事寧可稍加謹慎，也不可輕率隨便。",
 guaCiSeg:[{o:"小過：亨，",e:"小過卦象徵小事可為、大事宜緩：亨通，",terms:["heng"]},{o:"利貞。",e:"有利於堅守正道；",terms:["li","zhen"]},{o:"可小事，不可大事。",e:"適合處理小事，不適合處理大事。"},{o:"飛鳥遺之音，",e:"如同飛鳥留下的鳴聲一般，"},{o:"不宜上宜下，",e:"不宜向上高飛，宜向下低飛，"},{o:"大吉。",e:"如此便能大為吉祥。"}],
 tuanSeg:[{o:"小過，小者過而亨也。",e:"小過卦是陰柔稍微過盛卻仍能亨通的狀態。",terms:["heng"]},{o:"過以利貞，與時行也。",e:"過度之時仍有利於堅守正道，是因為能順應時勢而行動。",terms:["li","zhen","shi"]},{o:"柔得中，是以小事吉也；剛失位而不中，是以不可大事也。",e:"陰柔居於適中之位，因此處理小事能夠吉祥；陽剛失去恰當的位置且不居中，因此不適合處理重大之事。",terms:["ji"]},{o:"有飛鳥之象焉，飛鳥遺之音，不宜上宜下大吉；上逆而下順也。",e:"此卦帶有飛鳥的象徵，如同飛鳥的鳴聲，不宜向上高飛而宜向下低飛，如此便能大為吉祥，因為向上逆勢而向下則順勢而行。"}],
 xiangSeg:[{o:"山上有雷，小過；",e:"高山之上響著雷聲，聲音受阻而略顯過度，象徵小有過度之象；"},{o:"君子以行過乎恭，喪過乎哀，用過乎儉。",e:"君子觀此應在行為上稍微過於恭敬、居喪時稍微過於哀戚、用度上稍微過於節儉，凡事寧可稍加謹慎，也不可輕率隨便。",terms:["jun_zi"]}],
 yao:[
 ["初六","飛鳥以凶。","如飛鳥般急於高飛冒進，將招致凶險。","飛鳥以凶，不可如何也。","飛鳥冒進而招凶，事已至此也無可挽回。"],
 ["六二","過其祖，遇其妣；不及其君，遇其臣，无咎。","行事略微超越常規去拜見祖父卻遇見祖母，未及晉見君王卻遇見其臣屬，並無災咎，象徵謹守本分、不逾越過甚。","不及其君，臣不可過也。","未能晉見君王，是因為臣者不應過度僭越本分。"],
 ["九三","弗過防之，從或戕之，凶。","若不能適度提防過度之事，任其發展恐遭受傷害，凶險。","從或戕之，凶如何也。","放任而不加防備，其招致的凶險是可想而知的。"],
 ["九四","无咎，弗過遇之；往厲必戒，勿用永貞。","並無災咎，能不逾越常規而恰如其分地應對；前往行事雖有危險，必須提高戒備，此時不宜長久堅持固執己見。","弗過遇之，位不當也；往厲必戒，終不可長也。","能恰如其分應對，但所處之位仍有不當之處；前行有危險必須戒備，這種處境終究難以長久。"],
 ["六五","密雲不雨，自我西郊；公弋取彼在穴。","如烏雲密布卻遲遲不降雨，力量正從西方醞釀積聚；王公用箭射取藏於洞穴中的獵物，象徵仍需耐心等待、暗中準備。","密雲不雨，已上也。","密雲之所以尚未成雨，是因陽氣已然過於上升。"],
 ["上六","弗遇過之，飛鳥離之，凶，是謂災眚。","未能恰如其分卻反而過度躁進，如飛鳥般迅速遠離常軌，凶險，這正是所謂的災禍。","弗遇過之，已亢也。","未能恰如其分卻反而過度，是因已發展到過於高亢的地步。"],
 ],
 a:"感情上宜多注意小細節，勿好高騖遠、操之過急。",b:"適合處理日常瑣事，重大決策宜暫緩、謹慎評估。",c:"財務上宜謹慎小額操作，避免貿然進行大筆投資。",
 en:{name:"Xiǎo Guò",title:"Small Exceeding",keyword:"Caution in Large Matters",
  desc:"Thunder atop the mountain, its sound somewhat muffled and excessive: small matters may proceed now, but larger undertakings call for real restraint.",
  guaCi:"Xiǎo Guò: Success. Favorable to persevere. Suitable for small matters, not for great ones. The flying bird leaves behind its call; not fitting to go upward, fitting to go downward. Great good fortune.",
  guaCiX:"Success and continued perseverance suit modest, small-scale matters, but not major undertakings; like a bird's call trailing downward rather than up, favoring restraint and modesty brings great good fortune.",
  tuan:"Xiǎo Guò: the small exceeds and yet finds success. Exceeding with perseverance, one moves in accord with the times. The soft attains the middle place, hence good fortune in small matters. The firm loses its proper place and is not centered, hence unsuitable for great matters. There is the image of a flying bird within: the flying bird leaving behind its call, not fitting to go upward, fitting to go downward, brings great good fortune — going upward runs contrary, going downward is compliant.",
  tuanX:"A modest excess, well-timed and moving with the moment, can still succeed in small matters, though it lacks the firm centering needed for great undertakings; like a bird's trailing call, humility and downward restraint bring great good fortune, while overreaching does not.",
  xiang:"Thunder atop the mountain: this is Xiǎo Guò. Thus the noble one, in conduct, leans a little toward excessive reverence; in mourning, a little toward excessive grief; in spending, a little toward excessive frugality.",
  xiangX:"As thunder, muffled by the mountain, sounds somewhat excessive in its resonance, a person of character leans slightly toward extra reverence, extra grief, and extra frugality — erring gently on the side of care.",
  yao:[
   ["1st (Six)","A flying bird brings misfortune.","Overeager, premature action, soaring beyond what the moment calls for, brings misfortune.","The misfortune of the flying bird is simply beyond remedy at this point.","This premature overreach, once done, cannot really be undone."],
   ["2nd (Six)","Passing by one's grandfather, meeting one's grandmother; not reaching one's ruler, meeting his minister instead. No blame.","Staying within appropriate, modest bounds — engaging at one's own proper level rather than overreaching — carries no fault.","Not reaching one's ruler means a minister should not overstep his bounds.","This is simply a matter of not overstepping the bounds appropriate to one's station."],
   ["3rd (Nine)","If one does not take special precautions, someone may come to do harm. Misfortune.","Neglecting reasonable caution against a real, present risk invites genuine harm.","How great indeed is the misfortune of someone coming to do harm!","Such neglected caution against a real threat leads to genuinely serious trouble."],
   ["4th (Nine)","No blame; not exceeding, but meeting things as they are. To go forward brings danger, and one must be on guard; do not act with lasting rigidity.","Meeting circumstances appropriately, without overreach, is sound, though moving forward still requires real vigilance and flexibility.","Not exceeding, but meeting things as they are, comes from a position that is simply not fitting; going forward with danger requiring vigilance means, in the end, this cannot be sustained for long.","This ill-suited position is why continued vigilance, rather than rigid persistence, is called for."],
   ["5th (Six)","Dense clouds, no rain, coming from our western outskirts. The duke shoots and captures the one hidden in the cave.","Potential and readiness are gathering but not yet fully released — deliberate, targeted effort still secures what is sought.","Dense clouds, no rain, mean the yang force has already risen too high.","This excess of rising energy is why the rain has not yet been able to fall."],
   ["Top (Six)","Not meeting things as they are, but exceeding them; the flying bird departs from them. Misfortune. This is called disaster and calamity.","Overreaching well beyond what is fitting, like a bird flying entirely out of bounds, brings genuine misfortune and real calamity.","Not meeting things as they are, but exceeding them, shows one has already gone too far.","This is a clear case of having overreached well beyond the proper, fitting limit."],
  ],
  a:"Pay attention to small details in love — don't rush or overreach.",b:"Good for routine matters — hold off on major decisions and assess carefully.",c:"Handle finances cautiously in small amounts — avoid large investments for now."}
},
{n:63,s:"既濟",f:"水火既濟",u:"坎",l:"離",k:"慎終如始",fortune:"平",
 desc:"慎終如始，指當前雖已階段性完成、大致圓滿，仍須居安思危以防功虧一簣。",
 guaCi:"既濟：亨小，利貞。初吉終亂。",
 guaCiX:"既濟卦象徵功成圓滿：小有亨通，有利於堅守正道；提醒起初雖然吉祥，但若不知警惕，最終恐將陷入混亂。",
 tuan:"既濟亨，小者亨也。利貞，剛柔正而位當也。初吉，柔得中也。終止則亂，其道窮也。",
 tuanX:"既濟卦之所以亨通，是指小處能夠亨通；有利於堅守正道，是因為剛柔各安其位、恰如其分；起初吉祥，是因為陰柔居於適中之位；然而若因功成而停滯不前，終將陷入混亂，這是因為事物發展到極致便會走向窮途末路。",
 xiang:"水在火上，既濟；君子以思患而豫防之。",
 xiangX:"水在火的上方，兩者相互為用、恰到好處，象徵功成圓滿之象，君子觀此應在事情圓滿之時，仍不忘思慮潛藏的禍患並預先防範。",
 guaCiSeg:[{o:"既濟：亨小，",e:"既濟卦象徵功成圓滿：小有亨通，",terms:["heng"]},{o:"利貞。",e:"有利於堅守正道；",terms:["li","zhen"]},{o:"初吉終亂。",e:"提醒起初雖然吉祥，但若不知警惕，最終恐將陷入混亂。",terms:["ji"]}],
 tuanSeg:[{o:"既濟亨，小者亨也。",e:"既濟卦之所以亨通，是指小處能夠亨通。",terms:["heng"]},{o:"利貞，剛柔正而位當也。",e:"有利於堅守正道，是因為剛柔各安其位、恰如其分。",terms:["li","zhen"]},{o:"初吉，柔得中也。",e:"起初吉祥，是因為陰柔居於適中之位。",terms:["ji"]},{o:"終止則亂，其道窮也。",e:"然而若因功成而停滯不前，終將陷入混亂，這是因為事物發展到極致便會走向窮途末路。"}],
 xiangSeg:[{o:"水在火上，既濟；",e:"水在火的上方，兩者相互為用、恰到好處，象徵功成圓滿之象；"},{o:"君子以思患而豫防之。",e:"君子觀此應在事情圓滿之時，仍不忘思慮潛藏的禍患並預先防範。",terms:["jun_zi"]}],
 yao:[
 ["初九","曳其輪，濡其尾，无咎。","拖曳著車輪、沾濕了尾巴般行動謹慎緩慢，並無災咎。","曳其輪，義无咎也。","謹慎緩行、拖曳車輪，依理是無咎的。"],
 ["六二","婦喪其茀，勿逐，七日得。","婦人遺失了車上的簾飾，不必刻意追尋，過些時日自然尋回。","七日得，以中道也。","經過一段時日終能尋回，是因秉持中庸之道行事。"],
 ["九三","高宗伐鬼方，三年克之，小人勿用。","如殷高宗費時三年征伐鬼方才得以攻克，象徵成功得來不易，此時不宜任用心術不正之人。","三年克之，憊也。","歷經三年才得以攻克，可見其中付出的艱辛疲憊。"],
 ["六四","繻有衣袽，終日戒。","即使身著華美衣裳，仍應準備破舊衣物以備不時之需，終日保持戒備警惕。","終日戒，有所疑也。","終日保持戒備，是因心中仍存有所疑慮，不敢鬆懈。"],
 ["九五","東鄰殺牛，不如西鄰之禴祭，實受其福。","東邊鄰居殺牛盛大祭祀，卻不如西邊鄰居雖用簡樸的禴祭卻更加誠心，因而確實承受更多的福澤。","東鄰殺牛，不如西鄰之時也；實受其福，吉大來也。","東鄰盛大祭祀卻不如西鄰把握了合宜的時機；確實承受福澤，象徵大吉即將到來。"],
 ["上六","濡其首，厲。","水已沾濕了頭部，象徵險境已逼近極致，十分危險。","濡其首厲，何可久也。","險境已至沾濕頭部的地步，這樣的處境豈能長久維持。"],
 ],
 a:"感情關係圓滿穩定，仍須用心維持避免鬆懈。",b:"事業階段性完成，宜居安思危、持續精進不懈怠。",c:"財運豐收圓滿，宜妥善規劃，避免因鬆懈而流失。",
 en:{name:"Jì Jì",title:"After Completion",keyword:"Success Requiring Vigilance",
  desc:"Water above fire, each in its proper place: a task has reached genuine completion now — but true success requires the same care at the end as at the beginning.",
  guaCi:"Jì Jì: Small success. Favorable to persevere. Good fortune at the start, disorder at the end.",
  guaCiX:"Modest, real success is achieved here, favoring continued steadiness; but a good beginning risks giving way to disorder if vigilance is not maintained to the very end.",
  tuan:"Jì Jì brings small success: it is small matters that find success. Favorable to persevere, for the firm and the soft are correct and each occupies its proper place. Good fortune at the start comes from the soft attaining the middle place. Stopping at the very end brings disorder, for this way has reached its own limit.",
  tuanX:"True completion, where firm and gentle forces each rest correctly in their place, brings real but modest success; the real danger lies in growing complacent once that success is achieved, for even the soundest order can unravel if left unattended.",
  xiang:"Water above fire: this is Jì Jì. Thus the noble one reflects on potential trouble and guards against it in advance.",
  xiangX:"As water rests above fire, each element held in its proper, balanced place, a person of character reflects on possible future trouble and takes precautions well in advance.",
  yao:[
   ["1st (Nine)","Dragging back the wheels, wetting the tail. No blame.","Careful, deliberate restraint at the very start of a completed task, though slow, carries no fault.","Dragging back the wheels means, in principle, this is without blame.","This cautious slowing down is, by its very nature, entirely blameless."],
   ["2nd (Six)","The wife loses her head-covering; do not chase after it — in seven days, it is recovered.","A small loss along the way resolves on its own if one is patient rather than pursuing it anxiously.","In seven days it is recovered, for this follows the balanced, proper course.","This natural recovery follows simply from staying on the right, centered course."],
   ["3rd (Nine)","The High Ancestor attacks the Devil's Country; after three years, he conquers it. The small-minded should not be employed.","A hard-won victory, achieved only after long, sustained effort, should not be entrusted to those of lesser character.","Conquering it after three years shows how truly exhausting this effort was.","This lengthy, difficult campaign shows just how much genuine effort was required."],
   ["4th (Six)","Fine silk turns to rags; be on guard the whole day through.","Even something once fine can decline through neglect — constant vigilance is called for to prevent this.","Being on guard the whole day through means there remains real cause for doubt.","This ongoing vigilance reflects a genuine, well-founded sense of caution."],
   ["5th (Nine)","The eastern neighbor slaughters an ox, yet this does not compare to the western neighbor's simple summer offering, which truly receives its blessing.","Lavish but empty display falls short of a modest offering made with real sincerity, which alone brings true blessing.","The eastern neighbor slaughtering an ox does not compare to the western neighbor's well-timed offering; the real blessing received shows great good fortune is on its way.","This genuinely well-timed sincerity is what brings the real blessing and coming good fortune."],
   ["Top (Six)","Getting the head wet. Danger.","Overextending beyond the point of real success brings genuine danger.","The danger of getting the head wet — how could such a state possibly last long?","This precarious overreach, by its very nature, cannot be sustained for long."],
  ],
  a:"The relationship feels complete and stable — keep tending to it so it doesn't slip.",b:"A project has reached completion — stay alert and keep improving rather than relaxing.",c:"Finances have peaked nicely — plan carefully to avoid losing ground through complacency."}
},
{n:64,s:"未濟",f:"火水未濟",u:"離",l:"坎",k:"仍待努力",fortune:"小凶",
 desc:"仍待努力，指目前雖尚未大功告成，只要持續努力、謹慎收尾，終能水到渠成。",
 guaCi:"未濟：亨。小狐汔濟，濡其尾，无攸利。",
 guaCiX:"未濟卦象徵功未竟事：仍可亨通；但如同小狐狸即將渡過河流，卻在快要上岸時弄濕了尾巴，因而沒有任何利益，提醒行百里者半九十，不可掉以輕心。",
 tuan:"未濟亨，柔得中也。小狐汔濟，未出中也。濡其尾，无攸利，不續終也。雖不當位，剛柔應也。",
 tuanX:"未濟卦之所以仍可亨通，是因為陰柔居於適中之位；小狐狸快要渡河，卻尚未真正脫離水中的險境；弄濕了尾巴因而沒有利益，是因為未能堅持到最後、功虧一簣；雖然此卦六爻皆不居於恰當的位置，但剛柔仍能彼此相應，仍蘊含著未來可成的希望。",
 xiang:"火在水上，未濟；君子以慎辨物居方。",
 xiangX:"火在水的上方，兩者性質相背、尚未能相互為用，象徵功業未成之象，君子觀此應謹慎辨明事物的性質，使各得其所、各居其位。",
 guaCiSeg:[{o:"未濟：亨。",e:"未濟卦象徵功未竟事：仍可亨通；",terms:["heng"]},{o:"小狐汔濟，濡其尾，",e:"但如同小狐狸即將渡過河流，卻在快要上岸時弄濕了尾巴，"},{o:"无攸利。",e:"因而沒有任何利益，提醒行百里者半九十，不可掉以輕心。",terms:["wuyouli"]}],
 tuanSeg:[{o:"未濟亨，柔得中也。",e:"未濟卦之所以仍可亨通，是因為陰柔居於適中之位。",terms:["heng"]},{o:"小狐汔濟，未出中也。",e:"小狐狸快要渡河，卻尚未真正脫離水中的險境。"},{o:"濡其尾，无攸利，不續終也。",e:"弄濕了尾巴因而沒有利益，是因為未能堅持到最後、功虧一簣。",terms:["wuyouli"]},{o:"雖不當位，剛柔應也。",e:"雖然此卦六爻皆不居於恰當的位置，但剛柔仍能彼此相應，仍蘊含著未來可成的希望。"}],
 xiangSeg:[{o:"火在水上，未濟；",e:"火在水的上方，兩者性質相背、尚未能相互為用，象徵功業未成之象；"},{o:"君子以慎辨物居方。",e:"君子觀此應謹慎辨明事物的性質，使各得其所、各居其位。",terms:["jun_zi"]}],
 yao:[
 ["初六","濡其尾，吝。","如小狐狸渡河卻沾濕了尾巴，行事操之過急，稍有遺憾。","濡其尾，亦不知極也。","尾巴被沾濕，是因不知道應有的分寸限度。"],
 ["九二","曳其輪，貞吉。","拖曳車輪、行動謹慎緩慢，堅守正道則吉。","九二貞吉，中以行正也。","堅守正道而獲吉，是因秉持中道、行事端正。"],
 ["六三","未濟，征凶；利涉大川。","事情尚未完成，此時貿然出征有凶險；但長遠而言仍有利於涉險成就大事。","未濟征凶，位不當也。","事未完成卻貿然出征而招凶，是因所處之位不甚恰當。"],
 ["九四","貞吉，悔亡；震用伐鬼方，三年有賞于大國。","堅守正道則吉、悔恨消失；如以雷霆之勢出兵征伐鬼方，歷經三年終獲大國的封賞。","貞吉悔亡，志行也。","堅守正道而獲吉、悔恨消失，是因心中志向終能得以施行。"],
 ["六五","貞吉，无悔；君子之光，有孚，吉。","堅守正道則吉、並無悔恨；君子的光輝德行加上誠信待人，吉祥。","君子之光，其暉吉也。","君子德行的光輝，其光芒本身便是吉祥的象徵。"],
 ["上九","有孚于飲酒，无咎；濡其首，有孚失是。","心懷誠信、安然歡飲慶祝，並無災咎；但若過度沉溺以至於沾濕了頭部，即使心懷誠信也將因此失去分寸。","飲酒濡首，亦不知節也。","飲酒過度以至於沾濕頭部，是因不知道應有的節制。"],
 ],
 a:"感情尚未修成正果，仍需耐心努力、持續經營。",b:"事業目標尚未達成，仍需持續努力，勿輕言放棄。",c:"財富累積尚在過程中，仍需謹慎規劃、持續努力。",
 en:{name:"Wèi Jì",title:"Before Completion",keyword:"Not Yet There",
  desc:"Fire above water, not yet properly aligned: the task remains unfinished for now — with patience and careful attention to the final steps, real completion is still within reach.",
  guaCi:"Wèi Jì: Success. The little fox, nearly across the river, wets its tail. Nothing favorable.",
  guaCiX:"Success remains possible here, but like a young fox that grows careless right at the crossing's end, carelessness at the final step brings no real benefit.",
  tuan:"Wèi Jì brings success: the soft attains the middle place. The little fox nearly across the river, for it has not yet emerged from the middle of the danger. Wetting its tail, nothing favorable — it does not carry the crossing through to completion. Though the positions are not entirely fitting, the firm and the soft still respond to one another.",
  tuanX:"Though not everything is yet in its ideal place, genuine responsiveness between firm and gentle forces still allows for real success — but only if the final, crucial steps are carried through with the same care as the earlier ones.",
  xiang:"Fire above water: this is Wèi Jì. Thus the noble one carefully discerns the true nature of things and sets each in its proper place.",
  xiangX:"As fire and water sit above and below without yet working in true accord, a person of character discerns the real nature of things and places each rightly.",
  yao:[
   ["1st (Six)","Wetting the tail. There is regret.","Carelessness right at the outset of a difficult crossing brings real regret.","Wetting the tail also comes from not truly knowing the limits of the situation.","This lack of real awareness of one's own limits is what leads to this regret."],
   ["2nd (Nine)","Dragging back the wheels. Perseverance brings good fortune.","Restraint and careful pacing, held with integrity, brings good fortune.","The good fortune of perseverance at the second line comes from moving with balance and correctness.","This centered, correct approach is exactly what secures the good fortune here."],
   ["3rd (Six)","Before completion, to press forward brings misfortune. Favorable to cross the great water.","Rash advance while the task is still genuinely unfinished brings misfortune, though a bold, decisive undertaking may still be favorable.","The misfortune of pressing forward before completion comes from a position that is simply not fitting.","This ill-suited position is precisely why rash advance proves unwise here."],
   ["4th (Nine)","Perseverance brings good fortune, regret vanishes. Moving with real vigor, one attacks the Devil's Country; after three years, there is reward from a great state.","Sustained, vigorous effort, held with integrity, dissolves earlier regret and ultimately earns real, significant reward.","Perseverance with good fortune, regret vanishing, means the true will can now be carried out.","This genuine resolve, sustained through effort, is now finally able to be fulfilled."],
   ["5th (Six)","Perseverance brings good fortune, no regret. The noble one's brightness brings real sincerity and good fortune.","Steady integrity brings good fortune without regret, and a truly noble character's own genuine radiance brings real, well-earned good fortune.","The noble one's brightness — its very glow is what brings this good fortune.","This inner radiance of genuine character is, in itself, the true source of the good fortune."],
   ["Top (Nine)","With sincerity, enjoying a drink together. No blame. Yet if the head gets wet through sincerity carried too far, even sincerity itself is lost.","Genuine, sincere celebration at this final stage carries no fault, though even sincerity, taken to careless excess, can undo the very trust it was meant to express.","Drinking with a wet head also means not truly knowing when enough is enough.","This failure to recognize the proper limit is what turns even sincerity into excess."],
  ],
  a:"Love hasn't fully blossomed yet — keep investing patience and effort.",b:"Career goals aren't fully realized — keep pushing and don't give up.",c:"Wealth is still building — keep planning carefully and stay persistent."}
}
];
