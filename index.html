<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卜卦｜六十四卦占卜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE5D8;
    --paper-deep:#DFD8C6;
    --ink:#221F1B;
    --ink-soft:#5C564C;
    --ink-faint:#8B8375;
    --seal:#A5402C;
    --seal-deep:#7E2E1E;
    --jade:#4C6B60;
    --line:rgba(34,31,27,0.16);
    --line-strong:rgba(34,31,27,0.32);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Noto Serif TC', serif;
  }

  section{
    min-height:100vh;
    padding:6vh 8vw;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
  }

  /* ---------- HERO ---------- */
  #hero{
    align-items:center;
    text-align:center;
    background:
      radial-gradient(circle at 50% 42%, rgba(165,64,44,0.05), transparent 55%),
      var(--paper);
  }
  .eyebrow-title{
    font-size:1.05rem;
    letter-spacing:0.4em;
    color:var(--ink-soft);
    margin:0 0 0.3em 4px;
  }
  #hero h1{
    font-size:clamp(2.6rem, 8vw, 4.4rem);
    font-weight:900;
    margin:0 0 0.6em;
    letter-spacing:0.08em;
  }

  .cast-circle{
    width:220px;
    height:220px;
    border-radius:50%;
    border:1.5px solid var(--line-strong);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:transparent;
    position:relative;
    transition:border-color .3s ease, transform .15s ease;
    padding:0;
  }
  .cast-circle:hover{ border-color:var(--seal); }
  .cast-circle:active{ transform:scale(0.97); }
  .cast-circle:focus-visible{ outline:2px solid var(--seal); outline-offset:6px; }

  .cast-circle .cast-label{
    font-family:'Noto Serif TC', serif;
    font-size:1.3rem;
    letter-spacing:0.5em;
    padding-left:0.5em;
    color:var(--ink);
  }

  .lines-frame{
    width:96px;
    display:none;
    flex-direction:column;
    gap:8px;
  }
  .lines-frame.show{ display:flex; }

  .yao-line{
    height:9px;
    display:flex;
    gap:14px;
    opacity:0;
    transform:translateY(6px);
  }
  .yao-line.drawn{
    animation:yaoIn .45s ease forwards;
  }
  @keyframes yaoIn{
    to{ opacity:1; transform:translateY(0); }
  }
  .yao-line .bar{
    background:var(--ink);
    height:100%;
    border-radius:1px;
  }
  .yao-line.yang .bar{ flex:1; }
  .yao-line.yin .bar{ flex:1; }

  .hero-hint{
    margin-top:2.4em;
    font-size:0.92rem;
    color:var(--ink-faint);
    letter-spacing:0.08em;
    min-height:1.4em;
  }

  /* ---------- MEANING SECTION ---------- */
  #meaning{
    align-items:center;
    border-top:1px solid var(--line);
  }
  .meaning-wrap{
    width:100%;
    max-width:760px;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:4vw;
    align-items:start;
  }
  .hex-index{
    font-size:0.95rem;
    color:var(--ink-faint);
    margin:0 0 0.4em;
    letter-spacing:0.15em;
  }
  .hex-name{
    font-size:clamp(2.4rem,6vw,3.6rem);
    font-weight:700;
    margin:0 0 0.15em;
    line-height:1.05;
  }
  .hex-full{
    font-size:1.05rem;
    color:var(--ink-soft);
    margin:0 0 0.9em;
  }
  .hex-keyword{
    display:inline-block;
    font-size:1.05rem;
    color:var(--seal-deep);
    border-bottom:1.5px solid var(--seal);
    padding-bottom:0.15em;
    margin-bottom:0.9em;
  }
  .hex-desc{
    font-size:0.98rem;
    line-height:1.85;
    color:var(--ink-soft);
    margin:0 0 1.6em;
    max-width:34em;
  }

  .trigram-rows{
    display:flex;
    flex-direction:column;
    gap:0.9em;
    margin-bottom:1.6em;
  }
  .trigram-row{
    display:flex;
    align-items:baseline;
    gap:0.9em;
    font-size:0.98rem;
  }
  .trigram-row .role{
    color:var(--ink-faint);
    width:3.2em;
    flex-shrink:0;
  }
  .trigram-row .glyph{
    font-size:1.3rem;
  }
  .trigram-row .tname{
    font-weight:500;
  }
  .trigram-row .dir{
    color:var(--seal-deep);
  }

  .static-lines{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .static-lines .yao-line{
    opacity:1;
    transform:none;
    height:9px;
  }
  .static-lines .yao-line .bar{ background:var(--ink); }

  /* compass */
  .compass-wrap{
    display:flex;
    justify-content:center;
    margin-top:0.5em;
  }
  .compass{
    width:min(320px, 78vw);
    height:min(320px, 78vw);
  }
  .compass text{
    font-family:'Noto Sans TC', sans-serif;
    fill:var(--ink-soft);
  }
  .compass .dir-label{ font-size:12px; }
  .compass .name-label{ font-size:13px; font-weight:500; fill:var(--ink); }
  .compass circle.ring{
    fill:none;
    stroke:var(--line);
    stroke-width:1;
  }
  .compass .spoke{
    stroke:var(--line);
    stroke-width:1;
  }
  .compass .hit.active .name-label{ fill:var(--seal-deep); font-weight:700; }
  .compass .hit.active .dir-label{ fill:var(--seal-deep); }
  .compass .spoke.active{ stroke:var(--seal); stroke-width:1.6; }

  .fortune-badge{
    align-self:flex-start;
    display:inline-block;
    font-family:'Noto Serif TC', serif;
    font-size:1.05rem;
    font-weight:700;
    color:#F3EEE2;
    background:var(--seal);
    padding:0.35em 0.9em;
    border-radius:2px;
    letter-spacing:0.2em;
    margin:0 0 2em 0;
    transform:rotate(-1deg);
  }

  .lang-toggle{
    position:fixed;
    top:18px;
    right:18px;
    z-index:50;
    font-family:'Noto Sans TC', sans-serif;
    font-size:0.85rem;
    font-weight:500;
    letter-spacing:0.1em;
    background:var(--paper);
    border:1px solid var(--line-strong);
    color:var(--ink);
    padding:0.5em 1em;
    border-radius:2px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .lang-toggle:hover{ border-color:var(--seal); color:var(--seal-deep); }

  /* ---------- CLASSICAL TEXT SECTION ---------- */
  #classical{
    align-items:center;
    border-top:1px solid var(--line);
  }
  .classical-wrap{
    width:100%;
    max-width:680px;
  }
  .classic-block{
    border-left:2px solid var(--line-strong);
    padding:0.3em 0 0.3em 1.6em;
    margin-bottom:2.2em;
  }
  .classic-block:last-child{ margin-bottom:0; }
  .classic-label{
    margin:0 0 0.5em;
    font-size:0.85rem;
    letter-spacing:0.3em;
    color:var(--seal-deep);
  }
  .classic-text{
    margin:0 0 0.7em;
    font-size:1.08rem;
    line-height:2;
    color:var(--ink);
  }
  .classic-explain{
    margin:0;
    font-size:0.95rem;
    line-height:1.9;
    color:var(--ink-soft);
  }

  /* ---------- SEGMENT HIGHLIGHT + GLOSSARY ---------- */
  .seg{
    cursor:pointer;
    position:relative;
    border-radius:3px;
    padding:0.05em 0.06em;
    transition:background-color .12s ease;
  }
  .seg.hover-active{
    background-color:rgba(165,64,44,0.16);
  }
  .seg.locked{
    background-color:rgba(165,64,44,0.30);
  }
  .seg-badge{
    position:absolute;
    top:-9px;
    right:-8px;
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--seal);
    color:#F8F4EA;
    font-size:10px;
    font-weight:700;
    font-family:'Noto Sans TC', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    box-shadow:0 0 0 2px var(--paper);
  }
  .seg-badge:hover{ background:var(--seal-deep); }

  .seg-popover{
    position:fixed;
    max-width:min(320px, 84vw);
    background:#F8F4EA;
    border:1px solid var(--line-strong);
    border-radius:3px;
    padding:0.9em 1em;
    font-family:'Noto Sans TC', sans-serif;
    font-size:0.88rem;
    line-height:1.75;
    color:var(--ink);
    box-shadow:0 6px 20px rgba(34,31,27,0.18);
    z-index:100;
    display:none;
  }
  .seg-popover.show{ display:block; }
  .seg-popover .term-line{ margin:0 0 0.5em; }
  .seg-popover .term-line:last-child{ margin-bottom:0; }
  .seg-popover .term-word{
    color:var(--seal-deep);
    font-weight:700;
  }

  .yao-section{
    margin-top:0.4em;
  }
  .yao-block{
    border-left:2px solid var(--line-strong);
    padding:0.3em 0 0.3em 1.6em;
    margin-bottom:1.6em;
  }
  .yao-block:last-child{ margin-bottom:0; }
  .yao-head{
    display:flex;
    align-items:baseline;
    gap:0.9em;
    margin-bottom:0.4em;
  }
  .yao-label{
    flex-shrink:0;
    font-family:'Noto Serif TC', serif;
    font-size:0.95rem;
    font-weight:700;
    color:var(--seal-deep);
    width:2.6em;
  }
  .yao-text{
    margin:0;
    font-size:1.02rem;
    line-height:1.8;
    color:var(--ink);
  }
  .yao-explain{
    margin:0 0 0.7em 3.5em;
    font-size:0.93rem;
    line-height:1.8;
    color:var(--ink-soft);
  }
  .yao-toggle{
    margin-left:3.5em;
    font-family:'Noto Sans TC', sans-serif;
    font-size:0.85rem;
    letter-spacing:0.15em;
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
    padding:0.3em 0.9em;
    cursor:pointer;
    border-radius:2px;
    transition:border-color .2s ease, color .2s ease;
  }
  .yao-toggle:hover{ border-color:var(--seal); color:var(--seal-deep); }
  .yao-xiang-panel{
    margin:0.7em 0 0 3.5em;
    padding-left:1em;
    border-left:1px solid var(--line);
  }
  .yao-xiang-panel[hidden]{ display:none; }
  .yao-xiang-panel .classic-label{
    font-size:0.78rem;
    margin-bottom:0.3em;
  }
  .yao-xiang-panel .classic-text{
    font-size:0.98rem;
    margin-bottom:0.4em;
  }
  .yao-xiang-panel .classic-explain{
    font-size:0.9rem;
  }

  /* ---------- ADVICE SECTION ---------- */
  #advice{
    align-items:center;
    border-top:1px solid var(--line);
  }
  .advice-wrap{
    width:100%;
    max-width:640px;
  }
  .advice-title{
    font-size:1.5rem;
    margin:0 0 1.4em;
  }
  .advice-row{
    display:flex;
    gap:1.4em;
    padding:1.5em 0;
    border-top:1px solid var(--line);
  }
  .advice-row:last-child{ border-bottom:1px solid var(--line); }
  .seal-mark{
    flex-shrink:0;
    width:44px;
    height:44px;
    background:var(--seal);
    color:#F3EEE2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Noto Serif TC', serif;
    font-size:1.3rem;
    transform:rotate(-3deg);
    border-radius:2px;
  }
  .advice-body h3{
    margin:0 0 0.35em;
    font-size:1.08rem;
    font-weight:500;
  }
  .advice-body p{
    margin:0;
    color:var(--ink-soft);
    line-height:1.9;
    font-size:0.98rem;
  }

  .redo-wrap{
    text-align:center;
    margin-top:3em;
  }
  .redo-btn{
    font-family:'Noto Sans TC', sans-serif;
    font-size:0.95rem;
    letter-spacing:0.1em;
    background:none;
    border:1px solid var(--line-strong);
    color:var(--ink);
    padding:0.9em 2.2em;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .redo-btn:hover{ border-color:var(--seal); color:var(--seal-deep); }

  footer{
    text-align:center;
    padding:3em 8vw 4em;
    color:var(--ink-faint);
    font-size:0.85rem;
  }

  @media (max-width:640px){
    .meaning-wrap{ grid-template-columns:1fr; }
    .trigram-rows{ order:2; }
    .static-lines{ order:1; margin-bottom:1.6em; }
  }

  @media (prefers-reduced-motion: reduce){
    .yao-line.drawn{ animation:none; opacity:1; transform:none; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">EN</button>

<section id="hero">
  <p class="eyebrow-title" id="eyebrowTitle">周易　六十四卦</p>
  <h1 id="heroTitle">卜　卦</h1>

  <button class="cast-circle" id="castBtn" aria-label="輕點起卦">
    <span class="cast-label" id="castLabel">起卦</span>
    <div class="lines-frame" id="linesFrame"></div>
  </button>

  <p class="hero-hint" id="heroHint">靜心片刻，輕點圓圈，起一卦</p>
</section>

<section id="meaning">
  <p class="fortune-badge" id="fortuneBadge">—</p>
  <div class="meaning-wrap">
    <div>
      <div class="static-lines" id="staticLines"></div>
    </div>
    <div>
      <p class="hex-index" id="hexIndex">第　卦</p>
      <h2 class="hex-name" id="hexName">—</h2>
      <p class="hex-full" id="hexFull">—</p>
      <p class="hex-keyword" id="hexKeyword">—</p>
      <p class="hex-desc" id="hexDesc">—</p>

      <div class="trigram-rows">
        <div class="trigram-row">
          <span class="role" id="roleUpper">外卦</span>
          <span class="glyph" id="upperGlyph">—</span>
          <span class="tname" id="upperName">—</span>
          <span class="dir" id="upperDir">—</span>
        </div>
        <div class="trigram-row">
          <span class="role" id="roleLower">內卦</span>
          <span class="glyph" id="lowerGlyph">—</span>
          <span class="tname" id="lowerName">—</span>
          <span class="dir" id="lowerDir">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="compass-wrap">
    <svg class="compass" id="compassSvg" viewBox="0 0 320 320"></svg>
  </div>
</section>

<section id="classical">
  <div class="classical-wrap">
    <h2 class="advice-title serif" id="classicalTitle">卦、彖、象原文</h2>

    <div class="classic-block">
      <p class="classic-label" id="labelGuaCi">卦辭</p>
      <p class="classic-text serif" id="ccGuaCi">—</p>
      <p class="classic-explain" id="ccGuaCiX">—</p>
    </div>

    <div class="classic-block">
      <p class="classic-label" id="labelTuan">彖曰</p>
      <p class="classic-text serif" id="ccTuan">—</p>
      <p class="classic-explain" id="ccTuanX">—</p>
    </div>

    <div class="classic-block">
      <p class="classic-label" id="labelXiang">象曰</p>
      <p class="classic-text serif" id="ccXiang">—</p>
      <p class="classic-explain" id="ccXiangX">—</p>
    </div>

    <div class="yao-section">
      <p class="classic-label" id="labelYaoSection">六爻爻辭</p>
      <div id="yaoContainer"></div>
    </div>
  </div>
</section>

<section id="advice">
  <div class="advice-wrap">
    <h2 class="advice-title serif" id="adviceTitle">此卦的提醒</h2>

    <div class="advice-row">
      <div class="seal-mark" id="sealLove">情</div>
      <div class="advice-body">
        <h3 id="loveTitle">感情</h3>
        <p id="adviceLove">—</p>
      </div>
    </div>

    <div class="advice-row">
      <div class="seal-mark" id="sealCareer">業</div>
      <div class="advice-body">
        <h3 id="careerTitle">事業</h3>
        <p id="adviceCareer">—</p>
      </div>
    </div>

    <div class="advice-row">
      <div class="seal-mark" id="sealWealth">財</div>
      <div class="advice-body">
        <h3 id="wealthTitle">財運</h3>
        <p id="adviceWealth">—</p>
      </div>
    </div>

    <div class="redo-wrap">
      <button class="redo-btn" id="redoBtn">再卜一卦</button>
    </div>
  </div>
</section>

<footer id="footerText">易理供參考，人生的決定終究在自己手中。</footer>

<div class="seg-popover" id="segPopover"></div>

<script>
/* ---------------- 資料：八卦 ---------------- */
// bottomToTop: 由下而上的三爻（1=陽爻, 0=陰爻）
const TRIGRAMS = {
  '乾': { glyph:'☰', dir:'西北', dirEn:'Northwest', nameEn:'Qián · Heaven',  bearing:315, bottomToTop:[1,1,1] },
  '兌': { glyph:'☱', dir:'西',   dirEn:'West',      nameEn:'Duì · Lake',     bearing:270, bottomToTop:[1,1,0] },
  '離': { glyph:'☲', dir:'南',   dirEn:'South',     nameEn:'Lí · Fire',      bearing:180, bottomToTop:[1,0,1] },
  '震': { glyph:'☳', dir:'東',   dirEn:'East',      nameEn:'Zhèn · Thunder', bearing:90,  bottomToTop:[1,0,0] },
  '巽': { glyph:'☴', dir:'東南', dirEn:'Southeast', nameEn:'Xùn · Wind',     bearing:135, bottomToTop:[0,1,1] },
  '坎': { glyph:'☵', dir:'北',   dirEn:'North',     nameEn:'Kǎn · Water',    bearing:0,   bottomToTop:[0,1,0] },
  '艮': { glyph:'☶', dir:'東北', dirEn:'Northeast', nameEn:'Gèn · Mountain', bearing:45,  bottomToTop:[0,0,1] },
  '坤': { glyph:'☷', dir:'西南', dirEn:'Southwest', nameEn:'Kūn · Earth',    bearing:225, bottomToTop:[0,0,0] }
};

/* ---------------- UI 文字對照 ---------------- */
const UI_STRINGS = {
  zh:{
    eyebrowTitle:'周易　六十四卦', heroTitle:'卜　卦', castLabel:'起卦',
    heroHintIdle:'靜心片刻，輕點圓圈，起一卦', heroHintCasting:'起卦中……',
    heroHintResult:(hex)=> '第 ' + hex.n + ' 卦・' + hex.s + '　　向下捲動，看卦義',
    roleUpper:'外卦', roleLower:'內卦', fortunePrefix:'卦運：',
    classicalTitle:'卦、彖、象原文', labelGuaCi:'卦辭', labelTuan:'彖曰', labelXiang:'象曰',
    labelYaoSection:'六爻爻辭', yaoToggle:'象曰', panelLabel:'小象',
    adviceTitle:'此卦的提醒', sealLove:'情', sealCareer:'業', sealWealth:'財',
    loveTitle:'感情', careerTitle:'事業', wealthTitle:'財運',
    redoBtn:'再卜一卦', footerText:'易理供參考，人生的決定終究在自己手中。',
    langToggle:'EN', hexIndexIdle:'第　卦'
  },
  en:{
    eyebrowTitle:'I CHING · THE 64 HEXAGRAMS', heroTitle:'Divination', castLabel:'Cast',
    heroHintIdle:'Take a breath, then tap the circle to cast a hexagram.', heroHintCasting:'Casting…',
    heroHintResult:(hex)=> 'Hexagram ' + hex.n + ' · ' + hex.en.title + '　　Scroll down for its meaning',
    roleUpper:'Upper Trigram', roleLower:'Lower Trigram', fortunePrefix:'Fortune: ',
    classicalTitle:'Judgment, Commentary & Image', labelGuaCi:'Judgment', labelTuan:'Commentary (Tuàn)', labelXiang:'Image (Xiàng)',
    labelYaoSection:'The Six Lines', yaoToggle:'Image', panelLabel:'Line Image',
    adviceTitle:'Guidance from This Hexagram', sealLove:'L', sealCareer:'C', sealWealth:'W',
    loveTitle:'Love', careerTitle:'Career', wealthTitle:'Wealth',
    redoBtn:'Cast Again', footerText:'This reading is offered for reflection — the choices in life remain yours to make.',
    langToggle:'中文', hexIndexIdle:'Hexagram'
  }
};
const FORTUNE_EN = {'大吉':'Great Fortune','小吉':'Good Fortune','平':'Neutral','小凶':'Unfavorable','大凶':'Highly Unfavorable'};

/* ---------------- 生難字詞小辭典 ---------------- */
const TERMS = {
  heng:'「亨」意為通達、順利。',
  li:'「利」意為有利、適宜。',
  zhen:'「貞」意為守正、堅守正道；占卜時也指所問之事。',

function segTermsHtml(termIds, note){
  let html = '';
  (termIds||[]).forEach(id=>{
    const t = TERMS[id];
    if (t) html += '<p class="term-line">' + t + '</p>';
  });
  if (note) html += '<p class="term-line">' + note + '</p>';
  return html;
}

/* ---------------- 原文／解釋 互動高亮引擎 ---------------- */
let segLockState = {}; // key: blockId+idx -> true if locked
let activePopoverBtn = null;

function clearAllHover(exceptBlock){
  document.querySelectorAll('.seg.hover-active').forEach(el=>{
    if (!el.classList.contains('locked')) el.classList.remove('hover-active');
  });
}

function setSegHighlight(blockId, idx, on, mode){
  // mode: 'hover' or 'locked'
  const els = document.querySelectorAll('[data-block="'+blockId+'"][data-idx="'+idx+'"]');
  els.forEach(el=>{
    if (mode === 'locked'){
      el.classList.toggle('locked', on);
    } else {
      if (on) el.classList.add('hover-active');
      else if (!el.classList.contains('locked')) el.classList.remove('hover-active');
    }
  });
}

function closeSegPopover(){
  const pop = document.getElementById('segPopover');
  pop.classList.remove('show');
  pop.innerHTML = '';
  activePopoverBtn = null;
}

function openSegPopover(badgeEl, html){
  const pop = document.getElementById('segPopover');
  pop.innerHTML = html;
  pop.classList.add('show');
  const r = badgeEl.getBoundingClientRect();
  const popW = Math.min(320, window.innerWidth * 0.84);
  let left = r.left + r.width/2 - popW/2;
  left = Math.max(10, Math.min(left, window.innerWidth - popW - 10));
  let top = r.bottom + 8;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  // if it would overflow bottom, place above badge instead
  requestAnimationFrame(()=>{
    const popRect = pop.getBoundingClientRect();
    if (popRect.bottom > window.innerHeight - 8){
      pop.style.top = (r.top - popRect.height - 8) + 'px';
    }
  });
}

document.addEventListener('click', (e)=>{
  const badge = e.target.closest('.seg-badge');
  if (badge){
    e.stopPropagation();
    if (activePopoverBtn === badge){
      closeSegPopover();
      return;
    }
    openSegPopover(badge, badge.dataset.gloss);
    activePopoverBtn = badge;
    return;
  }
  const seg = e.target.closest('.seg');
  if (seg){
    closeSegPopover();
    const blockId = seg.dataset.block, idx = seg.dataset.idx;
    const key = blockId + ':' + idx;
    const nowLocked = !segLockState[key];
    segLockState[key] = nowLocked;
    setSegHighlight(blockId, idx, nowLocked, 'locked');
    return;
  }
  // clicked outside any seg or badge
  closeSegPopover();
});

document.addEventListener('mouseover', (e)=>{
  const seg = e.target.closest('.seg');
  if (!seg) return;
  setSegHighlight(seg.dataset.block, seg.dataset.idx, true, 'hover');
});
document.addEventListener('mouseout', (e)=>{
  const seg = e.target.closest('.seg');
  if (!seg) return;
  const related = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('.seg') : null;
  if (related === seg) return;
  setSegHighlight(seg.dataset.block, seg.dataset.idx, false, 'hover');
});

let touchCurrentSeg = null;
document.addEventListener('touchmove', (e)=>{
  const t = e.touches[0];
  if (!t) return;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const seg = el ? el.closest('.seg') : null;
  if (seg === touchCurrentSeg) return;
  if (touchCurrentSeg){
    setSegHighlight(touchCurrentSeg.dataset.block, touchCurrentSeg.dataset.idx, false, 'hover');
  }
  if (seg){
    setSegHighlight(seg.dataset.block, seg.dataset.idx, true, 'hover');
  }
  touchCurrentSeg = seg;
}, {passive:true});
document.addEventListener('touchend', ()=>{
  if (touchCurrentSeg){
    setSegHighlight(touchCurrentSeg.dataset.block, touchCurrentSeg.dataset.idx, false, 'hover');
    touchCurrentSeg = null;
  }
});

function buildSegSpans(segArray, blockId, side){
  // side: 'o' (original) or 'e' (explanation)
  const frag = document.createDocumentFragment();
  segArray.forEach((seg, idx)=>{
    const span = document.createElement('span');
    span.className = 'seg';
    span.dataset.block = blockId;
    span.dataset.idx = idx;
    span.textContent = side === 'o' ? seg.o : seg.e;
    if (side === 'o' && (seg.terms || seg.note)){
      const badge = document.createElement('span');
      badge.className = 'seg-badge';
      badge.textContent = '!';
      badge.dataset.gloss = segTermsHtml(seg.terms, seg.note);
      span.appendChild(badge);
    }
    frag.appendChild(span);
  });
  return frag;
}

function renderSegBlock(origEl, explEl, segArray, blockId){
  origEl.innerHTML = '';
  explEl.innerHTML = '';
  if (!segArray || !segArray.length){
    origEl.textContent = '—';
    explEl.textContent = '—';
    return;
  }
  origEl.appendChild(buildSegSpans(segArray, blockId, 'o'));
  explEl.appendChild(buildSegSpans(segArray, blockId, 'e'));
}

  desc:"Earth's yielding strength: let receptivity and patient support — not force — carry you through.",
  guaCi:"Kūn: Sublime success. Fitting to be as constant as a mare. The noble one has somewhere to go; acting first leads astray, following leads to a guide. Fitting to find friends in the southwest, and to lose them in the northeast. Quiet perseverance brings good fortune.",
  guaCiX:"The earth's gentle constancy — those who rush ahead lose their way, but those who follow the natural order find their bearings; quiet, steady patience is what brings good fortune here.",
  tuan:"Perfect indeed is the origin of the Receptive, from which all things take their birth — it receives and obeys Heaven in turn. Earth is generous and carries all things, its virtue without limit. It holds all in its embrace, vast and bright, so every creature flourishes. The mare belongs to the earthly kind, moving across it without limit — gentle, devoted, and constant. When the noble one has somewhere to go, going first leads him astray, but following he finds the proper course. In the southwest he finds friends and travels with his kind; in the northeast he loses friends but in the end finds cause for joy. The good fortune of quiet perseverance answers to the boundlessness of the earth.",
  tuanX:"All things owe their birth to earth's boundless devotion; going first leads astray, but following the natural order and staying humbly constant brings its own reward.",
  xiang:"The earth's condition is the Receptive. Thus the noble one carries the outer world with generous virtue.",
  xiangX:"As the earth supports and holds up everything upon it, a person of character bears others with deep and generous character.",
  yao:[
   ["1st (Six)","Treading on frost, the solid ice will come.","A small early sign points to a much larger change ahead — heed it.","Treading on frost — the yin is just beginning to harden; followed to its course, it becomes solid ice.","Small beginnings, left unchecked, grow into something much greater."],
   ["2nd (Six)","Straight, square, and great. Without effort, nothing fails to be favorable.","Uprightness and fairness, applied naturally, bring success without strain.","The movement of the second line is straight and square: without effort nothing fails, for the way of earth is bright.","Acting with honest simplicity, like the clear and generous way of the earth."],
   ["3rd (Six)","Hidden ability, one may remain constant. If in the service of a king, seek no achievement but bring things to completion.","Hold talent quietly, work loyally, let results speak without claiming credit.","Hidden ability, one may remain constant: let it show at the right time. If in the service of a king, wisdom is broad and great.","True judgment shows itself only when the timing is right."],
   ["4th (Six)","A tied sack — no blame, no praise.","Discretion and restraint keep you safe, even without recognition.","A tied sack, no blame: cautious, one avoids harm.","Careful restraint is what prevents trouble."],
   ["5th (Six)","A yellow lower garment. Sublime good fortune.","Modest, balanced conduct — like the harmonious color yellow — brings great fortune.","Yellow lower garment, sublime good fortune: refined character lies within.","Inner cultivation and grace are the true source of this fortune."],
   ["Top (Six)","Dragons battle in the wilderness. Their blood is black and yellow.","Extreme conflict of opposing forces signals things pushed to their limit.","Dragons battling in the wilderness: their way has reached its limit.","Extreme yielding, pushed too far, brings this conflict about."],
  ],
  a:"Lead with gentleness and patience in love; yielding a little now can bring a relationship to fruition.",b:"Favor supporting roles and teamwork; build your position steadily rather than chasing the spotlight.",c:"Finances are stable — save steadily and avoid speculation."}
},
{n:3,s:"屯",f:"水雷屯",u:"坎",l:"震",k:"初生艱難",fortune:"小吉",
 desc:"初生艱難，指目前正處草創階段，雖多波折，只要穩固根基終能亨通。",
 guaCi:"屯：元亨，利貞。勿用有攸往，利建侯。",
 guaCiX:"屯卦象徵萬物初生時的艱難：雖具備亨通、正固的條件，但此時不宜貿然前進，反而適合建立輔佐、穩固根基。",
 tuan:"屯，剛柔始交而難生，動乎險中，大亨貞。雷雨之動滿盈，天造草昧，宜建侯而不寧。",
 tuanX:"陰陽剛柔初次交會，萬物萌生本就艱難，在險境中行動，唯有守正才能亨通；如同天地初開、萬象混沌未明，此時最需要建立根基以求安定。",
 xiang:"雲雷，屯；君子以經綸。",
 xiangX:"雲層密布、雷聲滾動，象徵萬物草創初生，君子觀此應著手規劃、致力於治理天下大事。",
 guaCiSeg:[{o:"屯：元亨，",e:"屯卦象徵萬物初生時的艱難：大為亨通，",terms:["yuanheng"]},{o:"利貞。",e:"有利且應堅守正道。",terms:["li","zhen"]},{o:"勿用有攸往，",e:"此時不宜貿然前進，"},{o:"利建侯。",e:"反而適合建立輔佐、穩固根基。",terms:["li"]}],
 tuanSeg:[{o:"屯，剛柔始交而難生，",e:"屯卦是陰陽剛柔初次交會、萬物萌生本就艱難的階段，"},{o:"動乎險中，大亨貞。",e:"在險境中行動，唯有大為亨通、堅守正道才能度過。",terms:["heng","zhen"]},{o:"雷雨之動滿盈，天造草昧，宜建侯而不寧。",e:"雷雨交加、充盈天地，正如天地初開、萬象混沌未明，此時最需要建立根基，難以安寧。"}],
 xiangSeg:[{o:"雲雷，屯；",e:"雲層密布、雷聲滾動，象徵萬物草創初生；"},{o:"君子以經綸。",e:"君子觀此應著手規劃、致力於治理天下大事。",terms:["jun_zi"]}],
 yao:[
 ["初九","磐桓，利居貞，利建侯。","徘徊不進，宜安守正道、建立根基輔佐。","雖磐桓，志行正也；以貴下賤，大得民也。","雖然徘徊，志向仍正；謙下待人可得民心。"],
 ["六二","屯如邅如，乘馬班如，匪寇婚媾。女子貞不字，十年乃字。","處境艱難、猶豫不前，需長時間等待才能修成正果。","六二之難，乘剛也；十年乃字，反常也。","艱難是因乘於剛強之上；久候方成，實屬反常之例。"],
 ["六三","即鹿无虞，惟入于林中。君子幾不如舍，往吝。","貿然行動卻無人引導，不如及早放棄，勉強前行將有困難。","即鹿无虞，以從禽也；君子舍之，往吝窮也。","盲目追逐獵物，君子應懂得捨棄，執意前往將陷困境。"],
 ["六四","乘馬班如，求婚媾，往吉，无不利。","猶豫之後主動求助、尋求合作，前往可獲吉祥。","求而往，明也。","主動求助而後前行，是明智之舉。"],
 ["九五","屯其膏，小貞吉，大貞凶。","恩澤尚未廣施，小心謹慎則吉，操之過急反而凶險。","屯其膏，施未光也。","恩澤尚未能廣泛施展。"],
 ["上六","乘馬班如，泣血漣如。","徘徊不前、悲傷落淚，象徵艱難至極、走投無路。","泣血漣如，何可長也。","如此悲苦的處境，難以長久維持。"],
 ],
 a:"感情剛起步容易有波折，需要耐心經營，不宜躁進。",b:"新工作或創業初期較為辛苦，撐過草創期會漸入佳境。",c:"財運起步不易，宜謹慎規劃，避免貿然投入大筆資金。",
 en:{name:"Zhūn",title:"Difficulty at the Beginning",keyword:"Struggle of New Growth",
  desc:"A hard start: things are new and unsettled, but steady effort now lays the groundwork for later ease.",
  guaCi:"Zhūn: Sublime success, fitting to persevere. Do not act rashly — favorable to appoint helpers.",
  guaCiX:"Growth is hard at first; rather than pushing forward alone, build support and let the foundation set.",
  tuan:"In Zhūn, hard and soft first meet and difficulty is born; movement occurs within danger, yet greatly does it lead to success through perseverance. The stirring of thunder and rain fills all with abundance; heaven creates in wild confusion — it is fitting to appoint helpers, though one should not yet feel secure.",
  tuanX:"Difficulty at the start is only natural when opposing forces first meet — moving carefully through danger while gathering trustworthy support will bring things through.",
  xiang:"Clouds and thunder: this is the image of Zhūn. Thus the noble one sets things in order.",
  xiangX:"Amid the clouds and thunder of a new beginning, a person of character organizes and plans ahead.",
  yao:[
   ["1st (Nine)","Hesitating and circling. Fitting to remain and persevere; fitting to appoint helpers.","Progress is halting at the very start — stay grounded and build alliances.","Though hesitating, the will remains true; the noble stoops to the lowly and wins the people.","Humility toward others, even from a position of worth, wins real support."],
   ["2nd (Six)","Difficulty piling on difficulty, horses and chariot turning back. Not bandits, but a suitor. The woman stays true and does not pledge herself — ten years, then she does.","A long, frustrating wait is required before the right union can form.","The hardship of the second line comes from riding upon strength; ten years to pledge is a return to the ordinary course.","Such a long delay, though unusual, eventually restores the natural order."],
   ["3rd (Six)","Chasing deer without a guide, only entering deeper into the forest. The noble one, sensing this, had better let go; going on brings regret.","Acting without proper guidance leads nowhere — better to withdraw than press on blindly.","Chasing deer without a guide is simply following the game; the noble one lets go, for going on leads to difficulty and an end.","Better judgment means knowing when to stop pursuing."],
   ["4th (Six)","Horses and chariot turning back, seeking a match; going brings good fortune, nothing unfavorable.","Reaching out for help and moving forward now brings good fortune.","To seek and then go forward shows clear understanding.","Actively seeking support before acting is the wise course."],
   ["5th (Nine)","Difficulty in bestowing riches. Small perseverance is fortunate, great perseverance is unfortunate.","Generosity is not yet possible on a large scale — act modestly, not boldly.","Difficulty in bestowing riches: its generosity has not yet come to light.","The capacity to give generously has not yet fully matured."],
   ["Top (Six)","Horses and chariot turning back, weeping tears of blood, flowing on and on.","Difficulty reaches its extreme — a moment of deep sorrow and helplessness.","Weeping tears of blood, flowing on: how can such a state long continue?","Such extreme distress cannot be sustained for long."],
  ],
  a:"A new relationship may feel bumpy at first; be patient and don't force the pace.",b:"A new job or venture is tough at the start — push through the founding phase and it eases.",c:"Money is tight in early stages — plan carefully and avoid large commitments."}
},
{n:4,s:"蒙",f:"山水蒙",u:"艮",l:"坎",k:"蒙昧待啟",fortune:"小吉",
 desc:"蒙昧待啟，指當前認知尚有不足，宜虛心求教、按部就班，方能撥雲見日。",
 guaCi:"蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。",
 guaCiX:"蒙卦象徵蒙昧待啟：不是老師去求學生，而是學生誠心求教於老師；初次誠心請教便如實告知，若一再輕慢褻瀆地詢問，便不再回答；持守正道方為有利。",
 tuan:"蒙，山下有險，險而止，蒙。蒙亨，以亨行時中也。匪我求童蒙，童蒙求我，志應也。初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。蒙以養正，聖功也。",
 tuanX:"山下有險阻，遇險而止步不前，這便是蒙昧的景象；蒙昧之所以能亨通，是因為掌握時機、恰如其分地引導；教育蒙昧、培養其端正的品德，是極為崇高的功業。",
 xiang:"山下出泉，蒙；君子以果行育德。",
 xiangX:"泉水從山下湧出，象徵蒙昧初開，君子觀此應果斷篤行，並藉此涵養自身的品德。",
 guaCiSeg:[{o:"蒙：亨。",e:"蒙卦象徵蒙昧待啟：亨通。",terms:["heng"]},{o:"匪我求童蒙，童蒙求我。",e:"不是老師去求學生，而是學生誠心求教於老師。",terms:["fei"]},{o:"初筮告，",e:"初次誠心請教便如實告知，"},{o:"再三瀆，瀆則不告。",e:"若一再輕慢褻瀆地詢問，便不再回答。"},{o:"利貞。",e:"持守正道方為有利。",terms:["li","zhen"]}],
 tuanSeg:[{o:"蒙，山下有險，險而止，蒙。",e:"山下有險阻，遇險而止步不前，這便是蒙昧的景象。"},{o:"蒙亨，以亨行時中也。",e:"蒙昧之所以能亨通，是因為掌握時機、恰如其分地引導。",terms:["heng"]},{o:"匪我求童蒙，童蒙求我，志應也。",e:"不是老師求學生而是學生求老師，正顯示彼此心志相應。",terms:["fei"]},{o:"初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。",e:"初問即告，是因居中剛正；一再輕慢詢問便不再回答，是因這已是褻瀆蒙昧之道。"},{o:"蒙以養正，聖功也。",e:"教育蒙昧、培養其端正的品德，是極為崇高的功業。"}],
 xiangSeg:[{o:"山下出泉，蒙；",e:"泉水從山下湧出，象徵蒙昧初開；"},{o:"君子以果行育德。",e:"君子觀此應果斷篤行，並藉此涵養自身的品德。",terms:["jun_zi"]}],
 yao:[
 ["初六","發蒙，利用刑人，用說桎梏，以往吝。","啟發蒙昧宜用規範導正，但過度嚴苛也將帶來困難。","利用刑人，以正法也。","用規範端正行為，是為了導正法度。"],
 ["九二","包蒙，吉；納婦，吉；子克家。","包容蒙昧者、廣納賢良，如子能持家，吉祥可期。","子克家，剛柔接也。","子能持家，是剛柔相濟配合得宜。"],
 ["六三","勿用取女，見金夫，不有躬，无攸利。","見利忘義、失去自持，不宜娶這樣的對象，無所得益。","勿用取女，行不順也。","行為不合乎正道，故不宜。"],
 ["六四","困蒙，吝。","深陷蒙昧而無人引導，處境艱難。","困蒙之吝，獨遠實也。","遠離良師益友，故陷入困境。"],
 ["六五","童蒙，吉。","如孩童般虛心受教，吉祥。","童蒙之吉，順以巽也。","順從而又謙遜受教，故能得吉。"],
 ["上九","擊蒙，不利為寇，利禦寇。","以嚴厲手段啟發蒙昧，宜用於防禦而非主動侵犯。","利用禦寇，上下順也。","用以防禦外侮，上下才能相安順從。"],
 ],
 a:"對感情狀況認識還不清楚，宜多溝通、聽取旁人建議。",b:"適合進修學習、尋求良師指點，不宜自作主張。",c:"財務知識尚有不足，宜請教專業人士後再做決定。",
 en:{name:"Méng",title:"Youthful Folly",keyword:"Learning Through Guidance",
  desc:"Inexperience needing instruction: approach a mentor with sincerity, and step by step clarity will come.",
  guaCi:"Méng: Success. It is not I who seek the young fool; the young fool seeks me. At the first question I inform him; if he asks a second and third time, that is disrespect, and I do not inform him further. Fitting to persevere.",
  guaCiX:"Understanding grows when guidance is sought sincerely; over-asking without real effort or respect isn't worth answering — patient, principled learning wins through.",
  tuan:"Méng: below the mountain lies danger; encountering danger, one stops still — this is Méng. Méng's success comes from acting at the right, balanced moment. Not the teacher seeking the young fool but the fool seeking the teacher shows their wills in accord. Informing at the first question comes from firm centeredness; asking again and again is disrespect, and such disrespect is not answered. Nurturing simplicity into rightness is a sacred task.",
  tuanX:"Facing danger, one wisely pauses rather than rushing forward; teaching only sincere seekers, and cultivating their character patiently, is a noble and vital work.",
  xiang:"A spring emerges from beneath the mountain: this is the image of Méng. Thus the noble one acts with resolve and nurtures virtue.",
  xiangX:"As a spring rises fresh from the mountainside, a person of character acts decisively while cultivating their own character.",
  yao:[
   ["1st (Six)","Shackling the fool: fitting to use restraint, then release the fetters; to go on this way brings regret.","Discipline should guide and free, not punish forever — excessive harshness backfires.","Fitting to use restraint: it is to establish proper order.","The point of correction is to set things on the right course."],
   ["2nd (Nine)","Embracing the fool brings good fortune; taking a wife brings good fortune; the son manages the household.","Patient tolerance of inexperience, paired with sound judgment, leads to success.","The son manages the household: hard and soft meet in harmony.","Strength and gentleness working together achieve this success."],
   ["3rd (Six)","Do not take this woman — she sees only wealth and loses herself. Nothing favorable.","Superficial or self-serving motives make this an unwise match.","Do not take this woman: her conduct does not follow what is right.","Such conduct departs from the proper way."],
   ["4th (Six)","Bound in folly. Regret.","Isolated from any wise guidance, one is stuck in confusion.","The regret of being bound in folly comes from being far from what is real.","Distance from sound guidance and substance is the cause of this trouble."],
   ["5th (Six)","Childlike folly. Good fortune.","Approaching learning with a humble, open, childlike heart brings good fortune.","The good fortune of childlike folly comes from gentle, yielding obedience.","A gentle and receptive attitude is what makes this fortunate."],
   ["Top (Nine)","Striking the fool. Not favorable to become a bandit; favorable to ward off bandits.","Firm correction should be used to defend, not to attack.","Favorable to ward off bandits: above and below are then in harmony.","Using firmness to protect brings harmony to all involved."],
  ],
  a:"You may not fully understand where things stand emotionally — talk it through and take advice.",b:"A good time for study or mentorship — seek guidance rather than acting alone.",c:"Your financial knowledge has gaps — consult a professional before deciding."}
},
{n:5,s:"需",f:"水天需",u:"坎",l:"乾",k:"等待時機",fortune:"大吉",
 desc:"等待時機，指當前條件已具備，只需耐心等候，時機一到自然水到渠成。",
 guaCi:"需：有孚，光亨，貞吉。利涉大川。",
 guaCiX:"需卦象徵等待時機：心懷誠信、光明亨通，堅守正道便能吉祥，有利於渡過艱險、成就大事。",
 tuan:"需，須也，險在前也。剛健而不陷，其義不困窮矣。需有孚，光亨貞吉，位乎天位，以正中也。利涉大川，往有功也。",
 tuanX:"需就是等待，前方雖有險阻，但只要剛健而不冒進陷入危境，就不會走入困境；心懷誠信、居於正位，前行終能有所成就。",
 xiang:"雲上於天，需；君子以飲食宴樂。",
 xiangX:"雲氣聚集在天上、尚未化為雨水，象徵等待的時機，君子觀此應安於當下、從容自處，蓄養身心以待時機成熟。",
 guaCiSeg:[{o:"需：有孚，",e:"需卦象徵等待時機：心懷誠信，",terms:["youfu"]},{o:"光亨，",e:"光明亨通，",terms:["heng"]},{o:"貞吉。",e:"堅守正道便能吉祥。",terms:["zhen","ji"]},{o:"利涉大川。",e:"有利於渡過艱險、成就大事。",terms:["li","she_da_chuan"]}],
 tuanSeg:[{o:"需，須也，險在前也。",e:"需就是等待，前方雖有險阻。"},{o:"剛健而不陷，其義不困窮矣。",e:"只要剛健而不冒進陷入危境，就不會走入困境。"},{o:"需有孚，光亨貞吉，位乎天位，以正中也。",e:"心懷誠信、光明亨通、堅守正道而吉，是因居於天位、秉持中正。",terms:["youfu","zhen","ji"]},{o:"利涉大川，往有功也。",e:"有利於渡險成就大事，是因前行終能有所成就。",terms:["li"]}],
 xiangSeg:[{o:"雲上於天，需；",e:"雲氣聚集在天上、尚未化為雨水，象徵等待的時機；"},{o:"君子以飲食宴樂。",e:"君子觀此應安於當下、從容自處，蓄養身心以待時機成熟。",terms:["jun_zi"]}],
 yao:[
 ["初九","需于郊，利用恆，无咎。","在郊外安心等待，保持恆心便無災咎。","需于郊，不犯難行也；利用恆无咎，未失常也。","在遠處等待不冒然涉險，保持常態便無過失。"],
 ["九二","需于沙，小有言，終吉。","靠近沙地等待，雖有些許閒言閒語，最終仍吉祥。","需于沙，衍在中也；雖小有言，以吉終也。","身處寬緩之中，雖有小言語終將平息，以吉收場。"],
 ["九三","需于泥，致寇至。","逼近險境等待，容易招致外來的侵擾。","需于泥，災在外也；自我致寇，敬慎不敗也。","禍患來自外部，唯有謹慎警惕才不致失敗。"],
 ["六四","需于血，出自穴。","身陷險境等待，宜設法脫離險穴、自我保全。","需于血，順以聽也。","順應形勢、靜聽時機而行。"],
 ["九五","需于酒食，貞吉。","從容安享、堅守正道，吉祥。","酒食貞吉，以中正也。","秉持中正之道，故能安享吉祥。"],
 ["上六","入于穴，有不速之客三人來，敬之終吉。","雖處險境，卻有意外的助力到來，恭敬對待終能吉祥。","不速之客來，敬之終吉；雖不當位，未大失也。","雖處境不甚理想，但以誠敬相待，終不致有大失。"],
 ],
 a:"感情急不得，耐心等待對的時機自然水到渠成。",b:"時機尚未成熟，宜靜觀其變、充實自己再出手。",c:"財運需要耐心累積，不宜躁進，先儲備資源伺機而動。",
 en:{name:"Xū",title:"Waiting",keyword:"Patient Confidence",
  desc:"Rain gathers above heaven: what's needed is already forming — hold steady and let the moment ripen.",
  guaCi:"Xū: With sincerity, brilliant success. Perseverance brings good fortune. Fitting to cross the great water.",
  guaCiX:"Genuine sincerity and steady patience make this a time of quiet confidence, favorable even for bold undertakings.",
  tuan:"Xū means to wait; danger lies ahead. Being strong and firm, one does not fall into it, and so its meaning is not one of being trapped. Waiting with sincerity brings brilliant success and, through perseverance, good fortune, for one occupies heaven's own rightful, central place. Crossing the great water brings achievement by going forward.",
  tuanX:"Facing danger ahead, strength that does not rush blindly avoids being caught by it; holding to sincerity and a balanced position is what carries one through successfully.",
  xiang:"Clouds rise above heaven: this is Xū. Thus the noble one eats, drinks, and takes his ease.",
  xiangX:"As clouds gather in the sky before the rain falls, a person of character rests and nourishes themselves while waiting for the right moment.",
  yao:[
   ["1st (Nine)","Waiting in the meadow. Favorable to remain constant. No blame.","Waiting far from danger, with patience, keeps one entirely safe.","Waiting in the meadow: one does not act rashly amid danger.","Staying at a safe distance is the sensible course here."],
   ["2nd (Nine)","Waiting on the sand. Some gossip, but in the end good fortune.","Minor criticism along the way will pass, ending in good fortune.","Waiting on the sand: at ease within, though there is some talk, it ends well.","An inner sense of calm sees this through despite the chatter."],
   ["3rd (Nine)","Waiting in the mud. This invites attackers.","Drawing too near to danger risks bringing trouble upon oneself.","Waiting in the mud: disaster lies just outside; bringing attackers upon oneself, only caution and care prevent defeat.","Awareness and prudence are what prevent real harm here."],
   ["4th (Six)","Waiting in blood. Escape from the pit.","Caught in real danger, the only wise course is to find a way out.","Waiting in blood: it is to listen and comply with the moment.","Yielding to the situation as it develops is the wise response."],
   ["5th (Nine)","Waiting with food and drink. Perseverance brings good fortune.","Ease and abundance while remaining true to one's course bring good fortune.","Good fortune of food and drink through perseverance comes from a balanced, upright position.","Holding a centered, correct position is the source of this ease."],
   ["Top (Six)","Entering the pit. Three uninvited guests arrive; treat them with respect, and in the end there is good fortune.","Even in a difficult spot, unexpected help arrives — welcome it graciously.","Uninvited guests arrive; treating them with respect brings good fortune in the end, for though not perfectly placed, nothing great is lost.","Sincerity in a less-than-ideal position still prevents any serious loss."],
  ],
  a:"Don't rush love — patience now lets the right moment arrive naturally.",b:"The timing isn't ripe yet; build your skills quietly and wait for the right opening.",c:"Wealth builds slowly — be patient, keep resources in reserve, and act when ready."}
},
{n:6,s:"訟",f:"天水訟",u:"乾",l:"坎",k:"爭訟不休",fortune:"大凶",
 desc:"爭訟不休，指眼前糾紛四起，宜以和為貴、適可而止，切勿纏訟到底。",
 guaCi:"訟：有孚，窒惕，中吉，終凶。利見大人，不利涉大川。",
 guaCiX:"訟卦象徵爭訟：雖然理直但受到阻塞而心生警惕，適可而止則吉，若堅持爭訟到底則凶；宜求助於賢明之人，不宜涉險行事。",
 tuan:"訟，上剛下險，險而健，訟。訟有孚窒惕中吉，剛來而得中也。終凶，訟不可成也。利見大人，尚中正也。不利涉大川，入于淵也。",
 tuanX:"上剛下險、遇險而又剛強好爭，因而形成爭訟；適可而止便能得吉，堅持爭訟到底終將招致凶險，因此爭訟不宜久持，應崇尚公正中道。",
 xiang:"天與水違行，訟；君子以作事謀始。",
 xiangX:"天向上運行、水向下流動，兩者方向相違，象徵爭端由此而生，君子觀此應在做事之初便謀劃周詳，以避免日後的糾紛。",
 guaCiSeg:[{o:"訟：有孚，窒惕，",e:"訟卦象徵爭訟：雖然理直但受到阻塞而心生警惕，",terms:["youfu"]},{o:"中吉，",e:"適可而止則吉，",terms:["ji"]},{o:"終凶。",e:"若堅持爭訟到底則凶。",terms:["xiong"]},{o:"利見大人，",e:"宜求助於賢明之人，",terms:["li","da_ren"]},{o:"不利涉大川。",e:"不宜涉險行事。",terms:["li","she_da_chuan"]}],
 tuanSeg:[{o:"訟，上剛下險，險而健，訟。",e:"上剛下險、遇險而又剛強好爭，因而形成爭訟。"},{o:"訟有孚窒惕中吉，剛來而得中也。",e:"爭訟雖理直卻受阻而心生警惕，適可而止便能得吉，是因剛強者能居中而行。",terms:["youfu","ji"]},{o:"終凶，訟不可成也。",e:"堅持爭訟到底終將招致凶險，因此爭訟不宜久持。",terms:["xiong"]},{o:"利見大人，尚中正也。",e:"宜求見賢明之人，是崇尚公正中道。",terms:["li","da_ren","zhong_zheng"]},{o:"不利涉大川，入于淵也。",e:"不宜涉險行事，否則將陷入深淵之中。",terms:["li"]}],
 xiangSeg:[{o:"天與水違行，訟；",e:"天向上運行、水向下流動，兩者方向相違，象徵爭端由此而生；"},{o:"君子以作事謀始。",e:"君子觀此應在做事之初便謀劃周詳，以避免日後的糾紛。",terms:["jun_zi"]}],
 yao:[
 ["初六","不永所事，小有言，終吉。","不將爭訟拖延過久，雖有些許口舌，最終仍吉。","不永所事，訟不可長也；雖小有言，其辯明也。","爭訟不宜久持，雖有小爭辯終能辯明是非。"],
 ["九二","不克訟，歸而逋，其邑人三百戶，无眚。","爭訟不利，宜退守自保，可保無災。","不克訟，歸逋竄也；自下訟上，患至掇也。","爭訟不勝而退避，以下犯上終將自取禍患。"],
 ["六三","食舊德，貞厲，終吉；或從王事，无成。","安享舊有的根基、堅守正道雖有危險，終能吉祥。","食舊德，從上吉也。","依循既有根基、順從上位，可獲吉祥。"],
 ["九四","不克訟，復即命，渝，安貞吉。","爭訟不利，改變心意、安分守正，便能吉祥。","復即命渝，安貞不失也。","回歸本分、改變態度，安守正道便不致有失。"],
 ["九五","訟，元吉。","以中正之道處理爭訟，大為吉祥。","訟元吉，以中正也。","秉持中正之道處理爭端，故能大吉。"],
 ["上九","或錫之鞶帶，終朝三褫之。","即使因爭訟獲得獎賞，也可能反覆被剝奪，得不償失。","以訟受服，亦不足敬也。","靠爭訟得來的榮譽，並不值得尊敬。"],
 ],
 a:"感情中容易有爭執與誤會，宜以溝通化解，避免硬碰硬。",b:"職場上易生糾紛口舌，凡事以和為貴，避免興訟。",c:"財務糾紛風險較高，簽約合作務必謹慎，避免對簿公堂。",
 en:{name:"Sòng",title:"Conflict",keyword:"Dispute and Contention",
  desc:"Two forces pulling apart: quarrels are rising — seek resolution early, since pressing a dispute to the end brings only harm.",
  guaCi:"Sòng: Sincerity is obstructed. Caution brings good fortune in the middle course; to carry it to the end brings misfortune. Favorable to see a great man; not favorable to cross the great water.",
  guaCiX:"Stopping a dispute partway, with caution, brings good outcomes; pressing it all the way through leads to misfortune — seek a wise mediator rather than risk everything.",
  tuan:"In Sòng, strength above and danger below; danger paired with strength makes conflict. Sincerity obstructed, caution brings good fortune in the middle course, for the firm comes and gains the center. To carry it to the end brings misfortune, for a conflict should not be carried to completion. Favorable to see a great man, for one values what is centered and correct. Not favorable to cross the great water, for one would sink into the depths.",
  tuanX:"Where danger meets unyielding strength, conflict naturally arises; stopping midway with balance and restraint is wise, while pushing the dispute to its conclusion only leads to ruin.",
  xiang:"Heaven and water move in opposing directions: this is Sòng. Thus the noble one, in undertaking any affair, plans carefully from the start.",
  xiangX:"As heaven moves upward while water flows down, opposing courses give rise to conflict; a person of character therefore plans thoroughly from the outset to avoid future disputes.",
  yao:[
   ["1st (Six)","Does not prolong the matter. Some gossip, but in the end good fortune.","Letting a small dispute go quickly, rather than dragging it out, ends well.","Not prolonging the matter: conflict should not be drawn out; though there is talk, the truth becomes clear.","Truth comes to light when a dispute is not needlessly extended."],
   ["2nd (Nine)","Cannot win the dispute. Returning home and fleeing, his town of three hundred households escapes disaster.","Retreat from a fight one cannot win, and the wider community stays safe.","Cannot win the dispute: returning to flee and hide; bringing conflict against a superior invites trouble upon oneself.","Challenging someone in a stronger position only invites further trouble."],
   ["3rd (Six)","Living off old virtue. Perseverance is precarious, but ends well; if following a king's service, claim no achievement.","Relying on past merit, with care, avoids danger — serve loyally without seeking credit.","Living off old virtue brings good fortune when one follows those above.","Deference to rightful authority is what brings the good result."],
   ["4th (Nine)","Cannot win the dispute. Returns and submits to what is right, changes course; content and constant, good fortune.","Abandoning a losing fight and correcting one's course brings peace.","Returning to submit and changing course: settling into constancy loses nothing.","Nothing is lost by yielding and finding a settled, correct path."],
   ["5th (Nine)","Contending. Sublime good fortune.","Settling the dispute with perfect fairness brings the greatest good fortune.","Sublime good fortune in the dispute comes from balance and uprightness.","Fairness and a centered, correct approach bring this excellent result."],
   ["Top (Nine)","Perhaps given a ceremonial sash, but stripped of it three times before the morning ends.","Gains won through conflict prove unstable and are soon taken back.","Receiving honor through conflict — this is not worth true respect.","Honor gained through contention is not honor worth having."],
  ],
  a:"Disputes and misunderstandings are likely — talk things through rather than confronting head-on.",b:"Workplace friction is likely; keep the peace and avoid escalating any dispute.",c:"Real risk of financial disputes — be extremely careful with contracts and partnerships."}
},
{n:7,s:"師",f:"地水師",u:"坤",l:"坎",k:"紀律為先",fortune:"小吉",
 desc:"紀律為先，指目前需要嚴明紀律、統率有方，方能化險為夷、成就大局。",
 guaCi:"師：貞，丈人吉，无咎。",
 guaCiX:"師卦象徵用兵統眾：堅守正道，並由德高望重之人統率，才能吉祥而沒有災咎。",
 tuan:"師，眾也；貞，正也。能以眾正，可以王矣。剛中而應，行險而順，以此毒天下，而民從之，吉又何咎矣。",
 tuanX:"師就是眾人，貞就是正道；能以正道統領眾人，便足以成就王業。剛強適中且能因應局勢，行於險境卻仍能順應人心，如此治理天下，百姓自然歸附，吉祥又哪來災咎？",
 xiang:"地中有水，師；君子以容民畜眾。",
 xiangX:"大地之中蘊藏著水，象徵軍旅之象，君子觀此應寬容百姓、蓄養民眾，如同大地涵養水源一般。",
 guaCiSeg:[{o:"師：貞，",e:"師卦象徵用兵統眾：堅守正道，",terms:["zhen"]},{o:"丈人吉，",e:"並由德高望重之人統率，才能吉祥，",terms:["ji"]},{o:"无咎。",e:"沒有災咎。",terms:["wujiu"]}],
 tuanSeg:[{o:"師，眾也；貞，正也。",e:"師就是眾人，貞就是正道。",terms:["zhen"]},{o:"能以眾正，可以王矣。",e:"能以正道統領眾人，便足以成就王業。"},{o:"剛中而應，行險而順，",e:"剛強適中且能因應局勢，行於險境卻仍能順應人心，"},{o:"以此毒天下，而民從之，吉又何咎矣。",e:"如此治理天下，百姓自然歸附，吉祥又哪來災咎？",terms:["ji","jiu"]}],
 xiangSeg:[{o:"地中有水，師；",e:"大地之中蘊藏著水，象徵軍旅之象；"},{o:"君子以容民畜眾。",e:"君子觀此應寬容百姓、蓄養民眾，如同大地涵養水源一般。",terms:["jun_zi"]}],
 yao:[
 ["初六","師出以律，否臧凶。","出兵行事須有紀律，若無章法必有凶險。","師出以律，失律凶也。","失去紀律法度，必然招致凶險。"],
 ["九二","在師中，吉，无咎；王三錫命。","統率得宜、居中而正，吉祥且屢受重用。","在師中吉，承天寵也；王三錫命，懷萬邦也。","得天之寵愛信任，屢獲重任以安撫天下。"],
 ["六三","師或輿尸，凶。","用兵不當、指揮混亂，恐招致慘敗凶險。","師或輿尸，大无功也。","如此用兵毫無功效可言。"],
 ["六四","師左次，无咎。","知難而退、暫時駐守，並無災咎。","左次无咎，未失常也。","暫時退守合乎常理，並無過失。"],
 ["六五","田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。","應由德才兼備者統帥，若任用不當則有凶險。","長子帥師，以中行也；弟子輿尸，使不當也。","委任得宜、行事中正則吉；用人不當則招致失敗。"],
 ["上六","大君有命，開國承家，小人勿用。","論功行賞、建立基業之時，切忌任用心術不正之人。","大君有命，以正功也；小人勿用，必亂邦也。","論功行賞以端正功績；任用小人必致邦國混亂。"],
 ],
 a:"感情需要有原則與分寸，過度縱容反而不利於關係長久。",b:"適合團隊作戰，講求紀律與領導，宜事必躬親。",c:"財運與團體合作有關，宜有計畫、有紀律地理財。",
 en:{name:"Shī",title:"The Army",keyword:"Discipline in Leadership",
  desc:"Leading with order: success now depends on discipline and a capable leader guiding the collective effort.",
  guaCi:"Shī: Perseverance. A mature and experienced man brings good fortune. No blame.",
  guaCiX:"Effective leadership of many requires a seasoned, principled leader and unwavering discipline to succeed without fault.",
  tuan:"Shī means the multitude; perseverance means correctness. One who can lead the multitude correctly may achieve kingship. Strength centered and responded to, acting through danger yet in accord — to lead the world this way, the people follow; good fortune, and what blame could there be?",
  tuanX:"Guiding many people demands both firm capability and rightness of purpose; acting through hardship while carrying the people's trust is how true leadership succeeds.",
  xiang:"In the midst of the earth there is water: this is Shī. Thus the noble one, with generosity, sustains the people and gathers the multitude.",
  xiangX:"As water is held within the earth, a person of character nurtures and gathers the people with a generous spirit.",
  yao:[
   ["1st (Six)","The army sets out by discipline. Without it, misfortune.","Order and discipline are the foundation — without them, failure follows.","The army sets out by discipline: losing discipline brings misfortune.","Loss of order and rules is what brings about failure."],
   ["2nd (Nine)","In the midst of the army, centered. Good fortune, no blame. The king bestows honors three times.","Balanced, capable leadership earns trust and repeated recognition.","Good fortune in the midst of the army comes from receiving heaven's favor; the king's threefold honor shows care for all the states.","Trusted leadership, repeatedly honored, brings stability to the whole realm."],
   ["3rd (Six)","The army may carry corpses in its wagons. Misfortune.","Poor command leads to defeat and heavy loss.","Carrying corpses in the wagons: great is the lack of achievement.","Such an outcome shows a serious failure of leadership."],
   ["4th (Six)","The army camps and withdraws. No blame.","A prudent retreat, rather than reckless advance, is no fault.","Camping and withdrawing brings no blame, for the ordinary course is not lost.","Sound judgment in withdrawing keeps things on the right track."],
   ["5th (Six)","Game in the field: favorable to catch it and speak of it, no blame. Let the eldest son lead the army; if the younger sons carry corpses, perseverance brings misfortune.","Entrust command to one who is truly capable, or failure follows.","Let the eldest son lead the army by acting with balance; if the younger sons carry corpses, the assignment was not fitting.","Choosing the wrong person for the task is what leads to disaster."],
   ["Top (Six)","The great ruler issues his command: to found states and inherit families; petty men should not be employed.","At the moment of reward, only the trustworthy should be given real responsibility.","The great ruler issues his command in order to reward true achievement; petty men should not be employed, for they will surely bring disorder.","Giving power to the unworthy is what invites future chaos."],
  ],
  a:"Love needs boundaries and principle; over-indulgence now works against a lasting bond.",b:"Good for team efforts requiring discipline and leadership — stay hands-on.",c:"Money matters tied to group efforts — plan with discipline and structure."}
},
{n:8,s:"比",f:"水地比",u:"坎",l:"坤",k:"親比相輔",fortune:"小吉",
 desc:"親比相輔，指當前宜主動親近、廣結善緣，及早合作方能吉祥獲益。",
 guaCi:"比：吉。原筮元永貞，无咎。不寧方來，後夫凶。",
 guaCiX:"比卦象徵親近輔助：吉祥，反覆審慎地占問，只要恆久守正便無災咎；心不安者會前來歸附，若遲遲不肯親附則有凶險。",
 tuan:"比，吉也；比，輔也，下順從也。原筮元永貞，无咎，以剛中也。不寧方來，上下應也。後夫凶，其道窮也。",
 tuanX:"親比是吉祥的，因為彼此輔助、上下順從；反覆審慎地堅守正道所以沒有災咎，這是因為居中而剛正；不安的人前來歸附，是上下相應和的緣故；遲遲不歸附者則陷入窮途末路，故有凶險。",
 xiang:"地上有水，比；先王以建萬國，親諸侯。",
 xiangX:"大地之上有水相互依附，象徵親比之象，古代君王觀此，便建立邦國、親近諸侯，以凝聚人心。",
 guaCiSeg:[{o:"比：吉。",e:"比卦象徵親近輔助：吉祥。",terms:["ji"]},{o:"原筮元永貞，",e:"反覆審慎地占問，恆久堅守正道，",terms:["yuan","zhen"]},{o:"无咎。",e:"便無災咎。",terms:["wujiu"]},{o:"不寧方來，",e:"心不安者會前來歸附，"},{o:"後夫凶。",e:"若遲遲不肯親附則有凶險。",terms:["xiong"]}],
 tuanSeg:[{o:"比，吉也；比，輔也，下順從也。",e:"親比是吉祥的，因為彼此輔助、下位者順從上位者。",terms:["ji"]},{o:"原筮元永貞，无咎，以剛中也。",e:"反覆審慎地堅守正道而無災咎，這是因為居中而剛正。",terms:["yuan","zhen","wujiu"]},{o:"不寧方來，上下應也。",e:"不安的人前來歸附，是上下相應和的緣故。"},{o:"後夫凶，其道窮也。",e:"遲遲不歸附者則陷入窮途末路，故有凶險。",terms:["xiong"]}],
 xiangSeg:[{o:"地上有水，比；",e:"大地之上有水相互依附，象徵親比之象；"},{o:"先王以建萬國，親諸侯。",e:"古代君王觀此，便建立邦國、親近諸侯，以凝聚人心。"}],
 yao:[
 ["初六","有孚比之，无咎。有孚盈缶，終來有它，吉。","心懷誠信與人親近，誠意充盈終能招來意外的助益。","比之初六，有它吉也。","心存誠信而有意外收穫，故為吉祥。"],
 ["六二","比之自內，貞吉。","發自內心地親近他人、堅守正道，吉祥。","比之自內，不自失也。","出於本心相親，不致迷失自我。"],
 ["六三","比之匪人。","與品行不端之人親近往來，恐有損害。","比之匪人，不亦傷乎。","與不當之人相親，豈不令人感到傷痛。"],
 ["六四","外比之，貞吉。","對外尋求賢者親近合作，堅守正道則吉。","外比於賢，以從上也。","對外親近賢能之人，是順從良善之道。"],
 ["九五","顯比，王用三驅，失前禽，邑人不誡，吉。","光明磊落地親近眾人，寬厚待人、不強求，吉祥。","顯比之吉，位正中也；舍逆取順，失前禽也；邑人不誡，上使中也。","居中守正故能顯明親比；捨強求而順其自然，上位者行事持中庸之道。"],
 ["上六","比之无首，凶。","親近他人卻缺乏誠心與領導，難有善終，有凶險。","比之无首，无所終也。","缺乏善始善終的誠心，故難有好結果。"],
 ],
 a:"感情宜真誠相待，主動親近、建立彼此信任。",b:"貴人運佳，適合尋求合作與結盟，團結力量大。",c:"財運靠人脈與合作，誠信經營可獲穩定收益。",
 en:{name:"Bǐ",title:"Holding Together",keyword:"Unity and Alliance",
  desc:"Water settling into earth: closeness and cooperation are favored now — reach out and unite before it's too late.",
  guaCi:"Bǐ: Good fortune. Reconsidering the oracle: sublime, lasting, and correct — no blame. Those uneasy will come; the latecomer meets misfortune.",
  guaCiX:"Genuine, lasting sincerity draws others toward unity and is free of fault; delaying too long to join in brings misfortune.",
  tuan:"Bǐ is good fortune; Bǐ means to support one another, the lower ones willingly following. Reconsidering the oracle as sublime, lasting, and correct, without blame, comes from firmness and balance. Those uneasy come, for above and below respond to one another. The latecomer's misfortune comes from the way having run its course.",
  tuanX:"Good fortune comes from mutual support and willing cooperation; those who hesitate too long to join lose out as the opportunity passes.",
  xiang:"Above the earth there is water: this is Bǐ. Thus the former kings established the many states and drew the feudal lords close.",
  xiangX:"As water rests naturally upon the earth, ancient rulers built states and drew others near through this same natural closeness.",
  yao:[
   ["1st (Six)","Held together in sincerity. No blame. Sincerity filling the vessel, in the end something unexpected and good arrives.","Sincere, steady connection with others brings unexpected good fortune.","The good fortune of unexpected fortune in Bǐ's first line.","Genuine sincerity brings its own surprising reward."],
   ["2nd (Six)","Held together from within. Perseverance brings good fortune.","Bonds formed from genuine inner conviction, held with constancy, bring good fortune.","Held together from within: one does not lose oneself.","True unity from within does not compromise one's own integrity."],
   ["3rd (Six)","Holding together with the wrong sort.","Aligning with unworthy company brings only harm.","Is it not sorrowful to hold together with the wrong sort?","Such an alliance is genuinely regrettable."],
   ["4th (Six)","Holding together from without. Perseverance brings good fortune.","Seeking alliance with the wise and capable, steadily, brings good fortune.","Holding together with the worthy from without is to follow those above.","Following capable, worthy leadership is the wise course."],
   ["5th (Nine)","Manifest unity. The king uses beaters on three sides only, letting the game escape in front; the townsfolk are not warned. Good fortune.","Open, generous leadership that doesn't force compliance wins genuine loyalty.","The good fortune of manifest unity comes from a rightful, balanced position; releasing what runs ahead and taking only what comes willingly.","Fair, unforced leadership is the true source of loyal support."],
   ["Top (Six)","Holding together without a good beginning. Misfortune.","Unity lacking real sincerity from the outset cannot end well.","Holding together without a good beginning has no place to end.","Such a hollow union has nothing sound to rest upon."],
  ],
  a:"Approach love with sincerity and take the initiative to build real trust.",b:"Good fortune with allies and connections — seek partnerships and collaboration.",c:"Wealth flows through relationships — sincere dealings bring steady returns."}
},
{n:9,s:"小畜",f:"風天小畜",u:"巽",l:"乾",k:"小有積蓄",fortune:"平",
 desc:"小有積蓄，指目前力量尚在醞釀階段，宜耐心蓄積，暫緩躁進。",
 guaCi:"小畜：亨。密雲不雨，自我西郊。",
 guaCiX:"小畜卦象徵小有積蓄：亨通，但如同烏雲密布卻尚未降雨，力量正從西方逐漸醞釀積聚之中。",
 tuan:"小畜，柔得位而上下應之，曰小畜。健而巽，剛中而志行，乃亨。密雲不雨，尚往也；自我西郊，施未行也。",
 tuanX:"陰柔者居於適當之位，上下都與之呼應，因此稱為小畜；剛健而又謙遜配合，志向得以推行，因此亨通；密雲尚未成雨，是因為時機仍在醞釀，恩澤尚未能廣施。",
 xiang:"風行天上，小畜；君子以懿文德。",
 xiangX:"風行於天上，象徵蓄積尚小，君子觀此應致力於修養並美化自身的文采與德行。",
 guaCiSeg:[{o:"小畜：亨。",e:"小畜卦象徵小有積蓄：亨通，",terms:["heng"]},{o:"密雲不雨，",e:"如烏雲密布卻尚未降雨，"},{o:"自我西郊。",e:"力量正從西方逐漸醞釀積聚之中。"}],
 tuanSeg:[{o:"小畜，柔得位而上下應之，曰小畜。",e:"陰柔者居於適當之位，上下都與之呼應，因此稱為小畜。"},{o:"健而巽，剛中而志行，乃亨。",e:"剛健而又謙遜配合，志向得以推行，因此亨通。",terms:["heng"]},{o:"密雲不雨，尚往也；自我西郊，施未行也。",e:"密雲尚未成雨，是因為時機仍在醞釀；恩澤來自西方，是恩澤尚未能廣施。"}],
 xiangSeg:[{o:"風行天上，小畜；",e:"風行於天上，象徵蓄積尚小；"},{o:"君子以懿文德。",e:"君子觀此應致力於修養並美化自身的文采與德行。",terms:["jun_zi"]}],
 yao:[
 ["初九","復自道，何其咎，吉。","回歸正道而行，並無過失，吉祥。","復自道，其義吉也。","回歸正道之義理，本就吉祥。"],
 ["九二","牽復，吉。","受牽引而回歸正道，吉祥。","牽復在中，亦不自失也。","受牽引仍能保持中道，不致迷失自我。"],
 ["九三","輿說輻，夫妻反目。","車輪脫落難行，如夫妻失和反目，象徵阻礙叢生。","夫妻反目，不能正室也。","無法端正家室，故生齟齬。"],
 ["六四","有孚，血去惕出，无咎。","心懷誠信，能化解危懼與傷害，並無災咎。","有孚惕出，上合志也。","心存誠信而戒懼得解，與上位者志向相合。"],
 ["九五","有孚攣如，富以其鄰。","心懷誠信、彼此緊密相繫，能與鄰里共享富足。","有孚攣如，不獨富也。","心懷誠信不自私自利，願與人分享富足。"],
 ["上九","既雨既處，尚德載；婦貞厲，月幾望；君子征凶。","積蓄已然成形、恩澤廣被，但盈滿之際仍須提防凶險。","既雨既處，德積載也；君子征凶，有所疑也。","恩德積累深厚已然成形；此時貿然前行恐有疑慮而生凶險。"],
 ],
 a:"感情進展較緩慢，需要多一點耐心累積默契。",b:"事業上遇到小阻礙，宜蓄積實力，暫緩大動作。",c:"財運小有累積但尚不豐厚，宜穩健儲蓄。",
 en:{name:"Xiǎo Chù",title:"Small Accumulation",keyword:"Gentle Restraint",
  desc:"Strength gathering quietly: forces are building but not yet released — be patient and store up your resources.",
  guaCi:"Xiǎo Chù: Success. Dense clouds, no rain, coming from our western outskirts.",
  guaCiX:"Effort is accumulating like clouds not yet ready to release rain — the moment for full expression has not yet arrived.",
  tuan:"In Xiǎo Chù, the soft finds its place and those above and below respond to it, hence the name. Strong yet gentle, the firm holds the center and its will moves forward, and so there is success. Dense clouds, no rain: still moving onward. Coming from our western outskirts: its bounty has not yet been spread.",
  tuanX:"Gentle influence guiding firm strength allows real intent to advance; the promise of abundance is gathering but not yet released to the world.",
  xiang:"Wind moves across heaven: this is Xiǎo Chù. Thus the noble one refines his character and culture.",
  xiangX:"As wind moves gently across the sky, a person of character cultivates their inner refinement and virtue.",
  yao:[
   ["1st (Nine)","Returning along one's own path. What fault could there be? Good fortune.","Returning to one's proper course brings good fortune, without error.","Returning along one's own path is right in its very meaning.","Staying true to one's own correct way is inherently sound."],
   ["2nd (Nine)","Drawn back to return. Good fortune.","Being led back to the right path, even by others, brings good fortune.","Being drawn to return while centered — one does not lose oneself either.","Even when guided back by others, one's own integrity remains intact."],
   ["3rd (Nine)","The cart's spokes come loose; husband and wife look at each other askance.","A breakdown in the usual order leads to friction and discord.","Husband and wife look askance, for the household is not properly set right.","Disorder within has led to this evident discord."],
   ["4th (Six)","Sincerity. Blood withdraws, apprehension passes. No blame.","Genuine sincerity resolves danger and eases anxious tension.","Apprehension passing with sincerity shows the will is in accord above.","Trust from those above matches the sincerity shown below."],
   ["5th (Nine)","Sincerity that binds together. Wealth shared with one's neighbors.","Genuine sincerity draws others close, and prosperity is shared, not hoarded.","Sincerity that binds together does not mean wealth for oneself alone.","True sincerity naturally shares its abundance with others."],
   ["Top (Nine)","Rain has come, all is still; virtue is being stored up. The wife's perseverance is precarious; the moon nears full. If the noble one advances now, misfortune.","Success has been achieved through accumulation — caution is still needed against overreach.","Rain and stillness come from virtue steadily accumulated; the noble one's misfortune in advancing shows there remains cause for doubt.","Pressing further, even at the height of success, still carries real risk."],
  ],
  a:"Progress in love feels slow — patience will let the connection deepen naturally.",b:"Minor obstacles at work — build up your strength quietly rather than making big moves.",c:"Savings are building but modestly — keep steady rather than reaching for more."}
},
{n:10,s:"履",f:"天澤履",u:"乾",l:"兌",k:"如履薄冰",fortune:"小吉",
 desc:"如履薄冰，指當前處境需步步為營、謹言慎行，如此方能化險為夷。",
 guaCi:"履：履虎尾，不咥人，亨。",
 guaCiX:"履卦象徵謹慎而行：如同踩在老虎尾巴上，卻沒有被咬傷，因為態度謙和謹慎，故能亨通。",
 tuan:"履，柔履剛也。說而應乎乾，是以履虎尾，不咥人，亨。剛中正，履帝位而不疚，光明也。",
 tuanX:"以柔和之姿應對剛強之勢，內心和悅而順應剛健，因此雖如履虎尾卻不受傷害；居於剛正中道之位而無所愧疚，光明磊落。",
 xiang:"上天下澤，履；君子以辯上下，定民志。",
 xiangX:"天在上、澤在下，各安其位，象徵禮制之象，君子觀此應辨明上下尊卑之分，安定百姓的心志。",
 guaCiSeg:[{o:"履：履虎尾，",e:"履卦象徵謹慎而行：如同踩在老虎尾巴上，"},{o:"不咥人，",e:"卻沒有被咬傷，"},{o:"亨。",e:"因為態度謙和謹慎，故能亨通。",terms:["heng"]}],
 tuanSeg:[{o:"履，柔履剛也。",e:"以柔和之姿應對剛強之勢。"},{o:"說而應乎乾，是以履虎尾，不咥人，亨。",e:"內心和悅而順應剛健，因此雖如履虎尾卻不受傷害，故能亨通。",terms:["heng"]},{o:"剛中正，履帝位而不疚，光明也。",e:"居於剛正中道之位而無所愧疚，光明磊落。",terms:["zhong_zheng"]}],
 xiangSeg:[{o:"上天下澤，履；",e:"天在上、澤在下，各安其位，象徵禮制之象；"},{o:"君子以辯上下，定民志。",e:"君子觀此應辨明上下尊卑之分，安定百姓的心志。",terms:["jun_zi"]}],
 yao:[
 ["初九","素履，往无咎。","以樸素平常之心前行，並無災咎。","素履之往，獨行願也。","依循本心單純而行，並無他求。"],
 ["九二","履道坦坦，幽人貞吉。","行於平坦大道，如隱士般安靜守正，吉祥。","幽人貞吉，中不自亂也。","內心居中守正，不因外物而自亂陣腳。"],
 ["六三","眇能視，跛能履，履虎尾，咥人，凶；武人為于大君。","能力不足卻勉強行事，如踩虎尾般危險，將招致凶險。","眇能視，不足以有明也；跛能履，不足以與行也；咥人之凶，位不當也；武人為于大君，志剛也。","眼盲難以視物，跛足難以遠行，居位不當才招致凶險；剛猛之人妄圖僭越君位，志向過於剛強。"],
 ["九四","履虎尾，愬愬，終吉。","如踩虎尾般戒慎恐懼，最終能化險為夷、吉祥。","愬愬終吉，志行也。","心懷戒懼而終能吉祥，是因志向得以施行。"],
 ["九五","夬履，貞厲。","果決行事，堅守正道仍需提防危險。","夬履貞厲，位正當也。","居位雖正當，仍應保持警惕。"],
 ["上九","視履考祥，其旋元吉。","回顧檢視自己過去的行為，圓滿週全則大為吉祥。","元吉在上，大有慶也。","居於上位而獲大吉，必有喜慶之事。"],
 ],
 a:"感情中要謹言慎行，尊重對方的底線才能長久。",b:"職場如履薄冰，宜謹慎行事、按部就班。",c:"投資理財須步步為營，避免冒然涉險。",
 en:{name:"Lǚ",title:"Treading Carefully",keyword:"Conduct and Caution",
  desc:"Walking a fine line: proceed with care and propriety, and even a precarious step will not bring harm.",
  guaCi:"Lǚ: Treading on the tiger's tail — it does not bite the man. Success.",
  guaCiX:"Even in a dangerous situation, careful and respectful conduct keeps one safe and leads to success.",
  tuan:"Lǚ: the soft treads on the firm. Content and responsive to the strong, hence treading on the tiger's tail without being bitten — success. Firm, correct, and centered, he occupies the ruler's place without regret, for his way is bright.",
  tuanX:"A gentle, respectful approach toward what is strong or dangerous avoids harm; genuine integrity, held without excess, brings clear and untroubled success.",
  xiang:"Heaven above, the lake below: this is Lǚ. Thus the noble one distinguishes high from low, and settles the aims of the people.",
  xiangX:"As heaven stands above the lake, each in its proper place, a person of character clarifies proper roles and steadies the people's purpose.",
  yao:[
   ["1st (Nine)","Simple conduct. To go forward brings no blame.","Acting with plain, honest simplicity brings no fault.","The going forward of simple conduct is following one's own true wish alone.","Acting from genuine, unadorned intent is entirely sound."],
   ["2nd (Nine)","Treading a smooth and level path; the recluse perseveres, good fortune.","A quiet, steady, undisturbed course, like a hermit's, brings good fortune.","The recluse's good fortune through perseverance comes from an inner life undisturbed by chaos.","Inner calm and order are the true source of this good fortune."],
   ["3rd (Six)","A one-eyed man can see, a lame man can walk; treading on the tiger's tail, it bites him. Misfortune. Like a warrior acting for the great ruler.","Attempting something beyond one's real capacity leads to real harm.","A one-eyed man's sight is not enough to truly see; a lame man's walk is not enough to truly go far; the misfortune of being bitten comes from being ill-suited to the position; a warrior acting for the ruler shows only reckless will.","Overreaching one's actual ability leads directly to this misfortune."],
   ["4th (Nine)","Treading on the tiger's tail with trembling caution. In the end, good fortune.","Extreme care in a dangerous position ultimately leads to good fortune.","Trembling caution ending in good fortune shows the will is truly carried through.","Persistent, careful resolve is what carries this through successfully."],
   ["5th (Nine)","Resolute treading. Perseverance, yet danger.","Decisive action, even while holding firm, still carries real risk.","Resolute treading with danger comes from occupying a rightly balanced position.","Even from a correct position, decisive action still demands real caution."],
   ["Top (Nine)","Examine one's own conduct and consider the signs of fortune; if the whole course has been complete, sublime good fortune.","Reviewing one's own path with care, if it has been sound throughout, brings the greatest fortune.","Sublime good fortune at the very top comes with great cause for celebration.","Such a fulfilling completion is genuinely worth celebrating."],
  ],
  a:"Watch your words and respect boundaries — care now keeps a relationship lasting.",b:"Tread carefully at work; proceed step by step rather than taking shortcuts.",c:"Invest cautiously and methodically — avoid unnecessary risk."}
},
{n:11,s:"泰",f:"地天泰",u:"坤",l:"乾",k:"天地交泰",fortune:"大吉",
 desc:"天地交泰，指眼前運勢通達順遂，上下一心，正是大展宏圖的好時機。",
 guaCi:"泰：小往大來，吉，亨。",
 guaCiX:"泰卦象徵通達安泰：付出的小、得到的大，吉祥而亨通。",
 tuan:"泰，小往大來，吉亨，則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。",
 tuanX:"小往大來之所以吉祥亨通，是因為天地陰陽交融，萬物因此暢通無阻；上下彼此交流溝通，志向一致；內部剛健、外部柔順，君子的力量正逐漸增長，小人的勢力則日漸消退。",
 xiang:"天地交，泰；后以財成天地之道，輔相天地之宜，以左右民。",
 xiangX:"天地之氣相互交融，象徵通泰之象，君王觀此應順應天地運行之理，制定政令輔助萬物，並藉此照顧引導百姓。",
 guaCiSeg:[{o:"泰：小往大來，",e:"泰卦象徵通達安泰：付出的小、得到的大，"},{o:"吉，亨。",e:"吉祥而亨通。",terms:["ji","heng"]}],
 tuanSeg:[{o:"泰，小往大來，吉亨，",e:"小往大來之所以吉祥亨通，",terms:["ji","heng"]},{o:"則是天地交而萬物通也，上下交而其志同也。",e:"是因為天地陰陽交融，萬物因此暢通無阻；上下彼此交流溝通，志向一致。",terms:["zhi"]},{o:"內陽而外陰，內健而外順，內君子而外小人，",e:"內部剛健、外部柔順，內裡君子而外表小人，",terms:["jun_zi","xiao_ren"]},{o:"君子道長，小人道消也。",e:"君子的力量正逐漸增長，小人的勢力則日漸消退。",terms:["jun_zi","xiao_ren"]}],
 xiangSeg:[{o:"天地交，泰；",e:"天地之氣相互交融，象徵通泰之象；"},{o:"后以財成天地之道，輔相天地之宜，以左右民。",e:"君王觀此應順應天地運行之理，制定政令輔助萬物，並藉此照顧引導百姓。"}],
 yao:[
 ["初九","拔茅茹，以其彙，征吉。","如拔茅草般牽連而起、志同道合者相偕前行，吉祥。","拔茅征吉，志在外也。","志向在於向外發展、有所作為。"],
 ["九二","包荒，用馮河，不遐遺，朋亡，得尚于中行。","胸懷寬廣、勇於任事，不遺棄遠方之人，秉持中道行事。","包荒得尚于中行，以光大也。","胸懷寬廣又能秉持中道，故能光明廣大。"],
 ["九三","无平不陂，无往不復，艱貞无咎；勿恤其孚，于食有福。","世事本有起伏循環，堅守正道雖艱難仍無災咎，終有福報。","无往不復，天地際也。","萬物往而復返，正是天地交會運行的道理。"],
 ["六四","翩翩，不富以其鄰，不戒以孚。","輕盈地與鄰里共享，不待告誡便能以誠相待。","翩翩不富，皆失實也；不戒以孚，中心願也。","雖不富有仍願分享，是出自內心真誠的願望。"],
 ["六五","帝乙歸妹，以祉元吉。","如君王嫁女般謙和下嫁，因此獲得福澤、大為吉祥。","以祉元吉，中以行願也。","秉持中道實現心願，故能獲得大吉。"],
 ["上六","城復于隍，勿用師，自邑告命，貞吝。","城牆傾頹回歸壕溝，此時不宜出兵，堅守正道仍有些許遺憾。","城復于隍，其命亂也。","政令已趨紊亂，猶如城牆傾覆一般。"],
 ],
 a:"感情運勢極佳，彼此坦誠交流，關係和諧圓滿。",b:"事業運亨通，上下配合順暢，宜把握良機大展身手。",c:"財運亨通，收支平衡且有餘裕，適合穩健擴展。",
 en:{name:"Tài",title:"Peace",keyword:"Harmony and Flourishing",
  desc:"Heaven and earth in accord: this is a season of genuine flow and opportunity — move forward with confidence.",
  guaCi:"Tài: The small departs, the great arrives. Good fortune, success.",
  guaCiX:"What is lesser gives way and what is greater comes forth — a time of real harmony, good fortune, and forward movement.",
  tuan:"Tài: the small departs, the great arrives, good fortune and success — this is heaven and earth in communion, all things flowing freely together; above and below in communion, their aims as one. Inward, the yang; outward, the yin. Inward, strength; outward, yielding. Inward, the noble one; outward, the small-minded — the way of the noble one grows, the way of the small-minded fades.",
  tuanX:"When heaven and earth, and those above and below, are truly in accord, all things flourish together; this is a season when integrity naturally grows stronger while pettiness recedes.",
  xiang:"Heaven and earth in communion: this is Tài. Thus the ruler completes and assists the way of heaven and earth, guiding the people accordingly.",
  xiangX:"As heaven and earth join in perfect accord, a ruler shapes policy in harmony with this natural order, to guide and support the people.",
  yao:[
   ["1st (Nine)","Pulling up intertwined reed roots. Going forward brings good fortune.","Advancing together with like-minded companions brings good fortune.","Good fortune in pulling up the roots and advancing: the will is set on what lies ahead.","A shared, forward-looking purpose drives this good result."],
   ["2nd (Nine)","Bearing with the uncultivated, fording the river with resolve, not neglecting the distant, letting go of factions — one finds due honor in the middle path.","Broad-minded tolerance and even-handedness, without bias, wins genuine standing.","Bearing with the uncultivated and finding honor in the middle path comes from a character that is broad and bright.","Such generous, balanced character naturally brings this recognition."],
   ["3rd (Nine)","No plain without a slope, no going without a return. Persevering through hardship brings no blame; do not worry over the outcome — there is good fortune in what you eat.","Life has its natural ups and downs — steady perseverance through hardship is rewarded.","No going without a return, for that is where heaven and earth meet.","This natural rhythm of advance and return reflects the meeting of heaven and earth."],
   ["4th (Six)","Fluttering down, not rich yet with his neighbors, without being warned, in sincerity.","Sharing sincerely and freely with those nearby, without needing to be urged.","Fluttering down without riches: all have lost their fullness; without being warned, in sincerity, it is the genuine wish of the heart.","Sincerity offered freely reflects the heart's own true desire."],
   ["5th (Six)","Sovereign Yi gives his younger sister in marriage. This brings blessing and sublime good fortune.","A humble, gracious union between different ranks brings real blessing.","Blessing and sublime good fortune come from a balanced heart carrying out its wish.","A centered, sincere heart is what fulfills this happy union."],
   ["Top (Six)","The wall falls back into the moat. Do not use the army now; announce your orders from within your own town. Perseverance brings regret.","A period of harmony is ending — withdraw and consolidate rather than push outward.","The wall falling back into the moat shows that order has grown chaotic.","The breakdown of order is the underlying cause of this decline."],
  ],
  a:"A wonderful time for love — open, honest communication brings real harmony.",b:"Career flows smoothly — cooperation across the board makes this a good time to act boldly.",c:"Finances are thriving with healthy balance — a good time for steady expansion."}
},
{n:12,s:"否",f:"天地否",u:"乾",l:"坤",k:"閉塞不通",fortune:"大凶",
 desc:"閉塞不通，指目前局勢受阻、小人當道，宜低調自守、靜待轉機。",
 guaCi:"否：否之匪人，不利君子貞，大往小來。",
 guaCiX:"否卦象徵閉塞不通：世道不順、人心背離，不利於君子堅守正道，付出的多、得到的少。",
 tuan:"否之匪人，不利君子貞，大往小來，則是天地不交而萬物不通也，上下不交而天下无邦也。內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。",
 tuanX:"之所以世道閉塞、不利君子，是因為天地陰陽不相交融，萬物因此阻塞不通；上下彼此不溝通，國家便難以維繫；內部柔弱、外部強硬，小人的勢力正逐漸增長，君子的力量則日漸消退。",
 xiang:"天地不交，否；君子以儉德辟難，不可榮以祿。",
 xiangX:"天地之氣不相交融，象徵閉塞之象，君子觀此應收斂自身德行、避開禍患，不應貪求榮華俸祿。",
 guaCiSeg:[{o:"否之匪人，",e:"否卦象徵閉塞不通：世道不順、人心背離，",terms:["fei"]},{o:"不利君子貞，",e:"不利於君子堅守正道，",terms:["li","jun_zi","zhen"]},{o:"大往小來。",e:"付出的多、得到的少。"}],
 tuanSeg:[{o:"否之匪人，不利君子貞，大往小來，",e:"之所以世道閉塞、不利君子，",terms:["fei","li","jun_zi","zhen"]},{o:"則是天地不交而萬物不通也，上下不交而天下无邦也。",e:"是因為天地陰陽不相交融，萬物因此阻塞不通；上下彼此不溝通，國家便難以維繫。"},{o:"內陰而外陽，內柔而外剛，內小人而外君子，",e:"內部柔弱、外部強硬，內裡小人而外表君子，",terms:["xiao_ren","jun_zi"]},{o:"小人道長，君子道消也。",e:"小人的勢力正逐漸增長，君子的力量則日漸消退。",terms:["xiao_ren","jun_zi"]}],
 xiangSeg:[{o:"天地不交，否；",e:"天地之氣不相交融，象徵閉塞之象；"},{o:"君子以儉德辟難，不可榮以祿。",e:"君子觀此應收斂自身德行、避開禍患，不應貪求榮華俸祿。",terms:["jun_zi"]}],
 yao:[
 ["初六","拔茅茹，以其彙，貞吉，亨。","如拔茅草般牽連同類，堅守正道則吉祥亨通。","拔茅貞吉，志在君也。","志向在於效忠與追隨正道。"],
 ["六二","包承，小人吉，大人否，亨。","對小人的逢迎包容或許得利，但君子堅守原則反而閉塞卻能亨通。","大人否亨，不亂群也。","君子雖處閉塞卻能亨通，是因不隨波逐流。"],
 ["六三","包羞。","身處逆境卻無力改變，只能含羞忍耐。","包羞，位不當也。","所處的位置並不恰當，故感羞愧。"],
 ["九四","有命，无咎，疇離祉。","秉承正當使命行事，並無災咎，同類也能因此得福。","有命无咎，志行也。","秉承正命而行，志向得以實現。"],
 ["九五","休否，大人吉；其亡其亡，繫于苞桑。","閉塞之勢開始停止，德高望重之人吉祥，但仍須居安思危。","大人之吉，位正當也。","居於正當之位，故能獲得吉祥。"],
 ["上九","傾否，先否後喜。","閉塞之勢終將傾覆瓦解，先經歷困頓後迎來喜悅。","否終則傾，何可長也。","閉塞之勢發展到極致必然傾覆，不可能長久維持。"],
 ],
 a:"感情陷入低潮或溝通不良，宜先冷靜、暫緩推進。",b:"事業運受阻，小人當道，宜低調自守、等待轉機。",c:"財運不佳，投資宜保守觀望，避免大額進出。",
 en:{name:"Pǐ",title:"Standstill",keyword:"Stagnation and Blockage",
  desc:"Heaven and earth drifting apart: the way forward is blocked — hold back, stay principled, and wait it out.",
  guaCi:"Pǐ: Blocked by unworthy men. Not favorable for the noble one to persevere here. The great departs, the small arrives.",
  guaCiX:"With the wrong sort of people in control, the noble path itself is obstructed — better to withdraw quietly than to persist openly.",
  tuan:"Pǐ, blocked by unworthy men, is not favorable for the noble one's perseverance; the great departs, the small arrives — this is heaven and earth not in communion, all things not flowing together; above and below not in communion, the world without any state to speak of. Inward the yin, outward the yang; inward yielding, outward strong; inward the small-minded, outward the noble one — the way of the small-minded grows, the way of the noble one fades.",
  tuanX:"When heaven and earth fail to meet, and those above and below are out of touch, nothing can truly flourish — this is a season when small-minded influence rises and genuine integrity recedes.",
  xiang:"Heaven and earth not in communion: this is Pǐ. Thus the noble one withdraws into his own virtue to avoid difficulty, not seeking honor through position.",
  xiangX:"As heaven and earth fail to meet, a person of character withdraws to safeguard their integrity, rather than chasing rank or reward.",
  yao:[
   ["1st (Six)","Pulling up intertwined reed roots. Perseverance brings good fortune and success.","Even amid blockage, staying connected to like-minded companions and holding firm brings good fortune.","Pulling up roots with good fortune through perseverance shows the will is set on serving what is right.","A steady commitment to rightness is what sustains this fortune."],
   ["2nd (Six)","Bearing and supporting: good fortune for the small-minded; the great man is blocked, yet finds success.","Even the capable, though restrained now, will ultimately find their own way through.","The great man's success in being blocked comes from not being swept along with the crowd.","Refusing to blend into the general disorder is what preserves this integrity."],
   ["3rd (Six)","Wrapped in shame.","A painful, uncomfortable position with no easy way out.","Wrapped in shame comes from being in a position that is simply not fitting.","This ill-suited position is the source of the discomfort."],
   ["4th (Nine)","Acting under mandate. No blame. Companions share in the good fortune.","Acting on legitimate authority is safe, and others benefit alongside you.","Acting under mandate without blame shows the will can be carried out.","One's true purpose can genuinely be realized in this position."],
   ["5th (Nine)","Bringing the standstill to rest. Good fortune for the great man. 'It may fail, it may fail' — tied to a cluster of mulberry roots.","A capable leader ends the stagnation, though must remain constantly vigilant.","The great man's good fortune comes from occupying a rightly balanced position.","A correct, well-centered position is what enables this turnaround."],
   ["Top (Nine)","The standstill is overturned. First blockage, then joy.","The long period of stagnation finally breaks, and relief follows.","How can blockage last forever? It must in the end be overturned.","Stagnation, by its very nature, cannot continue indefinitely."],
  ],
  a:"A rough patch in love or communication — pause and cool off before pushing forward.",b:"Obstacles and unhelpful influences at work — stay low-key and wait for things to shift.",c:"A weak period financially — stay conservative and avoid large transactions."}
},
{n:13,s:"同人",f:"天火同人",u:"乾",l:"離",k:"與人和同",fortune:"小吉",
 desc:"與人和同，指當前適合尋求志同道合的夥伴，坦誠合作方能成就大事。",
 guaCi:"同人：同人于野，亨。利涉大川，利君子貞。",
 guaCiX:"同人卦象徵與人和同：在曠野之中與眾人和睦相處，可獲亨通，有利於涉越險阻，也有利於君子堅守正道。",
 tuan:"同人，柔得位得中而應乎乾，曰同人。同人曰：同人于野，亨，利涉大川，乾行也。文明以健，中正而應，君子正也。唯君子為能通天下之志。",
 tuanX:"陰柔者居於適中之位並與剛健相應，因此稱為同人；能在曠野之中與眾人和同，是效法天道剛健廣大的緣故；內心文明而外在剛健，居中守正而相應，這正是君子的正道；唯有君子才能通達天下人的心志。",
 xiang:"天與火，同人；君子以類族辨物。",
 xiangX:"天在上、火向上炎，性質相合而彼此親近，象徵和同之象，君子觀此應辨明事物的類別，使各得其宜。",
 guaCiSeg:[{o:"同人于野，",e:"同人卦象徵與人和同：在曠野之中與眾人和睦相處，"},{o:"亨。",e:"可獲亨通。",terms:["heng"]},{o:"利涉大川，",e:"有利於涉越險阻，",terms:["li","she_da_chuan"]},{o:"利君子貞。",e:"也有利於君子堅守正道。",terms:["li","jun_zi","zhen"]}],
 tuanSeg:[{o:"同人，柔得位得中而應乎乾，曰同人。",e:"陰柔者居於適中之位並與剛健相應，因此稱為同人。"},{o:"同人曰：同人于野，亨，利涉大川，乾行也。",e:"能在曠野之中與眾人和同、獲得亨通、有利涉險，是效法天道剛健廣大的緣故。",terms:["heng","li"]},{o:"文明以健，中正而應，君子正也。",e:"內心文明而外在剛健，居中守正而相應，這正是君子的正道。",terms:["zhong_zheng","jun_zi"]},{o:"唯君子為能通天下之志。",e:"唯有君子才能通達天下人的心志。",terms:["jun_zi","zhi"]}],
 xiangSeg:[{o:"天與火，同人；",e:"天在上、火向上炎，性質相合而彼此親近，象徵和同之象；"},{o:"君子以類族辨物。",e:"君子觀此應辨明事物的類別，使各得其宜。",terms:["jun_zi"]}],
 yao:[
 ["初九","同人于門，无咎。","一出門便能與人和睦相處，並無災咎。","出門同人，又誰咎也。","一出門就能與人和同，又哪來的過失呢。"],
 ["六二","同人于宗，吝。","僅與同宗族、小圈子之人親近，格局過小，稍有遺憾。","同人于宗，吝道也。","僅限於狹隘的圈子，是稍嫌不足的做法。"],
 ["九三","伏戎于莽，升其高陵，三歲不興。","暗藏兵力於草莽、登高窺伺，長時間都無法有所作為。","伏戎于莽，敵剛也；三歲不興，安行也。","對手實力強勁，因此長期無法輕舉妄動，只能安分行事。"],
 ["九四","乘其墉，弗克攻，吉。","登上城牆卻未強行進攻，能適可而止，吉祥。","乘其墉，義弗克也；其吉，則困而反則也。","按理不應強攻，之所以吉祥，是因陷入困境後懂得回歸正軌。"],
 ["九五","同人，先號咷而後笑，大師克相遇。","與人和同之路先經歷艱難悲傷，後終能歡笑重逢。","同人之先，以中直也；大師相遇，言相克也。","起初的艱難是因秉持中正之道；最終相遇克敵，是彼此協力克服困難。"],
 ["上九","同人于郊，无悔。","與人和同止於郊野之外，較為疏遠但也無所悔恨。","同人于郊，志未得也。","志向尚未能完全實現，僅止於疏遠的和同。"],
 ],
 a:"適合尋找志趣相投的對象，坦誠相待感情更穩固。",b:"適合團隊合作、結盟共事，凝聚共識可成大事。",c:"合夥投資運佳，志同道合者共同經營容易獲利。",
 en:{name:"Tóng Rén",title:"Fellowship",keyword:"Common Cause",
  desc:"Fire beneath heaven: shared purpose with others of like mind now leads to real, lasting success.",
  guaCi:"Tóng Rén: Fellowship in the open. Success. Favorable to cross the great water; favorable for the noble one to persevere.",
  guaCiX:"Open, honest fellowship — not exclusive cliques — brings success and supports even bold, difficult undertakings.",
