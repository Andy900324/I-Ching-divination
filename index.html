  tuan:"Repeated danger — this is Kǎn. Water flows on without filling up; moving through danger without losing its own sincerity. 'With sincerity, the heart finds its way through' comes from firmness and balance. 'Going forward is honored' means going forward achieves real merit. Heaven's danger cannot be ascended; earth's danger lies in mountains, rivers, hills, and ridges; kings and lords establish defenses to guard their states — great indeed is the use of this moment of danger!",
  tuanX:"Like water that keeps moving without ever losing itself, a firm and balanced inner sincerity is what allows real progress through danger; even rulers use such natural barriers wisely to protect what they hold dear.",
  xiang:"Water arrives again and again: this is Kǎn. Thus the noble one holds constantly to virtuous conduct and practices the work of teaching.",
  xiangX:"As water flows in again and again without pause, a person of character sustains constant virtue and steadily practices the work of teaching others.",
  yao:[
   ["1st (Six)","Repeated danger; entering a pit within a pit. Misfortune.","Sinking ever deeper into difficulty, without a clear way out, is genuinely dangerous.","Repeated danger, entering the pit, comes from having lost the proper way.","Losing sight of the right course is what leads into this deepening trouble."],
   ["2nd (Nine)","Danger present. Seeking only small gains.","Amid real danger, it is wise to be content with modest, achievable progress.","Seeking only small gains means one has not yet emerged from the center of danger.","One remains, for now, still within the heart of the difficulty."],
   ["3rd (Six)","Coming and going, danger upon danger; resting against peril, entering a pit within a pit. Do not act this way.","Wavering aimlessly amid compounding dangers only deepens the trouble — better to stop.","In the end, no true achievement comes this way.","Such aimless struggle ultimately yields nothing of real value."],
   ["4th (Six)","A cask of wine, a bowl of grain, served in earthenware; presented simply through the window. In the end, no blame.","Simple, sincere offering, without pretension, is enough to see one through safely.","The cask of wine and bowl of grain show hard and soft meeting in genuine accord.","This is where firm resolve and gentle sincerity meet in true harmony."],
   ["5th (Nine)","The pit is not yet full; it levels out. No blame.","The danger is beginning to ease and settle, and no fault remains.","The pit not yet full, leveling out, means greatness has not yet been achieved.","The situation has stabilized, though full resolution has not yet arrived."],
   ["Top (Six)","Bound with cords and ropes, placed within a thicket of thorns; for three years, finding no way out. Misfortune.","Prolonged, severe confinement, with no relief in sight, is a genuinely dire outcome.","The misfortune of the topmost line comes from having lost the way for three years.","This extended loss of direction is what brings about such a grave result."],
  ],
  a:"Love faces real tests and setbacks — hold firm and see it through.",b:"One difficulty after another at work — stay calm and proceed cautiously.",c:"Finances are volatile — stay conservative and avoid risky investments."}
},
{n:30,s:"離",f:"離為火",u:"離",l:"離",k:"光明附麗",fortune:"小吉",
 desc:"光明附麗，指當前表現亮眼、備受矚目，宜依附正道、保持理性方能長久。",
 guaCi:"離：利貞，亨。畜牝牛，吉。",
 guaCiX:"離卦象徵光明依附：有利於堅守正道，可獲亨通；如同畜養母牛般柔順地依附正道，便能吉祥。",
 tuan:"離，麗也；日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。柔麗乎中正，故亨，是以畜牝牛吉也。",
 tuanX:"離就是附麗依附的意思；日月依附於天空而運行，百穀草木依附於土地而生長，光明重疊而依附於正道，便能教化成就天下；柔順之德依附於中正之道，因此能夠亨通，就如同畜養柔順的母牛一般吉祥。",
 xiang:"明兩作，離；大人以繼明照于四方。",
 xiangX:"光明接連升起，象徵離卦光明相繼之象，德高望重之人觀此應延續光明的德行，照耀天下四方。",
 guaCiSeg:[{o:"離：利貞，",e:"離卦象徵光明依附：有利於堅守正道，",terms:["li","zhen"]},{o:"亨。",e:"可獲亨通。",terms:["heng"]},{o:"畜牝牛，吉。",e:"如同畜養母牛般柔順地依附正道，便能吉祥。",terms:["ji"]}],
 tuanSeg:[{o:"離，麗也；日月麗乎天，百穀草木麗乎土，",e:"離就是附麗依附的意思；日月依附於天空而運行，百穀草木依附於土地而生長，"},{o:"重明以麗乎正，乃化成天下。",e:"光明重疊而依附於正道，便能教化成就天下。"},{o:"柔麗乎中正，故亨，是以畜牝牛吉也。",e:"柔順之德依附於中正之道，因此能夠亨通，就如同畜養柔順的母牛一般吉祥。",terms:["zhong_zheng","heng","ji"]}],
 xiangSeg:[{o:"明兩作，離；",e:"光明接連升起，象徵離卦光明相繼之象；"},{o:"大人以繼明照于四方。",e:"德高望重之人觀此應延續光明的德行，照耀天下四方。",terms:["da_ren"]}],
 yao:[
 ["初九","履錯然，敬之，无咎。","行事之初略顯錯亂，但心懷敬慎便無災咎。","履錯之敬，以辟咎也。","以敬慎之心面對錯亂的處境，藉此避免過咎。"],
 ["六二","黃離，元吉。","如中和的黃色般依附於中正之道，大為吉祥。","黃離元吉，得中道也。","秉持中正之道而依附，故能大吉。"],
 ["九三","日昃之離，不鼓缶而歌，則大耋之嗟，凶。","如日過中天般光明將逝，若不知及時行樂，年老時將徒留嘆息，凶險。","日昃之離，何可久也。","日光西斜終將消逝，光明豈能長久維持。"],
 ["九四","突如其來如，焚如，死如，棄如。","變故突如其來、猛烈如焚燒，象徵劇烈而毀滅性的災禍。","突如其來如，无所容也。","如此突如其來的變故，令人無處容身。"],
 ["六五","出涕沱若，戚嗟若，吉。","雖悲傷落淚、憂愁嘆息，最終仍能轉為吉祥。","六五之吉，離王公也。","居此位而獲吉，是因依附於王公貴人。"],
 ["上九","王用出征，有嘉折首，獲匪其醜，无咎。","君王出兵征伐，摧毀敵首而不濫殺無辜，並無災咎。","王用出征，以正邦也。","君王出兵征伐，是為了端正邦國秩序。"],
 ],
 a:"感情熱烈但也需理性，避免因一時衝動而受傷。",b:"表現亮眼、備受矚目，宜持續保持專業與熱情。",c:"財運看好，但變動較大，宜適時分散風險。",
 en:{name:"Lí",title:"Clinging Light",keyword:"Radiance and Attachment",
  desc:"Fire attaching to fire, light upon light: this is a time to shine and be seen — but stay grounded in what is right rather than mere impulse.",
  guaCi:"Lí: Favorable to persevere. Success. Nurturing a cow brings good fortune.",
  guaCiX:"Success favors continued perseverance; a gentle, sustaining, cow-like devotion to what is right brings good fortune.",
  tuan:"Lí means to cling: the sun and moon cling to heaven; the hundred grains, grasses, and trees cling to the earth. Double brightness clinging to correctness transforms and completes the world. The soft clings to the middle and to correctness, hence success; thus nurturing a cow brings good fortune.",
  tuanX:"Just as sun and moon depend on the sky, and living things depend on the earth, real brightness needs something solid and correct to attach itself to — a gentle, steady devotion is what brings this arrangement to good fortune.",
  xiang:"Brightness arises twice over: this is Lí. Thus the great man, with this continued brightness, illuminates the four quarters of the world.",
  xiangX:"As brightness rises again and again in succession, a person of true stature, sustaining this same continuity, brings light to every corner of the world.",
  yao:[
   ["1st (Nine)","Footsteps crossing and uncertain. Treating this with reverence, no blame.","Confusion at the very start, approached with sincere care, carries no fault.","The reverence shown toward crossing footsteps is meant to avoid real fault.","Such careful, respectful attention is exactly what prevents any real error."],
   ["2nd (Six)","Yellow brightness. Sublime good fortune.","A balanced, harmonious brightness — like the color yellow — brings great fortune.","The sublime good fortune of yellow brightness comes from holding to the balanced, correct way.","Holding firmly to this centered, correct path is the true source of the fortune."],
   ["3rd (Nine)","Brightness at the sun's decline; if one does not drum on the bowl and sing, then in old age there is only sighing and lament. Misfortune.","Failing to embrace the natural passage of time with grace leads only to bitter regret.","How can the brightness of the sun's decline possibly last long?","Such a fading brightness, by its nature, cannot be expected to endure."],
   ["4th (Nine)","Coming on so suddenly — flaring up, dying out, discarded.","A sudden, violent, and self-destructive outburst leaves nothing but ruin in its wake.","Coming on so suddenly leaves no place to be received.","Such an abrupt, destructive force finds nowhere lasting to settle."],
   ["5th (Six)","Tears flowing in torrents, grieving and lamenting. Good fortune.","Genuine, heartfelt grief, honestly expressed, ultimately leads to good fortune.","The good fortune of the fifth line comes from an attachment to true kingship and nobility.","A genuine connection to what is truly noble is the source of this fortune."],
   ["Top (Nine)","The king uses this one to go on campaign; there is praise for beheading the leader and capturing not his followers. No blame.","Decisive, targeted correction of wrongdoing, without excessive punishment, is entirely sound.","The king going on campaign is done in order to set the states in right order.","This action is undertaken precisely to bring proper order to the realm."],
  ],
  a:"Passion runs high, but stay level-headed to avoid impulsive hurt.",b:"Your performance is shining and drawing attention — keep up the professionalism.",c:"Finances look promising but volatile — diversify to manage risk."}
},
{n:31,s:"咸",f:"澤山咸",u:"兌",l:"艮",k:"感應交流",fortune:"大吉",
 desc:"感應交流，指眼前彼此心意相通、感應良好，正是深化關係的絕佳時機。",
 guaCi:"咸：亨，利貞。取女吉。",
 guaCiX:"咸卦象徵感應交流：亨通，有利於堅守正道，娶妻成家則吉祥。",
 tuan:"咸，感也。柔上而剛下，二氣感應以相與，止而說，男下女，是以亨利貞，取女吉也。天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣！",
 tuanX:"咸就是感應的意思；陰柔在上、陽剛在下，兩股氣息相互感應交流，內心止定又和悅，男子謙下追求女子，因此能亨通、有利、正固，娶妻成家便吉祥；天地相互感應而化育萬物，聖人感動人心而使天下太平安和。觀察萬物相互感應的方式，便能了解天地萬物真實的情狀！",
 xiang:"山上有澤，咸；君子以虛受人。",
 xiangX:"高山之上有沼澤，象徵彼此感應交流之象，君子觀此應虛懷若谷，以開放的心胸接納他人。",
 guaCiSeg:[{o:"咸：亨，",e:"咸卦象徵感應交流：亨通，",terms:["heng"]},{o:"利貞。",e:"有利於堅守正道，",terms:["li","zhen"]},{o:"取女吉。",e:"娶妻成家則吉祥。",terms:["ji"]}],
 tuanSeg:[{o:"咸，感也。柔上而剛下，二氣感應以相與，",e:"咸就是感應的意思；陰柔在上、陽剛在下，兩股氣息相互感應交流，"},{o:"止而說，男下女，是以亨利貞，取女吉也。",e:"內心止定又和悅，男子謙下追求女子，因此能亨通、有利、正固，娶妻成家便吉祥。",terms:["heng","li","zhen","ji"]},{o:"天地感而萬物化生，聖人感人心而天下和平。",e:"天地相互感應而化育萬物，聖人感動人心而使天下太平安和。"},{o:"觀其所感，而天地萬物之情可見矣！",e:"觀察萬物相互感應的方式，便能了解天地萬物真實的情狀！"}],
 xiangSeg:[{o:"山上有澤，咸；",e:"高山之上有沼澤，象徵彼此感應交流之象；"},{o:"君子以虛受人。",e:"君子觀此應虛懷若谷，以開放的心胸接納他人。",terms:["jun_zi"]}],
 yao:[
 ["初六","咸其拇。","感應初起，僅止於腳趾般輕微的觸動，尚未深入。","咸其拇，志在外也。","感應僅在腳趾之微，志向仍在向外探尋。"],
 ["六二","咸其腓，凶；居吉。","感應觸及小腿，若躁動行事有凶險，安靜守候則吉。","雖凶居吉，順不害也。","雖有凶險，安然自守便能無害而吉。"],
 ["九三","咸其股，執其隨，往吝。","感應觸及大腿，一味追隨他人而缺乏主見，前行將有遺憾。","咸其股，亦不處也；志在隨人，所執下也。","感應至此仍難以安處，志向僅在盲從他人，格局偏低。"],
 ["九四","貞吉，悔亡；憧憧往來，朋從爾思。","堅守正道則吉、悔恨消失；但若心緒不定、反覆思念，終將有朋友回應你的心思。","貞吉悔亡，未感害也；憧憧往來，未光大也。","堅守正道故無感應之害；心緒紛亂往來，尚未能光明正大。"],
 ["九五","咸其脢，无悔。","感應觸及背脊，較為深沉內斂，並無悔恨。","咸其脢，志末也。","感應至背脊，其志向已趨於末端而較為含蓄。"],
 ["上六","咸其輔頰舌。","感應僅止於口舌之間的言語交流，較為表面。","咸其輔頰舌，滕口說也。","感應僅止於口舌言談，流於表面的空談。"],
 ],
 a:"感情運勢極佳，彼此心意相通，適合表白或深化關係。",b:"人際互動順暢，容易獲得他人共鳴與支持。",c:"合作機會增多，以誠相待可為財運帶來助益。",
 en:{name:"Xián",title:"Mutual Influence",keyword:"Resonance and Connection",
  desc:"A lake resting upon a mountain: two hearts are in true resonance now — a favorable time to deepen an honest, mutual bond.",
  guaCi:"Xián: Success. Favorable to persevere. Taking a wife brings good fortune.",
  guaCiX:"Genuine mutual attraction, held with integrity, brings success — a fitting time for forming a lasting bond.",
  tuan:"Xián means to be influenced: the soft is above and the firm below; the two vital forces move and respond to one another, resting together in joy; the man places himself beneath the woman — hence success, favorable perseverance, and good fortune in taking a wife. Heaven and earth are influenced by one another, and all things are transformed and born; the sage influences the hearts of men, and the whole world lives in peace. Observing what truly moves and influences things, the deeper nature of heaven and earth and all creation may be seen!",
  tuanX:"Just as heaven and earth's own mutual influence gives rise to all living things, and a wise leader's genuine connection with others brings harmony to the world, observing what truly resonates between people reveals something deep about the nature of all things.",
  xiang:"A lake rests upon the mountain: this is Xián. Thus the noble one welcomes others with an open, receptive heart.",
  xiangX:"As the lake rests gently upon the mountain, a person of character receives others with a heart open and free of preconception.",
  yao:[
   ["1st (Six)","Influence felt in the big toe.","A faint, barely perceptible stirring — the earliest, most tentative sign of connection.","Influence felt in the big toe shows the will directed outward.","This is only the very first, outward-reaching stirring of intent."],
   ["2nd (Six)","Influence felt in the calf. Misfortune. Remaining still brings good fortune.","Acting hastily on a still-developing connection invites trouble — patience is wiser.","Though there is misfortune, remaining still brings good fortune, for stillness brings no harm.","Choosing patient stillness over hasty action is what avoids the harm here."],
   ["3rd (Nine)","Influence felt in the thighs, holding to what merely follows. Going forward brings difficulty.","Being led along passively by another's intent, without one's own direction, leads to trouble.","Influence felt in the thighs likewise shows one has not settled where to remain.","There is, as yet, no settled sense of one's own true position."],
   ["4th (Nine)","Perseverance brings good fortune, regret vanishes. Restless coming and going — only close friends will follow your thoughts.","A settled, genuine connection dissolves earlier doubts, though restless overthinking should be set aside.","Perseverance with good fortune, regret vanishing, means no harm has truly been done.","No real harm has come from this experience of uncertain restlessness."],
   ["5th (Nine)","Influence felt in the back of the neck. No regret.","A connection felt deeply, though somewhat impersonally, still carries no real fault.","Influence felt in the back of the neck shows the will has become rather superficial.","This is a connection that, in truth, has not gone particularly deep."],
   ["Top (Six)","Influence felt in the jaws, cheeks, and tongue.","A connection that remains only at the level of talk, without real substance beneath it.","Influence felt in the jaws, cheeks, and tongue is merely idle talk.","Such connection, resting only on words, remains largely superficial chatter."],
  ],
  a:"An excellent time for love — hearts are truly in sync, a good time to confess or deepen the bond.",b:"Interactions flow easily — you'll find genuine resonance and support from others.",c:"More collaboration opportunities arise — sincerity brings financial benefit."}
},
{n:32,s:"恆",f:"雷風恆",u:"震",l:"巽",k:"恆久不變",fortune:"小吉",
 desc:"恆久不變，指當前宜堅守正道、持之以恆，長久經營終將亨通順遂。",
 guaCi:"恆：亨，无咎，利貞，利有攸往。",
 guaCiX:"恆卦象徵持久不變：亨通、沒有災咎，有利於堅守正道，也適合有所前往。",
 tuan:"恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。恆亨无咎，利貞；久於其道也，天地之道，恆久而不已也。利有攸往，終則有始也。日月得天，而能久照，四時變化，而能久成，聖人久於其道，而天下化成；觀其所恆，而天地萬物之情可見矣！",
 tuanX:"恆就是長久的意思；陽剛在上、陰柔在下，雷與風相互配合，順從而又能行動，剛柔彼此相應，因此稱為恆；恆卦之所以亨通、沒有災咎，是因為能長久地堅守正道，這正如天地運行的道理，恆久不息；有利於前往，是因為事物終而復始、循環不絕；日月依循天道運行，因此能夠長久照耀；四季不斷變化，因此能夠長久地成就萬物；聖人長久地堅守正道，天下便能因此而受到教化成就；觀察事物恆久不變之處，便可以了解天地萬物真實的情狀！",
 xiang:"雷風，恆；君子以立不易方。",
 xiangX:"雷與風相互配合、恆常運行，君子觀此應堅定自身的立場與原則，不輕易改變方向。",
 guaCiSeg:[{o:"恆：亨，无咎，",e:"恆卦象徵持久不變：亨通、沒有災咎，",terms:["heng","wujiu"]},{o:"利貞，",e:"有利於堅守正道，",terms:["li","zhen"]},{o:"利有攸往。",e:"也適合有所前往。",terms:["li","youyouwang"]}],
 tuanSeg:[{o:"恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。",e:"恆就是長久的意思；陽剛在上、陰柔在下，雷與風相互配合，順從而又能行動，剛柔彼此相應，因此稱為恆。"},{o:"恆亨无咎，利貞；久于其道也，",e:"恆卦之所以亨通、沒有災咎，是因為能長久地堅守正道，",terms:["heng","wujiu","li","zhen"]},{o:"天地之道，恆久而不已也。",e:"這正如天地運行的道理，恆久不息。"},{o:"利有攸往，終則有始也。",e:"有利於前往，是因為事物終而復始、循環不絕。",terms:["li"]},{o:"日月得天，而能久照，四時變化，而能久成，",e:"日月依循天道運行，因此能夠長久照耀；四季不斷變化，因此能夠長久地成就萬物；"},{o:"聖人久於其道，而天下化成；",e:"聖人長久地堅守正道，天下便能因此而受到教化成就；"},{o:"觀其所恆，而天地萬物之情可見矣！",e:"觀察事物恆久不變之處，便可以了解天地萬物真實的情狀！"}],
 xiangSeg:[{o:"雷風，恆；",e:"雷與風相互配合、恆常運行；"},{o:"君子以立不易方。",e:"君子觀此應堅定自身的立場與原則，不輕易改變方向。",terms:["jun_zi"]}],
 yao:[
 ["初六","浚恆，貞凶，无攸利。","一開始便要求過深過久的恆常，即使堅守也有凶險，沒有益處。","浚恆之凶，始求深也。","一開始便苛求過深的恆久，故招致凶險。"],
 ["九二","悔亡。","悔恨消失，能持守中道而化解過失。","九二悔亡，能久中也。","悔恨得以消失，是因能長久保持中道。"],
 ["九三","不恆其德，或承之羞，貞吝。","無法長久保持應有的德行，可能因此蒙受羞辱，即使堅持也有遺憾。","不恆其德，无所容也。","德行無法恆久保持，將使自己無處容身。"],
 ["九四","田无禽。","如田獵卻無所擒獲，象徵努力落空、徒勞無功。","久非其位，安得禽也。","長久處在不恰當的位置，又怎能有所收穫呢。"],
 ["六五","恆其德，貞；婦人吉，夫子凶。","恆久保持柔順的德行、堅守正道，對婦人而言吉祥，但對於當有所作為的男子則不宜。","婦人貞吉，從一而終也；夫子制義，從婦凶也。","婦人堅守貞節、從一而終故吉；男子理應依義行事，若一味順從則有凶。"],
 ["上六","振恆，凶。","躁動不安、無法安於恆常之道，凶險。","振恆在上，大无功也。","居於上位卻躁動不安，終將徒勞無功。"],
 ],
 a:"感情宜細水長流，長久經營勝過一時激情。",b:"事業運穩定，持續累積、堅守本業終有所成。",c:"財運穩健，適合長期規劃，避免頻繁更換策略。",
 en:{name:"Héng",title:"Duration",keyword:"Lasting Constancy",
  desc:"Thunder and wind moving in accord: steadfast, patient consistency — not sudden change — is what brings lasting success now.",
  guaCi:"Héng: Success, no blame. Favorable to persevere. Favorable to have somewhere to go.",
  guaCiX:"Steady constancy leads to success, and it is a favorable time both to hold firm and to move forward.",
  tuan:"Héng means to endure: the firm is above and the soft below; thunder and wind work together; gentle yet moving; firm and soft all respond to one another — this is Héng. Success, no blame, favorable perseverance — this comes from enduring long in one's own proper way. The way of heaven and earth is to endure long without ceasing. Favorable to have somewhere to go, for what ends will begin again. The sun and moon, in accord with heaven, are able to shine long; the four seasons change and transform, able to bring things to completion for a long time; the sage endures long in his own way, and the world is transformed and completed. Observing what truly endures, the deeper nature of heaven and earth and all creation may be seen!",
  tuanX:"Genuine constancy, like thunder and wind working in harmony, is the natural way of heaven and earth itself; sustained faithfulness over time is what allows real transformation and completion to unfold.",
  xiang:"Thunder and wind: this is Héng. Thus the noble one stands firm and does not change his direction.",
  xiangX:"As thunder and wind move together in constant, mutual accord, a person of character stands firm and does not waver from their principles.",
  yao:[
   ["1st (Six)","Seeking duration too hastily and deeply. Perseverance brings misfortune; nothing favorable.","Demanding lasting commitment too soon, before real trust has formed, ends badly.","Seeking duration too hastily from the very start comes from asking too much too soon.","Such premature demand for depth is the true source of this misfortune."],
   ["2nd (Nine)","Regret vanishes.","Whatever earlier difficulty existed here has now resolved on its own.","The vanishing regret of the second line comes from a truly enduring, centered nature.","A genuinely steady, balanced character is what dissolves this earlier regret."],
   ["3rd (Nine)","Not enduring in one's own virtue; perhaps meeting with disgrace. Perseverance brings regret.","Inconsistency of character, even while persisting, risks real shame and regret.","Not enduring in one's own virtue leaves nowhere for oneself to be accepted.","Such inconsistency leaves no stable ground on which to be truly trusted."],
   ["4th (Nine)","Game in the field, but nothing caught.","Effort spent in the wrong place or manner yields nothing, however hard one tries.","How, remaining long in a position not truly one's own, can anything be caught?","Persisting in an ill-fitting role simply cannot yield any real result."],
   ["5th (Six)","Enduring in one's virtue. Perseverance is good fortune for a woman, misfortune for a man.","Steadfast, yielding constancy suits one role well but proves unfitting demanded of another.","A woman's constancy and good fortune comes from following one man faithfully to the end.","This kind of unwavering, singular devotion suits a receptive role well."],
   ["Top (Six)","Restless duration. Misfortune.","Constant agitation, rather than settled steadiness, brings only misfortune.","The misfortune of restless duration at the very top brings, in the end, no real achievement.","Such persistent restlessness ultimately amounts to nothing of real value."],
  ],
  a:"Favor a slow, steady approach to love over short bursts of passion.",b:"Career is stable — steady accumulation in your field pays off over time.",c:"Finances are sound — plan long-term and avoid switching strategies too often."}
},
{n:33,s:"遯",f:"天山遯",u:"乾",l:"艮",k:"知機而退",fortune:"平",
 desc:"知機而退，指目前局勢不利，宜及時抽身、保存實力，靜待東山再起。",
 guaCi:"遯：亨，小利貞。",
 guaCiX:"遯卦象徵知機而退：亨通，小有利於堅守正道。",
 tuan:"遯亨，遯而亨也；剛當位而應，與時行也。小利貞，浸而長也。遯之時義大矣哉！",
 tuanX:"遯卦之所以亨通，是因為懂得適時隱退才能亨通；陽剛居於恰當之位並能相應，能順應時勢而行動；小有利於堅守正道，是因為陰柔之勢正逐漸增長；懂得適時隱退的道理，其意義實在深遠重大！",
 xiang:"天下有山，遯；君子以遠小人，不惡而嚴。",
 xiangX:"天下有高山阻隔，象徵退隱遠離之象，君子觀此應遠離小人，態度上不必顯露厭惡，但仍應保持莊重威嚴。",
 guaCiSeg:[{o:"遯：亨，",e:"遯卦象徵知機而退：亨通，",terms:["heng"]},{o:"小利貞。",e:"小有利於堅守正道。",terms:["li","zhen"]}],
 tuanSeg:[{o:"遯亨，遯而亨也；",e:"遯卦之所以亨通，是因為懂得適時隱退才能亨通；",terms:["heng"]},{o:"剛當位而應，與時行也。",e:"陽剛居於恰當之位並能相應，能順應時勢而行動。",terms:["shi"]},{o:"小利貞，浸而長也。",e:"小有利於堅守正道，是因為陰柔之勢正逐漸增長。",terms:["li","zhen"]},{o:"遯之時義大矣哉！",e:"懂得適時隱退的道理，其意義實在深遠重大！",terms:["shi"]}],
 xiangSeg:[{o:"天下有山，遯；",e:"天下有高山阻隔，象徵退隱遠離之象；"},{o:"君子以遠小人，不惡而嚴。",e:"君子觀此應遠離小人，態度上不必顯露厭惡，但仍應保持莊重威嚴。",terms:["jun_zi","xiao_ren"]}],
 yao:[
 ["初六","遯尾，厲；勿用有攸往。","隱退落後於人、居於末位，有危險，此時不宜有所前往行動。","遯尾之厲，不往何災也。","身處隱退之尾端的危險，若不貿然前往便無災禍。"],
 ["六二","執之用黃牛之革，莫之勝說。","以牢固的黃牛皮繩緊緊繫住決心，任誰也無法使其動搖解脫。","執用黃牛，固志也。","以牢固的方式執守，是為了堅定隱退的志向。"],
 ["九三","係遯，有疾厲；畜臣妾，吉。","心有牽掛而難以徹底隱退，如患病般危險；但若只是持家蓄養眷屬，則尚可吉。","係遯之厲，有疾憊也；畜臣妾吉，不可大事也。","心有牽繫而隱退不徹底，如患病般疲憊；持家蓄養尚可，但不可擔當大事。"],
 ["九四","好遯，君子吉，小人否。","樂於隱退、放下執著，君子能得吉祥，但小人卻難以做到。","君子好遯，小人否也。","君子樂於隱退放下，小人卻難以割捨。"],
 ["九五","嘉遯，貞吉。","以美善的方式適時隱退，堅守正道則吉。","嘉遯貞吉，以正志也。","以美善的方式隱退而獲吉，是因志向端正。"],
 ["上九","肥遯，无不利。","從容寬裕、毫無牽掛地隱退，無所不利。","肥遯无不利，无所疑也。","從容隱退而無所不利，是因心中毫無疑慮牽掛。"],
 ],
 a:"感情狀況不明朗，適時保持距離、觀察後續發展。",b:"局勢不利時宜暫時退讓，保存實力伺機而動。",c:"財運轉弱，宜適時收手、減少曝險部位。",
 en:{name:"Dùn",title:"Retreat",keyword:"Timely Withdrawal",
  desc:"Heaven rising above the mountain: circumstances now call for a graceful, well-timed withdrawal rather than continued advance.",
  guaCi:"Dùn: Success. Small gain in perseverance.",
  guaCiX:"A quiet, dignified withdrawal brings success, with modest benefit in staying true to one's course.",
  tuan:"Dùn brings success in its very retreat; the firm holds a rightful place and responds — moving in accord with the times. Small gain in perseverance shows the small-minded are gradually growing. The timeliness of retreat carries a truly great meaning.",
  tuanX:"There is real wisdom in withdrawing at the right moment, when lesser influences are on the rise; understanding when to step back, rather than press forward, carries deep significance.",
  xiang:"Beneath heaven there is a mountain: this is Dùn. Thus the noble one keeps his distance from the small-minded, not through hostility, but through dignified reserve.",
  xiangX:"As heaven stands apart, high above the mountain, a person of character keeps a respectful distance from petty influences, firm yet without open hostility.",
  yao:[
   ["1st (Six)","Retreating with the tail. Danger. Do not act in this manner.","Retreating from a position of weakness, at the very rear, is precarious — better to stay put for now.","The danger of retreating with the tail comes from not going forth, so what disaster could there be?","Simply not advancing avoids any real disaster in this precarious position."],
   ["2nd (Six)","Holding fast with the hide of a yellow ox; nothing can loosen this grip.","A firm, resolute inner resolve holds one steady, unshaken by outside pressure.","Holding fast with yellow ox hide means the resolve is truly firm.","This is a resolve that simply will not be shaken."],
   ["3rd (Nine)","A bound retreat. There is trouble and danger; keeping servants and concubines brings good fortune.","A withdrawal hampered by lingering ties involves real strain, though modest domestic matters may still go well.","The danger of a bound retreat brings real weariness and distress; keeping servants and concubines with good fortune means one cannot yet handle great affairs.","Such lingering entanglement leaves one unable, for now, to take on major undertakings."],
   ["4th (Nine)","A willing retreat. Good fortune for the noble one; misfortune for the small-minded.","A retreat chosen freely and wisely, rather than reluctantly, is good for the principled, though not for the petty-minded.","The willing retreat of the noble one comes from the small-minded being unable to do the same.","Only genuine integrity allows one to withdraw so freely and well."],
   ["5th (Nine)","A graceful retreat. Perseverance brings good fortune.","Withdrawing with real dignity and composure, held steadily, brings good fortune.","The good fortune of a graceful retreat, through perseverance, comes from a will kept correct and true.","Maintaining a correct, principled resolve is what makes this retreat so graceful."],
   ["Top (Nine)","A bountiful retreat. Nothing unfavorable.","A withdrawal made with full clarity and generosity of spirit brings only good.","The bountiful retreat of the topmost line comes from a mind entirely free of doubt.","A mind completely free of hesitation is what makes this final withdrawal so complete."],
  ],
  a:"The relationship's direction is unclear — keep some distance and observe how it develops.",b:"When circumstances turn unfavorable, step back and conserve strength for the right moment.",c:"Finances are weakening — scale back exposure while you can."}
},
{n:34,s:"大壯",f:"雷天大壯",u:"震",l:"乾",k:"剛健壯盛",fortune:"小吉",
 desc:"剛健壯盛，指眼前氣勢強盛、宜積極進取，但仍須謹守分寸避免躁進。",
 guaCi:"大壯：利貞。",
 guaCiX:"大壯卦象徵剛健壯盛：有利於堅守正道。",
 tuan:"大壯，大者壯也，剛以動，故壯。大壯利貞，大者正也。正大而天地之情可見矣！",
 tuanX:"大壯就是陽剛盛大壯盛的意思，剛強而又能行動，因此稱為壯盛；大壯之所以利於堅守正道，是因為壯盛之時更應合乎正道；能夠正大光明，天地萬物的真實情狀便可由此得見！",
 xiang:"雷在天上，大壯；君子以非禮弗履。",
 xiangX:"雷聲響徹天上，聲勢盛大，象徵剛健壯盛之象，君子觀此應謹守禮法，不合禮法的事絕不去做。",
 guaCiSeg:[{o:"大壯：利貞。",e:"大壯卦象徵剛健壯盛：有利於堅守正道。",terms:["li","zhen"]}],
 tuanSeg:[{o:"大壯，大者壯也，剛以動，故壯。",e:"大壯就是陽剛盛大壯盛的意思，剛強而又能行動，因此稱為壯盛。"},{o:"大壯利貞，大者正也。",e:"大壯之所以利於堅守正道，是因為壯盛之時更應合乎正道。",terms:["li","zhen"]},{o:"正大而天地之情可見矣！",e:"能夠正大光明，天地萬物的真實情狀便可由此得見！"}],
 xiangSeg:[{o:"雷在天上，大壯；",e:"雷聲響徹天上，聲勢盛大，象徵剛健壯盛之象；"},{o:"君子以非禮弗履。",e:"君子觀此應謹守禮法，不合禮法的事絕不去做。",terms:["jun_zi"]}],
 yao:[
 ["初九","壯于趾，征凶，有孚。","剛強之氣顯現於腳趾般初起躁動，貿然前行有凶險，但仍心懷誠信。","壯于趾，其孚窮也。","僅是腳趾般初起的壯盛，若躁進其誠信也將窮盡。"],
 ["九二","貞吉。","堅守正道，吉祥。","九二貞吉，以中也。","堅守正道而獲吉，是因居中而行。"],
 ["九三","小人用壯，君子用罔；貞厲，羝羊觸藩，羸其角。","小人一味逞強，君子則懂得節制；若堅持剛猛如公羊撞擊籬笆，恐傷及自身。","小人用壯，君子罔也。","小人一味恃強，君子則能有所節制而不為。"],
 ["九四","貞吉，悔亡；藩決不羸，壯于大輿之輹。","堅守正道則吉、悔恨消失；如籬笆已破開而角未受傷，壯盛之力如大車之輪軸般穩固。","藩決不羸，尚往也。","籬笆已破而角未受損，正宜繼續前行。"],
 ["六五","喪羊于易，无悔。","在平坦之地不慎失去羊群，雖有損失但並無悔恨。","喪羊于易，位不當也。","損失發生，是因所處之位不甚恰當。"],
 ["上六","羝羊觸藩，不能退，不能遂，无攸利；艱則吉。","如公羊撞入籬笆進退不得，沒有益處；唯有艱苦忍耐堅持才能轉為吉祥。","不能退不能遂，不詳也；艱則吉，咎不長也。","進退兩難是不夠周詳謹慎所致；艱苦忍耐終能吉祥，過咎不會長久持續。"],
 ],
 a:"感情運勢旺盛，但勿過於強勢，宜剛柔並濟。",b:"事業氣勢強勁，適合積極進取，但勿躁進莽撞。",c:"財運旺盛，可積極布局，但避免過度擴張風險。",
 en:{name:"Dà Zhuàng",title:"Great Vigor",keyword:"Power in Restraint",
  desc:"Thunder resounding high above heaven: real strength is available now, but only when guided by real restraint does it bring lasting benefit.",
  guaCi:"Dà Zhuàng: Favorable to persevere.",
  guaCiX:"Great strength is present now — the key to using it well is to stay firmly on the right path.",
  tuan:"Dà Zhuàng: the great is vigorous. Strong and moving with it — hence its vigor. 'Great vigor, favorable to persevere' means the great must be correct. Being both great and correct, the nature of heaven and earth may be seen!",
  tuanX:"True greatness of power is only meaningful when joined with genuine rightness — this pairing of real strength and real integrity reveals something essential about the natural order itself.",
  xiang:"Thunder resounds high above heaven: this is Dà Zhuàng. Thus the noble one does not tread where it is contrary to proper conduct.",
  xiangX:"As thunder's power resounds high above even the sky itself, a person of character never acts in a way that violates what is right.",
  yao:[
   ["1st (Nine)","Vigor in the toes. To press forward brings misfortune; this much is certain.","Overeager strength shown too early, without real readiness, leads to misfortune.","Vigor in the toes shows sincerity has, in truth, reached its limit.","Such premature strength has already exhausted its true substance."],
   ["2nd (Nine)","Perseverance brings good fortune.","Steady, balanced strength, held with integrity, brings good fortune.","The good fortune of perseverance at the second line comes from being centered.","A genuinely centered, balanced position is what secures this good fortune."],
   ["3rd (Nine)","The small-minded rely on their vigor; the noble one relies on none of it. Perseverance carries danger. A ram butting a hedge entangles its horns.","Overreliance on brute strength, without restraint, courts real danger regardless of who wields it.","The small-minded rely on their vigor; the noble one, in contrast, exercises restraint.","Real strength of character shows itself through restraint, not display."],
   ["4th (Nine)","Perseverance brings good fortune, regret vanishes. The hedge opens and there is no entanglement; vigor is found in the axle-straps of a great cart.","Persistent effort, now well applied, clears the earlier obstacle and moves forward with real capability.","The hedge opens without entanglement, and so one continues onward.","The way forward is now genuinely clear, without further resistance."],
   ["5th (Six)","Losing the ram with ease. No regret.","Letting go of stubborn resistance calmly and without struggle leaves no regret.","Losing the ram with ease comes from being in a position that is simply not fitting.","This somewhat awkward position is why the resistance had to be released."],
   ["Top (Six)","A ram butts against the hedge; it cannot retreat, cannot advance. Nothing is favorable. Yet through hardship, there is good fortune.","Stuck in a genuine impasse, neither able to advance nor retreat, but patient endurance still brings eventual good fortune.","Being unable to retreat or advance comes from a lack of real care; through hardship, good fortune means the fault will not long continue.","With careful, sustained effort, this awkward impasse need not last."],
  ],
  a:"Love is thriving, but don't be overbearing — balance strength with gentleness.",b:"Strong momentum at work — push forward, but avoid rash or reckless moves.",c:"Finances are strong — invest boldly but avoid overextending."}
},
{n:35,s:"晉",f:"火地晉",u:"離",l:"坤",k:"晉升向上",fortune:"小吉",
 desc:"晉升向上，指目前正是向上發展、備受提拔的好時機，宜積極把握。",
 guaCi:"晉：康侯用錫馬蕃庶，晝日三接。",
 guaCiX:"晉卦象徵晉升向上：如同安邦定國的諸侯獲賜眾多車馬，並在一日之內三次受到接見，備受禮遇。",
 tuan:"晉，進也。明出地上，順而麗乎大明，柔進而上行，是以康侯用錫馬蕃庶，晝日三接也。",
 tuanX:"晉就是前進上升的意思；光明從地面升起，柔順地依附於盛大的光明，並且柔順地向上晉升，因此才有安邦諸侯獲賜眾多車馬、一日三次受到接見的殊榮。",
 xiang:"明出地上，晉；君子以自昭明德。",
 xiangX:"光明從地面升起，象徵晉升上進之象，君子觀此應自我彰顯，發揚光明的德行。",
 guaCiSeg:[{o:"晉：康侯用錫馬蕃庶，",e:"晉卦象徵晉升向上：如同安邦定國的諸侯獲賜眾多車馬，"},{o:"晝日三接。",e:"並在一日之內三次受到接見，備受禮遇。"}],
 tuanSeg:[{o:"晉，進也。明出地上，順而麗乎大明，",e:"晉就是前進上升的意思；光明從地面升起，柔順地依附於盛大的光明，"},{o:"柔進而上行，是以康侯用錫馬蕃庶，晝日三接也。",e:"並且柔順地向上晉升，因此才有安邦諸侯獲賜眾多車馬、一日三次受到接見的殊榮。"}],
 xiangSeg:[{o:"明出地上，晉；",e:"光明從地面升起，象徵晉升上進之象；"},{o:"君子以自昭明德。",e:"君子觀此應自我彰顯，發揚光明的德行。",terms:["jun_zi"]}],
 yao:[
 ["初六","晉如摧如，貞吉；罔孚，裕，无咎。","晉升過程中或有受挫，堅守正道則吉；即使未獲信任，寬裕以待亦無咎。","晉如摧如，獨行正也；裕无咎，未受命也。","晉升受挫仍能獨自堅持正道；寬裕自處而無咎，是因尚未正式受命任事。"],
 ["六二","晉如，愁如，貞吉；受茲介福，于其王母。","晉升過程或有憂愁，堅守正道則吉，將如受祖母庇蔭般獲得大福。","受茲介福，以中正也。","能承受這樣的大福，是因秉持中正之道。"],
 ["六三","眾允，悔亡。","獲得眾人的信任支持，悔恨消失。","眾允之，志上行也。","眾人信服支持，志向得以向上發展。"],
 ["九四","晉如鼫鼠，貞厲。","晉升時如碩鼠般貪婪多疑，即使堅守也有危險。","鼫鼠貞厲，位不當也。","如碩鼠般行事而有危險，是因所處之位並不恰當。"],
 ["六五","悔亡，失得勿恤；往吉，无不利。","悔恨消失，得失不必過於憂慮；前往行事吉祥，無所不利。","失得勿恤，往有慶也。","不計較一時得失，前往行事必有喜慶之事。"],
 ["上九","晉其角，維用伐邑，厲吉，无咎；貞吝。","晉升至極如觸及頭角，僅適合用於整肅內部事務，雖有危險仍吉，但堅持下去終有遺憾。","維用伐邑，道未光也。","僅適合用於整肅內部，是因正道尚未能完全光大。"],
 ],
 a:"感情關係向上發展，適合更進一步、公開關係。",b:"升遷或表現獲得肯定的好時機，宜積極爭取。",c:"財運上升，收入有望增加，適合適度加碼。",
 en:{name:"Jìn",title:"Advance",keyword:"Recognized Progress",
  desc:"The sun rising over the earth: a favorable moment to move forward and be seen, as steady progress earns genuine recognition.",
  guaCi:"Jìn: A peaceable lord is honored with horses in great numbers, received three times in a single day.",
  guaCiX:"Genuine merit is now being warmly and repeatedly recognized — a favorable time to accept the trust extended to you.",
  tuan:"Jìn means to advance: brightness emerges above the earth; gentle and yet attached to great brightness; the soft advances and moves upward — hence a peaceable lord is honored with horses in great numbers, received three times in a single day.",
  tuanX:"Like the sun rising and casting light across the earth, genuine, gentle advancement — attached to a truly bright cause — is warmly recognized and rewarded.",
  xiang:"Brightness emerges above the earth: this is Jìn. Thus the noble one, of his own accord, makes his bright virtue ever clearer.",
  xiangX:"As the sun rises to shine over the earth, a person of character makes their own inner brightness of virtue ever clearer through their own effort.",
  yao:[
   ["1st (Six)","Advancing, then held back. Perseverance brings good fortune. If trust is not yet given, remain generous and calm; no blame.","Progress meets an early check — staying steady and open-hearted, even without recognition, is the sound course.","Advancing and being held back means to go forth alone with what is correct; remaining generous and calm without blame means the mandate has not yet been received.","Since formal recognition has not yet arrived, patient integrity is what carries this through."],
   ["2nd (Six)","Advancing with sorrow. Perseverance brings good fortune. Receiving this great blessing from one's own grandmother.","Progress that comes with some hardship, if met with integrity, still brings good fortune and unexpected blessing.","The good fortune of receiving this great blessing comes from a balanced, correct position.","This balanced, correct standing is what allows such an unexpected blessing to arrive."],
   ["3rd (Six)","The trust of the multitude. Regret vanishes.","Widespread trust and support dissolves any earlier doubt or difficulty.","The will expressed by the trust of the multitude moves things forward.","Such broad support is what carries genuine progress forward here."],
   ["4th (Nine)","Advancing like a large rodent. Perseverance carries danger.","Advancing through timid, furtive means, rather than openly, remains precarious even when persisted in.","The danger of advancing like a large rodent comes from a position that is simply not fitting.","This ill-suited position is what makes such a cautious, furtive advance risky."],
   ["5th (Six)","Regret vanishes. Loss and gain need not be a concern; going forward brings good fortune, nothing unfavorable.","Whatever earlier worry existed dissolves now — advancing without fixating on gain or loss brings good fortune.","Loss and gain not a concern, going forward brings good fortune, and this achievement is a matter for real celebration.","Such an unattached, forward-moving spirit is genuinely worth celebrating."],
   ["Top (Nine)","Advancing the horns. Fitting only to subdue one's own city; danger, yet good fortune, no blame. Yet perseverance still brings some regret.","Firm, corrective action, used only within one's own sphere, is sound and ultimately fortunate, though not entirely free of lingering difficulty.","Advancing the horns to subdue the city shows the way is not yet fully bright.","This limited scope of correction shows the deeper aim has not yet fully come to light."],
  ],
  a:"The relationship is progressing — a good time to go public or take the next step.",b:"A good time for promotion or recognition — pursue it actively.",c:"Income is rising — a good time to add moderately to your position."}
},
{n:36,s:"明夷",f:"地火明夷",u:"坤",l:"離",k:"韜光養晦",fortune:"大凶",
 desc:"韜光養晦，指當前處境艱難、光明受阻，宜收斂鋒芒、暗中蓄積實力。",
 guaCi:"明夷：利艱貞。",
 guaCiX:"明夷卦象徵光明受損：此時處境艱難，宜堅守正道、韜光養晦以自保。",
 tuan:"明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。利艱貞，晦其明也。內難而能正其志，箕子以之。",
 tuanX:"光明沒入大地之中，這便是明夷之象；內心光明而外表柔順，藉此度過重大的患難，周文王便是以此道自處；此時有利於堅守正道、忍受艱難，是要收斂自身的光明、韜光養晦；身處內部的患難之中仍能端正自己的心志，殷代箕子便是以此道自處。",
 xiang:"明入地中，明夷；君子以蒞眾，用晦而明。",
 xiangX:"光明沒入大地之中，象徵光明受到遮蔽之象，君子觀此在治理眾人時，應懂得韜光養晦、外表隱晦而內心明察。",
 guaCiSeg:[{o:"明夷：利艱貞。",e:"明夷卦象徵光明受損：此時處境艱難，宜堅守正道、韜光養晦以自保。",terms:["li","zhen"]}],
 tuanSeg:[{o:"明入地中，明夷。",e:"光明沒入大地之中，這便是明夷之象。"},{o:"內文明而外柔順，以蒙大難，文王以之。",e:"內心光明而外表柔順，藉此度過重大的患難，周文王便是以此道自處。"},{o:"利艱貞，晦其明也。",e:"此時有利於堅守正道、忍受艱難，是要收斂自身的光明、韜光養晦。",terms:["li","zhen"]},{o:"內難而能正其志，箕子以之。",e:"身處內部的患難之中仍能端正自己的心志，殷代箕子便是以此道自處。",terms:["zhi"]}],
 xiangSeg:[{o:"明入地中，明夷；",e:"光明沒入大地之中，象徵光明受到遮蔽之象；"},{o:"君子以蒞眾，用晦而明。",e:"君子觀此在治理眾人時，應懂得韜光養晦、外表隱晦而內心明察。",terms:["jun_zi"]}],
 yao:[
 ["初九","明夷于飛，垂其翼；君子于行，三日不食，有攸往，主人有言。","光明受損之時如鳥兒飛行卻垂下翅膀，君子行事艱難、忍飢前行，難免受人議論。","君子于行，義不食也。","君子行於此道，依理當忍受飢餓困頓。"],
 ["六二","明夷，夷于左股，用拯馬壯，吉。","光明受損及於左腿，藉助強壯的馬匹得以拯救脫困，吉祥。","六二之吉，順以則也。","能獲吉祥，是因順從並依循應有的法則。"],
 ["九三","明夷于南狩，得其大首，不可疾貞。","於南方狩獵般主動出擊、擒得首惡，但不可操之過急，仍須循序漸進守正。","南狩之志，乃大得也。","南行征討的志向，終能有重大的收穫。"],
 ["六四","入于左腹，獲明夷之心，于出門庭。","深入敵人核心之地，洞悉光明受損的真正緣由，進而得以脫離險境。","入于左腹，獲心意也。","深入核心之地，是為了獲知其中真正的心意用心。"],
 ["六五","箕子之明夷，利貞。","如箕子身處危局仍佯狂自晦以保全志節，堅守正道有利。","箕子之貞，明不可息也。","箕子堅守的正道，正是內心的光明永不熄滅。"],
 ["上六","不明，晦；初登于天，後入于地。","起初光明顯赫如登天，最終卻陷入完全的黑暗與沉淪。","初登于天，照四國也；後入于地，失則也。","起初光明高照四方國度；最終沒入黑暗，是因失去了應有的法度。"],
 ],
 a:"感情中可能遭遇誤解或委屈，宜低調處理、保護自己。",b:"職場環境不利，宜韜光養晦、暫避鋒芒。",c:"財運黯淡，宜保守謹慎，避免公開炫耀資產。",
 en:{name:"Míng Yí",title:"Light Obscured",keyword:"Hidden Integrity",
  desc:"The sun sinking beneath the earth: real light is now hidden away — the wise course is to guard your integrity quietly rather than display it openly.",
  guaCi:"Míng Yí: Favorable to persevere through hardship.",
  guaCiX:"In a time when brightness is deliberately suppressed, perseverance through real difficulty is the fitting response.",
  tuan:"Brightness entering into the earth: this is Míng Yí. Cultured and refined within, yet gentle and yielding without, thereby enduring great hardship — this is the way King Wen faced it. 'Favorable to persevere through hardship' means dimming one's own brightness. In hardship within, yet still able to keep one's resolve correct — this is the way Prince Jì faced it.",
  tuanX:"Concealing one's real brightness beneath outward gentleness, as wise figures of the past did in dangerous times, is how integrity survives severe hardship without being extinguished.",
  xiang:"Brightness entering into the earth: this is Míng Yí. Thus the noble one, in overseeing the multitude, uses obscurity while himself remaining clear-sighted.",
  xiangX:"As brightness sinks below the earth and out of sight, a person of character governs others while quietly concealing their own true clarity.",
  yao:[
   ["1st (Nine)","Light obscured in flight, wings drooping low; the noble one journeys on, going three days without eating. There is somewhere to go, yet the host has words of complaint.","Even amid unjust hardship and misunderstanding, the principled person presses on, accepting some criticism along the way.","The noble one journeys on, for it is right that he does not eat.","This willingness to endure hardship is, in principle, exactly right here."],
   ["2nd (Six)","Light obscured, injuring the left thigh. Rescued by a strong horse. Good fortune.","Even when wounded by circumstance, timely and capable help brings real recovery.","The good fortune of the second line comes from obedience to what is right and proper.","Willing compliance with the correct principle is what brings this rescue and recovery."],
   ["3rd (Nine)","Light obscured during a southern hunt, capturing its great leader; one should not be too hasty in this correction.","Actively confronting the source of injustice succeeds, but should be pursued patiently, not rashly.","The purpose of the southern hunt is achieved, greatly and truly.","This is a real and significant achievement, fully realized."],
   ["4th (Six)","Entering the left side of the belly, grasping the very heart of light obscured, then going out through the courtyard gate.","Penetrating deeply into a difficult situation to understand it fully, then finding a way clear of it.","Entering the left side of the belly means grasping the true intent and meaning.","This deep penetration is what reveals the real underlying intent."],
   ["5th (Six)","The light obscured of Prince Jì. Favorable to persevere.","Following the model of quiet, resolute integrity under real oppression is the sound course.","The constancy of Prince Jì means his brightness could never truly be extinguished.","Genuine inner integrity of this kind cannot ultimately be put out."],
   ["Top (Six)","Not light, but darkness: first rising to heaven, then sinking into the earth.","A power that begins in glory but ends in total downfall, having lost its way entirely.","First rising to heaven means shining upon the four quarters of the world; later sinking into the earth means the proper measure has been lost.","This total loss of the right principle is what leads to such a complete downfall."],
  ],
  a:"You may face misunderstanding or unfair treatment — handle it quietly and protect yourself.",b:"The work environment is unfavorable — keep a low profile for now.",c:"Finances are dim — stay conservative and avoid flaunting assets."}
},
{n:37,s:"家人",f:"風火家人",u:"巽",l:"離",k:"齊家之道",fortune:"小吉",
 desc:"齊家之道，指目前宜各安其分、同心協力，家庭和睦則萬事興旺。",
 guaCi:"家人：利女貞。",
 guaCiX:"家人卦象徵齊家之道：有利於女子堅守正道，家庭因此得以和睦安定。",
 tuan:"家人，女正位乎內，男正位乎外，男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正；正家而天下定矣。",
 tuanX:"家人卦中，女子端正地居於內位，男子端正地居於外位，男女各安其位、各正其道，這正是天地間的重大義理；一家之中有威嚴的主事者，指的便是父母；父親盡父親的責任、兒子盡兒子的本分，兄長、弟弟、丈夫、妻子皆各守其道，家庭的倫常便能端正；家庭端正了，天下也就因此安定。",
 xiang:"風自火出，家人；君子以言有物而行有恆。",
 xiangX:"風從火中生出，象徵由內而外的教化之象，君子觀此應言語有實質內容，行為則保持恆常一致。",
 guaCiSeg:[{o:"家人：利女貞。",e:"家人卦象徵齊家之道：有利於女子堅守正道，家庭因此得以和睦安定。",terms:["li","zhen"]}],
 tuanSeg:[{o:"家人，女正位乎內，男正位乎外，男女正，天地之大義也。",e:"家人卦中，女子端正地居於內位，男子端正地居於外位，男女各安其位、各正其道，這正是天地間的重大義理。"},{o:"家人有嚴君焉，父母之謂也。",e:"一家之中有威嚴的主事者，指的便是父母。"},{o:"父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正；正家而天下定矣。",e:"父親盡父親的責任、兒子盡兒子的本分，兄長、弟弟、丈夫、妻子皆各守其道，家庭的倫常便能端正；家庭端正了，天下也就因此安定。"}],
 xiangSeg:[{o:"風自火出，家人；",e:"風從火中生出，象徵由內而外的教化之象；"},{o:"君子以言有物而行有恆。",e:"君子觀此應言語有實質內容，行為則保持恆常一致。",terms:["jun_zi"]}],
 yao:[
 ["初九","閑有家，悔亡。","及早防範、建立家中規範，悔恨消失。","閑有家，志未變也。","及早防範規範家中事務，心志尚未有所改變偏差。"],
 ["六二","无攸遂，在中饋，貞吉。","不擅自成就個人事業，專心於家中飲食等內務，堅守正道則吉。","六二之吉，順以巽也。","能獲吉祥，是因順從且謙遜柔順。"],
 ["九三","家人嗃嗃，悔厲，吉；婦子嘻嘻，終吝。","家中治理嚴格甚至略顯苛厲雖有悔恨危險，但終究吉祥；若一味放縱嬉笑，最終將有遺憾。","家人嗃嗃，未失也；婦子嘻嘻，失家節也。","家規嚴格尚未失去分寸；若婦孺一味嬉笑放縱，便失去了家庭應有的節度。"],
 ["六四","富家，大吉。","使家庭富裕興旺，大為吉祥。","富家大吉，順在位也。","家庭富裕而大吉，是因居位順當、治理有方。"],
 ["九五","王假有家，勿恤，吉。","如君王般以誠意感化整頓家庭，不必過於憂慮，吉祥。","王假有家，交相愛也。","君王以誠意治家，是因彼此交相愛護的緣故。"],
 ["上九","有孚威如，終吉。","心懷誠信又兼具適度威嚴，最終吉祥。","威如之吉，反身之謂也。","具備威嚴而獲吉，關鍵在於反求諸己、以身作則。"],
 ],
 a:"適合認真經營穩定關係，重視家庭與責任。",b:"團隊分工明確、各司其職，有助提升整體效率。",c:"家庭財務宜共同規劃，量入為出、分工管理。",
 en:{name:"Jiā Rén",title:"The Family",keyword:"Domestic Order",
  desc:"Wind arising from fire: harmony at home comes when each person plays their proper role — a good time to attend to family and shared responsibility.",
  guaCi:"Jiā Rén: Favorable for a woman's perseverance.",
  guaCiX:"Steady, principled conduct within the household — especially from those who tend and sustain it — is what this moment favors.",
  tuan:"In Jiā Rén, the woman finds her rightful place within, and the man his rightful place without; man and woman each correct — this is the great principle of heaven and earth. In the family there is a stern authority — this refers to the parents. When the father is truly a father, the son truly a son, the elder brother truly an elder brother, the younger truly a younger, the husband truly a husband, the wife truly a wife, then the way of the family is correct; and when the family is correct, the whole world is settled.",
  tuanX:"Just as heaven and earth each have their rightful place, so too does harmony within the family depend on each member truly fulfilling their own proper role — and a well-ordered family is, in turn, the foundation of a well-ordered world.",
  xiang:"Wind arises from fire: this is Jiā Rén. Thus the noble one's words have real substance, and his conduct has real constancy.",
  xiangX:"As wind arises naturally from fire, a person of character speaks with real substance behind their words and acts with real consistency.",
  yao:[
   ["1st (Nine)","Guarding the family with firm boundaries from the start. Regret vanishes.","Establishing clear, sound order within the household early on prevents later regret.","Guarding the family with firm boundaries means the resolve has not yet wavered.","This is simply a matter of firm, unwavering early resolve."],
   ["2nd (Six)","Nothing accomplished on her own initiative; she attends to the meals within. Perseverance brings good fortune.","A quiet, steady devotion to essential household care, without seeking outside achievement, brings good fortune.","The good fortune of the second line comes from gentle obedience to what is right.","This gentle, willing compliance with what is proper is the source of the fortune."],
   ["3rd (Nine)","The family is stern and severe; there is regret and danger, yet good fortune. Wife and children giggling and laughing — in the end, this brings regret.","Firm, appropriately strict household discipline is ultimately sound, while excessive indulgence and laxity eventually brings trouble.","The severity of the family has not truly been lost; the giggling and laughing of wife and children means the family has lost its proper order.","Genuine discipline preserves the family, while excessive laxity ultimately undermines it."],
   ["4th (Six)","A prosperous family. Great good fortune.","Genuine, hard-won household prosperity brings great good fortune.","The great good fortune of a prosperous family comes from gentle compliance found in its rightful place.","This gentle, well-placed compliance is what secures such great prosperity."],
   ["5th (Nine)","The king arrives to bring the family together in truth. No need for concern; good fortune.","A leader's sincere presence and involvement unites the family genuinely — no worry is needed, and good fortune follows.","The king's arrival to unite the family shows mutual affection shared between them.","Genuine, mutual affection between family members is what makes this union so real."],
   ["Top (Nine)","With sincerity and dignity, in the end good fortune.","Combining genuine sincerity with appropriate authority ultimately brings good fortune.","The good fortune of dignity comes from turning back and examining oneself honestly.","Honest self-reflection is what truly grounds this well-earned dignity."],
  ],
  a:"A good time to commit seriously to a stable relationship and shared responsibility.",b:"Clear division of roles boosts team efficiency.",c:"Manage household finances together, living within your means."}
},
{n:38,s:"睽",f:"火澤睽",u:"離",l:"兌",k:"求同存異",fortune:"平",
 desc:"求同存異，指眼前雖有意見分歧，但只要包容協調，處理小事仍可順利。",
 guaCi:"睽：小事吉。",
 guaCiX:"睽卦象徵意見相左：處理小事仍可吉祥。",
 tuan:"睽，火動而上，澤動而下；二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也。睽之時用大矣哉！",
 tuanX:"睽卦中火向上燃燒、澤向下滲流，方向相背；如同兩位女子同住一處，志向卻各不相同；然而內心和悅又能依附光明，柔順者上進，居中並能與剛強相應，因此處理小事仍可吉祥。天地雖然睽違相背，運行的道理卻是相同的；男女雖然睽違有別，心志卻能相通；萬物雖然各自睽違不同，其中的道理卻相類似。睽卦所蘊含求同存異的道理實在深遠重大！",
 xiang:"上火下澤，睽；君子以同而異。",
 xiangX:"火在上、澤在下，性質互相違背，象徵意見相異之象，君子觀此應在求同之中保留各自的差異，包容不同的意見。",
 guaCiSeg:[{o:"睽：小事吉。",e:"睽卦象徵意見相左：處理小事仍可吉祥。",terms:["ji"]}],
 tuanSeg:[{o:"睽，火動而上，澤動而下；",e:"睽卦中火向上燃燒、澤向下滲流，方向相背；"},{o:"二女同居，其志不同行。",e:"如同兩位女子同住一處，志向卻各不相同。",terms:["zhi"]},{o:"說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。",e:"然而內心和悅又能依附光明，柔順者上進，居中並能與剛強相應，因此處理小事仍可吉祥。",terms:["ji"]},{o:"天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也。",e:"天地雖然睽違相背，運行的道理卻是相同的；男女雖然睽違有別，心志卻能相通；萬物雖然各自睽違不同，其中的道理卻相類似。"},{o:"睽之時用大矣哉！",e:"睽卦所蘊含求同存異的道理實在深遠重大！",terms:["shi"]}],
 xiangSeg:[{o:"上火下澤，睽；",e:"火在上、澤在下，性質互相違背，象徵意見相異之象；"},{o:"君子以同而異。",e:"君子觀此應在求同之中保留各自的差異，包容不同的意見。",terms:["jun_zi"]}],
 yao:[
 ["初九","悔亡；喪馬勿逐，自復；見惡人，无咎。","悔恨消失；遺失的馬匹不必刻意追逐，自然會回來；即使遇見心存惡意之人，也無災咎。","見惡人，以辟咎也。","主動接觸並化解與惡人的關係，藉此避免過咎。"],
 ["九二","遇主于巷，无咎。","在小巷中偶然遇見主事者，並無災咎。","遇主于巷，未失道也。","於巷弄間相遇，並未偏離應行的正道。"],
 ["六三","見輿曳，其牛掣，其人天且劓；无初有終。","見到車子被拖曳、牛隻被牽制不順，處境艱難，但雖然開始不順利，最終仍有好結果。","見輿曳，位不當也；无初有終，遇剛也。","處境艱難是因所處之位不甚恰當；起初雖不順，最終得以遇上剛強的助力而有成。"],
 ["九四","睽孤，遇元夫，交孚，厲，无咎。","孤立於分歧之中，幸遇志同道合之人，彼此以誠信相交，雖有危險仍無咎。","交孚无咎，志行也。","以誠信相交而無咎，是因志向得以施行。"],
 ["六五","悔亡，厥宗噬膚，往何咎。","悔恨消失，同宗之人如咬噬柔軟皮肉般容易親近協力，前往行事又有何過咎呢。","厥宗噬膚，往有慶也。","與同宗之人容易協力合作，前往行事必有喜慶。"],
 ["上九","睽孤，見豕負塗，載鬼一車；先張之弧，後說之弧；匪寇婚媾，往遇雨則吉。","孤立疑懼至極，看到怪異幻象而心生戒備，先張弓戒備、後放下弓弩，發現對方並非強盜而是良緣，如遇雨般化解疑慮則吉。","遇雨之吉，群疑亡也。","如遇甘霖般化解疑慮而獲吉，是因種種猜疑終於消散。"],
 ],
 a:"感情中意見分歧，需要更多包容與溝通化解隔閡。",b:"團隊內部意見不合，宜求同存異、耐心協調。",c:"合作理財上易生分歧，宜事先明確約定避免爭議。",
 en:{name:"Kuí",title:"Opposition",keyword:"Finding Common Ground",
  desc:"Fire rising while the lake sinks, moving in opposite directions: real differences exist now, but small, careful matters can still succeed through patient understanding.",
  guaCi:"Kuí: Good fortune in small matters.",
  guaCiX:"Amid genuine disagreement, modest, careful undertakings can still succeed, even while larger differences remain.",
  tuan:"Kuí: fire moves and rises; the lake moves and descends. Two women live together, yet their wills do not move in the same direction. Joyous, and clinging to what is bright; the soft advances and moves upward, attains balance and responds to the firm — hence good fortune in small matters. Heaven and earth are opposed, yet their work is the same; man and woman are opposed, yet their wills are in communication; all things are opposed, yet their affairs are of the same kind. Great indeed is the timeliness of opposition and its use!",
  tuanX:"Even where real differences persist, as between heaven and earth or man and woman, an underlying, deeper unity of purpose can still be found — recognizing and working within this is a matter of real and subtle wisdom.",
  xiang:"Above there is fire, below there is a lake: this is Kuí. Thus the noble one is unified in what he shares, yet distinguishes real differences.",
  xiangX:"As fire and lake sit together yet move in opposite directions, a person of character stays unified with others in what is truly shared, while still recognizing genuine differences.",
  yao:[
   ["1st (Nine)","Regret vanishes. Losing the horse, do not chase it — it returns on its own. Seeing a disagreeable person, no blame.","Letting go of what is lost, rather than chasing it, often brings it back naturally; even facing difficult people carries no real fault if handled well.","Seeing a disagreeable person is done in order to avoid real fault.","Such deliberate openness is exactly what prevents a deeper, real fault."],
   ["2nd (Nine)","Meeting one's lord in a narrow alley. No blame.","An unplanned, informal meeting with someone important still carries no fault.","Meeting one's lord in a narrow alley has, in truth, not departed from the proper way.","Even this informal encounter remains entirely within the bounds of what is right."],
   ["3rd (Six)","Seeing the cart dragged back, the ox held back, the man's hair and nose both cut. No good beginning, but a good end.","A rough, humiliating start to a matter eventually resolves into something good.","No good beginning, but a good end, comes from encountering real strength along the way.","Encountering and working through real difficulty is what leads to this eventual good end."],
   ["4th (Nine)","Isolated in opposition, meeting a worthy companion. Sincerity exchanged between them; danger, yet no blame.","A period of real isolation ends with a genuine, trustworthy connection — some risk remains, but no lasting fault.","Sincerity exchanged without blame shows the will can truly be carried out.","This genuine mutual trust is what allows the deeper purpose to be fulfilled."],
   ["5th (Six)","Regret vanishes. A kinsman bites through the skin; going forward, what blame could there be?","Whatever earlier discord existed dissolves — reconciling with someone close, and moving forward, brings no fault.","The kinsman biting through the skin means going forward brings real celebration.","This reconciliation is, in fact, genuinely worth celebrating as one moves ahead."],
   ["Top (Nine)","Isolated in opposition, seeing a pig covered in mud, a cart full of ghosts; first drawing the bow against it, then setting the bow aside — not a robber, but a suitor. Going forward, meeting rain brings good fortune.","Suspicion and misperception give way to clarity once true, benign intent is recognized — moving forward as doubts dissolve brings good fortune.","The good fortune of meeting rain comes from all doubts finally being dispelled.","This dissolving of doubt, like rain clearing the air, is what brings the good fortune."],
  ],
  a:"Differences of opinion call for patience and understanding to bridge the gap.",b:"Internal disagreement calls for patience and seeking common ground.",c:"Be clear on terms in advance to avoid disputes in shared finances."}
},
{n:39,s:"蹇",f:"水山蹇",u:"坎",l:"艮",k:"險阻在前",fortune:"小凶",
 desc:"險阻在前，指目前前路多艱，宜暫緩腳步、尋求協助，靜待時機化解。",
 guaCi:"蹇：利西南，不利東北；利見大人，貞吉。",
 guaCiX:"蹇卦象徵險阻在前：有利於前往西南方，不利於前往東北方；適合求見賢能之人，堅守正道便能吉祥。",
 tuan:"蹇，難也，險在前也。見險而能止，知矣哉！蹇利西南，往得中也；不利東北，其道窮也。利見大人，往有功也。當位貞吉，以正邦也。蹇之時用大矣哉！",
 tuanX:"蹇就是艱難的意思，前方有險阻存在；能看見危險而及時止步，這正是明智的表現！有利於前往西南方，是因為前去能得到適中之道；不利於前往東北方，是因為那條路已走到窮盡；有利於求見賢能之人，是因為前去必能有所成就；居於正位、堅守正道便能吉祥，這是為了端正邦國；蹇卦所蘊含應對艱難的道理，其作用實在深遠重大！",
 xiang:"山上有水，蹇；君子以反身修德。",
 xiangX:"高山之上有水流，行走艱難，象徵險阻之象，君子觀此應反省自身、修養德行，以應對眼前的困境。",
 guaCiSeg:[{o:"蹇：利西南，",e:"蹇卦象徵險阻在前：有利於前往西南方，",terms:["li"]},{o:"不利東北；",e:"不利於前往東北方；",terms:["li"]},{o:"利見大人，",e:"適合求見賢能之人，",terms:["li","da_ren"]},{o:"貞吉。",e:"堅守正道便能吉祥。",terms:["zhen","ji"]}],
 tuanSeg:[{o:"蹇，難也，險在前也。",e:"蹇就是艱難的意思，前方有險阻存在。"},{o:"見險而能止，知矣哉！",e:"能看見危險而及時止步，這正是明智的表現！"},{o:"蹇利西南，往得中也；不利東北，其道窮也。",e:"有利於前往西南方，是因為前去能得到適中之道；不利於前往東北方，是因為那條路已走到窮盡。",terms:["li"]},{o:"利見大人，往有功也。",e:"有利於求見賢能之人，是因為前去必能有所成就。",terms:["li","da_ren"]},{o:"當位貞吉，以正邦也。",e:"居於正位、堅守正道便能吉祥，這是為了端正邦國。",terms:["zhen","ji"]},{o:"蹇之時用大矣哉！",e:"蹇卦所蘊含應對艱難的道理，其作用實在深遠重大！",terms:["shi"]}],
 xiangSeg:[{o:"山上有水，蹇；",e:"高山之上有水流，行走艱難，象徵險阻之象；"},{o:"君子以反身修德。",e:"君子觀此應反省自身、修養德行，以應對眼前的困境。",terms:["jun_zi"]}],
 yao:[
 ["初六","往蹇，來譽。","前往將遇艱難險阻，退守回來反而能獲得美譽。","往蹇來譽，宜待也。","前往有險而退守得譽，此時宜靜待時機。"],
 ["六二","王臣蹇蹇，匪躬之故。","作為君王的忠臣，即使身處重重艱難險阻，也並非為了自身私利。","王臣蹇蹇，終无尤也。","忠臣身處艱難而不為己謀，終究無可責怪之處。"],
 ["九三","往蹇，來反。","前往將遇艱難，返回原處較為妥當。","往蹇來反，內喜之也。","前往有險而返回，內部之人也因此感到欣慰。"],
 ["六四","往蹇，來連。","前往有艱難險阻，返回則能與同伴相互聯繫扶持。","往蹇來連，當位實也。","返回而能與人相連相助，是因所處之位切合實際。"],
 ["九五","大蹇，朋來。","身處極大的艱難險阻之中，此時志同道合的朋友將前來相助。","大蹇朋來，以中節也。","身處大難而有朋友相助，是因秉持中正的節操。"],
 ["上六","往蹇，來碩，吉；利見大人。","前往艱難，但返回後能有豐碩的收穫，吉祥，適合求見賢能之人。","往蹇來碩，志在內也；利見大人，以從貴也。","前往艱難而返回豐碩，是因志向本在於內部的根基；利於見賢，是為了追隨尊貴賢能之人。"],
 ],
 a:"感情發展遇到阻礙，宜暫緩腳步、耐心等待轉機。",b:"事業推展困難重重，宜審慎評估、暫緩躁進。",c:"財運受阻，投資宜暫緩，先觀望局勢再行動。",
 en:{name:"Jiǎn",title:"Obstruction",keyword:"Difficulty Ahead",
  desc:"Water resting above the mountain: real obstacles lie ahead now — this is a time to pause, seek help, and let the difficulty resolve in its own time.",
  guaCi:"Jiǎn: Favorable in the southwest, unfavorable in the northeast. Favorable to see a great man. Perseverance brings good fortune.",
  guaCiX:"One direction is favorable and another is not; seeking wise counsel and holding steady with integrity is the wise response to this difficulty.",
  tuan:"Jiǎn means difficulty: danger lies ahead. Seeing the danger and being able to stop — this is true wisdom! Jiǎn favors the southwest, for going there one attains balance; unfavorable in the northeast, for that way is exhausted. Favorable to see a great man, for going forward brings real achievement. Occupying the correct position with perseverance brings good fortune, for this sets the state in order. Great indeed is the timeliness of Jiǎn and its use!",
  tuanX:"There is real wisdom in recognizing danger ahead and choosing to pause rather than press on; seeking guidance and holding to a correct, balanced course is what carries one through such difficult times.",
  xiang:"Water rests above the mountain: this is Jiǎn. Thus the noble one turns back to examine himself and cultivate his own virtue.",
  xiangX:"As water sits upon the mountain, blocked from easy passage, a person of character turns inward to examine themselves and cultivate their own character.",
  yao:[
   ["1st (Six)","Going forward brings difficulty, coming back brings praise.","Advancing now leads to trouble, while a timely retreat earns real respect.","Going forward brings difficulty, coming back brings praise — it is fitting to wait.","Patient waiting is the wise course indicated here."],
   ["2nd (Six)","The king's minister faces difficulty upon difficulty, yet not for his own sake.","Loyal service persists through hardship, undertaken not for personal gain but out of genuine duty.","The king's minister facing difficulty upon difficulty comes to no real fault in the end.","Such selfless loyalty ultimately carries no real fault."],
   ["3rd (Nine)","Going forward brings difficulty, coming back turns one homeward.","Advancing leads only to trouble, while turning back brings a welcome return to safety.","Going forward brings difficulty, coming back turns one homeward — and those within rejoice at this.","Those close to home are genuinely glad to see this safe return."],
   ["4th (Six)","Going forward brings difficulty, coming back brings connection.","Advancing leads to trouble, while a timely return allows one to reconnect with genuine allies.","Going forward brings difficulty, coming back brings connection, for the position held is truly substantial.","This is a position of real substance, which is what makes such reconnection possible."],
   ["5th (Nine)","Great difficulty; friends arrive.","In the midst of serious hardship, genuine allies come to offer real support.","The friends arriving amid great difficulty come through a balanced, moderate course.","A steady, well-tempered approach is what draws this genuine support."],
   ["Top (Six)","Going forward brings difficulty, coming back brings great achievement. Good fortune. Favorable to see a great man.","Advancing leads to trouble, while a wise retreat leads to real and lasting achievement — a favorable time to seek wise counsel.","Going forward brings difficulty, coming back brings great achievement, for the will is directed toward what lies within.","This deeper, inward-directed purpose is what ultimately brings such real achievement."],
  ],
  a:"Love faces obstacles — slow down and wait patiently for a turning point.",b:"Progress is genuinely difficult — assess carefully and hold off on pushing forward.",c:"Investments should wait — watch the situation before acting."}
},
{n:40,s:"解",f:"雷水解",u:"震",l:"坎",k:"撥雲見日",fortune:"小吉",
 desc:"撥雲見日，指眼前困境正逐漸化解，宜把握時機、盡快處理積壓問題。",
 guaCi:"解：利西南。无所往，其來復吉。有攸往，夙吉。",
 guaCiX:"解卦象徵化解危難：有利於前往西南方；若沒有特定目標，及早回歸原本安穩之處便吉祥；若有所前往，則應盡早行動才能吉祥。",
 tuan:"解，險以動，動而免乎險，解。解利西南，往得眾也。其來復吉，乃得中也。有攸往夙吉，往有功也。",
 tuanX:"解卦處於險境之中卻能有所行動，行動之後便能脫離險境，這便是化解之意；有利於前往西南方，是因為前去能得到眾人的支持；及早回歸則吉祥，是因為能保持適中之道；有所前往且盡早行動便能吉祥，是因為前去必能有所成就。",
 xiang:"雷雨作，解；君子以赦過宥罪。",
 xiangX:"雷雨交加、萬物得到滋潤，象徵鬱結得以化解之象，君子觀此應寬赦過失、寬宥罪責，如同雷雨過後的舒緩之氣。",
 guaCiSeg:[{o:"解：利西南。",e:"解卦象徵化解危難：有利於前往西南方。",terms:["li"]},{o:"无所往，其來復吉。",e:"若沒有特定目標，及早回歸原本安穩之處便吉祥。",terms:["ji"]},{o:"有攸往，夙吉。",e:"若有所前往，則應盡早行動才能吉祥。",terms:["ji"]}],
 tuanSeg:[{o:"解，險以動，動而免乎險，解。",e:"解卦處於險境之中卻能有所行動，行動之後便能脫離險境，這便是化解之意。"},{o:"解利西南，往得眾也。",e:"有利於前往西南方，是因為前去能得到眾人的支持。",terms:["li"]},{o:"其來復吉，乃得中也。",e:"及早回歸則吉祥，是因為能保持適中之道。",terms:["ji"]},{o:"有攸往夙吉，往有功也。",e:"有所前往且盡早行動便能吉祥，是因為前去必能有所成就。",terms:["ji"]}],
 xiangSeg:[{o:"雷雨作，解；",e:"雷雨交加、萬物得到滋潤，象徵鬱結得以化解之象；"},{o:"君子以赦過宥罪。",e:"君子觀此應寬赦過失、寬宥罪責，如同雷雨過後的舒緩之氣。",terms:["jun_zi"]}],
 yao:[
 ["初六","无咎。","此時處境並無災咎，宜安然自處。","剛柔之際，義无咎也。","正值剛柔交會化解之際，依理並無過咎。"],
 ["九二","田獲三狐，得黃矢，貞吉。","如田獵般擒獲奸邪之徒、獲得象徵中正的黃色箭矢，堅守正道則吉。","九二貞吉，得中道也。","堅守正道而獲吉，是因秉持中庸之道。"],
 ["六三","負且乘，致寇至，貞吝。","身分不相稱地背負重物又乘坐車輛，容易招致外來的覬覦侵擾，即使堅持也有遺憾。","負且乘，亦可醜也；自我致戎，又誰咎也。","身分不相稱的舉止令人側目；自己招致的禍患，又能歸咎於誰呢。"],
 ["九四","解而拇，朋至斯孚。","化解如腳趾般細微的牽絆糾葛，志同道合的朋友便會前來以誠相待。","解而拇，未當位也。","尚未化解的細微牽絆，是因所處之位尚未完全恰當。"],
 ["六五","君子維有解，吉；有孚于小人。","君子能徹底化解問題癥結，吉祥，也能以誠信感化小人。","君子有解，小人退也。","君子能化解困境，小人的不良影響便隨之消退。"],
 ["上六","公用射隼于高墉之上，獲之，无不利。","如公侯在高牆上射殺猛禽般徹底剷除禍患根源，並有所收穫，無所不利。","公用射隼，以解悖也。","剷除禍患根源，是為了徹底化解悖亂的根本。"],
 ],
 a:"感情中的誤會或壓力逐漸化解，關係漸趨明朗。",b:"難題出現轉機，宜把握時機盡快解決積壓問題。",c:"財務壓力逐漸緩解，可著手處理債務或理清帳目。",
 en:{name:"Xiè",title:"Deliverance",keyword:"Release from Difficulty",
  desc:"Thunder and rain arising together: the earlier tension is finally breaking — a good time to resolve outstanding matters and move forward with relief.",
  guaCi:"Xiè: Favorable in the southwest. If there is nowhere to go, returning brings good fortune. If there is somewhere to go, going early brings good fortune.",
  guaCiX:"With tension easing, one direction is favorable; without a clear goal, a prompt return to stability is wise, and with one, prompt action serves best.",
  tuan:"Xiè: danger, and movement out of danger — this is Xiè. Xiè favors the southwest, for going there one wins over the multitude. If there is somewhere to go, going early brings good fortune, for going forward achieves real merit. Heaven and earth release their tension, and thunder and rain arise; thunder and rain arising, the buds of every seed and fruit split open. Great indeed is the timeliness of Xiè!",
  tuanX:"Just as thunder and rain arise together to release the tension between heaven and earth, and this release causes seeds to finally sprout, resolving accumulated difficulty at the right moment brings real, generative relief.",
  xiang:"Thunder and rain arise: this is Xiè. Thus the noble one forgives transgressions and shows leniency toward faults.",
  xiangX:"As thunder and rain arise together, bringing relief and renewal, a person of character forgives past wrongs and treats faults with leniency.",
  yao:[
   ["1st (Six)","No blame.","In this moment of release, there is nothing here to fault.","The junction of hard and soft in the first line is, by its very meaning, without blame.","This natural meeting of firmness and gentleness is simply, in itself, entirely sound."],
   ["2nd (Nine)","Catching three foxes in the field, obtaining a yellow arrow. Perseverance brings good fortune.","Clearing away hidden sources of trouble, while holding to a balanced, correct course, brings good fortune.","The good fortune of perseverance at the second line comes from holding to the balanced, correct way.","This centered, correct approach is what secures the good fortune here."],
   ["3rd (Six)","Carrying a burden while also riding, this invites robbers to arrive. Perseverance brings regret.","Occupying a position or possessing wealth beyond one's true standing invites real trouble.","Carrying a burden while riding is truly a shameful thing.","Such a mismatch between position and true standing is genuinely a cause for embarrassment."],
   ["4th (Nine)","Releasing your own big toe; a true friend arrives, and there is mutual trust.","Freeing oneself from a minor, lingering attachment allows genuine, trustworthy connection to follow.","Releasing your own big toe means the position held is not yet a truly fitting one.","This still somewhat ill-fitting position is why the small attachment needed release first."],
   ["5th (Six)","The noble one alone finds release. Good fortune. There is proof of this in the small-minded being dismissed.","A principled leader achieves real resolution, confirmed by the retreat of lesser, corrupting influences.","The good fortune of the noble one comes from the small-minded being dismissed.","The clear withdrawal of petty influence is the very proof of this good fortune."],
   ["Top (Six)","The prince shoots a hawk perched atop a high wall, and captures it. Nothing unfavorable.","Decisively removing an entrenched source of trouble at the highest level brings only good.","The prince shooting the hawk is done in order to remove real disorder.","This is a deliberate, targeted action taken to clear away genuine disorder."],
  ],
  a:"Misunderstandings and pressure are easing — the relationship is clearing up.",b:"A breakthrough is emerging — resolve lingering problems while the window is open.",c:"Financial pressure is easing — a good time to tackle debt or sort out accounts."}
},
{n:41,s:"損",f:"山澤損",u:"艮",l:"兌",k:"損中有益",fortune:"小吉",
 desc:"損中有益，指目前雖需付出或犧牲，但長遠來看反而能帶來更大益處。",
 guaCi:"損：有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享。",
 guaCiX:"損卦象徵損己利他：只要心懷誠信，便能大為吉祥、沒有災咎，可以堅守正道，也適合有所前往；即使祭品簡樸，如兩簋食物，只要心誠也能用以祭享。",
 tuan:"損，損下益上，其道上行。損而有孚，元吉，无咎，可貞，利有攸往。曷之用？二簋可用享，二簋應有時，損剛益柔有時，損益盈虛，與時偕行。",
 tuanX:"損卦的道理是減損下位以增益上位，其運行之道是向上而行；減損之時只要心懷誠信，便能大為吉祥、沒有災咎、可以堅守正道、有利於前往；即使祭品簡樸也能用以祭享，是因為簡樸祭祀也應合乎時宜；減損剛強、增益柔順也各有其適合的時機，損益盈虛的道理，應隨著時勢的變化而調整。",
 xiang:"山下有澤，損；君子以懲忿窒欲。",
 xiangX:"高山之下有沼澤，山因沼澤的滋潤而更顯高聳，象徵損己利他之象，君子觀此應克制自身的忿怒，並抑制過多的欲望。",
 guaCiSeg:[{o:"損：有孚，",e:"損卦象徵損己利他：只要心懷誠信，",terms:["youfu"]},{o:"元吉，无咎，可貞，",e:"便能大為吉祥、沒有災咎，可以堅守正道，",terms:["yuanji","wujiu","zhen"]},{o:"利有攸往。",e:"也適合有所前往。",terms:["li","youyouwang"]},{o:"曷之用？二簋可用享。",e:"即使祭品簡樸，如兩簋食物，只要心誠也能用以祭享。"}],
 tuanSeg:[{o:"損，損下益上，其道上行。",e:"損卦的道理是減損下位以增益上位，其運行之道是向上而行。"},{o:"損而有孚，元吉，无咎，可貞，利有攸往。",e:"減損之時只要心懷誠信，便能大為吉祥、沒有災咎、可以堅守正道、有利於前往。",terms:["youfu","yuanji","wujiu","li"]},{o:"曷之用？二簋可用享，二簋應有時，",e:"即使祭品簡樸也能用以祭享，是因為簡樸祭祀也應合乎時宜，",terms:["shi"]},{o:"損剛益柔有時，損益盈虛，與時偕行。",e:"減損剛強、增益柔順也各有其適合的時機，損益盈虛的道理，應隨著時勢的變化而調整。",terms:["shi"]}],
 xiangSeg:[{o:"山下有澤，損；",e:"高山之下有沼澤，山因沼澤的滋潤而更顯高聳，象徵損己利他之象；"},{o:"君子以懲忿窒欲。",e:"君子觀此應克制自身的忿怒，並抑制過多的欲望。",terms:["jun_zi"]}],
 yao:[
 ["初九","已事遄往，无咎，酌損之。","事情完成便迅速前往，並無災咎，但仍應斟酌損益的分寸。","已事遄往，尚合志也。","事成便迅速前往，仍與應有的志向相合。"],
 ["九二","利貞，征凶；弗損益之。","堅守正道有利，但貿然前行有凶險；不宜過度減損反而應予增益。","九二利貞，中以為志也。","堅守正道有利，是因以中庸之道為志向。"],
 ["六三","三人行，則損一人；一人行，則得其友。","三人同行反而需要減損其一，獨自一人前行反而能得到志同道合的朋友，象徵事物損益相依的道理。","一人行，三則疑也。","獨行反能得友，是因三人同行容易彼此猜疑。"],
 ["六四","損其疾，使遄有喜，无咎。","及時減損自身的毛病或困擾，能迅速帶來喜悅，並無災咎。","損其疾，亦可喜也。","能減損自身的弊病困擾，這也是值得欣喜之事。"],
 ["六五","或益之十朋之龜，弗克違，元吉。","獲得如珍貴神龜般的豐厚增益，難以推辭違抗，大為吉祥。","六五元吉，自上祐也。","居此位而獲元吉，是得到上天的庇祐。"],
 ["上九","弗損益之，无咎，貞吝。利有攸往，得臣无家。","不必再減損，反而能增益於人，並無災咎，堅守正道有利於前行，能得到廣受愛戴、不謀私利的賢臣。","弗損益之，大得志也。","不再減損反而增益，是因志向得以大為實現。"],
 ],
 a:"感情中適度付出與退讓，反而能增進彼此感情。",b:"短期需要犧牲或投入成本，長遠來看有助於發展。",c:"財務上可能需要先支出後獲益，宜衡量長期效益。",
 en:{name:"Sǔn",title:"Decrease",keyword:"Loss That Enables Gain",
  desc:"A lake beneath the mountain: some giving up or reduction is called for now, and this loss, chosen wisely, will bring genuine benefit later.",
  guaCi:"Sǔn: With sincerity, sublime good fortune, no blame; one may persevere, and it is favorable to have somewhere to go. What use is it? Even two simple bowls of food may be offered.",
  guaCiX:"Genuine sincerity, even amid a reduction in resources, brings great good fortune, and forward movement remains favorable; simplicity itself, offered sincerely, is entirely sufficient.",
  tuan:"Sǔn means decrease of what is below to increase what is above; its way moves upward. Decrease with sincerity brings sublime good fortune, no blame, may persevere, and is favorable to have somewhere to go. What use is it? Even two simple bowls of food may be offered — this fits with the season. Decreasing the firm and increasing the soft has its own proper time; decrease and increase, fullness and emptiness, move together in step with the times.",
  tuanX:"Even reducing resources from above to strengthen what lies below, done sincerely, has its own rightful season; understanding this natural rhythm of loss and gain is itself a matter of real wisdom.",
  xiang:"Below the mountain there is a lake: this is Sǔn. Thus the noble one restrains his anger and reins in his desires.",
  xiangX:"As the lake, though lower, lends the mountain its true height by contrast, a person of character restrains anger and reins in excessive desire.",
  yao:[
   ["1st (Nine)","Finishing one's own affairs, then going forth promptly. No blame. Consider carefully what one gives up.","Completing one's own responsibilities before offering help elsewhere, given thoughtfully, is entirely sound.","Finishing one's own affairs, then going forth, remains in accord with the will above.","This still aligns with the deeper intent held by those in the position above."],
   ["2nd (Nine)","Favorable to persevere; to press forward brings misfortune. Without decreasing, one may still increase others.","Holding firm rather than rashly advancing allows genuine benefit to others without unnecessary sacrifice.","Perseverance at the second line, favorable, comes from holding to the balanced, correct middle way.","This balanced, centered approach is what makes such perseverance favorable here."],
   ["3rd (Six)","Three people traveling together decrease by one; one person traveling alone gains a companion.","Excess in a group can hinder unity, while a solitary figure naturally finds true partnership.","One person traveling alone — even three would then bring only doubt.","Too many together would only introduce uncertainty into what should be a clear match."],
   ["4th (Six)","Decreasing one's own affliction; if done promptly, there is cause for joy. No blame.","Addressing a personal flaw or burden quickly and directly brings genuine relief and no fault.","Decreasing one's own affliction is likewise a cause for real joy.","This resolution of a real weakness is genuinely something to be glad about."],
   ["5th (Six)","Perhaps increased by a pair of precious tortoise shells, worth ten strings of cowries — nothing can decline this. Sublime good fortune.","An unexpected, generous gain, impossible to refuse, brings great good fortune.","The sublime good fortune of the fifth line comes from a real blessing bestowed from above.","This is a genuine blessing that comes from a source above."],
   ["Top (Nine)","Not decreasing, but increasing others instead. No blame. Perseverance brings good fortune, favorable to have somewhere to go. One gains servants, yet without a household of one's own.","Rather than taking, generously giving to others — held with integrity — brings good fortune and favors moving forward, even without seeking personal gain.","Not decreasing but increasing others fulfills what was truly intended, greatly and fully.","This generous spirit fully realizes the deeper purpose behind it."],
  ],
  a:"Some sacrifice or compromise in love can actually deepen the bond.",b:"Short-term cost now supports longer-term development.",c:"Spending now may be needed before benefit follows — weigh the long-term payoff."}
},
{n:42,s:"益",f:"風雷益",u:"巽",l:"震",k:"利益眾人",fortune:"大吉",
 desc:"利益眾人，指當前正是投入資源、造福他人的好時機，付出必有回報。",
 guaCi:"益：利有攸往，利涉大川。",
 guaCiX:"益卦象徵損上益下、利益眾人：有利於有所前往，也有利於涉越險阻、成就大事。",
 tuan:"益，損上益下，民說无疆。自上下下，其道大光。利有攸往，中正有慶。利涉大川，木道乃行。益動而巽，日進无疆；天施地生，其益無方。凡益之道，與時偕行。",
 tuanX:"益卦的道理是減損上位以增益下位，百姓因此欣喜無比；居上位者能謙下對待下位者，這樣的作為更顯得光明廣大；有利於前往，是因為秉持中正之道必有喜慶；有利於涉險成就大事，是因為如同乘木舟渡河一般順暢可行；行動而又謙遜，因此能日益精進、沒有止境；天施予、地承受而萬物生長，增益萬物的方式並無固定範圍。凡是增益的道理，都應隨著時勢而靈活調整、與時俱進。",
 xiang:"風雷，益；君子以見善則遷，有過則改。",
 xiangX:"風與雷相互增益、聲勢更大，象徵彼此增益之象，君子觀此見到善行便應學習效法，發現過錯便要立即改正。",
 guaCiSeg:[{o:"益：利有攸往，",e:"益卦象徵損上益下、利益眾人：有利於有所前往，",terms:["li","youyouwang"]},{o:"利涉大川。",e:"也有利於涉越險阻、成就大事。",terms:["li","she_da_chuan"]}],
 tuanSeg:[{o:"益，損上益下，民說无疆。",e:"益卦的道理是減損上位以增益下位，百姓因此欣喜無比。"},{o:"自上下下，其道大光。",e:"居上位者能謙下對待下位者，這樣的作為更顯得光明廣大。"},{o:"利有攸往，中正有慶。",e:"有利於前往，是因為秉持中正之道必有喜慶。",terms:["li","zhong_zheng"]},{o:"利涉大川，木道乃行。",e:"有利於涉險成就大事，是因為如同乘木舟渡河一般順暢可行。",terms:["li"]},{o:"益動而巽，日進无疆；天施地生，其益無方。",e:"行動而又謙遜，因此能日益精進、沒有止境；天施予、地承受而萬物生長，增益萬物的方式並無固定範圍。"},{o:"凡益之道，與時偕行。",e:"凡是增益的道理，都應隨著時勢而靈活調整、與時俱進。",terms:["shi"]}],
 xiangSeg:[{o:"風雷，益；",e:"風與雷相互增益、聲勢更大，象徵彼此增益之象；"},{o:"君子以見善則遷，有過則改。",e:"君子觀此見到善行便應學習效法，發現過錯便要立即改正。",terms:["jun_zi"]}],
 yao:[
 ["初九","利用為大作，元吉，无咎。","此時適合投入資源、有所大作為，大為吉祥，並無災咎。","元吉无咎，下不厚事也。","大吉無咎，是因居於下位者尚無過度厚重的責任負擔。"],
 ["六二","或益之十朋之龜，弗克違，永貞吉；王用享于帝，吉。","獲得如珍貴神龜般的豐厚增益，難以推辭，長久堅守正道則吉；君王藉此祭祀上天，亦吉。","或益之，自外來也。","這樣的增益，是從外部意外而來的。"],
 ["六三","益之用凶事，无咎；有孚中行，告公用圭。","將增益之資用於救助凶險急難之事，並無災咎；心懷誠信、行事中正，如手持玉圭般誠敬地稟告上位者。","益用凶事，固有之也。","將資源用於救助急難之事，本就是理所應為之事。"],
 ["六四","中行，告公從，利用為依遷國。","秉持中庸之道行事，稟告上位者並獲得聽從，有利於遷徙國都等重大決策。","告公從，以益志也。","稟告而獲聽從，是為了增益整體的志向與利益。"],
 ["九五","有孚惠心，勿問元吉；有孚惠我德。","心懷誠信、施惠於人，不必多問便知是大為吉祥；以誠信回報我的恩德。","有孚惠心，勿問之矣；惠我德，大得志也。","心懷誠信施惠於人，其吉祥不言而喻；他人也以德回報，志向因此大為實現。"],
 ["上九","莫益之，或擊之，立心勿恆，凶。","不但沒有人增益幫助，反而可能受到攻擊，若不能堅定恆常的心志，將有凶險。","莫益之，偏辭也；或擊之，自外來也。","無人增益，是因言行有所偏頗；受到攻擊，是禍患由外部而來。"],
 ],
 a:"感情運勢佳，彼此互相扶持能讓關係更加穩固。",b:"適合投入資源拓展業務，付出將帶來實質回報。",c:"財運看漲，適合投資或擴大經營，收穫可期。",
 en:{name:"Yì",title:"Increase",keyword:"Benefit Through Giving",
  desc:"Wind and thunder reinforcing each other: this is a favorable time to invest generously in others — genuine giving now returns real benefit.",
  guaCi:"Yì: Favorable to have somewhere to go. Favorable to cross the great water.",
  guaCiX:"This is a fitting time to move forward, even into a bold or difficult undertaking.",
  tuan:"Yì means decreasing what is above to increase what is below — the people's joy knows no bound. From above descending to what is below, its way shines greatly. Favorable to have somewhere to go, for balance and correctness bring real cause for joy. Favorable to cross the great water, for the way of the wooden vessel is thus carried out. Yì moves and is gentle, advancing daily without limit; heaven bestows, earth gives birth, and their increase reaches everywhere without bound. The way of increase always moves together with the times.",
  tuanX:"Just as a leader who gives generously to those below brings genuine, shining joy, and heaven and earth together give rise to endless growth, the true principle of increase is to give freely and act in step with the season.",
  xiang:"Wind and thunder: this is Yì. Thus the noble one, seeing good, moves toward it; having faults, he corrects them.",
  xiangX:"As wind and thunder reinforce and amplify one another, a person of character moves toward what is good when they see it, and corrects their own faults when found.",
  yao:[
   ["1st (Nine)","Favorable to undertake great works. Sublime good fortune, no blame.","This is a favorable time for bold, significant undertakings, and the outcome is great good fortune without fault.","Sublime good fortune without blame means those below are not yet burdened with heavy affairs.","Those in a lesser position are not yet weighed down by excessive responsibility here."],
   ["2nd (Six)","Perhaps increased by a pair of precious tortoise shells, worth ten strings of cowries — nothing can decline this. Lasting perseverance brings good fortune. The king uses this to make offering to the Supreme Lord. Good fortune.","An unexpected, generous gain — impossible to refuse — held with lasting integrity, brings good fortune, fit even for the most solemn use.","This increase comes to one from outside.","Such an unexpected gain arrives from beyond one's own effort."],
   ["3rd (Six)","Increase used for difficult and dangerous affairs. No blame. With sincerity, holding to the middle course, report this to the duke using the ceremonial tablet.","Resources gained are rightly used to address real hardship; sincere, balanced conduct, properly reported to those above, is entirely sound.","Increase used for difficult affairs is genuinely something one already possesses.","Such capacity to meet real difficulty is already inherently present here."],
   ["4th (Six)","Holding to the middle course, report this to the duke, and he follows. Favorable to be used in relocating the capital.","Balanced, sincere counsel offered to a leader, and heeded, supports even a major undertaking like relocation.","Reporting to the duke, and he follows, is done to increase the will held.","This is undertaken precisely to further the deeper intent already held."],
   ["5th (Nine)","With a sincere and caring heart, do not even ask — sublime good fortune. With sincerity, my own virtue is rewarded.","Genuine, generous sincerity, offered without calculation, brings the greatest good fortune and its own natural reward.","With a sincere and caring heart, do not even ask, for great good fortune fulfills the true wish.","This unquestioning generosity fully realizes the deeper wish behind it."],
   ["Top (Nine)","No one increases him; indeed, some may attack him. Do not fix the heart on constancy alone. Misfortune.","Isolated and unsupported, even facing hostility, rigid stubbornness alone will not save the situation.","No one increases him, for this is a one-sided, partial view. Some may attack him, for this comes from outside.","Such a narrow, isolated stance is what leaves one exposed to this outside hostility."],
  ],
  a:"Love is thriving — mutual support strengthens the relationship.",b:"A good time to invest resources in growth — effort will bring real returns.",c:"Finances trend upward — a good time to invest or expand."}
},
{n:43,s:"夬",f:"澤天夬",u:"兌",l:"乾",k:"決斷果行",fortune:"小凶",
 desc:"決斷果行，指眼前該處理的問題不宜再拖延，宜當機立斷、明快解決。",
 guaCi:"夬：揚于王庭，孚號有厲。告自邑，不利即戎，利有攸往。",
 guaCiX:"夬卦象徵決斷果行：應在朝廷之上公開揭發罪狀，誠心呼籲眾人提防危險；應先從自身的封邑做起曉諭眾人，此時不宜貿然興兵動武，但適合有所前往、有所作為。",
 tuan:"夬，決也，剛決柔也。健而說，決而和。揚于王庭，柔乘五剛也。孚號有厲，其危乃光也。告自邑，不利即戎，所尚乃窮也。利有攸往，剛長乃終也。",
 tuanX:"夬就是決斷的意思，是以剛強決斷柔弱的過程；剛健而又和悅，決斷卻又不失和諧；之所以要在朝廷之上公開，是因為僅存的一個陰柔之勢正凌駕於眾多陽剛之上；心懷誠信、大聲疾呼提防危險，是要讓潛藏的危機得以彰顯、及早防範；先從自身封邑曉諭起，此時不宜輕率動武，是因為一味崇尚武力終將走向窮途；有利於前行，是因為陽剛之勢終將增長至圓滿。",
 xiang:"澤上於天，夬；君子以施祿及下，居德則忌。",
 xiangX:"沼澤之水高懸於天上，隨時可能潰決而下，象徵果決之象，君子觀此應將恩惠俸祿廣施於下位者，若獨自安享德澤而不與人分享，則應有所警惕。",
 guaCiSeg:[{o:"夬：揚于王庭，",e:"夬卦象徵決斷果行：應在朝廷之上公開揭發罪狀，"},{o:"孚號有厲。",e:"誠心呼籲眾人提防危險。",terms:["fu","li_danger"]},{o:"告自邑，",e:"應先從自身的封邑做起曉諭眾人，"},{o:"不利即戎，",e:"此時不宜貿然興兵動武，",terms:["li"]},{o:"利有攸往。",e:"但適合有所前往、有所作為。",terms:["li","youyouwang"]}],
