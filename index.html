  tuan:"Tóng Rén: the soft finds its place, holds the center, and responds to the strong — hence Tóng Rén. Fellowship in the open brings success, for this is heaven's own way of moving. Cultured and strong, centered and correct in response — this is the noble one's rectitude, and only the noble one can truly unite the wills of the whole world.",
  tuanX:"Genuine fellowship arises when balanced, sincere character responds to firm strength; only real integrity can bring truly diverse people together in common purpose.",
  xiang:"Heaven together with fire: this is Tóng Rén. Thus the noble one organizes clans and distinguishes things by their kind.",
  xiangX:"As fire rises to join with heaven, a person of character organizes communities and discerns what truly belongs together.",
  yao:[
   ["1st (Nine)","Fellowship at the gate. No blame.","Open, unguarded connection right from the start carries no fault.","Going out the gate for fellowship — who indeed could blame this?","Such open, unbiased fellowship draws no reasonable objection."],
   ["2nd (Six)","Fellowship limited to the clan. Regret.","Restricting fellowship to one's own narrow circle is too limited a view.","Fellowship limited to the clan is a regrettable, narrow way.","Such a narrow scope of connection falls short of the ideal."],
   ["3rd (Nine)","Hiding weapons in the thicket, climbing the high hill; for three years he does not rise.","Harboring hostile intent while lacking real strength leads to prolonged failure.","Hiding weapons in the thicket shows the opponent is too strong; not rising for three years — how then can he act?","Facing a stronger opposing force, there is simply no way to act."],
   ["4th (Nine)","Mounting the wall, yet unable to attack. Good fortune.","Restraint at the brink of conflict, rather than pressing forward, is fortunate.","Mounting the wall shows the wrong done should not be carried out; the good fortune comes from returning, in difficulty, to what is right.","Recognizing the wrong course and returning to what is proper brings this good result."],
   ["5th (Nine)","Fellowship first in loud weeping, then laughter; the great armies meet at last.","Reunion after hardship, achieved through genuine, combined effort, brings deep joy.","The beginning of fellowship comes from centered honesty; the armies meeting shows the difficulty has been overcome together.","Genuine sincerity at heart is what ultimately overcomes the difficulty together."],
   ["Top (Nine)","Fellowship in the outskirts. No regret.","A more distant, looser connection, though modest, brings no cause for regret.","Fellowship in the outskirts shows the will has not yet been fully realized.","This more limited fellowship shows the deeper aim is not yet complete."],
  ],
  a:"Look for someone who truly shares your values — honesty deepens the bond.",b:"Great for partnerships and alliances — shared purpose can accomplish big things.",c:"Good time for joint ventures with like-minded partners."}
},
{n:14,s:"大有",f:"火天大有",u:"離",l:"乾",k:"光明盛大",fortune:"大吉",
 desc:"光明盛大，指目前收穫豐盛、備受肯定，宜謙虛自持以保長久榮景。",
 guaCi:"大有：元亨。",
 guaCiX:"大有卦象徵光明豐盛：大為亨通，收穫豐碩。",
 tuan:"大有，柔得尊位大中，而上下應之，曰大有。其德剛健而文明，應乎天而時行，是以元亨。",
 tuanX:"陰柔者居於尊貴且適中之位，上下皆與之呼應，因此稱為大有；其德性剛健又光明，順應天道而適時而行，因此能大為亨通。",
 xiang:"火在天上，大有；君子以遏惡揚善，順天休命。",
 xiangX:"火高懸於天上，光照四方，象徵大有豐盛之象，君子觀此應遏止邪惡、褒揚善行，順應天道，成就美好的命運。",
 guaCiSeg:[{o:"大有：元亨。",e:"大有卦象徵光明豐盛：大為亨通，收穫豐碩。",terms:["yuanheng"]}],
 tuanSeg:[{o:"大有，柔得尊位大中，而上下應之，曰大有。",e:"陰柔者居於尊貴且適中之位，上下皆與之呼應，因此稱為大有。"},{o:"其德剛健而文明，應乎天而時行，是以元亨。",e:"其德性剛健又光明，順應天道而適時而行，因此能大為亨通。",terms:["yuanheng"]}],
 xiangSeg:[{o:"火在天上，大有；",e:"火高懸於天上，光照四方，象徵大有豐盛之象；"},{o:"君子以遏惡揚善，順天休命。",e:"君子觀此應遏止邪惡、褒揚善行，順應天道，成就美好的命運。",terms:["jun_zi","tian_ming"]}],
 yao:[
 ["初九","无交害，匪咎，艱則无咎。","不與人有害的交往，雖非有過失，仍應謹慎行事以免災咎。","大有初九，无交害也。","初始階段尚未與外界產生妨害。"],
 ["九二","大車以載，有攸往，无咎。","以大車承載重物、前行辦事，並無災咎。","大車以載，積中不敗也。","有大車般的承載能力，積蓄居中而不致敗壞。"],
 ["九三","公用亨于天子，小人弗克。","王公貴族得以向天子進獻，但小人卻難以承擔此等重任。","公用亨于天子，小人害也。","若小人擔此重任，反而會帶來禍害。"],
 ["九四","匪其彭，无咎。","不誇耀自身的盛大，便無災咎。","匪其彭无咎，明辯晳也。","能明辨事理、不自我誇耀，故無過失。"],
 ["六五","厥孚交如，威如，吉。","以誠信與人交往、兼具威嚴，吉祥。","厥孚交如，信以發志也；威如之吉，易而无備也。","以誠信感發志向，因平易近人而無需過度防備，故能吉祥。"],
 ["上九","自天祐之，吉无不利。","得到上天的庇佑保祐，吉祥而無所不利。","大有上吉，自天祐也。","身處上位而大吉，是因得到上天的護祐。"],
 ],
 a:"感情運勢豐盛，深受對方欣賞與疼愛。",b:"事業運鼎盛，能力受到肯定，宜保持謙虛以求長久。",c:"財運豐厚，收穫頗豐，但要留意分寸避免招忌。",
 en:{name:"Dà Yǒu",title:"Great Possession",keyword:"Abundance and Recognition",
  desc:"Fire high in the sky: a season of great abundance and recognition — hold it with humility to keep it lasting.",
  guaCi:"Dà Yǒu: Sublime success.",
  guaCiX:"A time of great abundance and flourishing success.",
  tuan:"Dà Yǒu: the soft occupies the position of honor and the greatest centrality, and above and below respond to it — hence Great Possession. Its virtue is strong and cultured, responsive to heaven and moving in season — thus, sublime success.",
  tuanX:"When a balanced, generous presence is honored and supported by all, and its strength moves in accord with the natural season, great and genuine success follows.",
  xiang:"Fire above heaven: this is Dà Yǒu. Thus the noble one restrains evil and promotes good, in obedience to heaven's benevolent mandate.",
  xiangX:"As fire blazes high above, illuminating all things, a person of character curbs wrongdoing and lifts up goodness, following heaven's own generous will.",
  yao:[
   ["1st (Nine)","No dealings with what is harmful. Not yet a fault, but only through care does it remain without blame.","Avoiding harmful entanglements from the very start keeps one safe, with vigilance.","No dealings with what is harmful in the first line of Great Possession.","Avoiding harm at the very outset sets a sound course for what follows."],
   ["2nd (Nine)","A great cart for carrying loads. There is somewhere to go, no blame.","Solid capacity and resources allow one to undertake real responsibility safely.","A great cart for carrying loads means what is amassed within does not collapse.","Substantial inner resources are what prevent any real failure."],
   ["3rd (Nine)","A duke presents an offering to the Son of Heaven. The small-minded cannot do this.","Only those of genuine character can rightly take on such an honored role.","A duke's offering to the Son of Heaven — the small-minded would only bring harm through this.","Placing the unworthy in such a role would only invite disaster."],
   ["4th (Nine)","Not overreaching his fullness. No blame.","Restraint at the height of success — not flaunting it — avoids fault.","Not overreaching his fullness without blame shows clear and careful judgment.","Discerning restraint at the peak of success is what keeps this sound."],
   ["5th (Six)","His sincerity is reciprocated with respect. Good fortune.","Genuine sincerity, met by others' esteem, brings good fortune.","His sincerity reciprocated shows trust that awakens true resolve; the good fortune of such respect comes from an openness without excessive defense.","Openness and lack of pretense are the true source of this good fortune."],
   ["Top (Nine)","Blessed by heaven itself. Good fortune, nothing unfavorable.","Genuine goodness draws heaven's own blessing, and only good fortune follows.","The great good fortune at the top comes from the blessing of heaven itself.","This is the natural culmination of a life aligned with heaven's own favor."],
  ],
  a:"Love is flourishing and you're genuinely appreciated — stay humble to keep it that way.",b:"Career is thriving and your ability is recognized — stay modest to sustain it.",c:"Wealth is abundant — enjoy it, but avoid drawing unwanted envy."}
},
{n:15,s:"謙",f:"地山謙",u:"坤",l:"艮",k:"謙虛謹慎",fortune:"大吉",
 desc:"謙虛謹慎，指當前以謙遜低調處世，終能贏得人心，善始善終。",
 guaCi:"謙：亨，君子有終。",
 guaCiX:"謙卦象徵謙虛謹慎：亨通，君子若能保持謙遜，必能善始善終。",
 tuan:"謙亨，天道下濟而光明，地道卑而上行。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙尊而光，卑而不可踰，君子之終也。",
 tuanX:"謙遜之所以亨通，是因為天道向下運行而顯得光明，地道則謙卑而向上運行；天道減損盈滿而增益謙虛，地道則改變盈滿而流向謙下之處，鬼神也是損害盈滿而降福於謙虛者，人心同樣厭惡自滿而喜愛謙遜；謙遜者即使身居尊位仍顯光輝，即使身處卑微也無人能踰越，這正是君子能善終的原因。",
 xiang:"地中有山，謙；君子以裒多益寡，稱物平施。",
 xiangX:"大地之中蘊藏著高山，象徵外表謙卑而內在充實，君子觀此應減損多餘、增補不足，衡量事物、公平施予。",
 guaCiSeg:[{o:"謙：亨，",e:"謙卦象徵謙虛謹慎：亨通，",terms:["heng"]},{o:"君子有終。",e:"君子若能保持謙遜，必能善始善終。",terms:["jun_zi"]}],
 tuanSeg:[{o:"謙亨，天道下濟而光明，地道卑而上行。",e:"謙遜之所以亨通，是因為天道向下運行而顯得光明，地道則謙卑而向上運行。",terms:["heng"]},{o:"天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。",e:"天道減損盈滿而增益謙虛，地道則改變盈滿而流向謙下之處，鬼神損害盈滿而降福於謙虛者，人心厭惡自滿而喜愛謙遜。"},{o:"謙尊而光，卑而不可踰，君子之終也。",e:"謙遜者即使身居尊位仍顯光輝，即使身處卑微也無人能踰越，這正是君子能善終的原因。",terms:["jun_zi"]}],
 xiangSeg:[{o:"地中有山，謙；",e:"大地之中蘊藏著高山，象徵外表謙卑而內在充實；"},{o:"君子以裒多益寡，稱物平施。",e:"君子觀此應減損多餘、增補不足，衡量事物、公平施予。",terms:["jun_zi"]}],
 yao:[
 ["初六","謙謙君子，用涉大川，吉。","極度謙遜的君子，即使涉越大河險阻也能吉祥。","謙謙君子，卑以自牧也。","以謙卑之心自我修養約束。"],
 ["六二","鳴謙，貞吉。","謙遜之名廣為人知，堅守正道，吉祥。","鳴謙貞吉，中心得也。","謙遜之名發自內心，故能守正得吉。"],
 ["九三","勞謙，君子有終，吉。","辛勤付出又能保持謙遜的君子，能有好的結局，吉祥。","勞謙君子，萬民服也。","勤勞而謙遜的君子，能使萬民心悅誠服。"],
 ["六四","无不利，撝謙。","發揮謙遜之德，無所不利。","无不利撝謙，不違則也。","發揮謙德而無所不利，是因不違背應有的法則。"],
 ["六五","不富以其鄰，利用侵伐，无不利。","雖不富有仍願與鄰里分享，此時出兵征討不服者也無所不利。","利用侵伐，征不服也。","出兵征討，是為了平定不服從者。"],
 ["上六","鳴謙，利用行師，征邑國。","謙遜之名遠播，適合出兵征討悖亂的邦國。","鳴謙，志未得也；可用行師，征邑國也。","謙遜之志尚未能完全實現，故可藉出兵以端正邦國。"],
 ],
 a:"以謙和低調的態度經營感情，反而更受青睞。",b:"保持謙遜、不居功自傲，人緣與機會自然而來。",c:"財運平穩，宜低調理財，切忌炫富或投機躁進。",
 en:{name:"Qiān",title:"Modesty",keyword:"Humility and Restraint",
  desc:"A mountain hidden within the earth: quiet humility, more than display, is what carries real and lasting success.",
  guaCi:"Qiān: Success. The noble one carries things through to the end.",
  guaCiX:"Genuine humility brings success — and it is the character to see things through that marks the noble one.",
  tuan:"Qiān brings success: heaven's way is to send its bounty downward and shine forth in brightness; earth's way is to lie low, yet its influence rises upward. Heaven's way diminishes what is full and augments the modest; earth's way changes what is full and fills up the low places; the spirits harm what is full and bless the modest; man's way despises what is full and loves the modest. The modest, though honored, still shines; though lowly, cannot be surpassed — this is how the noble one ends well.",
  tuanX:"Nature itself favors the humble over the excessive — those who remain modest, whatever their honor, gain both lasting respect and a good end.",
  xiang:"Within the earth there is a mountain: this is Qiān. Thus the noble one reduces what is excessive and augments what is insufficient, weighing things and giving fairly.",
  xiangX:"As a mountain hides quietly within the earth, a person of character lessens what is too much and adds to what is lacking, treating all things with fairness.",
  yao:[
   ["1st (Six)","A truly modest noble one may cross the great water. Good fortune.","Genuine, thorough humility makes even the boldest undertaking safe.","A truly modest noble one nurtures himself with lowliness.","Cultivating oneself through genuine humility is the source of this strength."],
   ["2nd (Six)","Modesty that becomes known. Perseverance brings good fortune.","Humility that naturally earns recognition, sustained, brings good fortune.","The good fortune of modesty made known comes from a heart that is truly centered.","A genuinely centered heart is what makes this humility so evident."],
   ["3rd (Nine)","Diligent and modest. The noble one carries things through; good fortune.","Hardworking humility, carried through fully, brings good fortune.","The diligent and modest noble one wins the allegiance of all people.","Such sincere, humble effort earns the genuine loyalty of others."],
   ["4th (Six)","Nothing unfavorable; further exercising modesty.","Nothing but good comes from continuing to extend humility further.","Nothing unfavorable in further exercising modesty means not departing from the proper rule.","This is simply staying true to the correct principle."],
   ["5th (Six)","Not relying on wealth for his neighbors; favorable to attack and subdue. Nothing unfavorable.","Even without great resources, correcting wrongdoing when needed brings only good.","Favorable to attack and subdue means to correct those who do not submit.","Setting right those who resist what is proper is the purpose here."],
   ["Top (Six)","Modesty that becomes known. Favorable to deploy the army, to attack one's own city and states.","Recognized humility even supports firm, corrective action when truly needed.","Modesty made known shows the will has not yet been fully realized; one may deploy the army to attack the city and states.","Since the deeper aim is not yet fulfilled, firm correction may still be called for."],
  ],
  a:"A humble, understated approach to love actually wins more favor.",b:"Stay modest and avoid claiming credit — opportunities and goodwill will come naturally.",c:"Finances are steady — keep a low profile and avoid showing off or speculating."}
},
{n:16,s:"豫",f:"雷地豫",u:"震",l:"坤",k:"悅樂順動",fortune:"小吉",
 desc:"悅樂順動，指眼前氣氛歡欣、順勢而為，正是展開新計畫的好時機。",
 guaCi:"豫：利建侯行師。",
 guaCiX:"豫卦象徵歡樂順動：有利於建立諸侯、出兵征戰。",
 tuan:"豫，剛應而志行，順以動，豫。豫順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過而四時不忒；聖人以順動，則刑罰清而民服。豫之時義大矣哉！",
 tuanX:"剛強者得到響應而志向得以施行，順應時勢而行動，這便是豫卦的精神；順勢而動，連天地都遵循此理運行，何況是建立諸侯、出兵征戰呢？天地順勢運行，因此日月運轉不失常軌、四季更替不會錯亂；聖人順勢施政，刑罰便能清明、百姓自然順服。豫卦所蘊含順時而動的道理實在深遠廣大！",
 xiang:"雷出地奮，豫；先王以作樂崇德，殷薦之上帝，以配祖考。",
 xiangX:"雷聲從地面震動而出，象徵歡欣鼓舞之象，古代君王觀此便製作音樂、崇尚德行，並隆重地祭祀上天，同時配祀祖先。",
 guaCiSeg:[{o:"豫：利建侯行師。",e:"豫卦象徵歡樂順動：有利於建立諸侯、出兵征戰。",terms:["li"]}],
 tuanSeg:[{o:"豫，剛應而志行，順以動，豫。",e:"剛強者得到響應而志向得以施行，順應時勢而行動，這便是豫卦的精神。",terms:["zhi"]},{o:"豫順以動，故天地如之，而況建侯行師乎？",e:"順勢而動，連天地都遵循此理運行，何況是建立諸侯、出兵征戰呢？"},{o:"天地以順動，故日月不過而四時不忒；聖人以順動，則刑罰清而民服。",e:"天地順勢運行，因此日月運轉不失常軌、四季更替不會錯亂；聖人順勢施政，刑罰便能清明、百姓自然順服。"},{o:"豫之時義大矣哉！",e:"豫卦所蘊含順時而動的道理實在深遠廣大！",terms:["shi"]}],
 xiangSeg:[{o:"雷出地奮，豫；",e:"雷聲從地面震動而出，象徵歡欣鼓舞之象；"},{o:"先王以作樂崇德，殷薦之上帝，以配祖考。",e:"古代君王觀此便製作音樂、崇尚德行，並隆重地祭祀上天，同時配祀祖先。"}],
 yao:[
 ["初六","鳴豫，凶。","一味自鳴得意、耽於逸樂，將招致凶險。","初六鳴豫，志窮凶也。","志向已陷窮途，故沉溺逸樂而招凶。"],
 ["六二","介于石，不終日，貞吉。","意志堅定如磐石，能及時醒悟、堅守正道，吉祥。","不終日貞吉，以中正也。","不待終日便能醒悟守正，是因秉持中正之德。"],
 ["六三","盱豫，悔；遲有悔。","仰望上位貪圖逸樂而後悔，猶豫遲疑也會招來悔恨。","盱豫有悔，位不當也。","貪圖逸樂而生悔恨，是因所處地位不恰當。"],
 ["九四","由豫，大有得；勿疑，朋盍簪。","由此開創歡樂之局，大有收穫，不必疑慮，志同道合者將紛紛前來相聚。","由豫大有得，志大行也。","由此而使志向得以大為施展。"],
 ["六五","貞疾，恆不死。","雖處久病纏身般的困境，堅守正道仍能維持不至於敗亡。","六五貞疾，乘剛也；恆不死，中未亡也。","久病是因乘凌於剛強之上；但因居中之道未失，故能不亡。"],
 ["上六","冥豫，成有渝，无咎。","沉溺於逸樂昏昧不明，若能及時醒悟改變，仍可無咎。","冥豫在上，何可長也。","居於上位卻沉溺逸樂，這種狀態難以長久。"],
 ],
 a:"感情氛圍愉悅和樂，但勿因安逸而鬆懈經營。",b:"適合展開新計畫，順勢而為可獲支持與認同。",c:"財運順遂，但仍需未雨綢繆，避免樂極生悲。",
 en:{name:"Yù",title:"Enthusiasm",keyword:"Joyful Momentum",
  desc:"Thunder breaking from the earth: an atmosphere of energy and shared enthusiasm — a good time to launch new plans.",
  guaCi:"Yù: Favorable to appoint leaders and deploy armies.",
  guaCiX:"A season of momentum, well suited to establishing leadership and mobilizing collective effort.",
  tuan:"Yù: strength responds and its will is carried out; moving in accord, this is Yù. Since Yù moves in accord, even heaven and earth follow this pattern — how much more the appointing of leaders and deploying of armies! Heaven and earth move in accord, and so sun and moon do not err, and the four seasons do not go astray. The sage moves in accord, and so punishments are made clear and the people submit. Great indeed is the meaning of this moment.",
  tuanX:"When action follows the natural order, even heaven and earth move smoothly along with it; a wise leader who moves this way governs with clarity and wins the people's genuine trust.",
  xiang:"Thunder bursts forth from the earth: this is Yù. Thus the ancient kings made music to honor virtue, offering it in glory to the Supreme Lord, joined with the memory of their ancestors.",
  xiangX:"As thunder bursts vigorously from the earth, the ancient kings composed music to honor virtue and offered solemn tribute to the divine, alongside their ancestors.",
  yao:[
   ["1st (Six)","Enthusiasm proclaimed aloud. Misfortune.","Boastful, self-satisfied enthusiasm, without real substance, ends badly.","The misfortune of the first line's loud enthusiasm shows the will has reached a dead end.","Such empty self-satisfaction is a sign of a purpose gone astray."],
   ["2nd (Six)","Firm as a rock, not lasting the whole day. Perseverance brings good fortune.","Recognizing danger quickly and acting at once, with integrity, brings good fortune.","Good fortune through perseverance, not lasting the whole day, comes from centered correctness.","A firmly centered, correct nature is what allows this swift good judgment."],
   ["3rd (Six)","Enthusiasm looking upward brings regret; hesitation also brings regret.","Both overeager dependence and hesitant delay lead to regret here.","The regret of looking upward for enthusiasm comes from being poorly placed.","This ill-fitting position is the underlying cause of the regret."],
   ["4th (Nine)","The source of enthusiasm. Great achievement; have no doubt — friends gather around like a hairpin holding the hair.","Genuine, confident momentum draws capable allies together in real achievement.","Great achievement from the source of enthusiasm shows the will greatly carried out.","A truly ambitious and sincere purpose is realized here."],
   ["5th (Six)","Chronically ill, yet persisting without dying.","Persevering through a lingering difficulty without being overcome by it.","Chronically ill from riding upon strength; persisting without dying, for the centered way has not been lost.","Holding to a balanced, centered course is what allows one to endure."],
   ["Top (Six)","Enthusiasm carried to excess, yet if change comes, no blame.","Overindulgence in ease, if corrected in time, need not end badly.","How can such excessive enthusiasm at the top possibly last?","Such indulgence, by its nature, cannot be sustained indefinitely."],
  ],
  a:"The mood is joyful — just don't let comfort make you complacent about the relationship.",b:"A good time to launch new plans — going with the flow brings support and recognition.",c:"Finances are smooth, but still plan ahead — don't let ease turn into carelessness."}
},
{n:17,s:"隨",f:"澤雷隨",u:"兌",l:"震",k:"隨時而動",fortune:"小吉",
 desc:"隨時而動，指當前宜順應局勢、隨緣而行，不必強求，自然水到渠成。",
 guaCi:"隨：元亨利貞，无咎。",
 guaCiX:"隨卦象徵隨時而動：大為亨通，堅守正道便沒有災咎。",
 tuan:"隨，剛來而下柔，動而說，隨。大亨貞无咎，而天下隨時，隨時之義大矣哉！",
 tuanX:"剛強者前來屈居於柔順者之下，行動且能使人喜悅，這便是隨的精神；能大為亨通、守正而無災咎，天下萬物都懂得順應時勢而隨行，隨時應變的道理實在深遠廣大！",
 xiang:"澤中有雷，隨；君子以嚮晦入宴息。",
 xiangX:"沼澤之中蘊藏著雷聲，象徵萬物隨時而動、隨時而息，君子觀此應順應晝夜規律，天色入暗便安然休息。",
 guaCiSeg:[{o:"隨：元亨利貞，",e:"隨卦象徵隨時而動：大為亨通、有利、正固，",terms:["yuanheng","li","zhen"]},{o:"无咎。",e:"沒有災咎。",terms:["wujiu"]}],
 tuanSeg:[{o:"隨，剛來而下柔，動而說，隨。",e:"剛強者前來屈居於柔順者之下，行動且能使人喜悅，這便是隨的精神。"},{o:"大亨貞无咎，而天下隨時，",e:"能大為亨通、守正而無災咎，天下萬物都懂得順應時勢而隨行，",terms:["heng","zhen","wujiu"]},{o:"隨時之義大矣哉！",e:"隨時應變的道理實在深遠廣大！",terms:["shi"]}],
 xiangSeg:[{o:"澤中有雷，隨；",e:"沼澤之中蘊藏著雷聲，象徵萬物隨時而動、隨時而息；"},{o:"君子以嚮晦入宴息。",e:"君子觀此應順應晝夜規律，天色入暗便安然休息。",terms:["jun_zi"]}],
 yao:[
 ["初九","官有渝，貞吉，出門交有功。","職位或處境有所變動，堅守正道則吉，主動與外界交往可獲成效。","官有渝，從正吉也；出門交有功，不失也。","順從正道故能吉祥；出外結交而有所成就，不致有所失。"],
 ["六二","係小子，失丈夫。","若牽繫於眼前小利，恐將失去真正重要的依靠。","係小子，弗兼與也。","顧此失彼，難以兩全其美。"],
 ["六三","係丈夫，失小子；隨有求得，利居貞。","選擇依附真正可靠的對象，捨棄眼前小利，堅守正道有利。","係丈夫，志舍下也。","志向捨棄眼前微小的利益。"],
 ["九四","隨有獲，貞凶；有孚在道，以明，何咎。","隨從中有所獲得，卻可能潛藏凶險；只要心存誠信、行於正道，便無過失。","隨有獲，其義凶也；有孚在道，明功也。","隨從得利本身潛藏凶險；唯有誠信循道而行，才能彰顯功效。"],
 ["九五","孚于嘉，吉。","以誠信對待美善之事，吉祥。","孚于嘉吉，位正中也。","居中守正，故能誠信而獲吉祥。"],
 ["上六","拘係之，乃從維之，王用亨于西山。","以誠意深切維繫人心，如君王在西山誠心祭祀般虔敬。","拘係之，上窮也。","極力維繫人心，是因局勢已發展至極致。"],
 ],
 a:"感情宜順其自然、隨緣發展，不必強求。",b:"懂得因時制宜、隨機應變，能順勢掌握機會。",c:"財運隨市場變化，宜靈活調整策略，不宜固執己見。",
 en:{name:"Suí",title:"Following",keyword:"Adapting to the Moment",
  desc:"Thunder settling within the lake: the wise course now is to follow the flow of events rather than force your own way.",
  guaCi:"Suí: Sublime success, fitting to persevere. No blame.",
  guaCiX:"Great success comes through adaptability and integrity — flowing with circumstances rather than resisting them.",
  tuan:"Suí: the strong comes and places itself beneath the soft; movement that brings joy — this is Suí. Sublime success through perseverance brings no blame, and so the whole world follows the times. Great indeed is the meaning of following the times.",
  tuanX:"Strength that willingly yields to what brings genuine joy creates true and adaptable following; understanding when to flow with the moment is a profound skill.",
  xiang:"Thunder within the lake: this is Suí. Thus the noble one, as evening comes, withdraws indoors to rest.",
  xiangX:"As thunder settles quietly into the lake at day's end, a person of character retires indoors to rest when the time is right.",
  yao:[
   ["1st (Nine)","The official has a change of heart. Perseverance brings good fortune; going out and connecting with others brings achievement.","A change of position, held with integrity and openness to others, brings good results.","The official has a change of heart, and by following correctness gains good fortune; going out and connecting with others shows nothing is lost.","Openness to change, held with integrity, loses nothing of real value."],
   ["2nd (Six)","Holding to the young lad, losing the mature man.","Attaching to a lesser option means losing a more worthy connection.","Holding to the young lad means one cannot have both at once.","Choices of this kind cannot be had in both directions together."],
   ["3rd (Six)","Holding to the mature man, losing the young lad. Following brings what is sought; favorable to remain constant.","Choosing the more worthy connection, and releasing the lesser, is the sound course.","Holding to the mature man shows the will is set on what lies below.","The genuine intent here is directed toward what truly matters."],
   ["4th (Nine)","Following brings gain, but perseverance still carries danger. With sincerity on the path, understanding clearly — what blame could there be?","Success gained through following still carries risk, best offset by sincerity and clarity.","Following that brings gain carries a meaning that is genuinely dangerous.","Even a fortunate gain of this kind must be approached with real caution."],
   ["5th (Nine)","Sincerity toward what is excellent. Good fortune.","Genuine faith placed in what is truly good brings good fortune.","The good fortune of sincerity toward excellence comes from a rightly balanced position.","A correct, well-centered position is what brings this fortunate result."],
   ["Top (Six)","Bound and tied, then further secured. The king offers this at the western mountain.","Deep, unwavering commitment, expressed with the reverence of sacred devotion.","Bound and tied at the very top shows things have reached their limit.","This deep commitment has reached the natural limit of its expression."],
  ],
  a:"Let love unfold naturally — don't force what isn't ready.",b:"Adapt to circumstances as they change — flexibility lets you seize the moment.",c:"Markets are shifting — stay flexible rather than rigid in your strategy."}
},
{n:18,s:"蠱",f:"山風蠱",u:"艮",l:"巽",k:"撥亂反正",fortune:"平",
 desc:"撥亂反正，指目前積弊已深，宜大刀闊斧革新整頓，方能轉危為安。",
 guaCi:"蠱：元亨，利涉大川。先甲三日，後甲三日。",
 guaCiX:"蠱卦象徵積弊叢生：大為亨通，有利於涉越險阻成就大事；行事之前應審慎籌劃，事後也要妥善善後。",
 tuan:"蠱，剛上而柔下，巽而止，蠱。蠱，元亨，而天下治也。利涉大川，往有事也。先甲三日，後甲三日，終則有始，天行也。",
 tuanX:"剛強者居上、柔順者居下，順從而又止步不前，因而形成積弊叢生的局面；然而整治積弊反而能大為亨通，使天下得以大治；涉險前行，是為了有所作為、革除弊端；謹慎籌劃於事前、妥善善後於事後，正如同事物終而復始、循環不息的天道規律。",
 xiang:"山下有風，蠱；君子以振民育德。",
 xiangX:"山下吹拂著風，草木因而散亂，象徵積弊叢生之象，君子觀此應振興教化百姓、涵養自身的德行。",
 guaCiSeg:[{o:"蠱：元亨，",e:"蠱卦象徵積弊叢生：大為亨通，",terms:["yuanheng"]},{o:"利涉大川。",e:"有利於涉越險阻成就大事。",terms:["li","she_da_chuan"]},{o:"先甲三日，後甲三日。",e:"行事之前應審慎籌劃，事後也要妥善善後。"}],
 tuanSeg:[{o:"蠱，剛上而柔下，巽而止，蠱。",e:"剛強者居上、柔順者居下，順從而又止步不前，因而形成積弊叢生的局面。"},{o:"蠱，元亨，而天下治也。",e:"然而整治積弊反而能大為亨通，使天下得以大治。",terms:["yuanheng"]},{o:"利涉大川，往有事也。",e:"涉險前行，是為了有所作為、革除弊端。",terms:["li"]},{o:"先甲三日，後甲三日，終則有始，天行也。",e:"謹慎籌劃於事前、妥善善後於事後，正如同事物終而復始、循環不息的天道規律。"}],
 xiangSeg:[{o:"山下有風，蠱；",e:"山下吹拂著風，草木因而散亂，象徵積弊叢生之象；"},{o:"君子以振民育德。",e:"君子觀此應振興教化百姓、涵養自身的德行。",terms:["jun_zi"]}],
 yao:[
 ["初六","幹父之蠱，有子，考无咎，厲終吉。","子女承擔起整治父輩留下的積弊，雖有危險，最終能使父輩免於過咎、吉祥。","幹父之蠱，意承考也。","整治父業的積弊，用意在於承繼父輩的心願。"],
 ["九二","幹母之蠱，不可貞。","整治母輩留下的積弊，宜圓融應對、不可過於剛硬固執。","幹母之蠱，得中道也。","秉持中庸之道應對，方為得宜。"],
 ["九三","幹父之蠱，小有悔，无大咎。","整治積弊過程雖有小遺憾，但無重大過失。","幹父之蠱，終无咎也。","整治積弊到最後，終究沒有災咎。"],
 ["六四","裕父之蠱，往見吝。","對積弊過於寬鬆放任，繼續下去恐生遺憾。","裕父之蠱，往未得也。","過於寬鬆處理積弊，繼續前行難有所得。"],
 ["六五","幹父之蠱，用譽。","整治積弊得宜，因而贏得聲譽。","幹父用譽，承以德也。","以德行承繼並整治積弊，故能獲得美譽。"],
 ["上九","不事王侯，高尚其事。","不求仕於王侯，堅守自身高潔的志向操守。","不事王侯，志可則也。","如此高尚的志向，值得作為典範效法。"],
 ],
 a:"感情中累積已久的問題浮現，需要正視並徹底改善。",b:"工作上積弊已久，適合大刀闊斧整頓革新。",c:"財務出現舊有問題，宜盡快清理債務、重新規劃。",
 en:{name:"Gǔ",title:"Repairing What Has Decayed",keyword:"Renewal After Decay",
  desc:"Old corruption has built up: it's a good time for decisive reform — clearing away what's rotten to restore what's sound.",
  guaCi:"Gǔ: Sublime success. Favorable to cross the great water. Three days before the starting day, three days after.",
  guaCiX:"Careful, thorough reform of accumulated problems leads to great success, even supporting a bold new undertaking.",
  tuan:"Gǔ: the strong is above and the soft below; yielding, then coming to rest — this is Gǔ. Sublime success in Gǔ brings order to the world; favorable to cross the great water shows there is work to be done. Three days before the starting day, three days after, for the end and the beginning follow heaven's own course.",
  tuanX:"Where decay meets stillness rather than correction, this is how corruption sets in; but addressing it with care and thoroughness restores true order, following nature's own cycle of ending and renewal.",
  xiang:"Below the mountain, wind blows: this is Gǔ. Thus the noble one rouses the people and nurtures their virtue.",
  xiangX:"As wind stirs beneath the mountain, scattering what has stagnated, a person of character rouses the people and cultivates their character.",
  yao:[
   ["1st (Six)","Correcting a father's decay. If there is a worthy heir, the father is without blame; though there is danger, in the end good fortune.","A capable successor mending past mistakes redeems what came before, despite the risk.","Correcting a father's decay shows the intent to carry on the father's legacy.","Genuine devotion to carrying on the family's honor drives this repair."],
   ["2nd (Nine)","Correcting a mother's decay. One should not be too rigid.","Reforming a matter tied to maternal authority calls for gentleness rather than force.","Correcting a mother's decay is achieved through a balanced, moderate course.","A measured, flexible approach is what accomplishes this correction."],
   ["3rd (Nine)","Correcting a father's decay. Some small regret, but no great blame.","Reforming past error brings minor friction but nothing seriously wrong.","Correcting a father's decay comes to no great blame in the end.","Any friction here does not amount to a real fault."],
   ["4th (Six)","Tolerating a father's decay. Going forward brings only regret.","Being too lenient with the problem only lets it worsen further.","Tolerating a father's decay and going forward without gain.","Excess leniency here yields nothing of real value going forward."],
   ["5th (Six)","Correcting a father's decay. One earns praise for it.","Successfully reforming past error brings genuine recognition.","Correcting a father's decay and earning praise comes from carrying it forward with true virtue.","Genuine virtue, applied to the task, is what earns this praise."],
   ["Top (Nine)","Not serving kings or lords, holding one's own affairs in high regard.","Choosing personal integrity and independence over public office.","Not serving kings or lords — such a resolve is worth taking as a model.","This kind of principled independence is genuinely admirable."],
  ],
  a:"Long-buried issues are surfacing — face them honestly and clean things up thoroughly.",b:"Old problems at work need bold, decisive reform.",c:"Old financial issues are surfacing — clear debts and re-plan as soon as possible."}
},
{n:19,s:"臨",f:"地澤臨",u:"坤",l:"兌",k:"臨事而懼",fortune:"小吉",
 desc:"臨事而懼，指眼前運勢上升、宜積極任事，但仍須提防盛極而衰。",
 guaCi:"臨：元亨，利貞。至于八月有凶。",
 guaCiX:"臨卦象徵居上臨下：大為亨通，堅守正道有利；但到了陽氣漸消的時候，仍須提防由盛轉衰的凶險。",
 tuan:"臨，剛浸而長，說而順，剛中而應，大亨以正，天之道也。至于八月有凶，消不久也。",
 tuanX:"剛強者逐漸增長，內心和悅又能順應局勢，居中守正且能相應，因此能大為亨通，這正是順應天道的緣故；提醒到了陽氣消退之時將有凶險，是因為盛極必衰，不會長久維持。",
 xiang:"澤上有地，臨；君子以教思无窮，容保民无疆。",
 xiangX:"沼澤之上有廣闊的大地，象徵居高臨下、統御萬民之象，君子觀此應施行教化不知窮盡，並且包容、保護百姓，恩澤廣被無邊。",
 guaCiSeg:[{o:"臨：元亨，",e:"臨卦象徵居上臨下：大為亨通，",terms:["yuanheng"]},{o:"利貞。",e:"堅守正道有利。",terms:["li","zhen"]},{o:"至于八月有凶。",e:"但到了陽氣漸消的時候，仍須提防由盛轉衰的凶險。",terms:["xiong"]}],
 tuanSeg:[{o:"臨，剛浸而長，說而順，剛中而應，",e:"剛強者逐漸增長，內心和悅又能順應局勢，居中且能相應，"},{o:"大亨以正，天之道也。",e:"因此能大為亨通，這正是順應天道的緣故。",terms:["heng"]},{o:"至于八月有凶，消不久也。",e:"提醒到了陽氣消退之時將有凶險，是因為盛極必衰，不會長久維持。",terms:["xiong"]}],
 xiangSeg:[{o:"澤上有地，臨；",e:"沼澤之上有廣闊的大地，象徵居高臨下、統御萬民之象；"},{o:"君子以教思无窮，容保民无疆。",e:"君子觀此應施行教化不知窮盡，並且包容、保護百姓，恩澤廣被無邊。",terms:["jun_zi"]}],
 yao:[
 ["初九","咸臨，貞吉。","以誠心感召的方式治理臨下，堅守正道則吉。","咸臨貞吉，志行正也。","感召之志行於正道，故能吉祥。"],
 ["九二","咸臨，吉，无不利。","以誠心感召治理，吉祥，無所不利。","咸臨吉无不利，未順命也。","雖尚未完全順從命令，但誠心感召仍能無往不利。"],
 ["六三","甘臨，无攸利；既憂之，无咎。","以甜言蜜語討好、粉飾太平地治理，並無益處；能及時憂慮警惕便無咎。","甘臨，位不當也；既憂之，咎不長也。","以此方式治理是位不當之舉；懂得憂慮反省，過咎便不會延續。"],
 ["六四","至臨，无咎。","親自到場、切實臨事處理，並無災咎。","至臨无咎，位當也。","親身臨事處理得宜，是因所處之位恰當。"],
 ["六五","知臨，大君之宜，吉。","以智慧治理臨下，適合居於君王之位，吉祥。","大君之宜，行中之謂也。","君王治理得宜，正是秉持中道而行的表現。"],
 ["上六","敦臨，吉，无咎。","以敦厚篤實之心治理臨下，吉祥且無災咎。","敦臨之吉，志在內也。","敦厚治理而獲吉祥，是因志向發自內心真誠。"],
 ],
 a:"感情運勢上升，宜主動關心、親近對方。",b:"事業運漸旺，適合擴大經營或接下更多責任。",c:"財運看漲，適合逐步加碼，但仍須留意風險。",
 en:{name:"Lín",title:"Approach",keyword:"Rising Influence",
  desc:"Growing influence, growing responsibility: a favorable time to step forward and lead — but stay alert once the peak has passed.",
  guaCi:"Lín: Sublime success, fitting to persevere. When the eighth month comes, there will be misfortune.",
  guaCiX:"Great success and rightness mark this moment, though a warning remains that even growth eventually turns toward decline.",
  tuan:"Lín: the firm gradually grows; joy within, obedience without; the firm holds the center and is responded to — great success through correctness, this is heaven's own way. The misfortune when the eighth month comes shows this waning will not be far off.",
  tuanX:"Steady, balanced growth supported by genuine contentment and compliance leads naturally to great success; but nothing that rises can rise forever, so vigilance against decline remains wise.",
  xiang:"Above the lake there is earth: this is Lín. Thus the noble one's thought and instruction are without limit, and he protects and sustains the people without bound.",
  xiangX:"As earth rises above the lake, overseeing and drawing near, a person of character teaches endlessly and cares for the people without limit.",
  yao:[
   ["1st (Nine)","Joint approach. Perseverance brings good fortune.","Approaching others in genuine partnership, with integrity, brings good fortune.","Perseverance and good fortune in joint approach comes from a will set on what is right.","A sincere intent toward what is right underlies this good result."],
   ["2nd (Nine)","Joint approach. Good fortune, nothing unfavorable.","This same genuine partnership continues to bring nothing but good.","Good fortune with nothing unfavorable shows one has not yet simply obeyed orders.","Acting from genuine will, rather than mere obligation, brings this good result."],
   ["3rd (Six)","Approach with mere flattery — nothing favorable in this. But once one grows anxious about it, no blame follows.","Approaching others through empty charm is unhelpful, but timely self-awareness prevents real harm.","Approach with mere flattery comes from being poorly placed; growing anxious about it means the fault does not persist.","Recognizing the misstep in time is what prevents lasting fault."],
   ["4th (Six)","Complete approach. No blame.","Wholehearted, genuine engagement with others carries no fault.","No blame in complete approach shows a position that is truly fitting.","This well-suited position is what makes the approach entirely sound."],
   ["5th (Six)","Wise approach. Fitting for a great ruler. Good fortune.","Approaching matters with real wisdom, especially in leadership, brings good fortune.","The fitting course for a great ruler comes from following the balanced, middle way.","Following a centered, moderate course is the true mark of wise rule."],
   ["Top (Six)","Generous approach. Good fortune, no blame.","A warm, magnanimous way of engaging with others brings good fortune, without fault.","The good fortune of generous approach comes from a will directed inward, toward what truly matters.","A genuine, inward-focused sincerity is the real source of this fortune."],
  ],
  a:"Things are looking up in love — be proactive and show you care.",b:"Career momentum is building — a good time to expand or take on more responsibility.",c:"Finances trending up — good time to add positions gradually, but stay alert to risk."}
},
{n:20,s:"觀",f:"風地觀",u:"巽",l:"坤",k:"觀察省思",fortune:"平",
 desc:"觀察省思，指當前宜多加觀察、謹慎行事，以身作則方能感化他人。",
 guaCi:"觀：盥而不薦，有孚顒若。",
 guaCiX:"觀卦象徵觀察省思：如同祭祀時洗淨雙手、尚未獻上祭品的莊重時刻，心懷誠敬便能使人肅然起敬、心悅誠服。",
 tuan:"大觀在上，順而巽，中正以觀天下。觀，盥而不薦，有孚顒若，下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。",
 tuanX:"居於上位者德行廣大可觀，柔順而謙遜，以中正之道昭示天下；如同祭祀初始那般莊重誠敬，便能使下位者觀之而受感化；觀察天道運行的奧妙，四季更替絲毫不差，聖人便依循此天道設立教化，天下百姓因而心悅誠服。",
 xiang:"風行地上，觀；先王以省方，觀民設教。",
 xiangX:"風吹拂過大地各處、無所不至，象徵巡視觀察之象，古代君王觀此便巡視四方、體察民情，並依此設立教化。",
 guaCiSeg:[{o:"觀：盥而不薦，",e:"觀卦象徵觀察省思：如同祭祀時洗淨雙手、尚未獻上祭品的莊重時刻，"},{o:"有孚顒若。",e:"心懷誠敬便能使人肅然起敬、心悅誠服。",terms:["youfu","yongruo"]}],
 tuanSeg:[{o:"大觀在上，順而巽，中正以觀天下。",e:"居於上位者德行廣大可觀，柔順而謙遜，以中正之道昭示天下。",terms:["zhong_zheng"]},{o:"觀，盥而不薦，有孚顒若，下觀而化也。",e:"如同祭祀初始那般莊重誠敬，便能使下位者觀之而受感化。",terms:["youfu","yongruo"]},{o:"觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。",e:"觀察天道運行的奧妙，四季更替絲毫不差，聖人便依循此天道設立教化，天下百姓因而心悅誠服。"}],
 xiangSeg:[{o:"風行地上，觀；",e:"風吹拂過大地各處、無所不至，象徵巡視觀察之象；"},{o:"先王以省方，觀民設教。",e:"古代君王觀此便巡視四方、體察民情，並依此設立教化。"}],
 yao:[
 ["初六","童觀，小人无咎，君子吝。","如孩童般見識淺薄地觀察事物，一般人尚可，但君子應有更深遠的見識，否則有所遺憾。","初六童觀，小人道也。","見識淺薄猶如孩童，是一般人常見的處世之道。"],
 ["六二","闚觀，利女貞。","從門縫中窺視觀察，格局有限，宜如女子般安靜守正。","闚觀女貞，亦可醜也。","僅從狹隘的角度觀察，也是令人稍感不足之處。"],
 ["六三","觀我生，進退。","反省自身的作為，依此決定進退。","觀我生進退，未失道也。","觀察自身而決定進退，並未偏離正道。"],
 ["六四","觀國之光，利用賓于王。","觀察國家的興盛景象，適合出仕輔佐君王。","觀國之光，尚賓也。","觀察國家的光輝榮景，崇尚成為賓客輔佐之才。"],
 ["九五","觀我生，君子无咎。","君子反省自身的言行舉止，並無災咎。","觀我生，觀民也。","觀察自身其實也是在觀察治下的百姓。"],
 ["上九","觀其生，君子无咎。","觀察他人的言行作為，君子行事得宜便無災咎。","觀其生，志未平也。","觀察他人的作為，內心仍有未平之處，宜持續戒慎。"],
 ],
 a:"宜多觀察了解對方，勿急於下結論或行動。",b:"適合觀察局勢、蓄積實力，以身作則帶動他人。",c:"理財前宜多觀察市場動態，避免倉促決定。",
 en:{name:"Guān",title:"Contemplation",keyword:"Observation and Reflection",
  desc:"Wind moving over the earth: a time for careful observation and self-reflection, so that clear insight can guide what follows.",
  guaCi:"Guān: Washing the hands but not yet presenting the offering; possessing sincerity, dignified and full of reverence.",
  guaCiX:"Like the solemn pause before a sacred offering, this is a moment to hold sincere, dignified reverence rather than rush ahead.",
  tuan:"Great is the vision from above: gentle and obedient, centered and correct, one contemplates the world. 'Washing the hands but not yet presenting the offering, possessing sincerity, dignified and full of reverence' shows those below observe and are transformed. Contemplating heaven's own divine way, the four seasons do not err; the sage, through this divine way, establishes his teaching, and the whole world submits.",
  tuanX:"A leader who is centered, sincere, and genuinely dignified inspires transformation simply by example — this is how those observing heaven's own steady, reliable order come to trust and follow.",
  xiang:"Wind moves over the earth: this is Guān. Thus the ancient kings inspected the regions, observed the people, and established their teaching.",
  xiangX:"As wind travels far and wide across the earth, reaching every place, ancient kings toured the land, observed the people's condition, and set up fitting instruction.",
  yao:[
   ["1st (Six)","A child's view. No blame for the small-minded; regret for the noble one.","A shallow, immature perspective is acceptable for the ordinary person but a real shortcoming for one who should know better.","A child's view in the first line is the way of the small-minded.","Such limited insight is simply the natural way of the ordinary person."],
   ["2nd (Six)","Peering through a crack. Favorable for a woman's perseverance.","A narrow, restricted vantage point is fitting only for a quietly modest role.","Peering through a crack, favorable for a woman's perseverance, is a somewhat limited view even so.","Even this modest fittingness reflects a fairly narrow scope of insight."],
   ["3rd (Six)","Contemplating one's own life, advancing or withdrawing accordingly.","Reflecting honestly on one's own conduct to decide whether to move forward or hold back.","Contemplating one's own life to advance or withdraw does not depart from the proper way.","This is simply staying true to the correct principle of self-examination."],
   ["4th (Six)","Contemplating the glory of the kingdom. Favorable to be received as a guest of the king.","Observing the flourishing of a well-governed realm supports serving in an honored role.","Contemplating the kingdom's glory means valuing the position of honored guest.","Recognizing and valuing this esteemed role is the point here."],
   ["5th (Nine)","Contemplating one's own life. The noble one is without blame.","A ruler reflecting sincerely on their own conduct and influence remains without fault.","Contemplating one's own life is in truth to observe the people.","Self-reflection at this level is, in effect, an honest look at how the people fare."],
   ["Top (Nine)","Contemplating the life of others. The noble one is without blame.","Observing the conduct of others with a discerning eye also carries no fault, if done rightly.","Contemplating others' lives, though the will has not yet found full peace.","There remains a lingering unease that has not yet been fully settled."],
  ],
  a:"Observe more before drawing conclusions or acting on the relationship.",b:"Watch the wider situation and build your strength — lead by example.",c:"Study market trends carefully before making financial moves."}
},
{n:21,s:"噬嗑",f:"火雷噬嗑",u:"離",l:"震",k:"明辨是非",fortune:"小吉",
 desc:"明辨是非，指目前障礙需要果斷處理，明快斷案方能掃除阻礙、順利通行。",
 guaCi:"噬嗑：亨。利用獄。",
 guaCiX:"噬嗑卦象徵咬合去除障礙：亨通，有利於明斷刑獄。",
 tuan:"頤中有物，曰噬嗑。噬嗑而亨，剛柔分，動而明，雷電合而章。柔得中而上行，雖不當位，利用獄也。",
 tuanX:"口中含有異物，需要咬合才能通暢，這便是噬嗑；咬合之後便能亨通，是因為剛柔各自分明、行動且明察，如同雷電交加、彰顯威嚴；柔順者居中且能上行，雖不完全居於正位，但仍有利於明斷刑獄。",
 xiang:"雷電，噬嗑；先王以明罰敕法。",
 xiangX:"雷聲與閃電交相顯現，威嚴而明察，象徵噬嗑之象，古代君王觀此便嚴明刑罰、整飭法令。",
 guaCiSeg:[{o:"噬嗑：亨。",e:"噬嗑卦象徵咬合去除障礙：亨通。",terms:["heng"]},{o:"利用獄。",e:"有利於明斷刑獄。",terms:["li"]}],
 tuanSeg:[{o:"頤中有物，曰噬嗑。",e:"口中含有異物，需要咬合才能通暢，這便是噬嗑。"},{o:"噬嗑而亨，剛柔分，動而明，雷電合而章。",e:"咬合之後便能亨通，是因為剛柔各自分明、行動且明察，如同雷電交加、彰顯威嚴。",terms:["heng"]},{o:"柔得中而上行，雖不當位，利用獄也。",e:"柔順者居中且能上行，雖不完全居於正位，但仍有利於明斷刑獄。",terms:["li"]}],
 xiangSeg:[{o:"雷電，噬嗑；",e:"雷聲與閃電交相顯現，威嚴而明察，象徵噬嗑之象；"},{o:"先王以明罰敕法。",e:"古代君王觀此便嚴明刑罰、整飭法令。"}],
 yao:[
 ["初九","屨校滅趾，无咎。","初犯輕微過錯即受懲戒，如戴上腳鐐傷及腳趾，及時警惕故無災咎。","屨校滅趾，不行也。","及早懲戒能使其不再繼續犯錯而行。"],
 ["六二","噬膚滅鼻，无咎。","處理阻礙如咬噬柔軟的皮肉般容易，即使力道稍重也無災咎。","噬膚滅鼻，乘剛也。","處理容易，是因居於剛強之位。"],
 ["六三","噬腊肉，遇毒；小吝，无咎。","處理較難的阻礙如咬噬乾硬的臘肉般遇到阻力，稍有困難但無大礙。","遇毒，位不當也。","遭遇阻力，是因所處之位不太恰當。"],
 ["九四","噬乾胏，得金矢；利艱貞，吉。","處理艱難的阻礙，如咬噬帶骨乾肉卻獲得金屬箭矢，堅守正道、克服艱難則吉。","利艱貞吉，未光也。","雖然艱難守正而吉，但事情尚未完全彰顯。"],
 ["六五","噬乾肉，得黃金；貞厲，无咎。","處理阻礙獲得豐厚回報，雖有危險但堅守正道便無災咎。","貞厲无咎，得當也。","堅守正道雖有危險卻無咎，是因處置得當。"],
 ["上九","何校滅耳，凶。","積習已深、屢教不改，最終遭受嚴厲懲罰，凶險。","何校滅耳，聰不明也。","招致嚴厲懲罰，是因不聽勸告、耳目不夠聰明。"],
 ],
 a:"感情中的誤會需要坦誠溝通、當機立斷解決。",b:"適合處理棘手問題，明快果決能突破僵局。",c:"財務糾紛宜及早處理，避免拖延累積損失。",
 en:{name:"Shì Kè",title:"Biting Through",keyword:"Decisive Resolution",
  desc:"Thunder and lightning together: obstacles need to be met head-on — decisive, fair action clears the way forward.",
  guaCi:"Shì Kè: Success. Favorable to administer justice.",
  guaCiX:"Success comes through firm, fair resolution — this is a good time to settle disputes and clear away obstacles.",
  tuan:"Within the jaws there is something — this is called Biting Through. Biting through brings success: the hard and soft are distinct, movement joined with clarity, thunder and lightning combined and shining. The soft attains the center and moves upward; though not perfectly placed, it is favorable to administer justice.",
  tuanX:"When clarity and firm action work together, like thunder and lightning combined, obstacles yield to decisive, fair judgment even from an imperfect position.",
  xiang:"Thunder and lightning: this is Shì Kè. Thus the ancient kings made penalties clear and set the laws in order.",
  xiangX:"As thunder and lightning together display both power and clarity, ancient kings made their laws plain and their penalties just.",
  yao:[
   ["1st (Nine)","Feet in the stocks, toes destroyed. No blame.","Early, mild correction for a first offense prevents worse trouble later.","Feet in the stocks, toes destroyed, means one is stopped from going further.","Timely correction here is what prevents the wrongdoing from continuing."],
   ["2nd (Six)","Biting through soft flesh, the nose disappears into it. No blame.","Dealing with an easy problem may still involve some minor excess, without real fault.","Biting through soft flesh, the nose disappearing, shows one riding upon strength.","Acting from a position of real strength makes such a minor excess forgivable."],
   ["3rd (Six)","Biting old dried meat, encountering something poisonous. Slight regret, no blame.","A tougher problem brings some difficulty along the way, though nothing serious.","Encountering something poisonous comes from a position that is not quite fitting.","This somewhat ill-suited position accounts for the minor trouble."],
   ["4th (Nine)","Biting dried meat on the bone, obtaining a metal arrow. Favorable to persevere through hardship. Good fortune.","A difficult matter yields real reward, if approached with persistence through hardship.","Favorable through hardship and good fortune, though the light has not yet fully shone.","Full clarity has not yet been reached, but progress continues nonetheless."],
   ["5th (Six)","Biting dried meat, obtaining yellow gold. Perseverance and awareness of danger — no blame.","Success is achieved, but continued vigilance is needed to avoid complacency.","Perseverance without blame comes from acting in a way that is truly fitting.","Acting appropriately for the situation is what secures this good outcome."],
   ["Top (Nine)","Wearing the cangue, ears destroyed. Misfortune.","Persisting stubbornly in wrongdoing despite repeated warnings leads to severe consequence.","Wearing the cangue with ears destroyed shows a lack of true understanding.","Failure to truly listen and learn is what leads to this harsh outcome."],
  ],
  a:"Misunderstandings need honest talk and decisive resolution.",b:"Good for tackling thorny problems — quick, decisive action breaks through deadlock.",c:"Address financial disputes early before losses accumulate."}
},
{n:22,s:"賁",f:"山火賁",u:"艮",l:"離",k:"文飾外表",fortune:"小吉",
 desc:"文飾外表，指當前適度修飾儀表與言行有助發展，但切勿本末倒置。",
 guaCi:"賁：亨。小利有攸往。",
 guaCiX:"賁卦象徵修飾文采：亨通，小有利益，適合有所前往。",
 tuan:"賁亨，柔來而文剛，故亨；分剛上而文柔，故小利有攸往，天文也。文明以止，人文也。觀乎天文，以察時變；觀乎人文，以化成天下。",
 tuanX:"賁卦之所以亨通，是因為柔順者前來修飾剛強者，因此能亨通；剛強者分出一部分向上修飾柔順者，因此小有利益、適合有所前往，這是天文的變化；內心光明而外表有所節制，這便是人文的教化；觀察天象變化，可以察知時序的更替；觀察人文教化，則可以感化並成就天下。",
 xiang:"山下有火，賁；君子以明庶政，无敢折獄。",
 xiangX:"山下有火光照耀，光彩而不熾烈，象徵修飾文采之象，君子觀此應清明地處理各項政務，但不可僅憑外表文飾便草率斷案。",
 guaCiSeg:[{o:"賁：亨。",e:"賁卦象徵修飾文采：亨通。",terms:["heng"]},{o:"小利有攸往。",e:"小有利益，適合有所前往。",terms:["li","youyouwang"]}],
 tuanSeg:[{o:"賁亨，柔來而文剛，故亨；",e:"賁卦之所以亨通，是因為柔順者前來修飾剛強者，因此能亨通；",terms:["heng"]},{o:"分剛上而文柔，故小利有攸往，天文也。",e:"剛強者分出一部分向上修飾柔順者，因此小有利益、適合前往，這是天文的變化。",terms:["li"]},{o:"文明以止，人文也。",e:"內心光明而外表有所節制，這便是人文的教化。"},{o:"觀乎天文，以察時變；觀乎人文，以化成天下。",e:"觀察天象變化，可以察知時序的更替；觀察人文教化，則可以感化並成就天下。"}],
 xiangSeg:[{o:"山下有火，賁；",e:"山下有火光照耀，光彩而不熾烈，象徵修飾文采之象；"},{o:"君子以明庶政，无敢折獄。",e:"君子觀此應清明地處理各項政務，但不可僅憑外表文飾便草率斷案。",terms:["jun_zi"]}],
 yao:[
 ["初九","賁其趾，舍車而徒。","修飾自己的腳步，寧可捨棄乘車而徒步而行，堅守本分。","舍車而徒，義弗乘也。","依道義而言不應乘車，故選擇徒步。"],
 ["六二","賁其須。","修飾鬍鬚等細節外表，需依附主體才能相得益彰。","賁其須，與上興也。","修飾鬚髯，是隨著上位者共同興盛。"],
 ["九三","賁如濡如，永貞吉。","外表修飾光潤如受潤澤，長久堅守正道則吉。","永貞之吉，終莫之陵也。","長久堅守正道而獲吉，終究無人能夠欺凌侵犯。"],
 ["六四","賁如皤如，白馬翰如，匪寇婚媾。","修飾得潔白樸素、乘著白馬疾馳而來，並非強盜而是良緣將至。","六四當位，疑也；匪寇婚媾，終无尤也。","居位雖疑慮重重，但終究並非惡意，故無過失。"],
 ["六五","賁于丘園，束帛戔戔，吝，終吉。","以樸素的禮物修飾山丘園林般簡樸之處，起初略顯寒酸，最終仍吉。","六五之吉，有喜也。","居此位而獲吉祥，必有喜慶之事。"],
 ["上九","白賁，无咎。","返璞歸真、以潔白樸素為飾，並無災咎。","白賁无咎，上得志也。","以樸素為美而無咎，是因居上位而得遂其志。"],
 ],
 a:"適度用心經營外在形象，能為感情加分。",b:"形象與包裝有助於事業發展，但勿忽略實質內涵。",c:"財運平穩，適度花費在提升自我價值上是值得的。",
 en:{name:"Bì",title:"Grace",keyword:"Adornment and Form",
  desc:"Fire beneath the mountain: outward form and beauty matter for a while, but true substance must remain the real foundation.",
  guaCi:"Bì: Success. Small gain in having somewhere to go.",
  guaCiX:"A pleasant, refined time bringing success, with modest gain from moving forward.",
  tuan:"Bì brings success: the soft comes and adorns the firm, hence success; a portion of the firm rises to adorn the soft, hence small gain in having somewhere to go — this is the pattern of heaven. Culture and restraint together — this is the pattern of man. Observing heaven's pattern, one discerns the changing seasons; observing man's pattern, one transforms and completes the world.",
  tuanX:"Just as heaven's own patterns reveal the changing seasons, cultivated human refinement — grace paired with restraint — can, in turn, shape and elevate the world.",
  xiang:"Below the mountain there is fire: this is Bì. Thus the noble one makes clear the ordinary affairs of government, but dares not use this alone to settle judicial cases.",
  xiangX:"As fire's glow illuminates the base of the mountain, a person of character clarifies everyday governance, yet never relies on outward appearance alone to judge a case.",
  yao:[
   ["1st (Nine)","Adorning one's own feet. Setting aside the carriage, going on foot.","Choosing plain, principled simplicity over easy, showy comfort.","Setting aside the carriage and going on foot is a matter of principle, not of riding.","This is a deliberate choice of integrity over convenient display."],
   ["2nd (Six)","Adorning one's own beard.","Refinement here depends on, and rises together with, what lies above it.","Adorning one's own beard rises together with what is above.","Such adornment only has meaning in relation to what it accompanies."],
   ["3rd (Nine)","Graceful and moist in appearance. Lasting perseverance brings good fortune.","A genuinely radiant, well-cultivated bearing, sustained faithfully, brings good fortune.","The good fortune of lasting perseverance means, in the end, no one can overstep it.","Enduring integrity of this kind ultimately earns lasting respect."],
   ["4th (Six)","Grace or plainness? A white horse comes as if flying. Not a robber, but a suitor.","Uncertainty resolves once true intent — not hostile, but sincere — becomes clear.","The fourth line, though placed appropriately, still has its doubts; not a robber but a suitor, in the end there is no cause for complaint.","Once genuine intent is revealed, all earlier doubt is set to rest."],
   ["5th (Six)","Grace in the hills and gardens. The bundle of silk is meager, yet in the end good fortune.","Simple, modest beauty in a quiet, natural setting still brings good fortune in the end.","Good fortune at the fifth line comes with real cause for joy.","This unpretentious grace turns out to be genuinely worth celebrating."],
   ["Top (Nine)","Plain, unadorned grace. No blame.","Returning to natural simplicity, free of excess ornament, is entirely sound.","Plain, unadorned grace at the top achieves what was truly intended.","This return to simplicity fulfills the deeper aim all along."],
  ],
  a:"A little thoughtful attention to how you present yourself can help the relationship.",b:"Image and presentation help your career, but don't neglect real substance.",c:"Finances are steady — modest spending on self-improvement is worthwhile."}
},
{n:23,s:"剝",f:"山地剝",u:"艮",l:"坤",k:"剝落衰退",fortune:"大凶",
 desc:"剝落衰退，指眼前局勢正走下坡，宜低調保守、靜待時機，切勿躁動。",
 guaCi:"剝：不利有攸往。",
 guaCiX:"剝卦象徵剝落衰退：此時不利於有所前往行動。",
 tuan:"剝，剝也，柔變剛也。不利有攸往，小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。",
 tuanX:"剝就是剝落，是陰柔逐漸侵蝕、改變陽剛的過程；此時不利於前進，是因為小人的勢力正在增長；此時應順應局勢、暫時止步不前，這是觀察卦象所得的啟示；君子應重視事物消長盈虛的規律，這正是天道運行的常理。",
 xiang:"山附於地，剝；上以厚下安宅。",
 xiangX:"高山依附於大地之上，隨時可能崩塌剝落，象徵衰退之象，居上位者觀此應厚待下位者、鞏固根基，以求安穩。",
 guaCiSeg:[{o:"剝：不利有攸往。",e:"剝卦象徵剝落衰退：此時不利於有所前往行動。",terms:["li","you_you_wang_neg"]}],
 tuanSeg:[{o:"剝，剝也，柔變剛也。",e:"剝就是剝落，是陰柔逐漸侵蝕、改變陽剛的過程。"},{o:"不利有攸往，小人長也。",e:"此時不利於前進，是因為小人的勢力正在增長。",terms:["xiao_ren"]},{o:"順而止之，觀象也。",e:"此時應順應局勢、暫時止步不前，這是觀察卦象所得的啟示。"},{o:"君子尚消息盈虛，天行也。",e:"君子應重視事物消長盈虛的規律，這正是天道運行的常理。",terms:["jun_zi"]}],
 xiangSeg:[{o:"山附於地，剝；",e:"高山依附於大地之上，隨時可能崩塌剝落，象徵衰退之象；"},{o:"上以厚下安宅。",e:"居上位者觀此應厚待下位者、鞏固根基，以求安穩。"}],
 yao:[
 ["初六","剝床以足，蔑貞，凶。","從床足開始剝落損毀，正道逐漸受到侵蝕，凶險。","剝床以足，以滅下也。","從最基層的地方開始受到侵蝕損毀。"],
 ["六二","剝床以辨，蔑貞，凶。","剝蝕蔓延至床身，情況愈發惡化，凶險。","剝床以辨，未有與也。","損毀持續擴大，是因缺乏同伴相助支持。"],
 ["六三","剝之，无咎。","雖處剝落之勢，能與良善者相隨而行，尚可無咎。","剝之无咎，失上下也。","雖無咎，卻也因此脫離了上下原有的依附關係。"],
 ["六四","剝床以膚，凶。","剝蝕已深入切身的皮膚，情勢十分危急，凶險。","剝床以膚，切近災也。","損毀已逼近切身，禍患十分接近。"],
 ["六五","貫魚，以宮人寵，无不利。","如串連魚群般有序地帶領眾人、獲得上位者的寵信，無所不利。","以宮人寵，終无尤也。","得到寵信而行事有序，終究不會有過失。"],
 ["上九","碩果不食，君子得輿，小人剝廬。","如碩大的果實未被摘食般留下希望，君子能得眾人擁戴，小人卻連安身之處都將失去。","君子得輿，民所載也；小人剝廬，終不可用也。","君子得到百姓的擁戴支持；小人終將自毀根基，不堪重用。"],
 ],
 a:"感情運勢低迷，恐有分離跡象，宜謹慎面對。",b:"事業運走下坡，宜低調保守，避免正面衝突。",c:"財運不佳，宜守成節流，避免大額投資或借貸。",
 en:{name:"Bō",title:"Splitting Apart",keyword:"Decline and Erosion",
  desc:"A mountain resting on the earth, worn away bit by bit: decline is underway — hold back and wait rather than force things.",
  guaCi:"Bō: Not favorable to have somewhere to go.",
  guaCiX:"With decline setting in, this is not the time to press forward with new undertakings.",
  tuan:"Bō means splitting apart: the soft transforms the firm. Not favorable to have somewhere to go, for the small-minded are growing. Yielding and coming to a halt — observing this pattern, the noble one values the waxing and waning, the fullness and emptiness of things, for this is heaven's own course.",
  tuanX:"When erosion is steadily advancing, the wise response is stillness rather than resistance; understanding the natural rhythm of rise and decline is itself the deeper wisdom here.",
  xiang:"The mountain rests upon the earth: this is Bō. Thus those above enrich those below to secure their own position.",
  xiangX:"As a mountain relies upon the earth beneath it for its very stability, a leader secures their own position by generously supporting those below.",
  yao:[
   ["1st (Six)","The bed is stripped at its legs. Ignoring what is right leads to misfortune.","Decay beginning at the very foundation is a serious warning to heed.","The bed stripped at its legs shows the destruction beginning from below.","Erosion of this kind starts at the most basic, foundational level."],
   ["2nd (Six)","The bed is stripped at its frame. Ignoring what is right leads to misfortune.","The decay is spreading further, and the danger is intensifying.","The bed stripped at its frame comes without any real support or companion.","There is no meaningful support left to counter this spreading decline."],
   ["3rd (Six)","Splitting apart, yet no blame.","Amid general decline, staying aligned with what is genuinely good avoids fault.","Splitting apart without blame means one has parted from the wrong company above and below.","Distancing oneself from the corrupting influence is what keeps this sound."],
   ["4th (Six)","The bed is stripped down to the skin. Misfortune.","The decay has now reached the very core — a grave and pressing danger.","The misfortune of the bed stripped to the skin comes from disaster drawing very near.","This is a clear sign that real harm is close at hand."],
   ["5th (Six)","A string of fish, favored like the ladies of the palace. Nothing unfavorable.","Orderly, generous leadership, even amid decline, brings only good.","Favor extended like this to the ladies of the palace ends with no cause for complaint.","Such orderly generosity closes this matter without any lasting fault."],
   ["Top (Nine)","A large fruit left uneaten. The noble one obtains a carriage; the small-minded man loses his home.","What survives the decline sustains the worthy, while the unworthy lose their foundation.","The noble one obtaining a carriage shows he is upheld by the people.","Genuine support from the people is what sustains this worthy figure."],
  ],
  a:"Love is in a low point, possibly heading toward separation — proceed with care.",b:"Career is declining — stay low-key and avoid direct confrontation.",c:"Finances are weak — hold steady and avoid big investments or loans."}
},
{n:24,s:"復",f:"地雷復",u:"坤",l:"震",k:"否極泰來",fortune:"小吉",
 desc:"否極泰來，指目前正是谷底反彈的轉機，把握時機重新出發，前景可期。",
 guaCi:"復：亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。",
 guaCiX:"復卦象徵一陽來復、否極泰來：亨通，往來皆無阻礙，志同道合者前來相聚也沒有災咎；陽氣循環往復，經過一段時間後終將回復，此時適合有所前往。",
 tuan:"復亨，剛反，動而以順行，是以出入无疾，朋來无咎。反復其道，七日來復，天行也。利有攸往，剛長也。復，其見天地之心乎！",
 tuanX:"復卦之所以亨通，是因為陽剛重新回返，行動且能順勢而為，因此往來暢通無礙、志同道合者前來相聚也沒有災咎；陽氣循環往復、按時回歸，這正是天道運行的規律；此時適合有所前往，是因為陽剛之氣正逐漸增長；由此復卦，或許正可窺見天地生生不息的用心！",
 xiang:"雷在地中，復；先王以至日閉關，商旅不行，后不省方。",
 xiangX:"雷潛藏在大地之中，尚未震動而出，象徵陽氣初生、生機初復，古代君王觀此便在冬至之日關閉關口，商旅暫停往來，君王也不巡視四方，讓萬物得以安靜地休養生息。",
 guaCiSeg:[{o:"復：亨。",e:"復卦象徵一陽來復、否極泰來：亨通。",terms:["heng"]},{o:"出入无疾，朋來无咎。",e:"往來皆無阻礙，志同道合者前來相聚也沒有災咎。",terms:["wujiu"]},{o:"反復其道，七日來復，",e:"陽氣循環往復，經過一段時間後終將回復，"},{o:"利有攸往。",e:"此時適合有所前往。",terms:["li","youyouwang"]}],
 tuanSeg:[{o:"復亨，剛反，動而以順行，",e:"復卦之所以亨通，是因為陽剛重新回返，行動且能順勢而為，",terms:["heng"]},{o:"是以出入无疾，朋來无咎。",e:"因此往來暢通無礙、志同道合者前來相聚也沒有災咎。",terms:["wujiu"]},{o:"反復其道，七日來復，天行也。",e:"陽氣循環往復、按時回歸，這正是天道運行的規律。"},{o:"利有攸往，剛長也。",e:"此時適合有所前往，是因為陽剛之氣正逐漸增長。",terms:["li"]},{o:"復，其見天地之心乎！",e:"由此復卦，或許正可窺見天地生生不息的用心！"}],
 xiangSeg:[{o:"雷在地中，復；",e:"雷潛藏在大地之中，尚未震動而出，象徵陽氣初生、生機初復；"},{o:"先王以至日閉關，商旅不行，后不省方。",e:"古代君王觀此便在冬至之日關閉關口，商旅暫停往來，君王也不巡視四方，讓萬物得以安靜地休養生息。"}],
 yao:[
 ["初九","不遠復，无祗悔，元吉。","犯錯後不久便能悔悟回歸正道，不致有太大悔恨，大為吉祥。","不遠之復，以脩身也。","及早回歸正道，是為了修養自身品德。"],
 ["六二","休復，吉。","安然美善地回歸正道，吉祥。","休復之吉，以下仁也。","能謙下親近仁德之人，故能安然回歸而吉。"],
 ["六三","頻復，厲无咎。","屢次偏離又屢次回歸正道，雖有危險但終能無咎。","頻復之厲，義无咎也。","雖然反覆而有危險，但依循道義終究無咎。"],
 ["六四","中行獨復。","獨自秉持中庸之道回歸正途，不隨波逐流。","中行獨復，以從道也。","獨自依循中道而回歸，是為了追隨正道。"],
 ["六五","敦復，无悔。","以敦厚篤實之心回歸正道，並無悔恨。","敦復无悔，中以自考也。","敦厚地回歸正道而無悔，是能秉持中道自我省察。"],
 ["上六","迷復，凶，有災眚；用行師，終有大敗，以其國君凶；至于十年不克征。","迷失而不知回歸正道，凶險且有災禍；此時出兵征戰將遭大敗，長期無法有所作為。","迷復之凶，反君道也。","迷失不知回歸，是因違反了應遵循的正道。"],
 ],
 a:"感情有復合或轉機的可能，把握機會重新開始。",b:"運勢逐漸回升，適合重新出發、東山再起。",c:"財運觸底反彈，可開始逐步規劃新的理財方向。",
 en:{name:"Fù",title:"Return",keyword:"Turning Point",
  desc:"A single line of yang stirring beneath the earth: after decline, the turning point has arrived — a fresh start is possible now.",
  guaCi:"Fù: Success. Going out and coming in without trouble; friends arrive without blame. Turning back on one's path, returning in seven days; favorable to have somewhere to go.",
  guaCiX:"A season of renewal and success, with the natural cycle bringing things back around; a good time to set forth in a new direction.",
  tuan:"Fù brings success: the firm returns; moving, and moving with obedience, hence going out and coming in without trouble, friends arrive without blame. Turning back on one's path, returning in seven days — this is heaven's own motion. Favorable to have somewhere to go, for the firm force is growing. In Fù, one may perhaps see the very heart of heaven and earth!",
  tuanX:"Renewal that moves in accord with the natural order brings ease and support; this cyclical return, echoing heaven's own rhythm, reveals something of the deepest creative impulse itself.",
  xiang:"Thunder lies within the earth: this is Fù. Thus the ancient kings, on the day of the winter solstice, shut the passes, and merchants and travelers did not journey; the ruler did not inspect the regions.",
  xiangX:"As thunder rests quietly within the earth, ancient kings, on the solstice, closed the borders and paused all travel and inspection, allowing all things to rest and renew.",
  yao:[
   ["1st (Nine)","Returning not far. No cause for great regret. Sublime good fortune.","Correcting course quickly, before straying far, brings excellent fortune.","Returning not far is a matter of cultivating oneself.","Prompt, honest self-correction is the essence of this good fortune."],
   ["2nd (Six)","A fine return. Good fortune.","A genuine, wholehearted return to what is right brings good fortune.","The good fortune of a fine return comes from a humble regard for what is good.","Genuine humility toward goodness is what makes this return so fortunate."],
   ["3rd (Six)","Repeated returning. Danger, but no blame.","Returning to the right path again and again, despite setbacks, is still sound.","The danger of repeated returning still, in principle, carries no blame.","Even repeated struggle to stay the course remains fundamentally without fault."],
   ["4th (Six)","Walking in the middle of the road, returning alone.","Choosing to return to what is right, even without companions, follows genuine principle.","Walking the middle road and returning alone is a matter of following the true way.","This solitary return is guided by a genuine commitment to what is right."],
   ["5th (Six)","A generous return. No regret.","A full, wholehearted return, made with generosity of spirit, leaves no regret.","No regret in a generous return comes from examining oneself with true sincerity.","Honest, sincere self-examination is what leaves no room for regret here."],
   ["Top (Six)","Missing the return. Misfortune. There will be disaster and calamity. If armies are deployed, there will be great defeat, ill fortune for the ruler of the state; for ten years it cannot be set right.","Persistent refusal to turn back from a wrong course leads to lasting, serious ruin.","The misfortune of missing the return comes from going against the way of the ruler.","This is what comes of acting against the fundamental principle of right return."],
  ],
  a:"There's a chance of reconciliation or a fresh start — seize the opportunity.",b:"Fortunes are turning upward — a good time for a comeback or new beginning.",c:"Finances are bottoming out — start planning your next financial direction."}
},
{n:25,s:"無妄",f:"天雷無妄",u:"乾",l:"震",k:"順應自然",fortune:"平",
 desc:"順應自然，指當前宜腳踏實地、不妄求非分，順其自然方能亨通。",
 guaCi:"無妄：元亨利貞。其匪正有眚，不利有攸往。",
 guaCiX:"無妄卦象徵順應自然、不妄求：大為亨通、有利、正固；但若行事不正，將會招致災禍，此時便不利於有所前往。",
 tuan:"無妄，剛自外來而為主於內，動而健，剛中而應，大亨以正，天之命也。其匪正有眚，不利有攸往，無妄之往，何之矣？天命不祐，行矣哉？",
 tuanX:"剛強之氣由外而來、成為內在的主導，行動而剛健，居中且能相應，因此能大為亨通、合乎正道，這正是順應天命的緣故；若行事不正而招致災禍，此時再前往又能往哪裡去呢？既然得不到天命的庇佑，又怎能貿然行動呢？",
 xiang:"天下雷行，物與無妄；先王以茂對時，育萬物。",
 xiangX:"天底下雷聲震動運行，萬物皆隨之順應自然而不敢妄動，古代君王觀此便順應天時、勉力施政，以化育天下萬物。",
 guaCiSeg:[{o:"無妄：元亨利貞。",e:"無妄卦象徵順應自然、不妄求：大為亨通、有利、正固。",terms:["yuanheng","li","zhen"]},{o:"其匪正有眚，",e:"但若行事不正，將會招致災禍，",terms:["fei"]},{o:"不利有攸往。",e:"此時便不利於有所前往。",terms:["li","you_you_wang_neg"]}],
 tuanSeg:[{o:"無妄，剛自外來而為主於內，",e:"剛強之氣由外而來、成為內在的主導，"},{o:"動而健，剛中而應，大亨以正，天之命也。",e:"行動而剛健，居中且能相應，因此能大為亨通、合乎正道，這正是順應天命的緣故。",terms:["heng","tian_ming"]},{o:"其匪正有眚，不利有攸往，",e:"若行事不正而招致災禍，此時便不利於前往，",terms:["fei","li"]},{o:"無妄之往，何之矣？天命不祐，行矣哉？",e:"此時再前往又能往哪裡去呢？既然得不到天命的庇佑，又怎能貿然行動呢？",terms:["tian_ming"]}],
 xiangSeg:[{o:"天下雷行，物與無妄；",e:"天底下雷聲震動運行，萬物皆隨之順應自然而不敢妄動；"},{o:"先王以茂對時，育萬物。",e:"古代君王觀此便順應天時、勉力施政，以化育天下萬物。",terms:["shi"]}],
 yao:[
 ["初九","無妄，往吉。","秉持真誠自然的心前往行事，吉祥。","無妄之往，得志也。","以真誠自然之心前行，故能實現志向。"],
 ["六二","不耕穫，不菑畬，則利有攸往。","不刻意求取耕耘之外的收穫，順其自然反而有利於前行。","不耕穫，未富也。","不刻意求取收穫，是因尚未汲汲於富貴。"],
 ["六三","無妄之災，或繫之牛，行人之得，邑人之災。","意外飛來的災禍，如遭他人牽走繫著的牛，過路人得利卻使當地人受害。","行人得牛，邑人災也。","過路人意外得到牛，卻成為當地居民無妄的災禍。"],
 ["九四","可貞，无咎。","堅守正道，並無災咎。","可貞无咎，固有之也。","堅守正道本就是理所固有的本分。"],
 ["九五","無妄之疾，勿藥有喜。","意外而來的疾病，不需刻意用藥調治，自然痊癒而有喜。","無妄之藥，不可試也。","面對這種無妄而來的疾患，不宜輕易嘗試藥物。"],
 ["上九","無妄，行有眚，无攸利。","即使秉持真誠自然之心，此時貿然行動仍將招致災禍，沒有益處。","無妄之行，窮之災也。","此時行動而生災禍，是因處境已至窮途末路。"],
 ],
 a:"以真誠自然的態度對待感情，不強求結果。",b:"腳踏實地、不投機取巧，才能穩健發展。",c:"財運宜順其自然，避免貪求非分之財。",
 en:{name:"Wú Wàng",title:"Innocence",keyword:"Natural Integrity",
  desc:"Thunder moving beneath heaven: stay true to your natural, honest course now, without forcing or scheming for gain.",
  guaCi:"Wú Wàng: Sublime success, fitting to persevere. If not correct, there will be misfortune, and it is not favorable to have somewhere to go.",
  guaCiX:"Great success and rightness come through genuine, unforced conduct; acting wrongly or scheming for gain now invites misfortune.",
  tuan:"In Wú Wàng, the firm comes from outside and becomes master within; moving with strength, firm and yet responsive — great success through correctness, this is heaven's own mandate. If not correct, there is misfortune, not favorable to have somewhere to go; where can the innocent even go? Without heaven's own blessing and support, can one really act?",
  tuanX:"When strength of character arises naturally and moves in true accord with what is right, real success follows as heaven itself intends; but acting wrongly forfeits that same support.",
  xiang:"Thunder moves beneath heaven; all things are given their true nature: this is Wú Wàng. Thus the ancient kings, in rich abundance, matched the seasons and nurtured all things.",
  xiangX:"As thunder moves beneath heaven, and all things respond in their natural, unforced way, ancient kings governed richly in step with the seasons, nurturing the world.",
  yao:[
   ["1st (Nine)","Innocent action. Going forward brings good fortune.","Acting from genuine, unforced sincerity brings good fortune.","The going forward of innocent action attains what is truly wished.","Genuine, sincere action is naturally rewarded with what is truly sought."],
   ["2nd (Six)","Not plowing for the harvest, not clearing new fields for their yield — then favorable to have somewhere to go.","Not laboring solely for personal gain, but working naturally, is what brings genuine benefit.","Not plowing for the harvest means not yet seeking to grow rich.","This is simply not yet grasping after personal wealth or gain."],
   ["3rd (Six)","Unforeseen misfortune: someone ties an ox nearby; a passerby's gain becomes the townsfolk's loss.","An entirely unforeseen mishap brings loss through no real fault of one's own.","A passerby's gain becomes the townsfolk's loss.","This is simply an unfortunate loss suffered by the local community."],
   ["4th (Nine)","One may remain constant. No blame.","Holding steady and true through this period brings no fault.","Remaining constant without blame means this is simply one's proper due.","Such steadfastness is, quite naturally, entirely fitting here."],
   ["5th (Nine)","Unforeseen illness. Do not medicate it, and there will be joy.","An unexpected trouble resolves on its own — forcing a remedy would only make things worse.","One should not test remedies for unforeseen illness.","Attempting to force a cure here would only cause further harm."],
   ["Top (Nine)","Innocent action still brings misfortune here; nothing favorable in going forward.","Even sincere, well-meant action can misfire when the moment itself is simply wrong.","The misfortune of innocent action at the top comes from a situation pushed to its very limit.","This is a case where the circumstances themselves have reached their natural end."],
  ],
  a:"Be genuine and natural in love, without forcing an outcome.",b:"Stay grounded and avoid shortcuts — steady effort brings real progress.",c:"Let finances take their natural course — avoid chasing unearned gains."}
},
{n:26,s:"大畜",f:"山天大畜",u:"艮",l:"乾",k:"蓄德積才",fortune:"大吉",
 desc:"蓄德積才，指目前正是累積實力、培養才德的階段，日後必有大成。",
 guaCi:"大畜：利貞。不家食，吉。利涉大川。",
 guaCiX:"大畜卦象徵蓄德積才：有利於堅守正道，不必只在家中自食，出仕於世則吉祥，也有利於涉越險阻、成就大事。",
 tuan:"大畜，剛健篤實輝光，日新其德。剛上而尚賢，能止健，大正也。不家食吉，養賢也。利涉大川，應乎天也。",
 tuanX:"大畜之象剛健篤實而光輝顯耀，能每日精進、更新自身的德行；剛強者居上且崇尚賢能，並能適時抑制過度剛健，這是極為正大的表現；不只在家中自食而能出仕，是因為得以奉養、任用賢才；有利於涉險成就大事，是因為順應了天道的緣故。",
 xiang:"天在山中，大畜；君子以多識前言往行，以畜其德。",
 xiangX:"天蘊藏在高山之中，象徵蓄積深厚廣大，君子觀此應多多學習前人的言論與行誼，藉以蓄養自身的德行。",
 guaCiSeg:[{o:"大畜：利貞。",e:"大畜卦象徵蓄德積才：有利於堅守正道。",terms:["li","zhen"]},{o:"不家食，吉。",e:"不必只在家中自食，出仕於世則吉祥。",terms:["ji"]},{o:"利涉大川。",e:"也有利於涉越險阻、成就大事。",terms:["li","she_da_chuan"]}],
 tuanSeg:[{o:"大畜，剛健篤實輝光，日新其德。",e:"大畜之象剛健篤實而光輝顯耀，能每日精進、更新自身的德行。"},{o:"剛上而尚賢，能止健，大正也。",e:"剛強者居上且崇尚賢能，並能適時抑制過度剛健，這是極為正大的表現。"},{o:"不家食吉，養賢也。",e:"不只在家中自食而能出仕，是因為得以奉養、任用賢才。",terms:["ji"]},{o:"利涉大川，應乎天也。",e:"有利於涉險成就大事，是因為順應了天道的緣故。",terms:["li"]}],
 xiangSeg:[{o:"天在山中，大畜；",e:"天蘊藏在高山之中，象徵蓄積深厚廣大；"},{o:"君子以多識前言往行，以畜其德。",e:"君子觀此應多多學習前人的言論與行誼，藉以蓄養自身的德行。",terms:["jun_zi"]}],
 yao:[
 ["初九","有厲，利已。","前方有危險，宜停止前進、暫緩行動較為有利。","有厲利已，不犯災也。","及時停止，便不致觸犯災禍。"],
 ["九二","輿說輹。","車輪與車軸脫離，象徵暫時無法前行，宜靜待時機。","輿說輹，中无尤也。","車輪脫落而暫停，能秉持中道故無過失。"],
 ["九三","良馬逐，利艱貞；日閑輿衛，利有攸往。","以良馬追逐前進，堅守正道渡過艱難，勤加練習車馬防衛，有利於前行。","利有攸往，上合志也。","有利於前往行事，是與上位者的志向相合。"],
 ["六四","童牛之牿，元吉。","在小牛角上加裝護具、及早防範，大為吉祥。","六四元吉，有喜也。","居此位而獲元吉，必有喜慶之事。"],
 ["六五","豶豕之牙，吉。","以柔性方式制服猛獸的尖牙，如同以巧勁化解剛強之勢，吉祥。","六五之吉，有慶也。","居此位而獲吉祥，必有可喜可賀之事。"],
 ["上九","何天之衢，亨。","如登上通達天際的大道般暢行無阻，亨通。","何天之衢，道大行也。","如此暢通的天路，象徵正道得以大力施行。"],
 ],
 a:"感情需要時間累積信任，值得耐心等待修成正果。",b:"適合累積實力、進修充電，為未來大展所長做準備。",c:"財運宜長期累積，適合穩健的長期投資規劃。",
 en:{name:"Dà Xù",title:"Great Accumulation",keyword:"Building Capacity",
  desc:"Heaven contained within the mountain: this is a time for gathering strength and knowledge — the reward for patient preparation is close at hand.",
  guaCi:"Dà Xù: Favorable to persevere. Not eating at home brings good fortune. Favorable to cross the great water.",
  guaCiX:"Perseverance is favorable now; stepping beyond mere self-sufficiency into wider service brings good fortune, even for bold undertakings.",
  tuan:"Dà Xù: firm, solid, genuine, and radiant, its virtue renewed daily. The firm is above and honors the worthy, able to restrain strength — this is truly great correctness. Not eating at home brings good fortune, for it nurtures the worthy. Favorable to cross the great water, for this responds to heaven itself.",
  tuanX:"Steady, disciplined accumulation of genuine strength and virtue, paired with respect for the worthy, is what makes real, far-reaching achievement possible.",
  xiang:"Heaven within the mountain: this is Dà Xù. Thus the noble one learns widely from the words and deeds of those who came before, to build up his own virtue.",
  xiangX:"As heaven itself is contained within the vastness of the mountain, a person of character studies broadly from past words and deeds, to cultivate their own character.",
  yao:[
   ["1st (Nine)","Danger present. Favorable to stop.","Recognizing danger early, and pausing rather than pushing on, is the wise course.","Danger present, favorable to stop, so as not to run into disaster.","Halting in time is what keeps real harm at bay."],
   ["2nd (Nine)","The cart's axle-straps come loose.","A natural, timely pause in progress, rather than a failure.","The axle-straps coming loose means, at the center, nothing is truly lost.","This pause, held with inner balance, involves no real setback."],
   ["3rd (Nine)","A fine horse in pursuit. Favorable to persevere through hardship; daily practice of charioteering and defense; favorable to have somewhere to go.","Sustained, disciplined effort and preparation now supports moving forward with confidence.","Favorable to have somewhere to go, for the will is in accord above.","This favorable outlook comes from being in genuine accord with what lies ahead."],
   ["4th (Six)","A young bull's headboard. Sublime good fortune.","Restraining a problem early and gently prevents it from growing — excellent fortune.","The sublime good fortune of the fourth line brings real cause for joy.","This is a genuinely happy and welcome outcome."],
   ["5th (Six)","The tusks of a gelded boar. Good fortune.","Neutralizing danger through skillful, indirect means, rather than force, brings good fortune.","The good fortune of the fifth line brings real cause for celebration.","This too is a result well worth celebrating."],
   ["Top (Nine)","How could one bear the crossroads of heaven itself? Success.","Reaching the very height of accumulated capability, the way forward opens wide.","How the crossroads of heaven is borne — the great way is now widely carried out.","The true way now flows forward without any real obstruction."],
  ],
  a:"Love needs time to build trust — patience now can lead to a lasting bond.",b:"A good time to build skills and knowledge in preparation for future achievement.",c:"Favor long-term, steady investment plans."}
},
{n:27,s:"頤",f:"山雷頤",u:"艮",l:"震",k:"頤養之道",fortune:"小吉",
 desc:"頤養之道，指當前宜調養身心、謹言節食，方能長保安康順遂。",
 guaCi:"頤：貞吉。觀頤，自求口實。",
 guaCiX:"頤卦象徵頤養之道：堅守正道則吉祥；觀察頤養的方式，也應反省自身如何謀求生活所需。",
 tuan:"頤貞吉，養正則吉也。觀頤，觀其所養也；自求口實，觀其自養也。天地養萬物，聖人養賢以及萬民，頤之時大矣哉！",
 tuanX:"頤卦堅守正道便能吉祥，是因為以正道頤養萬物才會吉祥；觀察頤養之道，是要觀察其所頤養的對象；反省如何自求飲食生活所需，則是觀察其自我頤養的方式；天地滋養萬物，聖人則頤養賢才進而澤及萬民，頤養的時義實在重大深遠！",
 xiang:"山下有雷，頤；君子以慎言語，節飲食。",
 xiangX:"山下響著雷聲，如同上顎與下顎咀嚼之象，君子觀此應謹慎言語，並節制飲食，涵養身心。",

 yao:[
 ["初九","舍爾靈龜，觀我朵頤，凶。","捨棄自身應有的靈性智慧，反而豔羨他人的享受，凶險。","觀我朵頤，亦不足貴也。","一味豔羨他人享用，這種心態也不值得推崇。"],
 ["六二","顛頤，拂經，于丘頤，征凶。","顛倒常理地向下位者求取奉養，違背常規，貿然前行有凶險。","六二征凶，行失類也。","貿然前行招致凶險，是因行為偏離了應有的常道。"],
 ["六三","拂頤，貞凶，十年勿用，无攸利。","違背頤養正道，即使堅持也有凶險，長時間都難有作為，沒有益處。","十年勿用，道大悖也。","長期無法有所作為，是因大大違背了應有的正道。"],
 ["六四","顛頤，吉；虎視眈眈，其欲逐逐，无咎。","雖顛倒地向下尋求助力，但心懷戒慎、如虎般專注審視，仍可無咎，吉祥。","顛頤之吉，上施光也。","如此仍能吉祥，是因上位者施予的恩澤光明廣大。"],
 ["六五","拂經，居貞吉，不可涉大川。","雖違背常規，但安守正道則吉，此時不宜涉險行事。","居貞之吉，順以從上也。","安守正道而獲吉，是因能順從並依附上位者。"],
 ["上九","由頤，厲吉，利涉大川。","身為頤養萬物的根本，雖有危險仍能吉祥，有利於涉險成就大事。","由頤厲吉，大有慶也。","雖有危險仍能吉祥，必有重大喜慶之事。"],
 ],
 a:"感情中宜多關心對方的身心需求，用心經營。",b:"適合休養生息、調整步調，避免過度消耗心力。",c:"財運平穩，宜量入為出，注意日常開支管理。",
 en:{name:"Yí",title:"Nourishment",keyword:"Sustaining Body and Mind",
  desc:"Thunder beneath the mountain, like jaws at work: this is a time to attend to what truly nourishes you — body, mind, and character alike.",
  guaCi:"Yí: Perseverance brings good fortune. Observe the jaws, and what one seeks to fill them with oneself.",
  guaCiX:"Good fortune comes through steady, principled nourishment — consider carefully both how others are cared for and how you provide for yourself.",
  tuan:"Yí: perseverance brings good fortune, for nourishing what is correct brings good fortune. Observe the jaws — observe what is being nourished. What one seeks to fill them with oneself — observe how one nourishes oneself. Heaven and earth nourish all things; the sage nourishes worthy men, extending this to reach the multitude. Great indeed is the timeliness of nourishment!",
  tuanX:"Just as heaven and earth sustain all living things, and a wise leader in turn cares for the worthy and, through them, the wider community, the true art of nourishment carries profound and timely significance.",
  xiang:"Thunder beneath the mountain: this is Yí. Thus the noble one is careful in speech and moderate in eating and drinking.",
  xiangX:"As thunder rumbles quietly beneath the still mountain, a person of character is careful with their words and moderate in food and drink.",
  yao:[
   ["1st (Nine)","Setting aside your own sacred tortoise, gazing at my full jaws. Misfortune.","Envying another's ease while neglecting one's own genuine resources leads to misfortune.","Gazing at my full jaws is likewise not worthy of true esteem.","Such envious dependence is, in truth, not something to admire."],
   ["2nd (Six)","Reversed nourishment, departing from the norm; seeking nourishment from the hilltop. To press forward brings misfortune.","Seeking sustenance from an unsuitable source, or in an unnatural way, invites misfortune if pursued.","The misfortune of the second line's advance comes from acting out of step with its own kind.","Acting contrary to what genuinely suits one's own nature is the cause here."],
   ["3rd (Six)","Turning away from nourishment. Perseverance brings misfortune; for ten years, do not act — nothing is favorable.","Departing wholly from what sustains one properly, for a long time, brings real misfortune.","Not acting for ten years shows the way is greatly at odds with what is right.","This prolonged inaction reflects a deep departure from the proper course."],
   ["4th (Six)","Reversed nourishment. Good fortune. A tiger watches intently, its desire pressing forward. No blame.","Even seeking help from below, done with sincere, focused intent, brings good fortune.","The good fortune of reversed nourishment comes from a light that spreads generously from above.","Generosity flowing down from above is the true source of this good fortune."],
   ["5th (Six)","Turning away from the norm. Remaining settled and constant brings good fortune; one should not cross the great water.","Departing from the usual path, while remaining steady and settled, still brings good fortune, though caution against bold ventures remains.","The good fortune of settled constancy comes from a gentle obedience to what is above.","Gentle, willing compliance with proper guidance is what secures this good fortune."],
   ["Top (Nine)","The source of nourishment. Awareness of danger brings good fortune; favorable to cross the great water.","Being the very source that sustains others, approached with due caution, brings good fortune, even for a bold undertaking.","Awareness of danger bringing good fortune at the top brings great cause for celebration.","This is a truly celebratory outcome, born of genuine, careful awareness."],
  ],
  a:"Pay attention to your partner's needs, both physical and emotional.",b:"A time to rest and recalibrate rather than overextend yourself.",c:"Finances are steady — live within your means and watch daily spending."}
},
{n:28,s:"大過",f:"澤風大過",u:"兌",l:"巽",k:"非常之舉",fortune:"小凶",
 desc:"非常之舉，指眼前處境特殊、壓力沉重，唯有當機立斷方能度過難關。",
 guaCi:"大過：棟橈。利有攸往，亨。",
 guaCiX:"大過卦象徵非常之時：如同棟樑過度彎曲一般，此時有利於有所行動，仍可獲得亨通。",
 tuan:"大過，大者過也。棟橈，本末弱也。剛過而中，巽而說行，利有攸往，乃亨。大過之時大矣哉！",
 tuanX:"大過就是陽剛過盛的意思，棟樑之所以彎曲，是因為根基與末端都相對薄弱；此時陽剛雖然過盛卻仍居於中位，且能謙遜和悅地行動，因此有利於前行、可獲亨通；大過所面臨的非常時勢，其意義實在重大！",
 xiang:"澤滅木，大過；君子以獨立不懼，遯世无悶。",
 xiangX:"沼澤之水淹沒了樹木，象徵非常艱難的處境，君子觀此應獨立不懼於危難之中，即使隱退避世也能坦然自處而不感到苦悶。",
 guaCiSeg:[{o:"大過：棟橈。",e:"大過卦象徵非常之時：如同棟樑過度彎曲一般。"},{o:"利有攸往，亨。",e:"此時有利於有所行動，仍可獲得亨通。",terms:["li","youyouwang","heng"]}],
 tuanSeg:[{o:"大過，大者過也。",e:"大過就是陽剛過盛的意思。"},{o:"棟橈，本末弱也。",e:"棟樑之所以彎曲，是因為根基與末端都相對薄弱。"},{o:"剛過而中，巽而說行，利有攸往，乃亨。",e:"此時陽剛雖然過盛卻仍居於中位，且能謙遜和悅地行動，因此有利於前行、可獲亨通。",terms:["li","heng"]},{o:"大過之時大矣哉！",e:"大過所面臨的非常時勢，其意義實在重大！",terms:["shi"]}],
 xiangSeg:[{o:"澤滅木，大過；",e:"沼澤之水淹沒了樹木，象徵非常艱難的處境；"},{o:"君子以獨立不懼，遯世无悶。",e:"君子觀此應獨立不懼於危難之中，即使隱退避世也能坦然自處而不感到苦悶。",terms:["jun_zi"]}],
 yao:[
 ["初六","藉用白茅，无咎。","以潔白的茅草鋪墊承接祭品，謹慎小心，並無災咎。","藉用白茅，柔在下也。","以柔順謹慎之心居於下位墊底承托。"],
 ["九二","枯楊生稊，老夫得其女妻，无不利。","枯萎的楊樹重新發出嫩芽，如年長者娶得年輕妻子，無所不利。","老夫女妻，過以相與也。","看似不相稱的結合，卻能彼此扶持相與。"],
 ["九三","棟橈，凶。","房屋棟樑嚴重彎曲，即將崩塌，凶險。","棟橈之凶，不可以有輔也。","棟樑彎曲的凶險，是因缺乏足夠的輔助支撐。"],
 ["九四","棟隆，吉；有它吝。","棟樑得到支撐而隆起穩固，吉祥，但若旁生枝節則有所遺憾。","棟隆之吉，不橈乎下也。","棟樑隆起穩固而吉，是因不再向下彎曲。"],
 ["九五","枯楊生華，老婦得其士夫，无咎无譽。","枯萎的楊樹開出花朵，如年長婦人得配年輕男子，雖無咎但也無甚可稱道。","枯楊生華，何可久也；老婦士夫，亦可醜也。","枯木開花終究難以長久；如此不相稱的結合，也令人稍感不妥。"],
 ["上六","過涉滅頂，凶，无咎。","涉險過度導致滅頂之災，雖有凶險，但因是出於義無反顧的抉擇而無可歸咎。","過涉之凶，不可咎也。","涉險過度而致凶險，這是無可歸咎於誰的結果。"],
 ],
 a:"感情處於關鍵轉折，需要果斷做出重要決定。",b:"承擔重大壓力或挑戰，宜謹慎評估後果斷行動。",c:"財務負擔較重，宜謹慎評估風險，避免過度槓桿。",
 en:{name:"Dà Guò",title:"Great Exceeding",keyword:"Extraordinary Pressure",
  desc:"A lake rising over the treetops: an unusual, weighty moment demanding decisive action to keep from being overwhelmed.",
  guaCi:"Dà Guò: The ridgepole sags. Favorable to have somewhere to go; success.",
  guaCiX:"Under extraordinary strain, like a sagging beam, decisive forward movement is still the path to success.",
  tuan:"In Dà Guò, the great exceeds the ordinary. The ridgepole sags, for the ends are weak. Strong yet balanced, gentle and joyous in its movement — favorable to have somewhere to go, and so there is success. Great indeed is the timeliness of Dà Guò!",
  tuanX:"An excess of strength, weak at both ends like an overloaded beam, still finds success through balanced, gentle, and well-timed action — this is a moment of real significance.",
  xiang:"The lake submerges the trees: this is Dà Guò. Thus the noble one stands alone without fear, and withdraws from the world without regret.",
  xiangX:"As the lake rises to submerge even the trees, a person of character stands firm alone, unafraid, and can retreat from the world without any regret.",
  yao:[
   ["1st (Six)","Spreading white rushes beneath the offering. No blame.","Extreme care and reverence at the outset of a weighty matter is entirely sound.","Spreading white rushes beneath comes from a soft, careful placement at the base.","This gentle, careful foundation is the source of such soundness."],
   ["2nd (Nine)","A withered willow sprouts new shoots; an old man takes a young wife. Nothing unfavorable.","An unexpected, late-life renewal or unconventional pairing turns out to bring only good.","An old man with a young wife is an unusual union, yet one that still supports itself.","Even this unconventional match proves mutually sustaining."],
   ["3rd (Nine)","The ridgepole sags. Misfortune.","Under real strain, without adequate support, collapse becomes a serious risk.","The misfortune of the sagging ridgepole comes from having no way to be properly supported.","Lack of any real support is what leads to this dangerous strain."],
   ["4th (Nine)","The ridgepole is raised up. Good fortune. Any other entanglement brings regret.","Reinforcing and stabilizing what is under strain brings good fortune, if one avoids unnecessary distraction.","The good fortune of the raised ridgepole comes from not bending down toward what is below.","Avoiding entanglement with lesser distractions is what secures this good result."],
   ["5th (Nine)","A withered willow puts forth flowers; an old woman takes a young husband. No blame, no praise.","A similarly unconventional, late renewal here brings neither real harm nor real distinction.","How can flowers on a withered willow last for long? An old woman with a young husband is likewise a match to be viewed with some reserve.","Such an unlikely, temporary flourishing cannot really be expected to endure."],
   ["Top (Six)","Fording too deep, submerging the crown of the head. Misfortune, yet no blame.","Overextending oneself into real danger brings misfortune, though the intent behind it remains blameless.","The misfortune of fording too deep cannot really be laid at anyone's fault.","This misfortune arises from circumstance rather than any real wrongdoing."],
  ],
  a:"Love is at a critical turning point — a decisive choice is needed.",b:"Facing real pressure or challenge — assess carefully, then act decisively.",c:"Financial burden is heavy — evaluate risk carefully and avoid excessive leverage."}
},
{n:29,s:"坎",f:"坎為水",u:"坎",l:"坎",k:"重重險陷",fortune:"小凶",
 desc:"重重險陷，指目前接連遭遇困境，宜堅定信念、步步為營，方能安然渡過。",
 guaCi:"習坎：有孚，維心亨，行有尚。",
 guaCiX:"坎卦象徵重重險陷：面對接連而來的險境，若能心懷誠信，內心便能亨通，勇於前行終將受到嘉許。",
 tuan:"習坎，重險也。水流而不盈，行險而不失其信。維心亨，乃以剛中也。行有尚，往有功也。天險不可升也，地險山川丘陵也，王公設險以守其國，險之時用大矣哉！",
 tuanX:"重重的險境接連而來；水流動而不會滿溢，即使身處險境仍不失去內心的誠信；內心之所以能亨通，是因為秉持剛健中正之德；前行受到嘉許，是因為前往終能有所成就；天有不可攀登的險阻，地有山川丘陵的險阻，君王設置險要以保衛國家，可見險境的作用實在深遠重大！",
 xiang:"水洊至，習坎；君子以常德行，習教事。",
 xiangX:"水接連不斷地流來，象徵險境接踵而至，君子觀此應保持恆常的德行，並反覆熟習教化之事。",
 guaCiSeg:[{o:"習坎：有孚，",e:"坎卦象徵重重險陷：面對接連而來的險境，若能心懷誠信，",terms:["youfu"]},{o:"維心亨，",e:"內心便能亨通，",terms:["heng"]},{o:"行有尚。",e:"勇於前行終將受到嘉許。"}],
 tuanSeg:[{o:"習坎，重險也。",e:"重重的險境接連而來。"},{o:"水流而不盈，行險而不失其信。",e:"水流動而不會滿溢，即使身處險境仍不失去內心的誠信。"},{o:"維心亨，乃以剛中也。行有尚，往有功也。",e:"內心之所以能亨通，是因為秉持剛健中正之德；前行受到嘉許，是因為前往終能有所成就。",terms:["heng"]},{o:"天險不可升也，地險山川丘陵也，王公設險以守其國，",e:"天有不可攀登的險阻，地有山川丘陵的險阻，君王設置險要以保衛國家，"},{o:"險之時用大矣哉！",e:"可見險境的作用實在深遠重大！",terms:["shi"]}],
 xiangSeg:[{o:"水洊至，習坎；",e:"水接連不斷地流來，象徵險境接踵而至；"},{o:"君子以常德行，習教事。",e:"君子觀此應保持恆常的德行，並反覆熟習教化之事。",terms:["jun_zi"]}],
 yao:[
 ["初六","習坎，入于坎窞，凶。","身陷重重險境之中，越陷越深，凶險。","習坎入坎，失道凶也。","陷入重重險境，是因偏離了應行的正道。"],
 ["九二","坎有險，求小得。","身處險境之中，只能求取小小的收穫。","求小得，未出中也。","僅能小有所得，是因尚未脫離險境的核心。"],
 ["六三","來之坎坎，險且枕，入于坎窞，勿用。","來去皆陷於重重險境，處境艱危，此時不宜輕舉妄動。","來之坎坎，終无功也。","往來都身陷險境，最終難有所成。"],
 ["六四","樽酒簋貳，用缶，納約自牖，終无咎。","以簡樸的酒食、從窗戶遞送誠意，簡約而真誠，最終無咎。","樽酒簋貳，剛柔際也。","簡樸的禮節，正是剛柔相互交會配合之時。"],
 ["九五","坎不盈，祗既平，无咎。","險境如水尚未滿溢，情勢逐漸趨於平穩，並無災咎。","坎不盈，中未大也。","險境尚未滿溢，是因居中之勢尚未發展到極致。"],
 ["上六","係用徽纆，寘于叢棘，三歲不得，凶。","被繩索捆綁、囚禁於荊棘叢中，長期無法脫困，凶險。","上六失道，凶三歲也。","偏離正道，導致長達多年的凶險困境。"],
 ],
 a:"感情面臨考驗與波折，需要堅定信念度過難關。",b:"工作上接連遇到困難，宜保持冷靜、步步為營。",c:"財運起伏不定，宜保守理財，避免涉險投資。",
 en:{name:"Kǎn",title:"The Abyss",keyword:"Repeated Danger",
  desc:"Water upon water, danger upon danger: hold to genuine sincerity now and move through carefully, one step at a time.",
  guaCi:"Kǎn: With sincerity, the heart finds its way through; going forward is honored.",
  guaCiX:"Even amid repeated danger, genuine inner sincerity finds a path through, and courageous action earns real respect.",
